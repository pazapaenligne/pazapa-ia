PAZAPA ENGLISH FOR ADULTS — A2

Single pronunciation focus: Word stress in contract terms.

MODEL LANGUAGE (verbatim from the production prompt)
  How much is the deposit?      <- the target recording (studio + comparison)
  Can I read the contract?
  Can I pay in an instalment?

  All five pictures are taken from the lesson workbook
  Week_5_Lesson_2_A2_Workbook_The_Tenancy_Contract.pdf (page 91, "Picture
  vocabulary"): agent, tenancy contract, deposit, clause, instalment. They are
  embedded whole (never cropped), no face is shown, nothing was redrawn.
  No logo and no new artwork has been added.

  bytes (PAZAPA Audio Standard): contract.mp3.mp3, deposit.mp3.mp3 and

  text-to-speech is used.

:root{
  --pz-blue:#36BBD6; --pz-lime:#C9D646; --pz-yellow:#FCC104; --pz-red:#E6352B;
  --pz-grey:#EBEBEB; --pz-dark:#2E2E2D;
  --pz-blue-80:#5EC9DE; --pz-blue-60:#86D6E6; --pz-blue-40:#AFE4EF; --pz-blue-20:#D7F1F7;
  --pz-lime-80:#D4DE6B; --pz-lime-60:#DFE690; --pz-lime-40:#E9EFB5; --pz-lime-20:#F4F7DA;
  --pz-yellow-80:#FDCD36; --pz-yellow-60:#FDDA68; --pz-yellow-40:#FEE69B; --pz-yellow-20:#FEF3CD;
  --head:"Filson Soft","Open Sans",Arial,sans-serif;
  --body:"Open Sans",Arial,sans-serif;
  --r:12px; --tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--body);font-size:17px;line-height:1.6;color:var(--pz-dark);background:#FFFFFF;-webkit-text-size-adjust:100%;}
[hidden]{display:none !important;}
.shell{max-width:52rem;margin:0 auto;padding:14px 16px 40px;}
h1,h2,h3{font-family:var(--head);color:var(--pz-dark);line-height:1.25;margin:0 0 8px;}
h1{font-size:1.6rem;} h2{font-size:1.2rem;} h3{font-size:1.02rem;}
p{margin:0 0 12px;}
.fr{font-size:.92rem;font-style:italic;opacity:.9;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* header + always-visible focus */
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--pz-blue);padding-bottom:10px;margin-bottom:12px;}
.brand b{font-family:var(--head);font-size:1.05rem;}
.crumb{font-size:.88rem;margin:0;}
.focus{display:flex;align-items:center;gap:10px;background:var(--pz-blue-20);border-left:8px solid var(--pz-blue);border-radius:var(--r);padding:8px 14px;margin:0 0 12px;font-size:.98rem;}
.focus b{font-family:var(--head);}
.pos{display:inline-block;background:var(--pz-grey);border-radius:var(--r);padding:4px 12px;font-size:.88rem;margin:0 0 14px;}
.screen{outline:none;}
.accent{width:56px;height:5px;border-radius:3px;background:var(--pz-red);margin:0 0 12px;}

/* buttons */
button{font-family:var(--body);font-size:1rem;font-weight:600;min-height:var(--tap);min-width:var(--tap);padding:10px 18px;border-radius:var(--r);border:2px solid var(--pz-dark);background:#FFFFFF;color:var(--pz-dark);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--pz-grey);}
button:focus-visible,input:focus-visible{outline:4px solid var(--pz-dark);outline-offset:3px;}
button[disabled]{opacity:.55;cursor:default;}
button[disabled]:hover{background:#FFFFFF;}
.b-main{background:var(--pz-blue);border-color:var(--pz-blue);}
.b-main:hover{background:var(--pz-blue-80);}
.b-listen{background:var(--pz-yellow);border-color:var(--pz-yellow);}
.b-listen:hover{background:var(--pz-yellow-80);}
.b-listen[disabled]:hover{background:var(--pz-yellow);}
.b-done{background:var(--pz-lime);border-color:var(--pz-lime);}
.b-done:hover{background:var(--pz-lime-80);}
.b-quiet{font-weight:400;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 0;}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:2px solid var(--pz-grey);}
.note{font-size:.92rem;margin:8px 0 0;}
.status{font-size:.95rem;margin:10px 0 0;min-height:1.2em;}
.hint:not(:empty){background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--r);padding:8px 12px;font-weight:600;}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid var(--pz-dark);}
.dot-ok{background:var(--pz-lime);} .dot-try{background:var(--pz-yellow);}

figure{margin:0;}
figure img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:var(--r);background:var(--pz-yellow-20);}

/* 1 — signing desk */
.desk{display:grid;gap:18px;background:var(--pz-blue-20);border-radius:var(--r);padding:18px;border-bottom:12px solid var(--pz-yellow-60);align-items:center;}
.desk figure img{max-height:260px;}
@media (min-width:640px){.desk{grid-template-columns:5fr 6fr;}}

/* 2 — contract excerpt */
.paper{background:#FFFFFF;border:2px solid var(--pz-grey);border-top:10px solid var(--pz-blue);border-radius:6px;padding:14px 16px 6px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--pz-grey) 31px,var(--pz-grey) 32px);}
.paper-title{font-family:var(--head);font-weight:700;margin:0 0 2px;}
.paper-sub{font-size:.85rem;margin:0 0 10px;}
.clause{padding:10px 0 12px;border-top:1px dashed var(--pz-dark);}
.clause p{margin:0 0 6px;}
.kw{background:var(--pz-yellow-40);padding:0 4px;border-radius:4px;font-weight:600;}
.sylrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.sylrow .q{font-size:.92rem;margin-right:4px;}
.syl{min-width:64px;font-size:1.1rem;background:#FFFFFF;}
.syl.ok{background:var(--pz-lime);border-color:var(--pz-lime);font-size:1.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.syl.miss{background:var(--pz-yellow);border-color:var(--pz-yellow);}
.wrap-note{margin-top:14px;}

/* 3 — rhythm strip */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.tabs button[aria-pressed="true"]{background:var(--pz-blue);border-color:var(--pz-blue);}
.rhythm{background:var(--pz-grey);border-radius:var(--r);padding:18px 14px;margin:0 0 6px;}
.rhythm .big{font-family:var(--head);font-size:1.45rem;line-height:1.35;margin:0 0 10px;}
.strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:flex-end;}
.strip li{display:flex;flex-direction:column;align-items:center;min-width:34px;}
.strip .u{font-size:1.15rem;}
.strip .u.beat{font-size:1.65rem;font-weight:800;letter-spacing:.05em;}
.strip .d{border-radius:50%;margin-top:4px;}
.strip .d.w{width:10px;height:10px;border:2px solid var(--pz-dark);background:#FFFFFF;}
.strip .d.s{width:26px;height:26px;background:var(--pz-blue);border:3px solid var(--pz-dark);}
.strip .d.n{width:10px;height:10px;visibility:hidden;}
.cols{display:grid;gap:14px;}
@media (min-width:700px){.cols{grid-template-columns:200px 1fr;align-items:start;}}
.cols figure img{max-height:150px;}

/* voice tools */
.voice{border:2px dashed var(--pz-blue-60);border-radius:var(--r);background:#FFFFFF;padding:12px 14px;margin:14px 0 0;}
.voice h3{margin-bottom:6px;}
.timer{font-variant-numeric:tabular-nums;font-weight:600;min-width:7ch;}
.take{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0;padding:8px 10px;background:var(--pz-lime-20);border:1px solid var(--pz-lime-80);border-radius:var(--r);}
.take b{min-width:5.5rem;}
.heard{background:#FFFFFF;border:1px solid var(--pz-dark);border-radius:var(--r);padding:8px 12px;margin:10px 0 0;}
.heard small{display:block;opacity:.85;}
.fb{border-radius:var(--r);padding:10px 14px;margin:10px 0 0;border:2px solid var(--pz-dark);}
.fb-match{background:var(--pz-lime-20);border-color:var(--pz-lime);}
.fb-try{background:var(--pz-yellow-20);border-color:var(--pz-yellow);}
.fb-none{background:var(--pz-grey);}
.fb p{margin:0 0 4px;}
.fb .st{font-family:var(--head);font-weight:700;}

/* 4 — studio */
.studio{background:var(--pz-grey);border-radius:var(--r);padding:18px 16px;}
.studio .big{font-family:var(--head);font-size:1.6rem;line-height:1.3;margin:0 0 6px;}
.studio .voice{border-style:solid;border-color:var(--pz-dark);}
.beat{background:var(--pz-yellow-40);border-radius:6px;padding:0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.recbig{min-width:190px;font-size:1.1rem;}
.recbig.on{background:var(--pz-yellow);border-color:var(--pz-yellow);}

/* 5 — compare */
.mix{display:grid;gap:8px;margin:12px 0;}
.mix .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:8px solid var(--pz-blue);background:var(--pz-blue-20);border-radius:var(--r);padding:8px 12px;}
.mix .line.mine{border-left-color:var(--pz-lime);background:var(--pz-lime-20);}
.mix .line b{min-width:5.5rem;}

/* 6 — close */
.close{background:var(--pz-lime-20);border:2px solid var(--pz-lime);border-radius:var(--r);padding:16px;margin:0 0 14px;}
.check{display:flex;gap:12px;align-items:flex-start;margin:10px 0;}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--pz-blue);}
.check label{cursor:pointer;}

@media (max-width:420px){
  body{font-size:16px;}
  .actions button,.row button{flex:1 1 100%;}
  .rhythm .big,.studio .big{font-size:1.25rem;}
  .strip{gap:4px 10px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
noscript p{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--r);padding:14px;}
</style>
</head>

/* ============================================================================
   HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function btn(label, cls, onclick){
  var b = el("button", cls, label);
  b.type = "button";
  if (onclick) b.addEventListener("click", onclick);
  return b;
}
function fr(text){ var p = el("p","fr",text); p.setAttribute("lang","fr"); return p; }
function announce(msg){ var l = document.getElementById("live"); if (l) l.textContent = String(msg||""); }
function shuffle(a){
  var r = a.slice();
  for (var i = r.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function isEmbeddedImage(v){ return typeof v === "string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function isValidAudio(key){
  var v = AUDIO_FILES[key];
  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav|x-m4a|aac);base64,[A-Za-z0-9+\/=]+$/.test(v);
}
function isSafeEndpoint(v){
  if (typeof v !== "string" || v === "" || v !== v.trim()) return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  if (u.protocol !== "https:") return false;
  if (/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(u.hostname)) return false;
  if (u.search || u.hash || u.username || u.password) return false;
  return true;
}
function figure(key, alt){
  var f = el("figure");
  if (isEmbeddedImage(IMAGES[key])){
    var i = document.createElement("img");
    i.src = IMAGES[key]; i.alt = alt || ""; i.setAttribute("decoding","async");
    f.appendChild(i);
  }
  return f;
}
function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ":" + ("0" + (s % 60)).slice(-2); }

/* ============================================================================
   AUDIO — one element, one source at a time, started only by a click or tap
   ========================================================================= */
var audioEl = document.getElementById("audio");
var audioBusy = null;
var audioToken = 0;
var playButtons = [];     /* {b, key, play, stop} */

function refreshPlay(){
  for (var i = 0; i < playButtons.length; i++){
    var o = playButtons[i];
    var on = (o.key === audioBusy);
    o.b.setAttribute("aria-pressed", on ? "true" : "false");
    o.b.textContent = on ? o.stop : o.play;
  }
}
function stopAudio(){
  audioToken++;
  try { audioEl.pause(); } catch(e){}
  try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  audioBusy = null;
  refreshPlay();
}
function playSource(src, key){
  if (!src) return;
  if (audioBusy === key){ stopAudio(); return; }
  stopAudio();
  stopCheck(); stopLiveRecorder(); cancelPendingMic();
  var token = ++audioToken;
  audioBusy = key;
  refreshPlay();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){} }
    var p = audioEl.play();
    if (p && typeof p.catch === "function"){
      p.catch(function(){
        if (token !== audioToken) return;
        audioBusy = null; refreshPlay();
        console.error("Audio playback failed");
      });
    }
  } catch(e){
    if (token !== audioToken) return;
    audioBusy = null; refreshPlay();
  }
}
audioEl.addEventListener("ended", function(){ audioBusy = null; refreshPlay(); });
audioEl.addEventListener("error", function(){
  if (!audioEl.getAttribute("src")) return;
  audioBusy = null; refreshPlay();
});

/* Audio button for one supplied recording. Returns null when no recording exists. */
function audioButton(key, label, aria){
  if (!isValidAudio(key)) return null;
  var b = el("button", "b-listen", label);
  b.type = "button";
  b.setAttribute("aria-label", aria || label);
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", function(){ playSource(AUDIO_FILES[key], "a:" + key); });
  playButtons.push({ b:b, key:"a:" + key, play:label, stop:"Stop" });
  return b;
}
/* Word recording (supplied) and phrase recording (MISSING AUDIO FILE for now). */
function modelRow(p, host){
  var w = audioButton("word_" + p.id, "Hear the word", "Hear the word " + p.word.replace(/-/g, "").toLowerCase());
  var ph = audioButton("phrase_" + p.id, "Hear the phrase", "Hear the phrase: " + p.text);
  if (w) host.appendChild(w);
  if (ph) host.appendChild(ph);
  if (!ph){
    var n = el("span", "note", w ? "Hear the word, then say the whole phrase." : "Read the phrase and say it aloud.");
    host.appendChild(n);
  }
}
function takeButton(voice, i){
  var b = el("button", "b-main", "Hear my recording");
  b.type = "button";
  var key = "take:" + voice.id + ":" + i;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", function(){
    var t = voice.takes[i];
    if (t) playSource(t.url, key);
  });
  playButtons.push({ b:b, key:key, play:"Hear my recording", stop:"Stop" });
  return b;
}

/* ============================================================================
   RECORDING — getUserMedia + MediaRecorder, in memory only
   ========================================================================= */
var genCounter = 0;
var live = null;        /* {voice, mr, stream, gen, slot, chunks, tick, cap, t0} */
var pendingMic = null;  /* {voice, gen, timer} */
var allVoices = [];

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function" &&
            typeof window.MediaRecorder !== "undefined");
}
function unsupportedReason(){
  if (!window.isSecureContext) return "Recording needs the course website (https). You can still listen, say the phrase aloud and use the self-check.";
  return "Recording does not work in this browser. You can still listen, say the phrase aloud and use the self-check.";
}
function recMime(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){
    try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){}
  }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function cancelPendingMic(){
  if (!pendingMic) return;
  clearTimeout(pendingMic.timer);
  genCounter++;                        /* a late permission result is discarded */
  var v = pendingMic.voice;
  pendingMic = null;
  v.state = "idle"; v.msg = ""; v.notify();
}
function stopLiveRecorder(){
  if (!live) return;
  try { if (live.mr.state !== "inactive") live.mr.stop(); } catch(e){}
}

/* A Voice = recorder + word check for one phrase. slots = number of takes kept. */
function Voice(id, phrase, slots){
  this.id = id; this.p = phrase; this.slots = slots;
  this.takes = []; for (var i = 0; i < slots; i++) this.takes.push(null);
  this.state = "idle";        /* idle | asking | recording */
  this.secs = 0; this.msg = "";
  this.views = [];
  this.attempted = false;     /* learner recorded at least once */
  this.chk = { state:"idle", heard:"", fb:null, note:"", seq:0, ctrl:null, tried:false };
  allVoices.push(this);
}
Voice.prototype.notify = function(){ for (var i = 0; i < this.views.length; i++) this.views[i](); };
Voice.prototype.hasTake = function(){ for (var i = 0; i < this.takes.length; i++) if (this.takes[i]) return true; return false; };
Voice.prototype.nextSlot = function(){
  for (var i = 0; i < this.takes.length; i++) if (!this.takes[i]) return i;
  return this.takes.length - 1;          /* all full: the newest replaces the last take */
};
Voice.prototype.deleteTake = function(i){
  var t = this.takes[i];
  if (!t) return;
  if (audioBusy === "take:" + this.id + ":" + i) stopAudio();
  try { URL.revokeObjectURL(t.url); } catch(e){}
  this.takes[i] = null;
  this.msg = "Recording deleted.";
  this.notify();
};
Voice.prototype.clearAll = function(){
  if (live && live.voice === this) stopLiveRecorder();
  if (pendingMic && pendingMic.voice === this) cancelPendingMic();
  for (var i = 0; i < this.takes.length; i++){
    if (this.takes[i]){
      if (audioBusy === "take:" + this.id + ":" + i) stopAudio();
      try { URL.revokeObjectURL(this.takes[i].url); } catch(e){}
      this.takes[i] = null;
    }
  }
  this.msg = "";
  this.resetCheck();
  this.notify();
};
Voice.prototype.resetCheck = function(){
  abortFeedback(this);
  if (checking && checking === this) stopCheck();
  this.chk.state = "idle"; this.chk.heard = ""; this.chk.fb = null; this.chk.note = "";
  this.notify();
};

function startRecording(v){
  if (!recordingSupported()){ v.msg = unsupportedReason(); v.notify(); return; }
  stopAudio(); stopCheck(); stopLiveRecorder(); cancelPendingMic();
  var gen = ++genCounter;
  var slot = v.nextSlot();
  v.state = "asking"; v.msg = "Allow the microphone, then say the phrase."; v.secs = 0;
  v.notify();
  pendingMic = { voice:v, gen:gen, timer:setTimeout(function(){
    if (!pendingMic || pendingMic.gen !== gen) return;
    cancelPendingMic();
    v.msg = "The microphone did not respond. You can try again or carry on.";
    v.notify();
  }, CONFIG.micPermissionTimeoutMs) };

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (pendingMic && pendingMic.gen === gen){ clearTimeout(pendingMic.timer); pendingMic = null; }
    if (gen !== genCounter){ releaseStream(stream); return; }
    var mr, chunks = [];
    try {
      var mt = recMime();
      mr = mt ? new window.MediaRecorder(stream, { mimeType:mt }) : new window.MediaRecorder(stream);
    } catch(e){
      releaseStream(stream);
      v.state = "idle"; v.msg = "Recording does not work in this browser. You can carry on."; v.notify();
      return;
    }
    var o = { voice:v, mr:mr, stream:stream, gen:gen, slot:slot, tick:null, cap:null, t0:Date.now() };
    live = o;
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
    mr.onerror = function(){
      clearInterval(o.tick); clearTimeout(o.cap); releaseStream(stream);
      if (live === o) live = null;
      if (gen !== genCounter) return;
      v.state = "idle"; v.msg = "The recording did not work. You can try again or carry on."; v.notify();
    };
    mr.onstop = function(){
      clearInterval(o.tick); clearTimeout(o.cap);
      releaseStream(stream);                           /* microphone light off */
      if (live === o) live = null;
      if (gen !== genCounter) return;
      v.state = "idle";
      var size = 0; for (var i = 0; i < chunks.length; i++) size += chunks[i].size;
      if (!chunks.length || size < 800){
        v.msg = "I did not catch that. Try again and speak a little louder."; v.notify(); return;
      }
      var blob;
      try { blob = new Blob(chunks, { type: chunks[0].type || "audio/mp4" }); }
      catch(e){ v.msg = "The recording did not work. You can try again or carry on."; v.notify(); return; }
      if (v.takes[slot]){ try { URL.revokeObjectURL(v.takes[slot].url); } catch(e){} }
      v.takes[slot] = { url: URL.createObjectURL(blob) };
      v.attempted = true;
      v.resetCheck();
      v.msg = "Your recording is ready. Listen to it, then listen to the model.";
      v.notify();
      announce(v.msg);
    };
    try { mr.start(); }
    catch(e){
      releaseStream(stream); if (live === o) live = null;
      v.state = "idle"; v.msg = "Recording does not work in this browser. You can carry on."; v.notify();
      return;
    }
    v.state = "recording"; v.secs = 0; v.msg = "Recording. Say the phrase."; v.notify();
    o.tick = setInterval(function(){
      v.secs = (Date.now() - o.t0) / 1000; v.notify();
    }, 250);
    o.cap = setTimeout(function(){ try { if (mr.state === "recording") mr.stop(); } catch(e){} },
                       CONFIG.recordMaxSeconds * 1000);
  }).catch(function(err){
    if (pendingMic && pendingMic.gen === gen){ clearTimeout(pendingMic.timer); pendingMic = null; }
    if (gen !== genCounter) return;
    v.state = "idle";
    var name = err && err.name;
    if (name === "NotFoundError" || name === "OverconstrainedError") v.msg = "No microphone was found. You can carry on.";
    else v.msg = "The microphone is off. You can carry on.";
    v.notify();
  });
}
function toggleRecording(v){
  if (v.state === "asking") cancelPendingMic();
  else if (v.state === "recording") stopLiveRecorder();
  else startRecording(v);
}

/* ============================================================================
   AI WORD CHECK — speech recognition, then text-only feedback request
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var checking = null;       /* the Voice currently listening */
var recog = null, recogTimer = null;

function checkAvailable(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }
function checkReason(){
  if (!SR) return "Word check does not work in this browser. You can still record, listen and use the self-check.";
  return "Word check is not switched on. You can still record, listen and use the self-check.";
}
function stopCheck(){
  if (recogTimer){ clearTimeout(recogTimer); recogTimer = null; }
  var v = checking; checking = null;
  if (recog){
    try { recog.onresult = null; recog.onerror = null; recog.onend = null; } catch(e){}
    try { recog.abort(); } catch(e){}
    recog = null;
  }
  if (v && v.chk.state === "listening"){ v.chk.state = "idle"; v.notify(); }
}
function abortFeedback(v){
  v.chk.seq++;
  if (v.chk.ctrl){ try { v.chk.ctrl.abort(); } catch(e){} v.chk.ctrl = null; }
}
function startCheck(v){
  if (!checkAvailable()){ v.chk.state = "idle"; v.chk.note = checkReason(); v.notify(); return; }
  stopAudio(); stopLiveRecorder(); cancelPendingMic(); stopCheck(); abortFeedback(v);
  var r;
  try { r = new SR(); } catch(e){ v.chk.note = checkReason(); v.notify(); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;
  v.chk.state = "listening"; v.chk.heard = ""; v.chk.fb = null; v.chk.note = "Listening. Say the phrase once.";
  v.notify();
  r.onresult = function(ev){
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); }
    catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recog !== r || settled) return;
    settled = true;
    var code = ev && ev.error ? String(ev.error) : "";
    stopCheck();
    v.chk.tried = true;
    v.chk.state = "idle";
    if (code === "not-allowed" || code === "service-not-allowed") v.chk.note = "The microphone is off. You can carry on.";
    else if (code === "no-speech" || code === "aborted"){
      v.chk.fb = { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on." };
      v.chk.note = "";
    } else { v.chk.fb = unavailableFb(); v.chk.note = ""; }
    v.notify();
  };
  r.onend = function(){
    if (recog !== r || settled) return;
    settled = true;
    stopCheck();
    var clean = got.replace(/\s+/g, " ").trim();
    if (!clean){
      v.chk.tried = true; v.chk.state = "idle"; v.chk.note = "";
      v.chk.fb = { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on." };
      v.notify(); return;
    }
    if (clean.length > 200) clean = clean.slice(0, 200);
    requestFeedback(v, clean);
  };
  recog = r; checking = v;
  recogTimer = setTimeout(function(){
    if (recog !== r || settled) return;
    settled = true;
    stopCheck();
    v.chk.tried = true; v.chk.state = "idle";
    v.chk.note = "The word check did not respond in this browser. You can try again or carry on.";
    v.notify();
  }, CONFIG.recognitionTimeoutMs);
  try { r.start(); }
  catch(e){ settled = true; stopCheck(); v.chk.state = "idle"; v.chk.note = checkReason(); v.notify(); }
}
function unavailableFb(){
  return { status:"unavailable", message:"Word check is unavailable right now. Listen to the model and practise again, or carry on." };
}
function requestFeedback(v, text){
  var seq = ++v.chk.seq;
  v.chk.state = "checking"; v.chk.heard = text; v.chk.note = "Comparing your words with the model."; v.chk.fb = null;
  v.notify();
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  v.chk.ctrl = ctrl;
  var timedOut = false;
  var timer = setTimeout(function(){ timedOut = true; if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ targetPhrase: v.p.text, recognisedText: text }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer"
  };
  if (ctrl) opts.signal = ctrl.signal;
  var done = function(fb){
    clearTimeout(timer);
    if (v.chk.seq !== seq) return;             /* stale: the take or check was reset */
    v.chk.ctrl = null; v.chk.tried = true; v.chk.state = "idle"; v.chk.note = "";
    v.chk.fb = fb; v.notify();
  };
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad-status"); return res.json(); })
    .then(function(data){ done(sanitiseFeedback(data, v.p) || unavailableFb()); })
    .catch(function(){
      done(timedOut ? { status:"unavailable", message:"The word check took too long. Try again, or carry on." } : unavailableFb());
    });
}
/* Second gate on whatever the server returns: plain sentence text only, no
   scores, grades or levels. Rendered with textContent, never as HTML. */
function sanitiseFeedback(data, p){
  if (!data || typeof data !== "object") return null;
  var s = data.status;
  if (s !== "match" && s !== "try_again" && s !== "unclear") return null;
  var m = (typeof data.message === "string") ? data.message.replace(/\s+/g, " ").trim() : "";
  if (!m || m.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  var focus = (typeof data.focus === "string") ? data.focus.replace(/\s+/g, " ").trim() : "";
  if (focus.length > 60 || !focusApproved(focus, p)) focus = "";
  return { status:s, message:m, focus:focus };
}
function focusApproved(f, p){
  var n = function(x){ return String(x).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  f = n(f);
  if (!f) return true;
  return (" " + n(p.text) + " ").indexOf(" " + f + " ") !== -1;
}

/* ============================================================================
   VIEWS — record controls and word-check panel, bound to a Voice
   ========================================================================= */
function recordView(v, opts){
  opts = opts || {};
  var wrap = el("div", "voice");
  wrap.appendChild(el("h3", null, opts.title || "Record yourself"));
  var row = el("div", "row");
  var rec = el("button", opts.big ? "b-main recbig" : "b-main", "Start recording");
  rec.type = "button";
  rec.addEventListener("click", function(){ toggleRecording(v); });
  var timer = el("span", "timer", "0:00 / " + fmt(CONFIG.recordMaxSeconds));
  timer.setAttribute("aria-hidden", "true");
  row.appendChild(rec); row.appendChild(timer);
  wrap.appendChild(row);
  var status = el("p", "status");
  status.setAttribute("role", "status"); status.setAttribute("aria-live", "polite");
  wrap.appendChild(status);

  var takeRows = [];
  for (var i = 0; i < v.slots; i++){
    (function(i){
      var t = el("div", "take");
      t.appendChild(el("b", null, v.slots > 1 ? "Take " + (i + 1) : "My voice"));
      var hear = takeButton(v, i);
      var del = btn("Delete recording", "b-quiet", function(){ v.deleteTake(i); });
      t.appendChild(hear); t.appendChild(del);
      if (opts.model){ /* optional model button on the same row */ }
      wrap.appendChild(t);
      takeRows.push(t);
    })(i);
  }
  if (opts.model){
    var mrow = el("div", "row");
    modelRow(v.p, mrow);
    wrap.appendChild(mrow);
  }
  if (!recordingSupported()){
    rec.disabled = true;
    status.textContent = unsupportedReason();
  }
  function update(){
    var supported = recordingSupported();
    if (v.state === "recording"){
      rec.textContent = "Stop"; rec.classList.add("on"); rec.setAttribute("aria-pressed", "true");
    } else if (v.state === "asking"){
      rec.textContent = "Cancel"; rec.classList.remove("on"); rec.setAttribute("aria-pressed", "false");
    } else {
      rec.textContent = v.hasTake() ? "Record again" : "Start recording";
      rec.classList.remove("on"); rec.setAttribute("aria-pressed", "false");
    }
    rec.disabled = !supported;
    timer.textContent = fmt(v.state === "recording" ? v.secs : 0) + " / " + fmt(CONFIG.recordMaxSeconds);
    if (supported) status.textContent = v.msg;
    for (var k = 0; k < takeRows.length; k++) takeRows[k].hidden = !v.takes[k];
    refreshPlay();
  }
  v.views.push(update);
  update();
  return wrap;
}

function checkView(v, opts){
  opts = opts || {};
  var wrap = el("div", "voice");
  wrap.appendChild(el("h3", null, opts.title || "Check my words"));
  wrap.appendChild(el("p", "note", "Say the phrase. The computer reads your words. It checks the words, not your accent, and gives no mark."));
  var row = el("div", "row");
  var b = el("button", "b-main", "Check my words");
  b.type = "button";
  b.addEventListener("click", function(){
    if (v.chk.state === "listening") stopCheck();
    else if (v.chk.state === "checking"){ abortFeedback(v); v.chk.state = "idle"; v.chk.note = "Cancelled. You can try again."; v.notify(); }
    else startCheck(v);
  });
  row.appendChild(b);
  wrap.appendChild(row);
  var status = el("p", "status"); status.setAttribute("role", "status"); status.setAttribute("aria-live", "polite");
  wrap.appendChild(status);
  var out = el("div"); out.setAttribute("aria-live", "polite");
  wrap.appendChild(out);
  if (!checkAvailable()){ b.disabled = true; status.textContent = checkReason(); }

  function update(){
    var c = v.chk;
    b.disabled = !checkAvailable();
    if (c.state === "listening") b.textContent = "Stop listening";
    else if (c.state === "checking") b.textContent = "Cancel";
    else b.textContent = c.tried ? "Check again" : "Check my words";
    if (checkAvailable()) status.textContent = c.note || "";
    while (out.firstChild) out.removeChild(out.firstChild);
    if (c.heard){
      var h = el("div", "heard");
      h.appendChild(el("small", null, "Your words:"));
      h.appendChild(el("span", null, c.heard));
      out.appendChild(h);
    }
    if (c.fb){
      var cls = c.fb.status === "match" ? "fb fb-match" : (c.fb.status === "try_again" ? "fb fb-try" : "fb fb-none");
      var word = c.fb.status === "match" ? "Your words matched" :
                 (c.fb.status === "try_again" ? "Try once more" :
                 (c.fb.status === "unavailable" ? "Word check unavailable" : "Not compared"));
      var f = el("div", cls);
      f.appendChild(el("p", "st", word));
      f.appendChild(el("p", null, c.fb.message));
      if (c.fb.focus){
        var pf = el("p"); pf.appendChild(document.createTextNode("Practise this part: "));
        pf.appendChild(el("b", null, c.fb.focus)); f.appendChild(pf);
      }
      if (c.fb.status === "match" || c.fb.status === "try_again") f.appendChild(el("p", null, v.p.tip));
      out.appendChild(f);
    }
  }
  v.views.push(update);
  update();
  return wrap;
}

/* ---- 2. notice the main beat ---- */
var notice = { order:[], tries:{}, done:{}, shown:{} };
var noticeBox, noticeHint, noticeSummary;

function noticeReset(){
  notice.order = shuffle(NOTICE.map(function(n){ return n.id; }));
  notice.tries = {}; notice.done = {}; notice.shown = {}; notice.pick = {};
  if (noticeBox) renderNotice();
}
function noticeAttempted(){
  for (var i = 0; i < NOTICE.length; i++){
    var id = NOTICE[i].id;
    if (!notice.tries[id] && !notice.done[id]) return false;
  }
  return true;
}
function noticeFinished(){
  for (var i = 0; i < NOTICE.length; i++) if (!notice.done[NOTICE[i].id]) return false;
  return true;
}
function findNotice(id){ for (var i = 0; i < NOTICE.length; i++) if (NOTICE[i].id === id) return NOTICE[i]; return null; }

function renderNotice(){
  while (noticeBox.firstChild) noticeBox.removeChild(noticeBox.firstChild);
  for (var k = 0; k < notice.order.length; k++){
    (function(n){
      var c = el("div", "clause");
      var p = el("p");
      var line = n.line[0];
      var idx = line.toLowerCase().indexOf(n.kw.toLowerCase());
      p.appendChild(document.createTextNode(line.slice(0, idx)));
      p.appendChild(el("span", "kw", line.slice(idx, idx + n.kw.length)));
      p.appendChild(document.createTextNode(line.slice(idx + n.kw.length)));
      c.appendChild(p);
      var grp = el("div", "sylrow");
      grp.setAttribute("role", "group");
      grp.setAttribute("aria-label", "Which part of " + n.word + (n.noun ? " (the noun)" : "") + " is the strongest?");
      var wb = audioButton("word_" + n.id, "Hear the word", "Hear the word " + n.word);
      if (wb) grp.appendChild(wb);
      grp.appendChild(el("span", "q", n.word + (n.noun ? " (noun)" : "") + ": tap the strongest part"));
      var done = !!notice.done[n.id];
      for (var i = 0; i < n.syl.length; i++){
        (function(i){
          var b = el("button", "syl", n.syl[i]);
          b.type = "button";
          if (done && i === n.key){ b.classList.add("ok"); b.setAttribute("aria-label", n.syl[i] + ", main beat"); b.setAttribute("aria-pressed", "true"); }
          else b.setAttribute("aria-pressed", (notice.pick && notice.pick[n.id] === i) ? "true" : "false");
          if (!done && notice.pick && notice.pick[n.id] === i) b.classList.add("miss");
          b.disabled = done;
          b.addEventListener("click", function(){
            notice.tries[n.id] = (notice.tries[n.id] || 0) + 1;
            notice.pick[n.id] = i;
            if (i === n.key) notice.done[n.id] = true;
            renderNotice();
            announce(i === n.key ? "Yes. The main beat is on " + n.syl[n.key] + "." : "Not this part.");
          });
          grp.appendChild(b);
        })(i);
      }
      c.setAttribute("data-id", n.id);
      c.appendChild(grp);
      var st = el("p", "status"); st.setAttribute("role", "status"); st.setAttribute("aria-live", "polite");
      if (done){
        var d = el("span", "dot dot-ok"); d.setAttribute("aria-hidden", "true");
        st.appendChild(d);
        st.appendChild(document.createTextNode(notice.shown[n.id]
          ? "The main beat is on " + n.syl[n.key].toUpperCase() + ": " + n.say + "."
          : "Yes. The main beat is on " + n.syl[n.key].toUpperCase() + ": " + n.say + "."));
      } else if (notice.tries[n.id]){
        var d2 = el("span", "dot dot-try"); d2.setAttribute("aria-hidden", "true");
        st.appendChild(d2);
        st.appendChild(document.createTextNode("Not this part. Listen for the longest, clearest part."));
        st.appendChild(document.createTextNode(" "));
        st.appendChild(btn("Show me", "b-quiet", function(){
          notice.done[n.id] = true; notice.shown[n.id] = true; renderNotice();
        }));
      }
      c.appendChild(st);
      noticeBox.appendChild(c);
    })(findNotice(notice.order[k]));
  }
  noticeSummary.hidden = !noticeFinished();
  noticeHint.textContent = "";
}
function buildNotice(){
  var s = newScreen("Notice the main beat");
  s.appendChild(el("p", null, "Read the contract. In each key word, one part is the main beat. Tap that part."));
  var paper = el("div", "paper");
  paper.appendChild(el("p", "paper-title", "Metro Apartment — tenancy contract"));
  paper.appendChild(el("p", "paper-sub", "Fictional practice contract"));
  noticeBox = el("div");
  paper.appendChild(noticeBox);
  s.appendChild(paper);
  noticeSummary = el("p", "wrap-note", "One part of each word is the main beat. Say that part longer and clearer. Say the other parts quickly.");
  noticeSummary.hidden = true;
  s.appendChild(noticeSummary);
  noticeHint = el("p", "status hint"); noticeHint.setAttribute("role", "status"); noticeHint.setAttribute("aria-live", "polite");
  s.appendChild(noticeHint);
  var a = el("div", "actions");
  a.appendChild(btn("Try again", "b-quiet", function(){ noticeReset(); announce("Starting this task again."); }));
  a.appendChild(btn("Practise the three phrases", "b-main", function(){
    if (!noticeAttempted()){ noticeHint.textContent = "Tap one part in each word first. You can do it."; return; }
    go(2);
  }));
  s.appendChild(a);
  noticeReset();
  renderNotice();
}

/* ---- 3. rehearse in chunks (rhythm strip) ---- */
var rehearse = { active:0, voices:[], panels:[], tabs:[] };
function buildRehearse(){
  var s = newScreen("Hear it, say it");
  s.appendChild(el("p", null, "Pick a phrase. Listen to the model. Say the phrase. The big dot shows the main beat."));
  var tabs = el("div", "tabs");
  tabs.setAttribute("role", "group"); tabs.setAttribute("aria-label", "Choose a phrase");
  s.appendChild(tabs);
  var host = el("div"); s.appendChild(host);

  PHRASES.forEach(function(p, i){
    var v = new Voice("r-" + p.id, p, 1);
    rehearse.voices.push(v);
    var tb = btn(p.word, "b-quiet", function(){ showPhrase(i); });
    tb.setAttribute("aria-pressed", "false");
    tb.setAttribute("aria-label", "Phrase " + (i + 1) + ": " + p.text);
    tabs.appendChild(tb); rehearse.tabs.push(tb);

    var panel = el("div"); panel.hidden = true;
    var rh = el("div", "rhythm");
    rh.appendChild(el("p", "big", p.text));
    var ol = el("ol", "strip");
    ol.setAttribute("aria-label", "Rhythm of: " + p.text);
    p.strip.forEach(function(u){
      var li = el("li");
      li.appendChild(el("span", u[1] === 2 ? "u beat" : "u", u[0]));
      var d = el("span", "d " + (u[1] === 2 ? "s" : (u[1] === 1 ? "w" : "n")));
      d.setAttribute("aria-hidden", "true");
      li.appendChild(d);
      ol.appendChild(li);
    });
    rh.appendChild(ol);
    rh.appendChild(el("p", "sr", "Main beat on " + p.beat + " in " + p.word + "."));
    var cols = el("div", "cols");
    cols.style.marginTop = "12px";
    cols.appendChild(figure(p.img, p.alt));
    var side = el("div");
    side.appendChild(el("p", null, "Say it with the beat on " + p.beat + "."));
    var r = el("div", "row"); r.style.marginTop = "0";
    modelRow(p, r);
    side.appendChild(r);
    cols.appendChild(side);
    rh.appendChild(cols);
    panel.appendChild(rh);
    panel.appendChild(recordView(v, { title:"Record and hear yourself" }));
    panel.appendChild(checkView(v, { title:"Check my words" }));
    host.appendChild(panel);
    rehearse.panels.push(panel);
  });

  var a = el("div", "actions");
  a.appendChild(btn("Try again", "b-quiet", function(){
    stopAudio();
    rehearse.voices.forEach(function(v){ v.clearAll(); });
    announce("Starting this screen again.");
  }));
  a.appendChild(btn("Open the recording studio", "b-main", function(){ go(3); }));
  s.appendChild(a);
  showPhrase(0);
}
function showPhrase(i){
  stopAudio(); stopCheck(); stopLiveRecorder(); cancelPendingMic();
  rehearse.active = i;
  rehearse.panels.forEach(function(p, k){ p.hidden = (k !== i); });
  rehearse.tabs.forEach(function(t, k){
    t.setAttribute("aria-pressed", k === i ? "true" : "false");
    t.className = k === i ? "b-main" : "b-quiet";
  });
}

/* ---- 4. recording studio ---- */
var studio;
function buildStudio(){
  studio = new Voice("studio", STUDIO_PHRASE, 2);
  var s = newScreen("Recording studio");
  var box = el("div", "studio");
  var big = el("p", "big");
  big.appendChild(document.createTextNode("How much is the de"));
  big.appendChild(el("span", "beat", "pos"));
  big.appendChild(document.createTextNode("it?"));
  big.setAttribute("aria-label", STUDIO_PHRASE.text + " Main beat on POS.");
  box.appendChild(big);
  box.appendChild(el("p", null, "Keep the words in front of you. Make POS the longest, clearest part."));
  var r = el("div", "row"); modelRow(STUDIO_PHRASE, r);
  box.appendChild(r);
  box.appendChild(recordView(studio, { title:"Your recording", big:true }));
  box.appendChild(fr("Gardez la phrase sous les yeux. Faites de POS la partie la plus longue et la plus claire."));
  s.appendChild(box);
  var a = el("div", "actions");
  a.appendChild(btn("Try again", "b-quiet", function(){
    studio.clearAll(); announce("Starting this screen again.");
  }));
  a.appendChild(btn("Compare my takes", "b-main", function(){ go(4); }));
  s.appendChild(a);
}

/* ---- 5. compare and word check ---- */
var compareNote;
function buildCompare(){
  var s = newScreen("Compare and check");
  s.appendChild(el("p", null, "Hear the model. Then hear your take. Listen for the beat on POS."));
  var mix = el("div", "mix");
  var l0 = el("div", "line"); l0.appendChild(el("b", null, "Model"));
  modelRow(STUDIO_PHRASE, l0);
  mix.appendChild(l0);
  var rows = [];
  for (var i = 0; i < studio.slots; i++){
    (function(i){
      var l = el("div", "line mine");
      l.appendChild(el("b", null, "Take " + (i + 1)));
      l.appendChild(takeButton(studio, i));
      l.appendChild(btn("Delete recording", "b-quiet", function(){ studio.deleteTake(i); }));
      mix.appendChild(l); rows.push(l);
    })(i);
  }
  s.appendChild(mix);
  compareNote = el("p", "status"); compareNote.setAttribute("role", "status"); compareNote.setAttribute("aria-live", "polite");
  s.appendChild(compareNote);
  s.appendChild(btn("Record again", "b-quiet", function(){ go(3); }));
  s.appendChild(checkView(studio, { title:"Check my words" }));
  s.appendChild(el("p", "note", "No microphone? Listen to the model and say the phrase aloud. You can use the self-check on the next screen."));
  studio.views.push(function(){
    var any = studio.hasTake();
    for (var k = 0; k < rows.length; k++) rows[k].hidden = !studio.takes[k];
    compareNote.textContent = any ? "" : "You have no recording yet. Go back to the studio, or use the self-check on the next screen.";
  });
  studio.notify();
  var a = el("div", "actions");
  a.appendChild(btn("Try again", "b-quiet", function(){ studio.resetCheck(); announce("Starting the word check again."); }));
  a.appendChild(btn("Finish up", "b-main", function(){ go(5); }));
  s.appendChild(a);
}

/* ---- 6. close ---- */
var selfCheck = false, doneBtn, doneStatus, doneHint, completionSent = false, completionInFlight = false, checkBox;
function practised(){
  if (selfCheck) return true;
  for (var i = 0; i < allVoices.length; i++){
    var v = allVoices[i];
    if (v.attempted || v.chk.tried || v.chk.fb) return true;
  }
  return false;
}
function canFinish(){ return noticeAttempted() && practised(); }
function refreshDone(){
  if (!doneBtn) return;
  var ok = canFinish();
  doneBtn.disabled = !ok || completionInFlight;
  if (completionSent){ doneBtn.disabled = true; return; }
  if (ok) doneHint.textContent = "";
  else {
    var need = [];
    if (!noticeAttempted()) need.push("tap one part in each word on the contract");
    if (!practised()) need.push("say the phrase once (record it, check your words, or tick the box)");
    doneHint.textContent = "To finish: " + need.join(", and ") + ".";
  }
}
function buildClose(){
  var s = newScreen("You practised a useful phrase");
  var c = el("div", "close");
  var cols = el("div", "cols");
  cols.appendChild(figure("deposit", "A yellow envelope with coins and a key."));
  var t = el("div");
  t.appendChild(el("p", null, "Your phrase: “How much is the deposit?”"));
  t.appendChild(el("p", null, "Your focus: put the main beat on POS in de-POS-it. The same idea helps with CON-tract and in-STAL-ment."));
  cols.appendChild(t);
  c.appendChild(cols);
  s.appendChild(c);
  s.appendChild(el("p", null, "You do not need a perfect voice. A clear, understandable phrase is the goal."));
  s.appendChild(fr("Une phrase claire et compréhensible suffit."));
  var ck = el("div", "check");
  checkBox = document.createElement("input");
  checkBox.type = "checkbox"; checkBox.id = "self";
  checkBox.addEventListener("change", function(){ selfCheck = checkBox.checked; refreshDone(); });
  var lab = el("label", null, "I listened to the model and said the phrase aloud.");
  lab.setAttribute("for", "self");
  ck.appendChild(checkBox); ck.appendChild(lab);
  s.appendChild(ck);
  doneHint = el("p", "status hint"); doneHint.setAttribute("role", "status"); doneHint.setAttribute("aria-live", "polite");
  s.appendChild(doneHint);
  doneStatus = el("p", "status"); doneStatus.setAttribute("role", "status"); doneStatus.setAttribute("aria-live", "polite");
  s.appendChild(doneStatus);
  var a = el("div", "actions");
  a.appendChild(btn("Record once more", "b-quiet", function(){ go(3); }));
  a.appendChild(btn("Try again", "b-quiet", resetAll));
  doneBtn = btn("Done", "b-done", finish);
  a.appendChild(doneBtn);
  s.appendChild(a);
  screens[screens.length - 1].onShow = refreshDone;
}

/* Replace the body of commitCompletion() with the real bridge call when one is
   supplied. It must return a Promise that REJECTS on failure. */
function commitCompletion(){ return Promise.resolve(); }

function finish(){
  if (completionSent || completionInFlight || !canFinish()) return;
  completionInFlight = true;
  refreshDone();
  commitCompletion().then(function(){
    completionInFlight = false; completionSent = true;
    doneStatus.textContent = "You finished the Pronunciation Clinic.";
    refreshDone();
  }).catch(function(){
    completionInFlight = false;
    doneStatus.textContent = "That did not work. Press Done to try again.";
    refreshDone();
  });
}

function resetAll(){
  stopAudio(); stopCheck(); stopLiveRecorder(); cancelPendingMic();
  allVoices.forEach(function(v){ v.clearAll(); v.attempted = false; v.chk.tried = false; });
  noticeReset();
  selfCheck = false; if (checkBox) checkBox.checked = false;
  showPhrase(0);
  doneStatus.textContent = completionSent ? "You finished the Pronunciation Clinic." : "";
  go(0);
  announce("The activity starts again.");
}

/* ============================================================================
   NAVIGATION — never automatic
   ========================================================================= */
function go(i){
  if (i < 0 || i >= screens.length) return;
  stopAudio(); stopCheck(); stopLiveRecorder(); cancelPendingMic();
  for (var k = 0; k < screens.length; k++) screens[k].el.hidden = (k !== i);
  current = i;
  document.getElementById("pos").textContent = "Part " + (i + 1) + " of " + TOTAL;
  if (screens[i].onShow) screens[i].onShow();
  try { screens[i].el.focus({ preventScroll:true }); } catch(e){ try { screens[i].el.focus(); } catch(e2){} }
  try { window.scrollTo(0, 0); } catch(e){}
}

function cleanUp(){
  stopCheck(); stopLiveRecorder(); cancelPendingMic(); stopAudio();
  allVoices.forEach(function(v){
    v.takes.forEach(function(t){ if (t){ try { URL.revokeObjectURL(t.url); } catch(e){} } });
  });
}
window.addEventListener("pagehide", cleanUp);
window.addEventListener("beforeunload", cleanUp);

function init(){
  buildDesk(); buildNotice(); buildRehearse(); buildStudio(); buildCompare(); buildClose();
  allVoices.forEach(function(v){ v.views.push(refreshDone); });
  go(0);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

/* Exposed for the verification harness only. No learner data is held here. */
window.__PZ__ = { go:go, CONFIG:CONFIG, AUDIO_FILES:AUDIO_FILES, sanitiseFeedback:sanitiseFeedback,
                  state:function(){ return { current:current, completionSent:completionSent, notice:notice }; } };
})();
</script>
