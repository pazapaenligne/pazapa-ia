(syllable blocks) in the action words, plus polite question intonation in two
useful phrases. All words and phrases come from the Week 16 Lesson 2 workbook.
Illustrations are taken from the workbook's "Final-assessment action words" page.

<style>
:root{
  --pz-blue:#36BBD6; --pz-lime:#C9D646; --pz-yellow:#FCC104; --pz-red:#E6352B;
  --pz-grey:#EBEBEB; --pz-dark:#2E2E2D; --pz-heading:#1B7E92;
  --pz-blue-80:#5EC9DE; --pz-blue-60:#86D6E6; --pz-blue-40:#AFE4EF; --pz-blue-20:#D7F1F7;
  --pz-lime-80:#D4DE6B; --pz-lime-20:#F4F7DA;
  --pz-yellow-80:#FDCD36; --pz-yellow-20:#FEF3CD;
  --pz-head-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --pz-body-font:"Open Sans",Arial,sans-serif;
  --pz-radius:10px; --pz-tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--pz-body-font);font-size:17px;line-height:1.6;color:var(--pz-dark);background:#fff;-webkit-text-size-adjust:100%;}
.pz-shell{max-width:44rem;margin:0 auto;padding:16px 16px 40px;}
.pz-brand{display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--pz-blue);padding-bottom:12px;margin-bottom:16px;}
.pz-brand img{max-height:40px;width:auto;}
.pz-brand-text{font-family:var(--pz-head-font);font-weight:600;font-size:1.05rem;color:var(--pz-heading);}
.pz-crumb{font-size:.9rem;margin:0;opacity:.85;}
.pz-brand .pz-grow{flex:1 1 auto;min-width:0;}
h1,h2,h3{font-family:var(--pz-head-font);color:var(--pz-heading);line-height:1.25;}
h1{font-size:1.55rem;margin:0 0 8px;} h2{font-size:1.2rem;margin:0 0 10px;} h3{font-size:1.02rem;margin:0 0 6px;}
p{margin:0 0 12px;}
.pz-fr{font-size:.92rem;font-style:italic;margin:0 0 12px;}
body:not(.pz-show-fr) .pz-fr{display:none;}
.pz-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.pz-progress{font-size:.88rem;background:var(--pz-grey);border-radius:var(--pz-radius);padding:6px 12px;margin:0;}
.pz-screen{outline:none;}
[hidden]{display:none !important;}
.pz-accent{width:56px;height:5px;border-radius:3px;background:var(--pz-red);margin:0 0 14px;}
button{font-family:var(--pz-body-font);font-size:1rem;font-weight:600;min-height:var(--pz-tap);min-width:var(--pz-tap);padding:10px 18px;border-radius:var(--pz-radius);border:2px solid var(--pz-dark);background:#fff;color:var(--pz-dark);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--pz-grey);}
button:focus-visible{outline:4px solid var(--pz-dark);outline-offset:3px;}
button[disabled]{opacity:.5;cursor:default;}
button[disabled]:hover{background:#fff;}
.pz-btn-primary{background:var(--pz-blue);border-color:var(--pz-blue);}
.pz-btn-primary:hover{background:var(--pz-blue-80);}
.pz-btn-help{background:var(--pz-yellow);border-color:var(--pz-yellow);}
.pz-btn-help:hover{background:var(--pz-yellow-80);}
.pz-btn-done{background:var(--pz-lime);border-color:var(--pz-lime);}
.pz-btn-done:hover{background:var(--pz-lime-80);}
.pz-btn-quiet{font-weight:400;}
button[aria-pressed="true"].pz-toggle{background:var(--pz-dark);color:#fff;}
.pz-btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;}
.pz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:14px;margin:0 0 18px;padding:0;list-style:none;}
.pz-card{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:14px;background:#fff;}
.pz-figure{margin:0 0 10px;text-align:center;}
.pz-figure img{width:100%;max-width:170px;height:auto;border-radius:var(--pz-radius);background:var(--pz-grey);}
.pz-word{font-family:var(--pz-head-font);font-size:1.4rem;margin:0 0 6px;}
.pz-blocks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0;list-style:none;}
.pz-blocks li{border:2px solid var(--pz-blue-60);background:var(--pz-blue-20);border-radius:8px;padding:2px 10px;font-size:1.05rem;}
.pz-blocks li.pz-strong{background:var(--pz-blue);border-color:var(--pz-dark);font-weight:700;font-size:1.2rem;}
.pz-blocks li.pz-strong::after{content:" ●";}
.pz-cue{font-size:.86rem;margin:0 0 8px;}
.pz-phrase{font-family:var(--pz-head-font);font-size:1.3rem;line-height:1.5;margin:0 0 6px;}
.pz-phrase b{background:var(--pz-yellow-20);border-bottom:3px solid var(--pz-yellow);padding:0 2px;font-weight:700;}
.pz-note{background:var(--pz-yellow-20);border-left:6px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:10px 12px;margin:0 0 12px;}
.pz-practice{border:2px dashed var(--pz-blue-60);background:var(--pz-blue-20);border-radius:var(--pz-radius);padding:14px;margin:0 0 16px;}
.pz-status{font-size:.95rem;margin:12px 0 0;min-height:1.4em;}
.pz-status:empty{display:none;}
.pz-fbbox{background:#fff;border:2px solid var(--pz-dark);border-radius:var(--pz-radius);padding:10px 12px;margin:12px 0 0;}
.pz-fbbox p{margin:0 0 6px;}
.pz-fallback{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:10px 12px;margin:12px 0 0;}
.pz-selfcheck{border:2px solid var(--pz-lime);background:var(--pz-lime-20);border-radius:var(--pz-radius);padding:12px 14px;margin:0 0 16px;}
.pz-selfcheck label{display:flex;align-items:center;gap:10px;min-height:var(--pz-tap);}
.pz-selfcheck input{width:24px;height:24px;}
.pz-complete{background:var(--pz-lime-20);border:2px solid var(--pz-lime);border-radius:var(--pz-radius);padding:16px;margin:0 0 18px;}
.pz-nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:2px solid var(--pz-grey);}
.pz-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
noscript p{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:14px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
@media (max-width:420px){body{font-size:16px;}.pz-btnrow button,.pz-nav button{flex:1 1 100%;}}
</style>

/* ---------- helpers ---------- */
function el(tag, cls, text){
  var n=document.createElement(tag);
  if (cls) n.className=cls;
  if (text!==undefined && text!==null) n.textContent=text;
  return n;
}
function btn(label, cls, onClick){
  var b=el("button", cls, label); b.type="button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
function fr(text){ var p=el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function announce(msg){ var l=document.getElementById("pz-live"); if (l) l.textContent=String(msg||""); }
function safeStore(k,v){ try{ if (v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v);}catch(e){} return null; }

/* ---------- audio: one element, one source at a time ---------- */
var audioEl=document.getElementById("pz-audio");
var audioBusy=null;     /* key of what is sounding */
var audioToken=0;

function refreshAudioButtons(){
  var bs=document.querySelectorAll("[data-play-key]");
  for (var i=0;i<bs.length;i++){
    var b=bs[i], on=(b.getAttribute("data-play-key")===audioBusy);
    b.setAttribute("aria-pressed", on?"true":"false");
    b.textContent = on ? b.getAttribute("data-stop") : b.getAttribute("data-play");
  }
}
function stopAudio(){
  audioToken++;
  try{ audioEl.pause(); }catch(e){}
  try{ if (audioEl.readyState>0) audioEl.currentTime=0; }catch(e){}
  audioBusy=null; refreshAudioButtons();
}
function playSrc(src, key){
  if (!src) return;
  if (audioBusy===key){ stopAudio(); return; }
  stopAudio();
  stopRecorder();                 /* playback stops any active recording */
  var t=++audioToken;
  audioBusy=key; refreshAudioButtons();
  try{
    if (audioEl.getAttribute("src")!==src) audioEl.src=src;
    var p=audioEl.play();
    if (p && p.catch) p.catch(function(){ if (t!==audioToken) return; audioBusy=null; refreshAudioButtons(); announce("The audio did not play."); });
  }catch(e){ audioBusy=null; refreshAudioButtons(); }
}
audioEl.addEventListener("ended", function(){ audioBusy=null; refreshAudioButtons(); });
audioEl.addEventListener("error", function(){ if (audioEl.getAttribute("src")){ audioBusy=null; refreshAudioButtons(); } });

/* Model Listen button. Disabled, and clearly labelled, when no file is set. */
function listenButton(id, label, spokenText){
  var has = !!AUDIO_FILES[id];
  var b = btn(has ? "Listen" : "Listen (audio not available yet)", "pz-btn-help");
  b.setAttribute("aria-label", (has ? "Listen: " : "Listen, audio not available yet: ") + spokenText);
  if (!has){ b.disabled=true; b.title="Model audio file: "+AUDIO_PATHS_READY[id]; return b; }
  b.setAttribute("data-play-key", "model:"+id);
  b.setAttribute("data-play","Listen"); b.setAttribute("data-stop","Stop");
  b.setAttribute("aria-pressed","false");
  b.addEventListener("click", function(){ playSrc(AUDIO_FILES[id], "model:"+id); });
  return b;
}

/* ---------- recording ---------- */
var recorder=null, recStream=null, recUnit=null, recGen=0, pendingUnit=null, pendingTimer=null;
var units=[];                /* every practice unit that may hold a Blob URL */

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
    typeof navigator.mediaDevices.getUserMedia==="function" && typeof window.MediaRecorder!=="undefined");
}
function pickMime(){
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i=0;i<c.length;i++){ try{ if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
function releaseStream(s){ if (!s) return; try{ s.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); }catch(e){} }
function stopRecorder(){
  if (pendingUnit){ cancelPending(); }
  if (recorder){ try{ if (recorder.state!=="inactive") recorder.stop(); }catch(e){} }
}
function cancelPending(){
  if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
  if (pendingUnit){ recGen++; var u=pendingUnit; pendingUnit=null; u.render(); u.say("Cancelled. You can try again."); }
}
function clearUnit(u){
  if (audioBusy==="rec:"+u.key) stopAudio();
  if (u.url){ try{ URL.revokeObjectURL(u.url); }catch(e){} }
  u.url=null; u.blob=null;
}
function clearAllUnits(){
  stopRecorder(); stopAudio();
  units.forEach(clearUnit);
  units=[];
}

/* A practice unit: Listen, Record my voice, Stop, Hear my recording, Try again
   (+ optional "Get AI feedback" for phrases) and a manual "I practised" path. */
function buildUnit(item, opts){
  opts=opts||{};
  var u={key:item.id+"-"+units.length, url:null, blob:null, recording:false, practised:false, mic:true, sending:false};
  units.push(u);
  var box=el("div","pz-practice");
  var row=el("div","pz-btnrow");
  var listen=opts.noListen?null:listenButton(item.id, "Listen", item.text);
  var rec=btn("Record my voice","pz-btn-primary");
  var stop=btn("Stop","pz-btn-quiet");
  var hear=btn("Hear my recording","pz-btn-primary");
  var again=btn("Try again","pz-btn-quiet");
  if (listen) row.appendChild(listen); row.appendChild(rec); row.appendChild(stop); row.appendChild(hear); row.appendChild(again);
  var ai=null;
  if (opts.ai && /^https:\/\//.test(CONFIG.feedbackEndpoint)){ ai=btn("Get AI feedback","pz-btn-quiet"); row.appendChild(ai); }
  box.appendChild(row);

  var status=el("p","pz-status"); status.setAttribute("role","status"); status.setAttribute("aria-live","polite");
  box.appendChild(status);
  var fb=el("div"); fb.setAttribute("aria-live","polite"); box.appendChild(fb);
  var manual=el("div","pz-fallback"); manual.hidden=true;
  manual.appendChild(el("p",null,"You can still practise without recording. Listen, say it aloud, then tap the button."));
  var prac=btn("I practised","pz-btn-quiet");
  prac.setAttribute("aria-pressed","false");
  prac.addEventListener("click", function(){ u.practised=true; prac.setAttribute("aria-pressed","true"); prac.textContent="I practised ✓"; u.say("Good. You practised this out loud."); });
  manual.appendChild(prac); box.appendChild(manual);
  if (opts.ai && !ai){
    box.appendChild(el("p","pz-cue","AI feedback is not set up in this activity. Recording and hearing yourself still work."));
  }

  u.say=function(t){ status.textContent=t; };
  u.render=function(){
    var busy = u.recording || pendingUnit===u;
    rec.disabled = busy || u.sending;
    stop.disabled = !busy;
    hear.disabled = !u.url || busy;
    again.disabled = !u.url || busy || u.sending;
    if (ai) ai.disabled = !u.blob || busy || u.sending;
    hear.setAttribute("data-play-key","rec:"+u.key);
    hear.setAttribute("data-play","Hear my recording"); hear.setAttribute("data-stop","Stop");
    hear.setAttribute("aria-pressed", audioBusy==="rec:"+u.key ? "true":"false");
    rec.setAttribute("aria-pressed", busy?"true":"false");
  };
  function showManual(){ manual.hidden=false; }
  function fail(msg){ u.recording=false; pendingUnit=null; u.say(msg); showManual(); u.render(); }

  function start(){
    if (u.recording || pendingUnit) return;            /* no double-start */
    if (!recordingSupported()){
      u.mic=false;
      u.say(window.isSecureContext ? "Recording is not supported in this browser." : "Recording needs a secure (https) page.");
      showManual(); u.render(); return;
    }
    stopAudio(); stopRecorder(); clearUnit(u); fb.textContent="";
    var gen=++recGen; pendingUnit=u; u.say("Asking for the microphone. Allow it to record."); u.render();
    pendingTimer=setTimeout(function(){
      if (gen!==recGen) return;
      pendingTimer=null; pendingUnit=null; recGen++;
      fail("The microphone did not respond. You can try again or practise without recording.");
    }, 10000);
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
      if (gen!==recGen){ releaseStream(stream); return; }
      pendingUnit=null;
      var chunks=[], mr, cap=null;
      try{ var mt=pickMime(); mr = mt ? new MediaRecorder(stream,{mimeType:mt}) : new MediaRecorder(stream); }
      catch(e){ releaseStream(stream); fail("Recording is not supported in this browser."); return; }
      recorder=mr; recStream=stream; recUnit=u;
      mr.ondataavailable=function(ev){ if (ev.data && ev.data.size>0) chunks.push(ev.data); };
      mr.onerror=function(){
        if (cap) clearTimeout(cap);
        releaseStream(stream); if (recorder===mr) recorder=null;
        if (gen!==recGen) return;
        fail("The recording did not work. Please try again.");
      };
      mr.onstop=function(){
        if (cap) clearTimeout(cap);
        releaseStream(stream);                    /* microphone released straight away */
        if (recorder===mr) recorder=null;
        u.recording=false;
        if (gen!==recGen){ u.render(); return; }
        var blob=null;
        try{ if (chunks.length) blob=new Blob(chunks,{type:chunks[0].type||"audio/mp4"}); }catch(e){}
        if (!blob || blob.size===0){ u.say("No sound was recorded. Check your microphone and try again."); showManual(); u.render(); return; }
        u.blob=blob; u.url=URL.createObjectURL(blob);
        u.say("Recording stopped. Your recording is ready to hear.");
        u.render();
      };
      try{ mr.start(); }catch(e){ releaseStream(stream); recorder=null; fail("The recording did not work. Please try again."); return; }
      u.recording=true; u.say("Recording. Say it now, then press Stop."); u.render();
      cap=setTimeout(function(){ try{ if (mr.state==="recording") mr.stop(); }catch(e){} }, 12000);
    }).catch(function(err){
      if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
      if (gen!==recGen) return;
      var n=err && err.name;
      if (n==="NotAllowedError" || n==="SecurityError") fail("The microphone is blocked. Allow it in your browser, or practise without recording.");
      else if (n==="NotFoundError" || n==="OverconstrainedError") fail("No microphone was found. You can practise without recording.");
      else fail("The microphone did not work. You can practise without recording.");
    });
  }
  rec.addEventListener("click", start);
  again.addEventListener("click", start);
  stop.addEventListener("click", function(){
    if (pendingUnit===u){ cancelPending(); return; }
    if (u.recording){ try{ recorder.stop(); }catch(e){} }
  });
  hear.addEventListener("click", function(){
    if (!u.url) return;
    playSrc(u.url, "rec:"+u.key);
    u.say(audioBusy==="rec:"+u.key ? "Playing your recording." : "");
  });

  /* Optional AI feedback: only after an explicit confirmation. */
  if (ai){
    ai.addEventListener("click", function(){
      if (!u.blob || u.sending) return;
      fb.textContent="";
      var c=el("div","pz-fbbox");
      c.appendChild(el("p",null,"Send this recording for feedback?"));
      var r=el("div","pz-btnrow");
      var yes=btn("Send","pz-btn-primary"), no=btn("Cancel","pz-btn-quiet");
      r.appendChild(yes); r.appendChild(no); c.appendChild(r); fb.appendChild(c);
      no.addEventListener("click", function(){ fb.textContent=""; ai.focus(); });
      yes.addEventListener("click", function(){ send(); });
      yes.focus();
    });
  }
  function send(){
    if (u.sending || !u.blob) return;
    u.sending=true; u.render(); fb.textContent="";
    u.say("Sending your recording. Please wait.");
    var ctrl=(typeof AbortController==="function")?new AbortController():null;
    var timer=setTimeout(function(){ if (ctrl) try{ctrl.abort();}catch(e){} }, CONFIG.requestTimeoutMs);
    var fd=new FormData();
    fd.append("audio", u.blob, "recording");
    fd.append("expectedPhrase", item.text);
    fd.append("locale","en-GB");
    fd.append("activityId", CONFIG.activityId);
    var o={method:"POST", body:fd, cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer"};
    if (ctrl) o.signal=ctrl.signal;
    fetch(CONFIG.feedbackEndpoint, o).then(function(res){
      if (!res.ok) throw new Error("status");
      return res.text();
    }).then(function(txt){
      clearTimeout(timer);
      if (txt.length>2000) throw new Error("size");
      var d=JSON.parse(txt);
      var ok = d && typeof d==="object" && typeof d.strength==="string" && typeof d.nextStep==="string" &&
        d.strength.length>0 && d.strength.length<=240 && d.nextStep.length>0 && d.nextStep.length<=240;
      if (!ok) throw new Error("schema");
      u.sending=false; u.render(); u.say("Feedback received.");
      var c=el("div","pz-fbbox");
      var a=el("p"); var s1=el("b",null,"Good: "); a.appendChild(s1); a.appendChild(document.createTextNode(d.strength));
      var b2=el("p"); var s2=el("b",null,"Next step: "); b2.appendChild(s2); b2.appendChild(document.createTextNode(d.nextStep));
      c.appendChild(a); c.appendChild(b2); fb.appendChild(c);
    }).catch(function(e){
      clearTimeout(timer);
      u.sending=false; u.render();
      u.say("Feedback is not available right now. You can try again or carry on.");
      var rt=btn("Try feedback again","pz-btn-quiet"); rt.addEventListener("click", function(){ fb.textContent=""; send(); });
      fb.appendChild(rt);
    });
  }

  if (!recordingSupported()){ u.say(window.isSecureContext ? "Recording is not supported in this browser." : "Recording needs a secure (https) page."); showManual(); }
  u.render();
  return box;
}

/* ---------- screens ---------- */
var TOTAL=6, current=0, doneBtn=null, completionSent=false;
var main=document.getElementById("pz-main");
var progress=document.getElementById("pz-progress");

function newScreen(n, title){
  var s=el("section","pz-screen"); s.id="pz-s"+n; s.tabIndex=-1;
  var h=el("h1",null,title); h.id="pz-s"+n+"-h"; s.setAttribute("aria-labelledby",h.id);
  s.appendChild(el("div","pz-accent")); s.querySelector(".pz-accent").setAttribute("aria-hidden","true");
  s.appendChild(h);
  return s;
}
function navRow(label, handler){
  var r=el("div","pz-nav"); var b=btn(label,"pz-btn-primary",handler); r.appendChild(b); return {row:r,btn:b};
}
function blocksList(w){
  var ul=el("ul","pz-blocks"); ul.setAttribute("aria-label","Syllables of "+w.text);
  w.blocks.forEach(function(t,i){
    var li=el("li", i===w.stress?"pz-strong":null, t);
    if (i===w.stress) li.setAttribute("aria-label", t+", stressed");
    ul.appendChild(li);
  });
  return ul;
}
function stressCue(w){
  if (w.blocks.length===1) return "One syllable.";
  var ord=["1st","2nd","3rd"][w.stress];
  return w.blocks.length+" syllables. Stress the "+ord+" block (●).";
}

function buildScreens(){
  main.textContent=""; var S=[];

  /* 1 — hear the targets */
  var s1=newScreen(1,"Listen and notice.");
  s1.appendChild(el("p",null,"These are action words from your final practical assessment. Look at each word and its blocks. The ● shows the strong part."));
  s1.appendChild(fr("Voici des verbes d’action de votre évaluation pratique finale. Regardez chaque mot et ses blocs. Le ● montre la partie accentuée."));
  var grid=el("ul","pz-grid");
  WORDS.forEach(function(w){
    var li=el("li","pz-card");
    var fg=el("div","pz-figure"); var im=el("img"); im.src=IMAGES[w.id]; im.alt=w.alt; fg.appendChild(im); li.appendChild(fg);
    li.appendChild(el("p","pz-word",w.text));
    li.appendChild(blocksList(w));
    li.appendChild(el("p","pz-cue",stressCue(w)));
    li.appendChild(fr(w.fr));
    grid.appendChild(li);
  });
  s1.appendChild(grid);
  var n1=navRow("Continue", function(){ goTo(1); }); s1.appendChild(n1.row);
  S.push(s1);

  /* 2 — notice one feature */
  var s2=newScreen(2,"Notice word stress");
  s2.appendChild(el("p",null,"In English, one part of a word is stronger. Say that part louder and longer."));
  s2.appendChild(fr("En anglais, une partie du mot est plus forte. Dites cette partie plus fort et plus longtemps."));
  var ex=el("ul","pz-grid");
  FOCUS_EXAMPLES.forEach(function(id){
    var w=wordById(id); var li=el("li","pz-card");
    li.appendChild(el("p","pz-word",w.text));
    li.appendChild(blocksList(w));
    li.appendChild(el("p","pz-cue",stressCue(w)));
    ex.appendChild(li);
  });
  s2.appendChild(ex);
  var n2=navRow("Continue", function(){ goTo(2); }); s2.appendChild(n2.row);
  S.push(s2);

  /* 3 — guided word practice (one word at a time) */
  var s3=newScreen(3,"Practise the words");
  s3.appendChild(el("p",null,"Say the word, then record your voice. Hear your recording. Try again if you want."));
  s3.appendChild(fr("Dites le mot, puis enregistrez votre voix. Écoutez votre enregistrement. Réessayez si vous voulez."));
  var host3=el("div"); s3.appendChild(host3);
  var wi=0;
  function showWord(){
    clearAllUnits(); host3.textContent="";
    var w=wordById(GUIDED[wi]);
    var card=el("div","pz-card");
    var hd=el("h2",null,"Word "+(wi+1)+" of "+GUIDED.length); card.appendChild(hd);
    var fg=el("div","pz-figure"); var im=el("img"); im.src=IMAGES[w.id]; im.alt=w.alt; fg.appendChild(im); card.appendChild(fg);
    card.appendChild(el("p","pz-word",w.text));
    card.appendChild(blocksList(w));
    card.appendChild(el("p","pz-cue",stressCue(w)));
    card.appendChild(fr(w.fr));
    card.appendChild(buildUnit({id:w.id,text:w.text},{noListen:true}));
    if (wi<GUIDED.length-1){
      var nx=btn("Next word","pz-btn-primary",function(){ wi++; showWord(); var h=host3.querySelector("h2"); if (h){ h.tabIndex=-1; h.focus(); } announce("Word "+(wi+1)+" of "+GUIDED.length+": "+GUIDED[wi]); });
      var r=el("div","pz-btnrow"); r.appendChild(nx); card.appendChild(r);
    }
    host3.appendChild(card);
  }
  s3.pzReset=function(){ wi=0; showWord(); };
  var n3=navRow("Continue", function(){ goTo(3); }); s3.appendChild(n3.row);
  S.push(s3);

  /* 4 — useful phrase practice */
  var s4=newScreen(4,"Practise two useful phrases");
  s4.appendChild(el("p",null,"Stress the yellow words. Keep the polite question melody."));
  s4.appendChild(fr("Accentuez les mots en jaune. Gardez la mélodie polie de la question."));
  var host4=el("div"); s4.appendChild(host4);
  s4.pzReset=function(){
    clearAllUnits(); host4.textContent="";
    PHRASES.forEach(function(p){
      var card=el("div","pz-card"); card.style.marginBottom="16px";
      var fg=el("div","pz-figure"); var im=el("img"); im.src=IMAGES[p.img]; im.alt=p.alt; fg.appendChild(im); card.appendChild(fg);
      card.appendChild(phraseEl(p));
      card.appendChild(el("p","pz-cue",p.cue));
      card.appendChild(fr(p.fr));
      card.appendChild(buildUnit(p,{ai:true}));
      host4.appendChild(card);
    });
  };
  var n4=navRow("Continue", function(){ goTo(4); }); s4.appendChild(n4.row);
  S.push(s4);

  /* 5 — personal retry */
  var s5=newScreen(5,"Choose one phrase to practise again.");
  s5.appendChild(fr("Choisissez une phrase à retravailler."));
  var choose=el("div","pz-btnrow"); choose.setAttribute("role","group"); choose.setAttribute("aria-label","Choose a phrase");
  var host5=el("div"); host5.style.marginTop="14px";
  var chosen=-1, chBtns=[];
  PHRASES.forEach(function(p,i){
    var b=btn(p.text,"pz-toggle pz-btn-quiet",function(){ pick(i); });
    b.setAttribute("aria-pressed","false"); chBtns.push(b); choose.appendChild(b);
  });
  s5.appendChild(choose); s5.appendChild(host5);
  function pick(i){
    chosen=i; clearAllUnits(); host5.textContent="";
    chBtns.forEach(function(b,k){ b.setAttribute("aria-pressed", k===i?"true":"false"); });
    var p=PHRASES[i];
    host5.appendChild(phraseEl(p));
    host5.appendChild(el("p","pz-cue",p.cue));
    host5.appendChild(buildUnit(p,{ai:true}));
    var sc=el("fieldset","pz-selfcheck");
    var lg=el("legend",null,"Private self-check (only for you, not a score)");
    sc.appendChild(lg);
    ["Clear words","Good stress","Easy to understand"].forEach(function(t){
      var lab=el("label"); var cb=el("input"); cb.type="checkbox"; lab.appendChild(cb); lab.appendChild(document.createTextNode(t)); sc.appendChild(lab);
    });
    host5.appendChild(sc);
    announce("Practising: "+p.text);
  }
  s5.pzReset=function(){
    clearAllUnits(); host5.textContent=""; chosen=-1;
    chBtns.forEach(function(b){ b.setAttribute("aria-pressed","false"); });
  };
  var n5=navRow("Continue", function(){ goTo(5); }); s5.appendChild(n5.row);
  S.push(s5);

  /* 6 — completion */
  var s6=newScreen(6,"Pronunciation Clinic complete.");
  var cp=el("div","pz-complete");
  cp.appendChild(el("p",null,"You practised useful English for final practical assessment."));
  cp.appendChild(el("p",null,"Next, you will build useful English."));
  cp.lastChild.style.margin="0";
  s6.appendChild(cp);
  s6.appendChild(fr("Vous avez pratiqué l’anglais utile pour l’évaluation pratique finale. Ensuite, vous allez construire de l’anglais utile."));
  var r6=el("div","pz-btnrow");
  doneBtn=btn("Done","pz-btn-done",onDone); doneBtn.id="pz-done"; doneBtn.disabled=true;
  var retry=btn("Try again","pz-btn-quiet",restart); retry.id="pz-retry";
  r6.appendChild(doneBtn); r6.appendChild(retry); s6.appendChild(r6);
  var ds=el("p","pz-status"); ds.id="pz-done-status"; ds.setAttribute("role","status"); ds.setAttribute("aria-live","polite");
  s6.appendChild(ds);
  S.push(s6);

  S.forEach(function(s){ s.hidden=true; main.appendChild(s); });
  return S;
}

function phraseEl(p){
  var d=el("p","pz-phrase");
  p.parts.forEach(function(x){ if (x[1]){ d.appendChild(el("b",null,x[0])); } else d.appendChild(document.createTextNode(x[0])); });
  d.setAttribute("aria-label", p.text);
  return d;
}

var screens=[];

function goTo(i){
  clearAllUnits();
  current=i;
  for (var k=0;k<screens.length;k++) screens[k].hidden=(k!==i);
  progress.textContent="Screen "+(i+1)+" of "+TOTAL;
  var s=screens[i];
  if (s.pzReset) s.pzReset();
  if (i===TOTAL-1){ doneBtn.disabled=completionSent; }   /* Done only on the final screen */
  var h=s.querySelector("h1"); s.scrollIntoView && window.scrollTo(0,0);
  s.focus({preventScroll:true});
  announce("Screen "+(i+1)+" of "+TOTAL+": "+h.textContent);
}

/* Done: works once; never needs a recording, microphone or AI feedback. */
function onDone(){
  if (completionSent || current!==TOTAL-1) return;
  completionSent=true;
  doneBtn.disabled=true;
  doneBtn.textContent="Done ✓";
  var st=document.getElementById("pz-done-status");
  st.textContent="Done. Your Pronunciation Clinic is complete.";
  announce("Done. Your Pronunciation Clinic is complete.");
  activityCompleted();
}
function activityCompleted(){ /* local completion only */ window.__pzCompleted=true; }

/* Try again on the completion screen: start the whole clinic from screen 1. */
function restart(){
  clearAllUnits();
  completionSent=false; window.__pzCompleted=false;
  buildScreens && (screens=buildScreens());
  goTo(0);
  announce("Starting the clinic again from screen 1.");
}

/* ---------- French toggle ---------- */
var frBtn=document.getElementById("pz-fr-btn");
function setFrench(on){
  document.body.classList.toggle("pz-show-fr", on);
  frBtn.setAttribute("aria-pressed", on?"true":"false");
  frBtn.textContent = on ? "English only" : "Français";
  frBtn.setAttribute("lang", on ? "en" : "fr");
  safeStore("pz-fr", on?"1":"0");
}
frBtn.addEventListener("click", function(){ var on=!document.body.classList.contains("pz-show-fr"); setFrench(on); announce(on?"French help shown.":"French help hidden."); });
setFrench(safeStore("pz-fr")==="1");

window.addEventListener("pagehide", function(){ clearAllUnits(); });

screens=buildScreens();
goTo(0);
window.scrollTo(0,0);

})();
</script>
