PAZAPA ENGLISH FOR ADULTS — A2
Week 8 · Lesson 3 — Step 3: Pronunciation Clinic
Topic: Practical speaking check and feedback        Level: A2
Lesson identifier: A2-W08-L3-S3
Language model: British English (en-GB)

PRONUNCIATION FOCUS (one only)
  Review: one clear goal phrase — familiar key-word stress.
  Target recording : "I want to practise speaking."
  Practice set     : "I want to practise speaking."
                     "I feel more confident."
                     "Please give me feedback."
  Stress cues      : PRACTISE; CONFIDENT (teaching annotations only).

SIX MOMENTS (six screens)
  1 Enter the situation   — scene + first try
  2 Notice the key word   — phrase strip, tap to reveal the beats
  3 Say it in beats       — rhythm strip, one phrase at a time
  4 Recording studio      — two takes, compare, optional word check
  5 My progress           — first vs latest recording, strength and goal
  6 Close the clinic      — Try again / Done

IMAGES
  All six illustrations are taken from the lesson workbook
  Week_8_Lesson_3_A2_Workbook_Speaking_Progress.pdf, page 1 ("My progress
  language"): goal, strength, improve, confident, practise, feedback.
  Extracted at original resolution, re-encoded as JPEG (quality 82), not
  cropped, recoloured or redrawn. The images show faceless women only.

AUDIO (Pazapa Global Audio Standard)
  Three supplied normal-speed recordings are embedded complete as Base64 data
  URLs (MP3, mono, 44.1 kHz), read from the exact file bytes, unaltered:
    p1_normal  practicespeaking.mp3.mp3  "I want to practise speaking."
               1.96 s, MD5 6cbafefa9b23a75fb8d630c5e15e0fb5
    p2_normal  feelconfident.mp3.mp3     "I feel more confident."

  independently verified by ear. Listen buttons stay fully active regardless.
  No slow recordings exist or are needed (this lesson has no slow buttons).
  No text-to-speech is used anywhere.

RECORDING (the learner's own voice)
  · Microphone access is requested only when a learner presses a Record button.
  · Every phrase screen has its own recorder. Each recorder keeps up to two

  · The microphone is released as soon as a take ends, fails or the page closes.
  · Recording stops by itself after 20 seconds (RECORD_MAX_MS).
  · HOST DEPENDENCY: the page must be served over HTTPS, and an embedding

WORD CHECK (optional, text only)

function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function fr(text){ var p = el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function announce(msg){ var l = document.getElementById("pz-live"); if (l) l.textContent = String(msg||""); }
function isSafeUrl(v){
  if (typeof v !== "string" || v === "" || v !== v.trim()) return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  return u.protocol === "https:" && !u.username && !u.password;
}
function isSafeEndpoint(v){
  if (!isSafeUrl(v)) return false;
  var u = new URL(v);
  if (u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "[::1]") return false;
  return u.search === "" && u.hash === "";
}
function isEmbeddedImage(v){ return typeof v === "string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(v); }
function isValidAudio(key){
  if (audioPendingConfirmation.indexOf(key) !== -1) return false;
  var v = AUDIO_FILES[key];
  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+/=]+$/.test(v);
}
function img(key, alt){
  var s = IMAGES[key];
  if (!isEmbeddedImage(s)) return null;
  var i = document.createElement("img");
  i.src = s; i.alt = alt || ""; i.setAttribute("decoding","async");
  return i;
}

var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null;
var audioToken = 0;
var audioQueue = [];

function stopAudio(){
  audioToken++;
  audioQueue = [];
  if (audioEl){
    try { audioEl.pause(); } catch(e){}
    try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  }
  audioBusyKey = null;
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e){}
  refreshAudioButtons();
}
function playSource(src, busyKey, keepQueue){
  if (!audioEl || !src) return;
  if (audioBusyKey === busyKey && !keepQueue){ stopAudio(); return; }
  var q = keepQueue ? audioQueue : [];
  stopAudio(); audioQueue = q;
  stopRecognition(); stopCurrentRecording();
  var token = ++audioToken;
  audioBusyKey = busyKey;
  refreshAudioButtons();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e2){} }
    var p = audioEl.play();
    if (p && typeof p.catch === "function"){
      p.catch(function(){ if (token !== audioToken) return; audioBusyKey = null; audioQueue = []; refreshAudioButtons(); announce("The audio did not play."); });
    }
  } catch(e){ if (token === audioToken){ audioBusyKey = null; refreshAudioButtons(); } }
}
function playSequence(items){
  if (!items.length) return;
  var first = items[0];
  var rest = items.slice(1);
  stopAudio();
  audioQueue = rest;
  playSource(first.src, first.key, true);
}

      var n = audioQueue.shift();
      playSource(n.src, n.key, true);
    } else { refreshAudioButtons(); }
  });
  audioEl.addEventListener("error", function(){
    if (!audioEl.getAttribute("src")) return;
    audioBusyKey = null; audioQueue = []; refreshAudioButtons();
  });
}
function refreshAudioButtons(){
  var btns = document.querySelectorAll("[data-audio-key],[data-rec-key]");
  for (var i = 0; i < btns.length; i++){
    var b = btns[i];

    b.setAttribute("aria-pressed", playing ? "true" : "false");
    var t = playing ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");

}
function modelButton(phrase, label){
  if (!isValidAudio(phrase.audio)) return null;

  b.type = "button";
  b.setAttribute("data-audio-key", phrase.audio);
  b.setAttribute("data-label-play", label || "Hear the model");
  b.setAttribute("data-label-stop","Stop");
  b.setAttribute("aria-pressed","false");

function noModelNote(){
  return el("p","pz-label","No model recording yet. Read the phrase and say it aloud.");
}

/* ===========================================================================
   RECORDER — many slots, two takes each
   ========================================================================= */
var slots = {};
var curRec = null;     /* the one recording (or permission request) in flight */

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function" &&
            typeof window.MediaRecorder !== "undefined");
}
function recMimeType(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){
    try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){}
  }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function takeKey(slot, i){ return "rec:" + slot.id + ":" + i; }
function slotHasTake(slot){ return !!(slot.takes[0] || slot.takes[1]); }
function latestTake(slot){ return slot.takes[1] || slot.takes[0] || null; }
function setSlotStatus(slot, text){ if (slot.ui.status) slot.ui.status.textContent = text; }

function refreshSlot(slot){
  var u = slot.ui;
  if (!u.recBtn) return;
  var st = slot.state;
  if (st === "recording"){ u.recBtn.textContent = "Stop"; }
  else if (st === "requesting"){ u.recBtn.textContent = "Cancel"; }
  else if (slotHasTake(slot)){ u.recBtn.textContent = "Record again"; }
  else { u.recBtn.textContent = "Record yourself"; }
  u.recBtn.setAttribute("aria-pressed", st === "recording" ? "true" : "false");
  u.recBtn.classList.toggle("pz-btn-primary", st !== "recording");
  u.recBtn.classList.toggle("pz-btn-help", st === "recording");
  var both = !!(slot.takes[0] && slot.takes[1]);
  for (var i = 0; i < 2; i++){
    var row = u.takeRows[i];
    row.wrap.hidden = !slot.takes[i];
    if (slot.takes[i]){
      var lbl = both ? "Play take " + (i+1) : "Play my voice";
      row.play.setAttribute("data-label-play", lbl);
      row.play.setAttribute("data-rec-key", takeKey(slot, i));
      row.play.setAttribute("aria-label", lbl + ": " + slot.phrase);
      row.del.setAttribute("aria-label", "Delete take " + (i+1) + ": " + slot.phrase);
    } else {
      row.play.removeAttribute("data-rec-key");
    }
  }
  if (u.timer) u.timer.textContent = "";
  refreshAudioButtons();
  if (slot.onChange) slot.onChange(slot);
}

function stopCurrentRecording(){
  var r = curRec;
  if (!r) return;
  if (!r.mr){            /* still waiting for the microphone permission */
    r.cancelled = true;
    if (r.permTimer){ clearTimeout(r.permTimer); r.permTimer = null; }
    curRec = null;
    r.slot.state = "idle";
    setSlotStatus(r.slot, "");
    refreshSlot(r.slot);
    return;
  }
  try { if (r.mr.state !== "inactive") r.mr.stop(); } catch(e){ finishRecording(r); }
}

function finishRecording(r){
  if (r.finished) return;
  r.finished = true;
  if (r.capTimer){ clearTimeout(r.capTimer); r.capTimer = null; }
  if (r.ticker){ clearInterval(r.ticker); r.ticker = null; }
  releaseStream(r.stream);
  if (curRec === r) curRec = null;
  var slot = r.slot;
  slot.state = "idle";
  if (r.cancelled){ refreshSlot(slot); return; }
  var total = 0;
  for (var i = 0; i < r.chunks.length; i++) total += r.chunks[i].size || 0;
  if (!r.chunks.length || total === 0){
    setSlotStatus(slot, "I did not catch that. Try again.");
    refreshSlot(slot);
    return;
  }
  var blob;
  try { blob = new Blob(r.chunks, { type: r.chunks[0].type || "audio/mp4" }); }
  catch(e){ setSlotStatus(slot, "The recording did not work. Try again."); refreshSlot(slot); return; }
  if (slot.takes[r.idx] && slot.takes[r.idx].url){
    if (audioBusyKey === takeKey(slot, r.idx)) stopAudio();
    try { URL.revokeObjectURL(slot.takes[r.idx].url); } catch(e){}
  }
  slot.takes[r.idx] = { url: URL.createObjectURL(blob) };
  slot.attempted = true;
  setSlotStatus(slot, "Take " + (r.idx+1) + " is saved. Play it and listen.");
  announce("Recording saved.");
  refreshSlot(slot);
}

function startRecording(slot){
  if (!recordingSupported()){ setSlotStatus(slot, "Recording does not work here. You can still say the phrase aloud."); return; }
  stopAudio(); stopRecognition(); stopCurrentRecording();
  var idx = !slot.takes[0] ? 0 : (!slot.takes[1] ? 1 : 1);
  var r = { slot:slot, idx:idx, cancelled:false, finished:false, mr:null, stream:null,
            chunks:[], capTimer:null, ticker:null, permTimer:null };
  curRec = r;
  slot.state = "requesting";
  setSlotStatus(slot, "Allow the microphone if your browser asks.");
  refreshSlot(slot);

  r.permTimer = setTimeout(function(){
    if (r.cancelled || r.mr) return;
    r.cancelled = true;
    if (curRec === r) curRec = null;
    slot.state = "idle";
    setSlotStatus(slot, "The microphone did not answer. You can try again.");
    refreshSlot(slot);
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (r.permTimer){ clearTimeout(r.permTimer); r.permTimer = null; }
    if (r.cancelled){ releaseStream(stream); return; }
    r.stream = stream;
    var mr;
    try {
      var mt = recMimeType();
      mr = mt ? new window.MediaRecorder(stream, { mimeType: mt }) : new window.MediaRecorder(stream);
    } catch(e){
      releaseStream(stream);
      if (curRec === r) curRec = null;
      slot.state = "idle";
      setSlotStatus(slot, "Recording does not work in this browser. You can still say the phrase aloud.");
      refreshSlot(slot);
      return;
    }
    r.mr = mr;
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) r.chunks.push(ev.data); };
    mr.onerror = function(){
      r.cancelled = true; finishRecording(r);
      setSlotStatus(slot, "The recording did not work. Try again.");
    };
    mr.onstop = function(){ finishRecording(r); };
    try { mr.start(); }
    catch(e){
      r.cancelled = true; finishRecording(r);
      setSlotStatus(slot, "Recording does not work in this browser. You can still say the phrase aloud.");
      return;
    }
    slot.state = "recording";
    var t0 = Date.now();
    setSlotStatus(slot, "Recording. Say the phrase.");
    refreshSlot(slot);
    if (slot.ui.timer){
      slot.ui.timer.textContent = "0:00";
      r.ticker = setInterval(function(){ if (slot.ui.timer) slot.ui.timer.textContent = fmt(Date.now() - t0); }, 250);
    }
    r.capTimer = setTimeout(function(){ try { if (mr.state === "recording") mr.stop(); } catch(e){} }, RECORD_MAX_MS);
  }).catch(function(){
    if (r.permTimer){ clearTimeout(r.permTimer); r.permTimer = null; }
    if (r.cancelled) return;
    if (curRec === r) curRec = null;
    slot.state = "idle";
    setSlotStatus(slot, "The microphone is off. You can still say the phrase aloud.");
    refreshSlot(slot);
  });
}

function toggleRecording(slot){
  if (slot.state === "recording" || slot.state === "requesting"){ stopCurrentRecording(); return; }
  startRecording(slot);
}
function deleteTake(slot, i){
  if (audioBusyKey === takeKey(slot, i)) stopAudio();
  if (slot.takes[i]){ try { URL.revokeObjectURL(slot.takes[i].url); } catch(e){} }
  slot.takes[i] = null;
  setSlotStatus(slot, "Take " + (i+1) + " is deleted.");
  announce("Recording deleted.");
  refreshSlot(slot);
}
function resetSlot(slot){
  if (curRec && curRec.slot === slot){
    var r = curRec; r.cancelled = true;
    if (r.mr){ try { if (r.mr.state !== "inactive") r.mr.stop(); } catch(e){ finishRecording(r); } }
    else { if (r.permTimer){ clearTimeout(r.permTimer); } curRec = null; }
  }
  for (var i = 0; i < 2; i++){
    if (audioBusyKey === takeKey(slot, i)) stopAudio();
    if (slot.takes[i]){ try { URL.revokeObjectURL(slot.takes[i].url); } catch(e){} }
    slot.takes[i] = null;
  }
  slot.state = "idle"; slot.attempted = false;
  setSlotStatus(slot, "");
  refreshSlot(slot);
}

/* Builds one recorder. Returns its element; the slot object is in slots[id]. */
function buildRecorder(id, phraseText, onChange){
  var slot = { id:id, phrase:phraseText, takes:[null,null], state:"idle", attempted:false, ui:{}, onChange:onChange||null };
  slots[id] = slot;
  var root = el("div","pz-rec");
  root.setAttribute("data-slot", id);

  var row = el("div","pz-btnrow");
  var rec = el("button","pz-btn-primary","Record yourself");
  rec.type = "button";
  rec.setAttribute("aria-label","Record yourself saying: " + phraseText);
  rec.addEventListener("click", function(){ toggleRecording(slot); });
  row.appendChild(rec);
  var timer = el("span","pz-rec-time");
  timer.setAttribute("aria-hidden","true");
  row.appendChild(timer);
  root.appendChild(row);

  var status = el("p","pz-rec-status");
  status.setAttribute("role","status");
  status.setAttribute("aria-live","polite");
  root.appendChild(status);

  var takes = el("div","pz-takes");
  var rows = [];
  for (var i = 0; i < 2; i++){
    (function(n){
      var wrap = el("div","pz-take");
      wrap.hidden = true;
      wrap.appendChild(el("span","pz-take-name","Take " + (n+1)));
      var play = el("button","pz-btn-primary","Play my voice");
      play.type = "button";
      play.setAttribute("data-label-play","Play my voice");
      play.setAttribute("data-label-stop","Stop");
      play.setAttribute("aria-pressed","false");
      play.addEventListener("click", function(){
        if (slot.takes[n]) playSource(slot.takes[n].url, takeKey(slot, n));
      });
      var del = el("button","pz-btn-quiet","Delete");
      del.type = "button";
      del.addEventListener("click", function(){ deleteTake(slot, n); });
      wrap.appendChild(play); wrap.appendChild(del);
      takes.appendChild(wrap);
      rows.push({ wrap:wrap, play:play, del:del });
    })(i);
  }
  root.appendChild(takes);

  slot.ui = { recBtn:rec, status:status, timer:timer, takeRows:rows };
  if (!recordingSupported()){
    var why = window.isSecureContext
      ? "Recording does not work in this browser. You can still say every phrase aloud."
      : "Recording needs the course website. You can still say every phrase aloud.";
    status.textContent = why;
    rec.disabled = true;
  }
  refreshSlot(slot);
  return root;
}

/* ===========================================================================
   SPEECH RECOGNITION + WORD CHECK (text only)
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognitionTimer = null, recognisingPanel = null;

function wordCheckEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
  if (recognisingPanel){ setWordBusy(recognisingPanel, false); recognisingPanel = null; }
  if (!recognition) return;
  try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; } catch(e){}
  try { recognition.abort(); } catch(e){}
  recognition = null;
}
function setWordBusy(panel, busy){
  var b = panel.querySelector('[data-role="word-btn"]');
  if (!b) return;
  b.disabled = !!busy;
  b.textContent = busy ? "Listening…" : "Say it for a word check";
}
function wordOut(panel){ return panel.querySelector('[data-role="word-out"]'); }
function wordClear(panel){
  panel.pzSeq = (panel.pzSeq || 0) + 1;
  if (panel.pzCtrl){ try { panel.pzCtrl.abort(); } catch(e){} panel.pzCtrl = null; }
  var o = wordOut(panel); if (o){ while (o.firstChild) o.removeChild(o.firstChild); }
}
function wordStatus(panel, text){
  var o = wordOut(panel); if (!o) return;
  var s = o.querySelector(".pz-status");
  if (!s){ s = el("p","pz-status"); o.appendChild(s); }
  s.textContent = text;
}
function wordHeard(panel, text){
  var o = wordOut(panel); if (!o) return;
  var box = o.querySelector(".pz-heard");
  if (!box){
    box = el("div","pz-heard");
    box.appendChild(el("p","pz-label","Your words:"));
    box.appendChild(el("p","pz-heard-text"));
    o.insertBefore(box, o.firstChild);
  }
  box.querySelector(".pz-heard-text").textContent = text;
}
function wordResult(panel, fb, heard){
  var o = wordOut(panel); if (!o) return;
  if (heard) wordHeard(panel, heard);
  var old = o.querySelector(".pz-fb"); if (old) o.removeChild(old);
  var s = o.querySelector(".pz-status"); if (s) s.textContent = "";
  var word, cls;
  if (fb.status === "match"){ word = "Your words matched"; cls = "pz-fb pz-fb-match"; }
  else if (fb.status === "try_again"){ word = "Try once more"; cls = "pz-fb pz-fb-try"; }
  else { word = "Not compared"; cls = "pz-fb pz-fb-unclear"; }
  var box = el("div", cls);
  box.appendChild(el("p","pz-fb-state",word));
  box.appendChild(el("p",null,fb.message));
  o.appendChild(box);
  panel.pzDone = true;
}
function wordFallback(panel, heard){
  wordResult(panel, { status:"unclear", message:FALLBACK_MSG }, heard);
}
function sanitiseFeedback(data){
  if (!data || typeof data !== "object") return null;
  var st = data.status;
  if (st !== "match" && st !== "try_again" && st !== "unclear") return null;
  var m = (typeof data.message === "string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (m === "" || m.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  return { status:st, message:m };
}
function startRecognition(panel){
  if (!wordCheckEnabled()) return;
  stopAudio(); stopCurrentRecording(); stopRecognition();
  wordClear(panel);
  var r;
  try { r = new SR(); } catch(e){ wordFallback(panel); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;
  r.onresult = function(ev){
    if (recognition !== r) return;
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); } catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recognition !== r || settled) return;
    settled = true;
    var code = (ev && ev.error) ? String(ev.error) : "";
    stopRecognition();
    if (code === "not-allowed" || code === "service-not-allowed"){ wordStatus(panel, "The microphone is off. You can carry on."); panel.pzDone = true; }
    else if (code === "no-speech" || code === "aborted"){ wordResult(panel, { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on." }, ""); }
    else { wordFallback(panel); }
  };
  r.onend = function(){
    if (recognition !== r || settled) return;
    settled = true;
    stopRecognition();
    var clean = got.replace(/\s+/g," ").trim();
    if (clean === ""){ wordResult(panel, { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on." }, ""); return; }
    if (clean.length > 200) clean = clean.slice(0,200);
    requestFeedback(panel, clean);
  };
  recognition = r; recognisingPanel = panel;
  setWordBusy(panel, true);
  wordStatus(panel, "Listening. Say the phrase once.");
  recognitionTimer = setTimeout(function(){
    if (recognition !== r || settled) return;
    settled = true; stopRecognition();
    wordStatus(panel, "Word check did not answer in this browser. You can try again or carry on.");
    panel.pzDone = true;
  }, RECOGNITION_TIMEOUT_MS);
  try { r.start(); } catch(e){ settled = true; stopRecognition(); wordFallback(panel); }
}
function requestFeedback(panel, text){
  var seq = panel.pzSeq || 0;
  wordHeard(panel, text);
  wordStatus(panel, "Comparing your words with the model.");
  if (!isSafeEndpoint(CONFIG.feedbackEndpoint)){ wordFallback(panel, text); return; }
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  panel.pzCtrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = { method:"POST", headers:{ "Content-Type":"application/json" },
               body: JSON.stringify({ targetPhrase: TARGET.text, recognisedText: text }),
               cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      var safe = sanitiseFeedback(data);
      if (!safe){ wordFallback(panel, text); return; }
      wordResult(panel, safe, text);
    })
    .catch(function(){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      wordFallback(panel, text);
    });
}

/* The phrase text with its key word marked (bold + underline + yellow). */
function phraseNode(p, marked){
  var wrap = el("p","pz-model");
  if (!marked || !p.key){ wrap.textContent = p.text; return wrap; }
  var i = p.text.toLowerCase().indexOf(p.key);
  if (i < 0){ wrap.textContent = p.text; return wrap; }
  wrap.appendChild(document.createTextNode(p.text.slice(0, i)));
  wrap.appendChild(el("span","pz-key",p.text.slice(i, i + p.key.length)));
  wrap.appendChild(document.createTextNode(p.text.slice(i + p.key.length)));
  return wrap;
}
function beatsNode(p){
  var ul = el("ul","pz-beats");
  ul.setAttribute("aria-label","Beats for: " + p.text);
  for (var i = 0; i < p.chunks.length; i++){
    var strong = p.key && p.chunks[i].toLowerCase().replace(/[^a-z]/g,"") === p.key;
    var li = el("li", strong ? "pz-beat pz-strong" : "pz-beat");
    li.appendChild(document.createTextNode(strong ? p.chunks[i].toUpperCase() : p.chunks[i]));
    if (strong){ var sm = el("small","","strong beat"); li.appendChild(sm); }
    ul.appendChild(li);
  }

}
/* A radio group made of three labelled radios. */
function radioGroup(name, legendText, options, cls){
  var fs = el("fieldset", cls || "");
  fs.appendChild(el("legend",null,legendText));
  var holder = el("div","pz-radios");
  var inputs = [];
  options.forEach(function(o, i){
    var d = el("div","pz-radio");
    var inp = document.createElement("input");
    inp.type = "radio"; inp.name = name; inp.id = name + "-" + i; inp.value = o.value;
    var lab = el("label",null,o.label); lab.setAttribute("for", inp.id);
    d.appendChild(inp); d.appendChild(lab);
    holder.appendChild(d);
    inputs.push(inp);
  });
  fs.appendChild(holder);
  return { el:fs, inputs:inputs,
    get:function(){ for (var i = 0; i < inputs.length; i++) if (inputs[i].checked) return inputs[i].value; return ""; },
    clear:function(){ for (var i = 0; i < inputs.length; i++) inputs[i].checked = false; } };
}

function buildS2(){
  var sec = makeScreen(2, "Notice the key word");
  sec.appendChild(el("p",null,"Each phrase has a strong beat. Say that word a little longer and clearer."));
  sec.appendChild(fr("Chaque phrase a un temps fort. Dites ce mot un peu plus longtemps et plus clairement."));
  var ul = el("ul","pz-strip");
  PHRASES.forEach(function(p){
    var li = el("li","pz-strip-row");
    var im = img(p.img, p.alt);
    if (im) li.appendChild(im);
    var body = el("div");
    var model = el("div");
    function paint(){
      model.innerHTML = "";
      model.appendChild(phraseNode(p, !!noticeOpen[p.id]));
    }
    paint();
    body.appendChild(model);
    var beatHold = el("div"); beatHold.setAttribute("aria-live","polite");
    body.appendChild(beatHold);

    var row = el("div","pz-btnrow");
    var show = el("button","pz-btn-help","Show the beats");
    show.type = "button";
    show.setAttribute("aria-label","Show the beats: " + p.text);
    show.addEventListener("click", function(){
      noticeOpen[p.id] = true; paint();
      beatHold.innerHTML = ""; beatHold.appendChild(beatsNode(p));
      if (!p.key){ beatHold.appendChild(el("p","pz-label","Say it in two smooth beats.")); }
      show.disabled = true;
    });
    row.appendChild(show);
    var mb = modelButton(p, "Hear the model");
    if (mb) row.appendChild(mb);
    body.appendChild(row);
    if (!mb && p.id === "p1") body.appendChild(noModelNote());
    body.appendChild(buildRecorder("n_" + p.id, p.text));
    li.appendChild(body);
    ul.appendChild(li);
    p._notice = { paint:paint, beatHold:beatHold, show:show };
  });
  sec.appendChild(ul);
  return { el:sec,
    canLeave:function(){
      for (var i = 0; i < PHRASES.length; i++) if (!noticeOpen[PHRASES[i].id]) return "Tap “Show the beats” on each phrase first. Then you can carry on.";
      return "";
    },
    reset:function(){
      PHRASES.forEach(function(p){
        resetSlot(slots["n_" + p.id]);
        noticeOpen[p.id] = false; p._notice.paint();
        p._notice.beatHold.innerHTML = ""; p._notice.show.disabled = false;
      });
    } };
}

/* ---------- 3 · Say it in beats ---------- */
function buildS3(){
  var sec = makeScreen(3, "Say it in beats");
  sec.appendChild(el("p",null,"Choose a phrase. Say it in beats. Then record it."));
  sec.appendChild(fr("Choisissez une phrase. Dites-la par groupes, puis enregistrez-vous."));

  var choices = el("div","pz-choices");
  choices.setAttribute("role","group");
  choices.setAttribute("aria-label","Choose a phrase");
  var panes = [], btns = [];
  var picked = 0;
  PHRASES.forEach(function(p, i){
    var b = el("button","pz-choice",p.text);
    b.type = "button"; b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", function(){ select(i); });
    choices.appendChild(b); btns.push(b);

    var pane = el("div"); pane.hidden = i !== 0;
    var rh = el("div","pz-rhythm");
    rh.appendChild(el("p","pz-label","Say these beats"));
    rh.appendChild(beatsNode(p));
    if (p.key) rh.appendChild(el("p","pz-label","The strong beat is " + p.key.toUpperCase() + "."));
    pane.appendChild(rh);
    var ol = el("ol","pz-steps");
    ["Read the phrase.","Hear the model, if you can.","Say it aloud: My turn.","Record yourself."].forEach(function(t){ ol.appendChild(el("li",null,t)); });
    pane.appendChild(ol);
    var row = el("div","pz-btnrow");
    var mb = modelButton(p, "Hear the model");
    if (mb) row.appendChild(mb);
    pane.appendChild(row);
    if (!mb) pane.appendChild(noModelNote());
    pane.appendChild(buildRecorder("r_" + p.id, p.text));
    panes.push(pane);
  });
  sec.appendChild(choices);
  panes.forEach(function(pn){ sec.appendChild(pn); });
  function select(i){
    stopAudio(); stopCurrentRecording();
    picked = i;
    panes.forEach(function(pn, k){ pn.hidden = k !== i; btns[k].setAttribute("aria-pressed", k === i ? "true" : "false"); });
    announce("Phrase " + (i+1) + ": " + PHRASES[i].text);
  }
  return { el:sec,
    reset:function(){ PHRASES.forEach(function(p){ resetSlot(slots["r_" + p.id]); }); select(0); } };
}

/* ---------- 4 · Recording studio ---------- */
var studioCheck, studioPanel;
function buildS4(){
  var sec = makeScreen(4, "Recording studio");
  var studio = el("div","pz-studio");
  var head = el("div","pz-studio-head");
  var im = img("practise", "A woman speaks into her phone.");
  if (im) head.appendChild(im);
  var hb = el("div");
  hb.appendChild(el("p","pz-label","Target recording"));
  hb.appendChild(phraseNode(TARGET, true));
  head.appendChild(hb);
  studio.appendChild(head);
  studio.appendChild(el("p",null,"Record two takes. Listen to each one. Make your second take clearer."));
  studio.appendChild(fr("Enregistrez deux prises, écoutez-les, puis améliorez la seconde."));

  var row = el("div","pz-btnrow");
  var mb = modelButton(TARGET, "Hear the model");
  if (mb) row.appendChild(mb);
  studio.appendChild(row);
  if (!mb) studio.appendChild(noModelNote());

  var rec = buildRecorder("studio", TARGET.text, function(){ updateCompare(); });
  studio.appendChild(rec);

  var cmp = el("div","pz-compare");
  cmp.appendChild(el("h2",null,"Compare your takes"));
  var cb = el("button","pz-btn-primary","Play take 1, then take 2");
  cb.type = "button";
  cb.addEventListener("click", function(){
    var s = slots.studio;
    if (!(s.takes[0] && s.takes[1])) return;
    if (audioBusyKey === takeKey(s,0) || audioBusyKey === takeKey(s,1)){ stopAudio(); return; }
    playSequence([{ src:s.takes[0].url, key:takeKey(s,0) }, { src:s.takes[1].url, key:takeKey(s,1) }]);
  });
  var cmpNote = el("p","pz-label","Record two takes to compare them.");
  cmp.appendChild(cmpNote);
  var cr = el("div","pz-btnrow"); cr.appendChild(cb); cmp.appendChild(cr);
  studio.appendChild(cmp);
  function updateCompare(){
    var s = slots.studio; if (!s || !cb || !cmpNote) return;
    var ok = !!(s.takes[0] && s.takes[1]);
    cb.disabled = !ok;
    cmpNote.hidden = ok;
  }
  updateCompare();

  /* self-check route, always available */
  var chk = el("div","pz-check");
  var cbx = document.createElement("input");
  cbx.type = "checkbox"; cbx.id = "pz-selfcheck";
  var lab = el("label",null,"I practised aloud without recording.");
  lab.setAttribute("for","pz-selfcheck");
  chk.appendChild(cbx); chk.appendChild(lab);
  studio.appendChild(chk);
  studioCheck = cbx;

  /* optional word check (text only) */
  studioPanel = el("div","pz-word");
  if (wordCheckEnabled()){
    studioPanel.appendChild(el("h2",null,"Word check"));
    studioPanel.appendChild(el("p",null,"Say the phrase once. The computer shows your words."));
    var wb = el("button","pz-btn-primary","Say it for a word check");
    wb.type = "button"; wb.setAttribute("data-role","word-btn");
    wb.addEventListener("click", function(){ startRecognition(studioPanel); });
    var wr = el("div","pz-btnrow"); wr.appendChild(wb);
    studioPanel.appendChild(wr);
    var out = el("div"); out.setAttribute("data-role","word-out"); out.setAttribute("aria-live","polite");
    studioPanel.appendChild(out);
    studio.appendChild(studioPanel);
  }
  sec.appendChild(studio);

  return { el:sec,
    canLeave:function(){
      if (slotHasTake(slots.studio) || studioCheck.checked || studioPanel.pzDone) return "";
      return "Try one recording first. If you cannot record, tick “I practised aloud without recording.”";
    },
    reset:function(){
      resetSlot(slots.studio); studioCheck.checked = false;
      stopRecognition(); wordClear(studioPanel); studioPanel.pzDone = false;
      updateCompare();
    } };
}

/* ---------- 5 · My progress ---------- */
var strengthG, improveG, confNow, progressRows = [];
function firstTakeOf(ids){
  for (var i = 0; i < ids.length; i++){
    var s = slots[ids[i]]; if (!s) continue;
    for (var k = 0; k < 2; k++) if (s.takes[k]) return { url:s.takes[k].url, key:takeKey(s,k) };
  }
  return null;
}
function lastTakeOf(ids){
  for (var i = ids.length - 1; i >= 0; i--){
    var s = slots[ids[i]]; if (!s) continue;
    for (var k = 1; k >= 0; k--) if (s.takes[k]) return { url:s.takes[k].url, key:takeKey(s,k) };
  }
  return null;
}
function buildS5(){
  var sec = makeScreen(5, "My progress");
  sec.appendChild(el("p",null,"Listen to your first recording and your latest recording. What is better?"));
  sec.appendChild(fr("Écoutez votre premier enregistrement et le dernier. Qu’est-ce qui est mieux ?"));

  var table = el("div");
  PHRASES.forEach(function(p){
    var order = ["s1","n_p1","r_p1","studio"];
    var ids = p.id === "p1" ? order : ["n_" + p.id, "r_" + p.id];
    var row = el("div","pz-prow");
    row.appendChild(el("p","pz-model",p.text));
    var bt = el("div","pz-pbtns");
    function mk(label){
      var b = el("button","pz-btn-primary",label);
      b.type = "button"; b.setAttribute("data-label-play",label); b.setAttribute("data-label-stop","Stop");
      b.setAttribute("aria-pressed","false");
      b.setAttribute("aria-label", label + ": " + p.text);
      bt.appendChild(b); return b;
    }
    var bf = mk("Play first recording"), bl = mk("Play latest recording");
    var cur = { f:null, l:null };
    bf.addEventListener("click", function(){ if (cur.f) playSource(cur.f.url, cur.f.key); });
    bl.addEventListener("click", function(){ if (cur.l) playSource(cur.l.url, cur.l.key); });
    row.appendChild(bt);
    var note = el("p","pz-label","");
    row.appendChild(note);
    table.appendChild(row);
    progressRows.push(function(){
      var f = firstTakeOf(ids), l = lastTakeOf(ids);
      if (f && l && f.url === l.url) l = null;
      cur.f = f; cur.l = l;
      bf.disabled = !f; bl.disabled = !l;
      if (f) bf.setAttribute("data-rec-key", f.key); else bf.removeAttribute("data-rec-key");
      if (l) bl.setAttribute("data-rec-key", l.key); else bl.removeAttribute("data-rec-key");
      note.textContent = !f ? "No recording yet. You can go back and record, or carry on."
                       : (!l ? "Only one recording so far." : "");
      refreshAudioButtons();
    });
  });
  sec.appendChild(table);

  /* goal / strength / improve — the three workbook words */
  var goals = el("div","pz-goals");
  var g1 = el("div","pz-goal");
  var i1 = img("goal","A woman writes on a paper."); if (i1) g1.appendChild(i1);
  g1.appendChild(el("h3",null,"goal"));
  g1.appendChild(el("p",null,"Something you want to achieve: “I want to practise speaking.”"));
  goals.appendChild(g1);

  var opts = PHRASES.map(function(p){ return { value:p.id, label:p.text }; });
  var g2 = el("div","pz-goal");
  var i2 = img("strength","Two women look at a paper."); if (i2) g2.appendChild(i2);
  g2.appendChild(el("h3",null,"strength"));
  strengthG = radioGroup("pz-strength","Which phrase did you do well?", opts);
  g2.appendChild(strengthG.el);
  goals.appendChild(g2);

  var g3 = el("div","pz-goal");
  var i3 = img("improve","A woman works at a laptop."); if (i3) g3.appendChild(i3);
  g3.appendChild(el("h3",null,"improve"));
  improveG = radioGroup("pz-improve","Which phrase will you do again?", opts);
  g3.appendChild(improveG.el);
  goals.appendChild(g3);
  sec.appendChild(goals);

  confNow = radioGroup("pz-conf-now","How ready do you feel now?", [
    { value:"1", label:"1 · I need help" },
    { value:"2", label:"2 · Some help" },
    { value:"3", label:"3 · Ready to try" } ], "pz-conf");
  sec.appendChild(confNow.el);

  var own = el("div","pz-own");
  own.appendChild(el("h2",null,"Say it your way"));
  own.appendChild(el("p",null,"Say one more sentence about your speaking goal. Use your own words. You do not have to use real details."));
  own.appendChild(buildRecorder("own","your own sentence"));
  sec.appendChild(own);

  return { el:sec,
    onShow:function(){ progressRows.forEach(function(f){ f(); }); },
    reset:function(){ resetSlot(slots.own); strengthG.clear(); improveG.clear(); confNow.clear(); progressRows.forEach(function(f){ f(); }); } };
}

/* ---------- 6 · Close the clinic ---------- */
var doneBtn, doneStatus, nextWrap, summaryBox;
function phraseById(id){ for (var i = 0; i < PHRASES.length; i++) if (PHRASES[i].id === id) return PHRASES[i]; return null; }
function buildS6(){
  var sec = makeScreen(6, "Well done");
  summaryBox = el("div","pz-complete");
  sec.appendChild(summaryBox);
  sec.appendChild(el("p",null,"Say your goal phrase again today. Use the strong beat: practise."));
  sec.appendChild(fr("Redites votre phrase aujourd’hui, avec le temps fort : practise."));
  var row = el("div","pz-btnrow");
  var again = el("button","pz-btn-quiet","Try again");
  again.type = "button"; again.id = "pz-try-all";
  again.addEventListener("click", restartAll);
  doneBtn = el("button","pz-btn-done","Done");
  doneBtn.type = "button"; doneBtn.id = "pz-done";
  doneBtn.addEventListener("click", function(){
    completed = true;
    doneBtn.disabled = true;
    doneStatus.textContent = "Done. Your Pronunciation Clinic is finished.";
    if (isSafeUrl(CONFIG.nextActivityUrl) && nextWrap) nextWrap.hidden = false;
  });
  row.appendChild(again); row.appendChild(doneBtn);
  sec.appendChild(row);
  doneStatus = el("p","pz-status");
  doneStatus.setAttribute("role","status"); doneStatus.setAttribute("aria-live","polite");
  sec.appendChild(doneStatus);
  nextWrap = el("div","pz-btnrow"); nextWrap.hidden = true;
  var nb = el("button","pz-btn-primary","Go to the next activity");
  nb.type = "button";
  nb.addEventListener("click", function(){ if (isSafeUrl(CONFIG.nextActivityUrl)) window.location.href = CONFIG.nextActivityUrl; });
  nextWrap.appendChild(nb);
  sec.appendChild(nextWrap);

  return { el:sec, noNav:true,
    onShow:function(){
      summaryBox.innerHTML = "";
      summaryBox.appendChild(el("p",null,"You practised “" + TARGET.text + "” and key-word stress on PRACTISE."));
      var s = phraseById(strengthG.get()), im = phraseById(improveG.get());
      if (s) summaryBox.appendChild(el("p",null,"Your strength: “" + s.text + "”"));
      if (im) summaryBox.appendChild(el("p",null,"Next time, practise again: “" + im.text + "”"));
      var made = 0;
      Object.keys(slots).forEach(function(k){ if (slotHasTake(slots[k])) made++; });
      if (made === 0) summaryBox.appendChild(el("p",null,"You practised aloud and read the phrases."));
    },
    reset:function(){
      completed = false; doneBtn.disabled = false; doneStatus.textContent = ""; nextWrap.hidden = true;
    } };
}

/* ===========================================================================
   NAVIGATION
   ========================================================================= */
function setNavStatus(t){ var n = document.getElementById("pz-nav-status"); if (n) n.textContent = t || ""; }
function teardownLive(){ stopAudio(); stopRecognition(); stopCurrentRecording(); }

function showScreen(i){
  if (i < 0 || i >= screens.length) return;
  teardownLive();
  for (var k = 0; k < screens.length; k++) screens[k].el.hidden = (k !== i);
  current = i;
  var sc = screens[i];
  if (sc.onShow) sc.onShow();
  document.getElementById("pz-progress").textContent = "Screen " + (i + 1) + " of " + screens.length;
  document.getElementById("pz-nav").hidden = !!sc.noNav;
  var fwd = document.getElementById("pz-fwd");
  fwd.textContent = "Carry on";
  setNavStatus("");
  try { sc.el.focus({ preventScroll:true }); } catch(e){ try { sc.el.focus(); } catch(e2){} }
  try { window.scrollTo(0,0); } catch(e){}
}
function goForward(){
  var sc = screens[current];
  if (sc.canLeave){
    var m = sc.canLeave();
    if (m){ setNavStatus(m); return; }
  }
  setNavStatus("");
  showScreen(current + 1);
}
/* Resets only the screen the learner is on. */
function retryScreen(){
  teardownLive();
  var sc = screens[current];
  if (sc.reset) sc.reset();
  setNavStatus("");
  announce("This screen is ready to try again.");
  try { sc.el.focus({ preventScroll:true }); } catch(e){}
  try { window.scrollTo(0,0); } catch(e){}
}
/* Resets the whole activity and goes back to the start. */
function restartAll(){
  teardownLive();
  screens.forEach(function(sc){ if (sc.reset) sc.reset(); });
  announce("Starting the clinic again.");
  showScreen(0);
}

/* ===========================================================================
   START-UP
   ========================================================================= */
function init(){
  screens.push(buildS1(), buildS2(), buildS3(), buildS4(), buildS5(), buildS6());
  document.getElementById("pz-fwd").addEventListener("click", goForward);
  document.getElementById("pz-retry").addEventListener("click", retryScreen);
  function release(){ teardownLive(); }
  window.addEventListener("pagehide", release);
  window.addEventListener("beforeunload", release);
  showScreen(0);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
