<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronunciation Clinic – My first team meeting</title>
<style>
:root{
  --pz-blue:#36BBD6; --pz-lime:#C9D646; --pz-yellow:#FCC104; --pz-red:#E6352B;
  --pz-grey:#EBEBEB; --pz-dark:#2E2E2D; --pz-heading:#1B7E92;
  --pz-blue-80:#5EC9DE; --pz-blue-60:#86D6E6; --pz-blue-40:#AFE4EF; --pz-blue-20:#D7F1F7;
  --pz-lime-80:#D4DE6B; --pz-lime-60:#DFE690; --pz-lime-40:#E9EFB5; --pz-lime-20:#F4F7DA;
  --pz-yellow-80:#FDCD36; --pz-yellow-60:#FDDA68; --pz-yellow-40:#FEE69B; --pz-yellow-20:#FEF3CD;
  --pz-head-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --pz-body-font:"Open Sans",Arial,sans-serif;
  --pz-radius:10px; --pz-tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--pz-body-font);font-size:17px;line-height:1.6;color:var(--pz-dark);background:#fff;-webkit-text-size-adjust:100%;}
.pz-shell{max-width:44rem;margin:0 auto;padding:16px 16px 40px;}
.pz-brand{display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--pz-blue);padding-bottom:12px;margin-bottom:20px;}
.pz-brand img{max-height:44px;width:auto;}
.pz-crumb{font-size:.9rem;margin:0;opacity:.85;}
h1,h2,h3{font-family:var(--pz-head-font);color:var(--pz-heading);line-height:1.25;}
h1{font-size:1.55rem;margin:0 0 6px;} h2{font-size:1.2rem;margin:0 0 10px;} h3{font-size:1.02rem;margin:0 0 6px;}
p{margin:0 0 12px;}
.pz-progress{font-size:.88rem;background:var(--pz-grey);border-radius:var(--pz-radius);padding:6px 12px;display:inline-block;margin-bottom:16px;}
.pz-screen{outline:none;}
[hidden]{display:none !important;}
.pz-card{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:16px;margin:0 0 18px;background:#fff;}
.pz-figure{margin:0 0 14px;text-align:center;}
.pz-figure img{max-width:100%;max-height:220px;width:auto;height:auto;border-radius:var(--pz-radius);background:var(--pz-grey);}
.pz-model{font-family:var(--pz-head-font);font-size:1.32rem;line-height:1.4;margin:0 0 4px;}
.pz-label{font-size:.86rem;margin:0 0 10px;opacity:.85;}
.pz-btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;}
button{font-family:var(--pz-body-font);font-size:1rem;font-weight:600;min-height:var(--pz-tap);min-width:var(--pz-tap);padding:12px 18px;border-radius:var(--pz-radius);border:2px solid var(--pz-dark);background:#fff;color:var(--pz-dark);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--pz-grey);}
button:focus-visible{outline:4px solid var(--pz-dark);outline-offset:3px;}
button[disabled]{opacity:.5;cursor:default;}
button[disabled]:hover{background:#fff;}
.pz-btn-primary{background:var(--pz-blue);border-color:var(--pz-blue);} .pz-btn-primary:hover{background:var(--pz-blue-80);}
.pz-btn-help{background:var(--pz-yellow);border-color:var(--pz-yellow);} .pz-btn-help:hover{background:var(--pz-yellow-80);}
.pz-btn-done{background:var(--pz-lime);border-color:var(--pz-lime);} .pz-btn-done:hover{background:var(--pz-lime-80);}
.pz-status{font-size:.95rem;margin:12px 0 0;}
.pz-note{background:var(--pz-grey);border-radius:var(--pz-radius);padding:10px 12px;font-size:.95rem;margin:12px 0 0;}
.pz-focus{background:var(--pz-blue-20);border:1px solid var(--pz-blue-60);border-radius:var(--pz-radius);padding:10px 14px;margin:0 0 14px;}
.pz-rec{border:2px dashed var(--pz-lime-80);border-radius:var(--pz-radius);padding:14px;margin:14px 0 0;background:var(--pz-lime-20);}
.pz-timer{font-family:var(--pz-head-font);font-size:1.3rem;margin:10px 0 0;}
.pz-speak{border:2px dashed var(--pz-blue-60);border-radius:var(--pz-radius);padding:14px;margin:14px 0 0;background:var(--pz-blue-20);}
.pz-heard{background:#fff;border:1px solid var(--pz-dark);border-radius:var(--pz-radius);padding:10px 12px;margin:12px 0 0;}
.pz-fb{border-radius:var(--pz-radius);padding:12px 14px;margin:12px 0 0;border:2px solid var(--pz-dark);}
.pz-fb-match{background:var(--pz-lime-20);border-color:var(--pz-lime);}
.pz-fb-try{background:var(--pz-yellow-20);border-color:var(--pz-yellow);}
.pz-fb-unclear{background:var(--pz-grey);}
.pz-fb-state{font-family:var(--pz-head-font);font-weight:600;margin:0 0 4px;}
.pz-opt{display:block;width:100%;text-align:left;margin:0 0 10px;font-weight:400;}
.pz-opt[aria-pressed="true"]{border-color:var(--pz-blue);background:var(--pz-blue-20);}
.pz-line{font-family:var(--pz-head-font);font-size:1.25rem;line-height:1.5;margin:4px 0;}
.pz-line .stress{font-weight:900;text-decoration:underline;text-decoration-color:var(--pz-blue);text-decoration-thickness:3px;text-underline-offset:4px;}
.pz-line .pause{color:var(--pz-heading);font-weight:900;padding:0 4px;}
.pz-reveal{background:var(--pz-lime-20);border:2px solid var(--pz-lime);border-radius:var(--pz-radius);padding:12px 14px;margin:12px 0 0;}
.pz-chunks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pz-chunks li{background:var(--pz-blue-20);border:1px solid var(--pz-blue-60);border-radius:var(--pz-radius);padding:8px 12px;}
.pz-phrase{border:2px solid var(--pz-grey);border-radius:var(--pz-radius);padding:14px;margin:0 0 14px;}
.pz-phrase[data-done="true"]{border-color:var(--pz-lime);background:var(--pz-lime-20);}
#pz-nav-status:not(:empty){background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:10px 12px;font-weight:600;}
.pz-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:2px solid var(--pz-grey);}
.pz-complete{background:var(--pz-lime-20);border:2px solid var(--pz-lime);border-radius:var(--pz-radius);padding:16px;margin:0 0 18px;}
.pz-accent{width:56px;height:5px;border-radius:3px;background:var(--pz-red);margin:0 0 14px;}
.pz-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
noscript p{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:14px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
@media (max-width:420px){
  body{font-size:16px;}
  .pz-btnrow button,.pz-nav button{flex:1 1 100%;}
  .pz-model{font-size:1.2rem;} .pz-brand img{max-height:34px;}
}
</style>
</head>

  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+\/=]+$/.test(v);
}
function img(key, alt){
  var f = el("figure", "pz-figure");
  if (isEmbeddedImage(IMAGES[key])){
    var i = document.createElement("img");
    i.src = IMAGES[key]; i.alt = alt; f.appendChild(i);
  }
  return f;
}

var logo = document.getElementById("pz-logo");
if (isEmbeddedImage(IMAGES.logo)){ logo.src = IMAGES.logo; logo.hidden = false; }

/* ---------- state ---------- */
var state = {
  completionInFlight: false,
  completionSent: false
};

/* ---------- audio (one element, never autoplays) ---------- */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null;
var audioToken = 0;

function stopAudio(){
  audioToken++;
  try { audioEl.pause(); } catch(e){}
  try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  audioBusyKey = null;
  refreshAudioButtons();
}
function playSource(src, key){
  if (!src) return;
  if (audioBusyKey === key){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopActiveRecorder();
  var token = ++audioToken;
  audioBusyKey = key; refreshAudioButtons();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { audioEl.currentTime = 0; } catch(e){} }
    var p = audioEl.play();
    if (p && p.catch) p.catch(function(){
      if (token !== audioToken) return;
      audioBusyKey = null; refreshAudioButtons();
      announce("The audio did not play.");
    });
  } catch(e){ if (token === audioToken){ audioBusyKey = null; refreshAudioButtons(); } }
}
audioEl.addEventListener("ended", function(){
  audioBusyKey = null; refreshAudioButtons();
});
audioEl.addEventListener("error", function(){
  if (!audioEl.getAttribute("src")) return;
  audioBusyKey = null; refreshAudioButtons();
});
function refreshAudioButtons(){
  var b = document.querySelectorAll("[data-audio-key],[data-rec-key]");
  for (var i = 0; i < b.length; i++){
    var playing = (b[i].getAttribute("data-audio-key") || b[i].getAttribute("data-rec-key")) === audioBusyKey;
    b[i].setAttribute("aria-pressed", playing ? "true" : "false");
    b[i].textContent = playing ? b[i].getAttribute("data-label-stop") : b[i].getAttribute("data-label-play");
  }
}

/* A Hear button for a model phrase. Honest when no audio exists. */
function hearButton(phrase, label){
  var wrap = document.createDocumentFragment();
  var b = el("button", "pz-btn-primary", label);
  b.type = "button";
  if (isValidAudio(phrase.id)){
    b.setAttribute("data-audio-key", phrase.id);
    b.setAttribute("data-label-play", label);
    b.setAttribute("data-label-stop", "Stop");
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function(){ playSource(AUDIO_FILES[phrase.id], phrase.id); });
  } else {
    b.addEventListener("click", function(){
      var s = b.parentNode && b.parentNode.parentNode ? b.parentNode.parentNode.querySelector("[data-role=no-audio]") : null;
      if (s) s.textContent = "The model audio is not available in this version. Read the phrase aloud yourself.";
      announce("The model audio is not available.");
    });
  }
  wrap.appendChild(b);
  return wrap;
}
function noAudioLine(phrase){
  var p = el("p", "pz-status");
  p.setAttribute("data-role", "no-audio");
  p.setAttribute("aria-live", "polite");
  if (!isValidAudio(phrase.id)) p.textContent = "Model audio is not available in this version.";
  return p;
}

/* ---------- speech recognition + AI feedback (explicit action only) ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognitionTimer = null, recognisingBtn = null;
function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
  if (recognisingBtn){ recognisingBtn.disabled = false; recognisingBtn.textContent = "Get AI feedback"; recognisingBtn = null; }
  if (!recognition) return;
  try { recognition.onresult = recognition.onerror = recognition.onend = null; recognition.abort(); } catch(e){}
  recognition = null;
}
var fbSeq = 0, fbCtrl = null;
function abortFeedback(){
  fbSeq++;
  if (fbCtrl){ try { fbCtrl.abort(); } catch(e){} fbCtrl = null; }
}

function startFeedback(btn, out){
  if (!speakingEnabled()) return;
  stopAudio(); stopRecognition(); abortFeedback();
  var r; try { r = new SR(); } catch(e){ fbUnavailable(out); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;
  r.onresult = function(ev){
    if (recognition !== r) return;
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); } catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recognition !== r || settled) return; settled = true;
    var code = ev && ev.error ? String(ev.error) : "";
    stopRecognition();
    if (code === "not-allowed" || code === "service-not-allowed") out.textContent = "The microphone is off. You can carry on.";
    else if (code === "no-speech" || code === "aborted") showFeedback(out, {status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on.", focus:""}, "");
    else fbUnavailable(out);
  };
  r.onend = function(){
    if (recognition !== r || settled) return; settled = true;
    stopRecognition();
    var clean = got.replace(/\s+/g, " ").trim().slice(0, 200);
    if (!clean){ showFeedback(out, {status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on.", focus:""}, ""); return; }
    requestFeedback(out, clean);
  };
  recognition = r; recognisingBtn = btn;
  btn.disabled = true; btn.textContent = "Listening…";
  out.textContent = "Listening. Say the phrase once.";
  recognitionTimer = setTimeout(function(){
    if (recognition !== r || settled) return; settled = true;
    stopRecognition();
    out.textContent = "Speaking feedback did not respond in this browser. You can try again or carry on.";
  }, RECOGNITION_TIMEOUT_MS);
  try { r.start(); } catch(e){ settled = true; stopRecognition(); fbUnavailable(out); }
}
function fbUnavailable(out){
  out.textContent = "AI feedback is unavailable right now. Hear the model, record yourself and compare, or carry on.";
}
function requestFeedback(out, heard){
  var seq = fbSeq;
  out.textContent = "Comparing your words with the model.";
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  fbCtrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ targetPhrase: TARGET.text, recognisedText: heard }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if (seq !== fbSeq) return;
      fbCtrl = null;
      var safe = sanitiseFeedback(data);
      if (!safe){ fbUnavailable(out); return; }
      showFeedback(out, safe, heard);
    })
    .catch(function(){ clearTimeout(timer); if (seq !== fbSeq) return; fbCtrl = null; fbUnavailable(out); });
}
function sanitiseFeedback(d){
  if (!d || typeof d !== "object") return null;
  if (d.status !== "match" && d.status !== "try_again" && d.status !== "unclear") return null;
  var m = typeof d.message === "string" ? d.message.replace(/\s+/g, " ").trim() : "";
  if (!m || m.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  var f = typeof d.focus === "string" ? d.focus.replace(/\s+/g, " ").trim() : "";
  if (f.length > 60 || !focusOk(f)) f = "";
  return { status:d.status, message:m, focus:f };
}
function focusOk(f){
  var n = function(s){ return String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/[.,!?;:]/g, " ").replace(/\s+/g, " ").trim(); };
  f = n(f); if (!f) return true;
  if (f === n(TARGET.chunks.join(" / "))) return true;
  return (" " + n(TARGET.text) + " ").indexOf(" " + f + " ") !== -1;
}
function showFeedback(out, fb, heard){
  out.textContent = "";
  if (heard){
    var h = el("div", "pz-heard");
    h.appendChild(el("p", "pz-label", "The words I heard (a text guess, not a judgement of your accent):"));
    h.appendChild(el("p", "", heard));
    out.appendChild(h);
  }
  var cls = fb.status === "match" ? "pz-fb-match" : (fb.status === "try_again" ? "pz-fb-try" : "pz-fb-unclear");
  var box = el("div", "pz-fb " + cls);
  box.appendChild(el("p", "pz-fb-state", fb.status === "match" ? "Matches the model" : (fb.status === "try_again" ? "Try again" : "Not clear this time")));
  box.appendChild(el("p", "", fb.message));
  if (fb.focus) box.appendChild(el("p", "", "Focus on: " + fb.focus));
  out.appendChild(box);
  announce(fb.message);
}

/* ---------- recording (microphone only after Start recording) ---------- */
var recGen = 0, recorder = null, recStream = null, recTimerId = null, recCapId = null, recPermId = null;
var recs = {};                       /* key -> { url, ui } */
var rec = { key:null, pending:false, active:false, startedAt:0 };
var micBlocked = false;              /* mic unsupported or refused: nobody is trapped */

function R(key){ return recs[key] || (recs[key] = { url:null, ui:null }); }
function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
    typeof navigator.mediaDevices.getUserMedia === "function" && typeof window.MediaRecorder !== "undefined");
}
function recMimeType(){
  var c = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){ try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){} }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function clearRecTimers(){
  if (recTimerId){ clearInterval(recTimerId); recTimerId = null; }
  if (recCapId){ clearTimeout(recCapId); recCapId = null; }
  if (recPermId){ clearTimeout(recPermId); recPermId = null; }
}
function stopActiveRecorder(){
  if (!recorder) return;
  try { if (recorder.state !== "inactive") recorder.stop(); } catch(e){}
}
function hasRecording(key){ return !!(recs[key] && recs[key].url); }
function discardRecording(key){
  var r = recs[key]; if (!r) return;
  if (audioBusyKey === "rec:" + key) stopAudio();
  if (r.url){ try { URL.revokeObjectURL(r.url); } catch(e){} r.url = null; }
}
function fmtTime(ms){ var s = Math.floor(ms / 1000); return "0:" + (s < 10 ? "0" : "") + s; }

/* modes: idle, asking, recording, recorded */
function recSetUi(key, mode, msg){
  var u = R(key).ui; if (!u) return;
  u.start.hidden = !(mode === "idle" || mode === "asking");
  u.start.disabled = (mode === "asking");
  u.stop.hidden = (mode !== "recording");
  u.play.hidden = u.again.hidden = u.del.hidden = (mode !== "recorded");
  u.timer.hidden = (mode !== "recording");
  if (msg !== undefined) u.status.textContent = msg;
  /* the other recorders are locked while one is in use */
  for (var k in recs){
    if (k !== key && recs[k].ui){ recs[k].ui.start.disabled = (mode === "asking" || mode === "recording"); recs[k].ui.again.disabled = recs[k].ui.start.disabled; }
  }
  applyGate();
}
function recBlocked(key, msg){
  micBlocked = true;
  recSetUi(key, "idle", msg);
}
function cancelPendingRecording(){
  if (rec.pending){
    recGen++; rec.pending = false; clearRecTimers();
    recSetUi(rec.key, hasRecording(rec.key) ? "recorded" : "idle", "");
  }
}
function startRecording(key){
  if (!recordingSupported() || rec.pending || rec.active) return;
  stopAudio(); stopRecognition(); abortFeedback();
  discardRecording(key);
  var gen = ++recGen;
  rec.key = key; rec.pending = true;
  recSetUi(key, "asking", "Asking your browser for the microphone…");
  recPermId = setTimeout(function(){
    if (gen !== recGen || !rec.pending) return;
    rec.pending = false; recGen++;
    recBlocked(key, "The microphone did not respond. You can try again.");
  }, RECORD_PERMISSION_TIMEOUT_MS);
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (gen !== recGen){ releaseStream(stream); return; }
    if (recPermId){ clearTimeout(recPermId); recPermId = null; }
    rec.pending = false;
    var mr, chunks = [];
    try {
      var mt = recMimeType();
      mr = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream);
    } catch(e){
      releaseStream(stream);
      recBlocked(key, "Recording is not available in this browser.");
      return;
    }
    recStream = stream; recorder = mr; rec.active = true; rec.startedAt = Date.now();
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size) chunks.push(ev.data); };
    mr.onstop = function(){
      releaseStream(stream);
      if (recStream === stream) recStream = null;
      if (recorder === mr) recorder = null;
      rec.active = false; clearRecTimers();
      if (gen !== recGen) return;
      if (!chunks.length){ recSetUi(key, "idle", "Nothing was recorded. Try again."); return; }
      var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
      R(key).url = URL.createObjectURL(blob);
      recSetUi(key, "recorded", "Recording saved. Press Hear my recording.");
      announce("Recording ready.");
    };
    mr.onerror = function(){
      if (gen !== recGen) return;
      releaseStream(stream); rec.active = false; clearRecTimers();
      recSetUi(key, "idle", "Recording stopped unexpectedly. Try again.");
    };
    try { mr.start(); } catch(e){
      releaseStream(stream); rec.active = false;
      recBlocked(key, "Recording is not available in this browser.");
      return;
    }
    recSetUi(key, "recording", "Recording. Say the phrase, then press Stop.");
    R(key).ui.timer.textContent = "0:00";
    recTimerId = setInterval(function(){
      var u = R(key).ui; if (u) u.timer.textContent = fmtTime(Date.now() - rec.startedAt);
    }, 250);
    recCapId = setTimeout(function(){ if (gen === recGen) stopActiveRecorder(); }, RECORD_MAX_MS);
  }).catch(function(){
    if (gen !== recGen) return;
    rec.pending = false; clearRecTimers();
    recBlocked(key, "The microphone is off. Allow the microphone in your browser, then try again.");
  });
}
function teardownRecording(){
  recGen++;
  clearRecTimers();
  stopActiveRecorder();
  releaseStream(recStream); recStream = null;
  rec.pending = false; rec.active = false;
  for (var k in recs) discardRecording(k);
  recs = {};
}

/* Builds one recorder (used for every phrase on the Rehearse step and again in
   the Record studio). */
function recorderBox(key, intro){
  var r = R(key);
  var box = el("div", "pz-rec");
  if (!recordingSupported()){
    micBlocked = true;
    box.appendChild(el("p", "", "Recording is not available in this browser. You can carry on."));
    return box;
  }
  if (intro) box.appendChild(el("p", "", intro));
  var row = el("div", "pz-btnrow");
  function mk(cls, label, hidden){ var b = el("button", cls, label); b.type = "button"; b.hidden = !!hidden; row.appendChild(b); return b; }
  var start = mk("pz-btn-primary", "Start recording");
  var stop = mk("pz-btn-help", "Stop", true);
  var play = mk("pz-btn-primary", "Hear my recording", true);
  var again = mk("", "Record again", true);
  var del = mk("", "Delete", true);
  play.setAttribute("data-rec-key", "rec:" + key);
  play.setAttribute("data-label-play", "Hear my recording");
  play.setAttribute("data-label-stop", "Stop");
  play.setAttribute("aria-pressed", "false");
  box.appendChild(row);
  var timer = el("p", "pz-timer", "0:00"); timer.hidden = true; timer.setAttribute("aria-hidden", "true");
  box.appendChild(timer);
  var status = el("p", "pz-status"); status.setAttribute("role", "status"); status.setAttribute("aria-live", "polite");
  box.appendChild(status);
  r.ui = { start:start, stop:stop, play:play, again:again, del:del, timer:timer, status:status };
  start.addEventListener("click", function(){ startRecording(key); });
  again.addEventListener("click", function(){ startRecording(key); });
  stop.addEventListener("click", function(){ stopActiveRecorder(); });
  play.addEventListener("click", function(){ if (r.url) playSource(r.url, "rec:" + key); });
  del.addEventListener("click", function(){ discardRecording(key); recSetUi(key, "idle", "Recording deleted."); });
  if (r.url) recSetUi(key, "recorded", "Your recording is ready. Press Hear my recording.");
  return box;
}

/* ---------- screens ---------- */
var stage = document.getElementById("pz-stage");
var progress = document.getElementById("pz-progress");
var navStatus = document.getElementById("pz-nav-status");
var backBtn = document.getElementById("pz-back");
var nextBtn = document.getElementById("pz-next");
var SCREENS = ["open", "notice", "rehearse", "record", "compare", "close"];
var TITLES = ["Start", "Listen for the shape", "Rehearse", "Record", "Compare", "Finish"];
var current = 0;

function setNavStatus(t){ navStatus.textContent = t || ""; }

function showScreen(i){
  stopAudio(); stopRecognition(); abortFeedback(); cancelPendingRecording();
  if (i < 2) teardownRecording();
  for (var k in recs) recs[k].ui = null;
  current = i;
  setNavStatus("");
  stage.textContent = "";
  var node = BUILDERS[SCREENS[i]]();
  node.className = (node.className ? node.className + " " : "") + "pz-screen";
  node.setAttribute("tabindex", "-1");
  stage.appendChild(node);
  progress.textContent = "Step " + (i + 1) + " of " + SCREENS.length + " · " + TITLES[i];
  backBtn.hidden = (i === 0);
  var last = (i === SCREENS.length - 1);
  nextBtn.hidden = last; nextBtn.removeAttribute("aria-disabled"); nextBtn.style.opacity = "";
  nextBtn.textContent = (i === 0) ? "Start" : "Next";
  applyGate();
  try { node.focus({ preventScroll:false }); } catch(e){}
  announce(progress.textContent);
}
/* The Rehearse step needs a recording of every phrase; the Record studio needs
   one of the target phrase. If the microphone cannot be used at all, nobody is
   held back. */
function gateOK(){
  if (micBlocked || !recordingSupported()) return true;
  if (current === 2){ for (var i = 0; i < PHRASES.length; i++) if (!hasRecording("p" + PHRASES[i].id)) return false; }
  if (current === 3 && !hasRecording("main")) return false;
  return true;
}
function gateMessage(){
  return current === 2 ? "Record yourself saying each phrase before you move on."
                       : "Record yourself saying the phrase before you move on.";
}
function applyGate(){
  if (current !== 2 && current !== 3) return;
  var ok = gateOK();
  nextBtn.setAttribute("aria-disabled", ok ? "false" : "true");
  nextBtn.style.opacity = ok ? "" : "0.5";
  if (ok && navStatus.getAttribute("data-gate") === "1"){ setNavStatus(""); navStatus.removeAttribute("data-gate"); }
}
function goForward(){
  if (!gateOK()){ setNavStatus(gateMessage()); navStatus.setAttribute("data-gate", "1"); return; }
  if (current < SCREENS.length - 1) showScreen(current + 1);
}
function goBack(){ if (current > 0) showScreen(current - 1); }
backBtn.addEventListener("click", goBack);
nextBtn.addEventListener("click", goForward);

function focusBox(){
  var d = el("div", "pz-focus");
  d.appendChild(el("p", "pz-label", "Today’s focus"));
  d.appendChild(el("p", "pz-model", "Intonation for a polite suggestion"));
  return d;
}
function chunkList(p){
  var ul = el("ul", "pz-chunks");
  ul.setAttribute("aria-label", "The phrase in parts");
  for (var i = 0; i < p.chunks.length; i++){
    ul.appendChild(el("li", "", p.chunks[i]));
    if (i < p.chunks.length - 1){ var s = el("li", "", "→"); s.style.background = "none"; s.style.border = "0"; s.setAttribute("aria-hidden", "true"); ul.appendChild(s); }
  }
  return ul;
}

var BUILDERS = {};

/* 1. Contextual opening */
BUILDERS.open = function(){
  var s = el("section");
  s.appendChild(el("h1", "", "Pronunciation Clinic"));
  s.appendChild(el("p", "", "My first team meeting"));
  s.appendChild(img("meeting", "Three colleagues at a table in a meeting. One points to an agenda."));
  s.appendChild(focusBox());
  s.appendChild(el("p", "", "In a meeting, a polite suggestion can sound very different from a demand. The tune of your voice does most of the work."));
  var card = el("div", "pz-card");
  card.appendChild(el("p", "pz-label", "Your phrase"));
  card.appendChild(el("p", "pz-model", TARGET.text));
  var row = el("div", "pz-btnrow"); row.appendChild(hearButton(TARGET, "Hear the phrase"));
  card.appendChild(row);
  card.appendChild(noAudioLine(TARGET));
  s.appendChild(card);
  return s;
};

  a.appendChild(el("p", "pz-line", "couldwechangethedeadline"));

/* 3. Rehearsal strip: record every phrase */
BUILDERS.rehearse = function(){
  var s = el("section");
  s.appendChild(el("h2", "", "Rehearse the phrases"));
  s.appendChild(img("suggest", "A colleague makes a suggestion at the table while two others listen."));
  s.appendChild(el("p", "", "Hear each phrase, then record yourself saying it. You need a recording of all three to move on."));
  PHRASES.forEach(function(p){
    var box = el("div", "pz-phrase");
    box.appendChild(el("p", "pz-model", p.text));
    box.appendChild(chunkList(p));
    box.appendChild(el("p", "pz-label", p.note));
    var row = el("div", "pz-btnrow");
    row.appendChild(hearButton(p, "Hear it"));
    box.appendChild(row);
    box.appendChild(noAudioLine(p));
    box.appendChild(recorderBox("p" + p.id, ""));
    s.appendChild(box);
  });
  return s;
};

/* 4. Recording studio */
BUILDERS.record = function(){
  var s = el("section");
  s.appendChild(el("h2", "", "Recording studio"));
  s.appendChild(img("think", "A colleague at a laptop thinks about the deadline on the calendar."));
  s.appendChild(el("p", "pz-model", TARGET.text));
  s.appendChild(chunkList(TARGET));
  s.appendChild(recorderBox("main", "Press Start recording when you are ready. The microphone stays off until then. Use a measured voice with a gentle rise at the end."));
  return s;
};

/* 5. Comparison */
BUILDERS.compare = function(){
  var s = el("section");
  s.appendChild(el("h2", "", "Compare"));
  s.appendChild(img("deadline", "A colleague writes notes beside a calendar while another points to the date."));
  s.appendChild(el("p", "", "Listen to the model, then to yourself. Is the voice measured? Is there a gentle rise at the end?"));
  var card = el("div", "pz-card");
  card.appendChild(el("p", "pz-model", TARGET.text));
  var row = el("div", "pz-btnrow");
  row.appendChild(hearButton(TARGET, "Hear the model"));
  card.appendChild(row);
  card.appendChild(noAudioLine(TARGET));
  s.appendChild(card);
  var mine = el("div", "pz-card");
  mine.appendChild(el("h3", "", "My recording"));
  if (hasRecording("main")){
    var pm = el("button", "pz-btn-primary", "Hear my recording"); pm.type = "button";
    pm.setAttribute("data-rec-key", "rec:cmp");
    pm.setAttribute("data-label-play", "Hear my recording"); pm.setAttribute("data-label-stop", "Stop");
    pm.setAttribute("aria-pressed", "false");
    pm.addEventListener("click", function(){ playSource(recs.main.url, "rec:cmp"); });
    var pr = el("div", "pz-btnrow"); pr.appendChild(pm); mine.appendChild(pr);
  } else {
    mine.appendChild(el("p", "", "No recording was made, so there is nothing to play back."));
  }
  s.appendChild(mine);
  var sp = el("div", "pz-speak");
  sp.appendChild(el("h3", "", "Optional: AI feedback"));
  if (speakingEnabled()){
    sp.appendChild(el("p", "", "This is voluntary. Pressing the button listens to you, turns your words into text and sends that text, with the target phrase, to the feedback service."));
    var out = el("div"); out.setAttribute("aria-live", "polite");
    var btn = el("button", "pz-btn-help", "Get AI feedback"); btn.type = "button";
    btn.addEventListener("click", function(){ startFeedback(btn, out); });
    var r2 = el("div", "pz-btnrow"); r2.appendChild(btn);
    sp.appendChild(r2); sp.appendChild(out);
  } else {
    sp.appendChild(el("p", "", "AI feedback is not available in this browser. You do not need it to finish."));
  }
  s.appendChild(sp);
  return s;
};

/* 6. Closing */
BUILDERS.close = function(){
  var s = el("section");
  s.appendChild(el("h2", "", "Finish"));
  s.appendChild(img("lunch", "Three colleagues chat over lunch."));
  var done = state.completionSent;
  var box = el("div", "pz-complete"); box.id = "pz-complete-box"; box.hidden = !done;
  box.appendChild(el("div", "pz-accent"));
  box.appendChild(el("h2", "", "Pronunciation finished"));
  box.appendChild(el("p", "", "You practised a polite suggestion: measured speech, a clear stress and a gentle rise. Use it in your next meeting."));
  var nextRow = el("div", "pz-btnrow");
  var again = el("button", "pz-btn-primary", "Try again"); again.type = "button"; again.id = "pz-try-again";
  again.addEventListener("click", restart);
  nextRow.appendChild(again);
  if (/^https:\/\//.test(CONFIG.nextActivityUrl)){
    var nx = el("a", "", "Next activity"); nx.href = CONFIG.nextActivityUrl; nx.style.fontWeight = "600";
    nextRow.appendChild(nx);
  }
  box.appendChild(nextRow);
  var pre = el("div");
  pre.id = "pz-close-main"; pre.hidden = done;
  pre.appendChild(el("p", "", "Say your phrase once more, then finish. Remember: small pauses, a clear stress on “deadline”, a gentle rise."));
  var card = el("div", "pz-card");
  card.appendChild(el("p", "pz-model", TARGET.text));
  card.appendChild(chunkList(TARGET));
  pre.appendChild(card);
  var row = el("div", "pz-btnrow");
  var once = el("button", "pz-btn-help", "Try once more"); once.type = "button";
  once.addEventListener("click", function(){ showScreen(3); });
  var fin = el("button", "pz-btn-done", "Finish pronunciation"); fin.type = "button"; fin.id = "pz-finish";
  fin.addEventListener("click", finish);
  row.appendChild(once); row.appendChild(fin);
  pre.appendChild(row);
  s.appendChild(pre);
  s.appendChild(box);
  return s;
};

/* ---------- completion (local; no bridge needed) ---------- */
function finish(){
  if (state.completionInFlight || state.completionSent){ return; }
  state.completionInFlight = true;
  var fin = document.getElementById("pz-finish");
  if (fin) fin.disabled = true;
  try {
    state.completionSent = true;
    var main = document.getElementById("pz-close-main");
    var box = document.getElementById("pz-complete-box");
    if (main) main.hidden = true;
    if (box){ box.hidden = false; try { box.setAttribute("tabindex", "-1"); box.focus(); } catch(e){} }
    announce("Pronunciation finished.");
    try { document.dispatchEvent(new CustomEvent("pazapa:complete", { detail:{ lessonId: LESSON_ID } })); } catch(e){}
  } finally {
    state.completionInFlight = false;
  }
}
function restart(){
  micBlocked = false;
  state.completionSent = false; state.completionInFlight = false;
  showScreen(0);
  window.scrollTo(0, 0);
}

window.addEventListener("pagehide", function(){ stopAudio(); stopRecognition(); abortFeedback(); teardownRecording(); });

showScreen(0);

})();
</script>
