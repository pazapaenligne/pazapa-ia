/* ============================================================================

   Microphone requested only when Start is pressed. Tracks are always released.
   ========================================================================= */
var state = { cur:0, found:{}, practised:false, selfCheck:false, finished:false };
var recs = [];
var activeRec = null;

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
    typeof navigator.mediaDevices.getUserMedia === "function" &&
    typeof window.MediaRecorder !== "undefined");
}
function recMime(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){
    try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){}
  }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function stopRecording(){
  for (var i = 0; i < recs.length; i++){
    var r = recs[i];
    if (r.pending) r.cancelPending();
    if (r.mr && r.mr.state !== "inactive"){ try { r.mr.stop(); } catch(e){} }
  }
}

/* opts: title (optional heading), say (accessible phrase text) */
function makeRecorder(screen, text, opts){
  opts = opts || {};
  var r = { id:recs.length + 1000 * (screen + 1) + Math.floor(Math.random() * 999),
            screen:screen, url:null, mr:null, stream:null, gen:0,
            pending:false, recording:false, t0:0, tick:null, cap:null, pTimer:null };
  var root = el("div","pz-rec");
  if (opts.title) root.appendChild(el("h3", null, opts.title));

  var row = el("div","pz-btnrow");
  var recBtn = mkBtn("Start recording","pz-btn-primary");
  recBtn.setAttribute("aria-label","Start recording: " + text);
  var elapsed = el("span","pz-elapsed"); elapsed.setAttribute("aria-hidden","true");
  row.appendChild(recBtn); row.appendChild(elapsed);
  root.appendChild(row);

  var status = el("p","pz-status"); status.setAttribute("role","status"); status.setAttribute("aria-live","polite");
  root.appendChild(status);

  var after = el("div","pz-btnrow"); after.hidden = true;
  var playBtn = mkBtn("Play my voice","pz-btn-primary", function(){ if (r.url) playSource(r.url, "rec:" + r.id); });
  playBtn.setAttribute("aria-label","Play my recording of: " + text);
  regAudioBtn(playBtn, "rec:" + r.id, "Play my voice", "Stop");
  var againBtn = mkBtn("Record again","pz-btn-quiet", function(){ begin(); });
  var delBtn = mkBtn("Delete recording","pz-btn-quiet", function(){

  });
  after.appendChild(playBtn); after.appendChild(againBtn); after.appendChild(delBtn);
  root.appendChild(after);

  function say(t){ status.textContent = t; }
  function dropUrl(){ if (r.url){ try { URL.revokeObjectURL(r.url); } catch(e){} r.url = null; } }

    recBtn.textContent = busy ? "Stop recording" : "Start recording";
    recBtn.setAttribute("aria-pressed", busy ? "true" : "false");
    after.hidden = busy || !r.url;
    elapsed.textContent = r.recording ? "Recording " + fmt(Date.now() - r.t0) : "";

  }
  function clearTimers(){
    if (r.tick){ clearInterval(r.tick); r.tick = null; }
    if (r.cap){ clearTimeout(r.cap); r.cap = null; }
  }
  r.cancelPending = function(){
    if (r.pTimer){ clearTimeout(r.pTimer); r.pTimer = null; }
    r.gen++; r.pending = false; ui();
  };

    r.gen++;
    if (r.pTimer){ clearTimeout(r.pTimer); r.pTimer = null; }
    clearTimers();
    if (r.mr){ r.mr.onstop = null; r.mr.ondataavailable = null; r.mr.onerror = null;
      try { if (r.mr.state !== "inactive") r.mr.stop(); } catch(e){} r.mr = null; }
    releaseStream(r.stream); r.stream = null;
    if (audioBusy === "rec:" + r.id) stopAudio();
    dropUrl();
    if (activeRec === r) activeRec = null;
  };
  r.reset = function(){ r.destroy(); r.recording = false; r.pending = false; say(""); ui(); };

  function begin(){
    if (!recordingSupported()){
      say("Recording does not work in this browser. Say the phrase aloud, then use Practise without recording at the end.");
      return;
    }
    stopAudio(); stopSpeech();
    stopRecording();                       /* one recording at a time */
    var gen = ++r.gen;
    r.pending = true; ui(); say("Allow the microphone to start.");
    r.pTimer = setTimeout(function(){
      if (gen !== r.gen) return;
      r.gen++; r.pending = false; r.pTimer = null; ui();
      say("The microphone did not answer. You can try again.");
    }, CONFIG.permissionTimeoutMs);

    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      if (r.pTimer){ clearTimeout(r.pTimer); r.pTimer = null; }
      if (gen !== r.gen){ releaseStream(stream); return; }

      try {
        var mt = recMime();

      } catch(e){
        releaseStream(stream); r.pending = false; ui();
        say("Recording does not work in this browser. Say the phrase aloud, then use Practise without recording at the end.");
        return;
      }
      r.mr = mr; r.stream = stream; r.pending = false; r.recording = true; r.t0 = Date.now(); activeRec = r;
      mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) chunks.push(ev.data); };

        r.recording = false; ui();
        say("The recording did not work. You can try again.");
      };
      mr.onstop = function(){
        clearTimers(); releaseStream(stream);
        if (r.stream === stream) r.stream = null;
        if (r.mr === mr) r.mr = null;
        if (activeRec === r) activeRec = null;
        r.recording = false;
        if (!chunks.length){ ui(); say(r.url ? "I did not catch that. Your earlier recording is still here." : "I did not catch that. Please try again."); return; }
        var blob;
        try { blob = new Blob(chunks, { type: chunks[0].type || "audio/mp4" }); }
        catch(e){ ui(); say("The recording did not work. You can try again."); return; }
        if (!blob.size){ ui(); say("I did not catch that. Please try again."); return; }
        var replaced = !!r.url;
        dropUrl(); r.url = URL.createObjectURL(blob);
        state.practised = true;

        return;

    }).catch(function(err){

      if (gen !== r.gen) return;

      if (n === "NotFoundError" || n === "OverconstrainedError") say("No microphone was found. You can use Practise without recording at the end.");

  }

  recBtn.addEventListener("click", function(){
    if (r.pending){ r.cancelPending(); say("Cancelled."); return; }
    if (r.recording){ try { if (r.mr && r.mr.state !== "inactive") r.mr.stop(); } catch(e){} return; }
    begin();
  });

  if (!recordingSupported()){
    recBtn.hidden = true;
    say("Recording is not available here. Say the phrase aloud, then use Practise without recording at the end.");
  }
  ui();
  recs.push(r);
  r.root = root;
  return r;
}
function destroyScreenRecs(screen){
  for (var i = recs.length - 1; i >= 0; i--){
    if (recs[i].screen === screen){ recs[i].destroy(); recs.splice(i,1); }
  }
}
function destroyAllRecs(){
  for (var i = 0; i < recs.length; i++) recs[i].destroy();

}

/* ============================================================================
   AI FEEDBACK — recognised words only, only after "Get AI feedback"
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recogTimer = null, recogPanel = null;

function feedbackEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }
function isSafeEndpoint(v){
  if (typeof v !== "string" || v === "" || v !== v.trim()) return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  if (u.protocol !== "https:") return false;
  if (/^(localhost|127\.0\.0\.1|\[::1\]|::1)$/.test(u.hostname)) return false;
  if (u.search || u.hash || u.username || u.password) return false;
  return true;
}
function stopSpeech(){
  if (recogTimer){ clearTimeout(recogTimer); recogTimer = null; }
  if (recogPanel){ recogPanel.setBusy(false); recogPanel = null; }
  if (!recognition) return;
  try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.abort(); } catch(e){}
  recognition = null;
}
function sanitiseFeedback(d){
  if (!d || typeof d !== "object") return null;
  if (d.status !== "match" && d.status !== "try_again" && d.status !== "unclear") return null;
  var m = typeof d.message === "string" ? d.message.replace(/\s+/g," ").trim() : "";
  if (m === "" || m.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  var f = typeof d.focus === "string" ? d.focus.replace(/\s+/g," ").trim() : "";
  var norm = function(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  if (f.length > 60 || (f !== "" && (" " + norm(TARGET.text) + " ").indexOf(" " + norm(f) + " ") === -1)) f = "";
  return { status:d.status, message:m, focus:f };
}

function buildFeedbackPanel(){
  var panel = el("div","pz-speak");
  panel.appendChild(el("h2", null, "AI feedback"));
  if (!feedbackEnabled()){
    panel.appendChild(el("p", null, "AI feedback is not available here yet. You can still record, listen and compare."));
    return panel;
  }
  panel.appendChild(el("p", null, "Say the phrase once. The computer reads your words and gives one small tip about the useful word."));
  panel.appendChild(phraseEl(TARGET));
  var row = el("div","pz-btnrow");
  var go = mkBtn("Get AI feedback","pz-btn-primary");
  row.appendChild(go); panel.appendChild(row);
  var status = el("p","pz-status"); status.setAttribute("role","status"); status.setAttribute("aria-live","polite");
  panel.appendChild(status);
  var out = el("div"); out.setAttribute("aria-live","polite"); panel.appendChild(out);
  var seq = 0, ctrl = null;

  panel.setBusy = function(b){ go.disabled = !!b; };
  function clearOut(){ out.textContent = ""; }
  function showHeard(t){
    var h = el("div","pz-heard");
    h.appendChild(el("p","pz-note","Words I heard:"));
    h.appendChild(el("p", null, t));
    out.appendChild(h);
  }
  function showFb(fb, heard){
    clearOut(); if (heard) showHeard(heard);
    var cls = fb.status === "match" ? "pz-fb-match" : (fb.status === "try_again" ? "pz-fb-try" : "pz-fb-unclear");
    var box = el("div","pz-fb " + cls);
    var label = fb.status === "match" ? "Easy to follow" : (fb.status === "try_again" ? "Try once more" : "Not clear this time");
    var st = el("p","pz-fb-state"); dotText(st, label, fb.status === "try_again"); box.appendChild(st);
    box.appendChild(el("p", null, fb.message));
    if (fb.focus){
      var f = el("p"); f.appendChild(document.createTextNode("Listen for: "));
      f.appendChild(el("strong", null, fb.focus)); box.appendChild(f);
    }
    out.appendChild(box);
    status.textContent = "";
    go.textContent = "Get AI feedback again";
    announce("Feedback ready.");
  }
  function fallback(heard){
    clearOut(); if (heard) showHeard(heard);
    status.textContent = "Feedback is not available right now. Listen to your recording and try again.";
    go.textContent = "Get AI feedback again";
  }
  function request(text){
    var my = ++seq;
    status.textContent = "Checking your words.";
    ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
    var o = { method:"POST", headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ targetPhrase:TARGET.text, recognisedText:text }),
      cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };

    });

  go.addEventListener("click", function(){
    stopAudio(); stopRecording(); stopSpeech(); panel.cancel(); clearOut();
    var rg;
    try { rg = new SR(); } catch(e){ fallback(""); return; }
    rg.lang = "en-GB"; rg.continuous = false; rg.interimResults = false; rg.maxAlternatives = 1;
    var got = "", settled = false;
    rg.onresult = function(ev){
      if (recognition !== rg) return;
      try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); } catch(e){ got = ""; }
    };
    rg.onerror = function(ev){
      if (recognition !== rg || settled) return; settled = true;
      var c = ev && ev.error ? String(ev.error) : "";
      stopSpeech();
      if (c === "not-allowed" || c === "service-not-allowed") status.textContent = "The microphone is off. You can allow it and try again.";
      else if (c === "no-speech" || c === "aborted") status.textContent = "I could not hear the words this time. Try again.";
      else fallback("");
    };
    rg.onend = function(){
      if (recognition !== rg || settled) return; settled = true;
      stopSpeech();
      var t = got.replace(/\s+/g," ").trim();
      if (!t){ status.textContent = "I could not hear the words this time. Try again."; return; }
      if (t.length > 200) t = t.slice(0,200);
      request(t);
    };
    recognition = rg; recogPanel = panel; panel.setBusy(true);
    status.textContent = "Listening. Say the phrase once.";
    recogTimer = setTimeout(function(){
      if (recognition !== rg || settled) return; settled = true;
      stopSpeech(); status.textContent = "Nothing came back. You can try again.";
    }, CONFIG.recognitionTimeoutMs);
    try { rg.start(); } catch(e){ settled = true; stopSpeech(); fallback(""); }
  });
  return panel;
}

/* ---- 1 · Enter the situation (contextual scene) ------------------------- */
builders[0] = function(){
  var s = shell(1, "Speaking stations", "You are at a service desk. You need help. Your voice puts the weight on the word that helps the other person act.");
  var scene = el("div","pz-scene");
  scene.appendChild(figure("scene","A woman in a hijab speaks and gestures while a camera on a tripod records her."));
  var right = el("div");
  var b = el("div","pz-bubble");
  b.appendChild(el("p","pz-note","At the service desk you say:"));
  b.appendChild(phraseEl(TARGET, "pz-phrase-xl"));
  right.appendChild(b);
  right.appendChild(modelControl(TARGET, "Hear the phrase"));
  scene.appendChild(right);
  s.appendChild(scene);
  s.appendChild(el("p", null, "Today's focus: stress on useful information."));
  s.appendChild(frLine("Aujourd’hui : on insiste sur le mot le plus utile pour que l’autre personne comprenne."));
  var row = el("div","pz-actions");
  row.appendChild(mkBtn("Go to the stations","pz-btn-primary", function(){ goTo(1); }));
  s.appendChild(row);
  return s;
};

/* ---- 2 · Notice one useful feature (service map) ------------------------ */
builders[1] = function(){
  var s = shell(2, "Choose a stop on the service map", "Pick a stop. Find the useful word. Then say the phrase and play your voice.");
  var order = shuffle(PHRASES);
  var route = el("ol","pz-route"); route.setAttribute("aria-label","Service map with three stops");
  var detailHost = el("div");
  var details = {}, stopBtns = {}, tags = {};

  function showStop(p){
    for (var k in details) details[k].hidden = (k !== p.id);
    for (var j in stopBtns) stopBtns[j].setAttribute("aria-pressed", j === p.id ? "true" : "false");
    stopAudio(); stopSpeech(); stopRecording();
    announce(p.place + " stop opened.");
  }
  function buildDetail(p){
    var d = el("div","pz-detail"); d.hidden = true;
    d.appendChild(figure(p.img, p.alt));
    var col = el("div");
    col.appendChild(el("h2", null, p.place));
    var q = el("p", null, p.q); col.appendChild(q);
    var opts = el("div","pz-opts"); col.appendChild(opts);
    var fb = el("p","pz-status"); fb.setAttribute("role","status"); fb.setAttribute("aria-live","polite"); col.appendChild(fb);
    var after = el("div"); after.hidden = !state.found[p.id]; col.appendChild(after);

    function unlock(){
      after.textContent = "";
      after.appendChild(el("p", null, "This is the useful information. Say it clearly."));
      after.appendChild(phraseEl(p));
      after.appendChild(modelControl(p, "Hear the phrase"));
      var r = makeRecorder(1, p.text, { title:"My turn", onSaved:function(){} });
      after.appendChild(r.root);
      after.hidden = false;
    }
    shuffle(p.opts).forEach(function(w){
      var b = mkBtn(w, "pz-opt");
      b.addEventListener("click", function(){
        if (state.found[p.id]) return;
        if (w === p.answer){
          state.found[p.id] = true;
          b.classList.add("is-right");
          fb.textContent = "Yes. " + p.stress + " is the useful word.";
          tags[p.id].textContent = "Word found";
          var all = opts.querySelectorAll("button"); for (var i = 0; i < all.length; i++) all[i].disabled = true;
          unlock(); announce("Yes. " + p.stress + " is the useful word.");
        } else {
          b.classList.add("is-look");
          dotText(fb, "Look again. Which word names the thing?", true);
        }
      });
      opts.appendChild(b);
    });
    d.appendChild(col);
    if (state.found[p.id]) unlock();
    return d;
  }

  order.forEach(function(p){
    var li = el("li");
    var b = mkBtn("", "pz-stop");
    b.setAttribute("aria-pressed","false");
    var pin = el("span","pz-pin"); pin.setAttribute("aria-hidden","true");
    var img = figure(p.img, ""); img.alt = "";
    var lab = el("span"); lab.appendChild(document.createTextNode(p.place));
    lab.appendChild(el("br"));
    var tag = el("span","pz-stop-tag","Not started");
    lab.appendChild(tag);
    b.appendChild(pin); b.appendChild(img); b.appendChild(lab);
    b.setAttribute("aria-label","Stop: " + p.place);
    b.addEventListener("click", function(){ showStop(p); });
    li.appendChild(b); route.appendChild(li);
    stopBtns[p.id] = b; tags[p.id] = tag;
    details[p.id] = buildDetail(p); detailHost.appendChild(details[p.id]);
  });
  s.appendChild(route);
  s.appendChild(detailHost);
  s.appendChild(actionRow(2, "Practise the rhythm", 1, function(){ resetScreen(1); }));
  return s;
};

/* ---- 3 · Rehearse in meaningful chunks (rhythm strips) ------------------- */
builders[2] = function(){
  var s = shell(3, "Say it in beats", "Each phrase has weak beats and one strong beat. Make the strong beat clearer. Say the whole phrase as one piece.");
  PHRASES.forEach(function(p){
    var strip = el("section","pz-strip");
    strip.setAttribute("aria-label", p.text);
    strip.appendChild(el("h2", null, p.text));
    var ol = el("ol","pz-beats");
    ol.setAttribute("aria-label","Beats. The strong beat is " + p.stress + ".");
    p.beats.forEach(function(bt){
      var li = el("li","pz-beat" + (bt.m ? " is-main" : ""));
      var pulse = el("span","pz-pulse"); pulse.setAttribute("aria-hidden","true");
      li.appendChild(pulse);
      li.appendChild(document.createTextNode(bt.t));
      if (bt.m) li.appendChild(el("span","pz-sr"," (strong beat)"));
      ol.appendChild(li);
    });
    strip.appendChild(ol);
    strip.appendChild(modelControl(p, "Hear the phrase", p !== PHRASES[0]));
    var r = makeRecorder(2, p.text, { title:"My turn" });
    strip.appendChild(r.root);
    s.appendChild(strip);
  });
  s.appendChild(actionRow(3, "Open the studio", 2, function(){ resetScreen(2); }));
  return s;
};

/* ---- 4 · Record a useful phrase (studio with two takes) ------------------ */
builders[3] = function(){
  var s = shell(4, "Recording studio", "Record the phrase. Listen to your voice. Then record again if you want to.");
  var studio = el("div","pz-studio");
  studio.appendChild(el("p","pz-note","Your phrase"));
  studio.appendChild(phraseEl(TARGET, "pz-phrase-xl"));
  var mc = modelControl(TARGET, "Hear the phrase");
  studio.appendChild(mc);
  s.appendChild(studio);
  var takes = el("div","pz-takes");
  [1,2].forEach(function(n){
    var t = el("section","pz-take");
    t.setAttribute("aria-label","Take " + n);
    t.appendChild(el("h2", null, "Take " + n));
    var r = makeRecorder(3, TARGET.text, {});
    t.appendChild(r.root);
    takes.appendChild(t);
  });
  s.appendChild(takes);
  s.appendChild(el("p", null, "Play Take 1 and Take 2 one after the other. Which one makes " + TARGET.stress + " clearer?"));
  s.appendChild(actionRow(4, "Get feedback", 3, function(){ resetScreen(3); }));
  return s;
};

/* ---- 5 · Compare and receive feedback ------------------------------------ */
builders[4] = function(){
  var s = shell(5, "Compare and improve", "Get a small tip. Then record one more time and play it back.");
  var fp = buildFeedbackPanel();
  s.appendChild(fp);
  s._panel = fp;
  var tk = el("section","pz-take");
  tk.setAttribute("aria-label","One more take");
  tk.style.marginTop = "16px";
  tk.appendChild(el("h2", null, "One more take"));
  tk.appendChild(phraseEl(TARGET));
  tk.appendChild(modelControl(TARGET, "Hear the phrase"));
  tk.appendChild(makeRecorder(4, TARGET.text, {}).root);
  s.appendChild(tk);
  s.appendChild(actionRow(5, "Close the clinic", 4, function(){ resetScreen(4); }));
  return s;
};

/* ---- 6 · Close ------------------------------------------------------------ */
var doneBtn = null, finishedBox = null, hintBox = null;
builders[5] = function(){
  var s = shell(6, "Your speaking stations", "");
  var sm = el("div","pz-summary");
  sm.appendChild(el("p", null, "You practised three useful phrases. You gave the useful word the strong beat."));
  var ul = el("ul");
  PHRASES.forEach(function(p){ var li = el("li"); li.appendChild(phraseEl(p)); ul.appendChild(li); });
  sm.appendChild(ul);
  sm.appendChild(el("p", null, "Focus: " + FOCUS + "."));
  s.appendChild(sm);
  s.appendChild(frLine("Vous avez mis le mot utile en valeur dans trois phrases."));

  var rt = el("section","pz-take");
  rt.setAttribute("aria-label","Say all three");
  rt.appendChild(el("h2", null, "Say all three"));
  rt.appendChild(el("p", null, "Say the three phrases one after another. Record and play it back."));
  rt.appendChild(makeRecorder(5, "all three phrases", {}).root);
  s.appendChild(rt);

  var chk = el("div","pz-check");
  var cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = "pz-self"; cb.checked = !!state.selfCheck;
  cb.addEventListener("change", function(){ state.selfCheck = cb.checked; hintBox.textContent = ""; });
  var lb = el("label", null, "Practise without recording: I listened and I said the phrases aloud.");
  lb.setAttribute("for","pz-self");
  chk.appendChild(cb); chk.appendChild(lb);
  s.appendChild(chk);

  hintBox = el("p","pz-status pz-gentle"); hintBox.setAttribute("role","status"); hintBox.setAttribute("aria-live","polite");
  s.appendChild(hintBox);

  var row = el("div","pz-actions");
  doneBtn = mkBtn("Done","pz-btn-done", function(){
    if (!(state.practised || state.selfCheck)){
      dotText(hintBox, "Say one phrase first. Record yourself, or tick Practise without recording.", true);
      return;
    }
    hintBox.textContent = "";
    state.finished = true;
    finishedBox.textContent = "Pronunciation Clinic finished. You can try again if you want more practice.";
    doneBtn.setAttribute("aria-disabled","true");
    announce("Pronunciation Clinic finished.");
  });
  var again = mkBtn("Try again","pz-btn-quiet", function(){ restartAll(); announce("The clinic starts again."); });
  again.setAttribute("aria-label","Try again: start the whole clinic again");
  row.appendChild(doneBtn); row.appendChild(again);
  s.appendChild(row);
  finishedBox = el("p","pz-finished"); finishedBox.setAttribute("role","status"); finishedBox.setAttribute("aria-live","polite");
  s.appendChild(finishedBox);
  return s;
};

/* ============================================================================
   NAVIGATION / RESET
   ========================================================================= */
function buildProgress(){
  var ol = document.getElementById("pz-progress"); ol.textContent = "";
  for (var i = 0; i < TOTAL; i++) ol.appendChild(el("li"));
}
function paintProgress(){
  var items = document.getElementById("pz-progress").children;
  for (var i = 0; i < items.length; i++){
    items[i].className = i < state.cur ? "is-done" : (i === state.cur ? "is-now" : "");
  }
  document.getElementById("pz-pos").textContent = "Moment " + (state.cur + 1) + " of " + TOTAL;
}
function mount(i){
  var fresh = builders[i]();
  if (screens[i] && screens[i].parentNode) screens[i].parentNode.replaceChild(fresh, screens[i]);
  else main.appendChild(fresh);
  screens[i] = fresh;
  fresh.hidden = (i !== state.cur);
  return fresh;
}
function goTo(i){
  stopAudio(); stopSpeech(); stopRecording();
  state.cur = i;
  for (var k = 0; k < screens.length; k++) screens[k].hidden = (k !== i);
  paintProgress();
  var h = screens[i].querySelector("h1");
  screens[i].focus({ preventScroll:true });
  try { window.scrollTo({ top:0, behavior:"auto" }); } catch(e){ window.scrollTo(0,0); }
  announce("Moment " + (i + 1) + " of " + TOTAL + ". " + (h ? h.textContent : ""));
}
function resetScreen(i){
  stopAudio(); stopSpeech(); stopRecording();
  if (screens[i] && screens[i]._panel && screens[i]._panel.cancel) screens[i]._panel.cancel();
  destroyScreenRecs(i);
  if (i === 1) state.found = {};
  mount(i);
  screens[i].focus({ preventScroll:true });
  try { window.scrollTo(0,0); } catch(e){}
}
function restartAll(){
  stopAudio(); stopSpeech(); stopRecording();
  for (var i = 0; i < screens.length; i++){
    if (screens[i] && screens[i]._panel && screens[i]._panel.cancel) screens[i]._panel.cancel();
  }
  destroyAllRecs();
  state = { cur:0, found:{}, practised:false, selfCheck:false, finished:false };
  for (var j = 0; j < TOTAL; j++) mount(j);
  goTo(0);
}

/* Release microphone, recordings and URLs when the page closes. */
window.addEventListener("pagehide", function(){
  stopAudio(); stopSpeech(); stopRecording(); destroyAllRecs();
});

/* ============================================================================
   START
   ========================================================================= */
buildProgress();
for (var i = 0; i < TOTAL; i++) mount(i);
goTo(0);

})();
</script>
</body>
</html>
