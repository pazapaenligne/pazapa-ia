PAZAPA ENGLISH FOR ADULTS — A2
Week 9 · Lesson 1 — Step 3: Pronunciation Clinic

Lesson identifier: A2-W09-L1-S3
================================================================================

ONE PRONUNCIATION FOCUS
  Word stress in symptom words — one main stressed syllable in each word:
  DIZzy · FEver · alLERgic (teaching annotations only; never sent to speech
  synthesis).

MODEL LANGUAGE (exact, from the production brief)
  1. I feel dizzy.                    stress: DIZzy
  2. I have a fever.                  stress: FEver
  3. I'm allergic to this medicine.   stress: alLERgic
  Main target recording: "I feel dizzy."  Recording and AI check are offered on
  all three phrases.

IMAGES
  Taken from the lesson workbook "Week 9 Lesson 1 A2 Workbook – Symptoms and
  Advice" (PDF): page 1 (dizzy, fever, allergic pictures) and page 4 (Sara and
  Hana reading scene). Embedded unchanged as Base64 JPEG, shown whole (never
  cropped). All figures are faceless women.

AUDIO — CONFIGURABLE ASSETS  (see AUDIO_FILES in the script)
  Three supplied recordings (dizzy, fever, allergic) are embedded complete in
  AUDIO_FILES and level-matched to -18 LUFS. No text-to-speech or invented
  audio is used. One persistent <audio> element plays one sound at a time,
  only after a learner click or tap. If a key is ever emptied, its Listen
  button is replaced by a plain "audio not added yet" note.

AI CHECK — feedbackEndpoint (see CONFIG)
  Uses the production pronunciation-feedback function. Only the words the
  browser recognised (text, never audio) and the target phrase are sent, and
  only after the learner presses the AI check button. No API key is held in
  this file. The response is validated twice and rendered as plain text. There
  is no score, grade or accent judgement. If the endpoint is unset, the AI
  panel is not rendered and recording still works.

RECORD AND COMPARE
  Local only: Blob + object URL, microphone requested only when Record is
  pressed, tracks stopped after every recording, URLs revoked on delete and
  screen change, 20-second cap. Up to two takes per phrase are kept for
  comparison.

HOST MICROPHONE REQUIREMENT (deployment note)
  getUserMedia needs an https page. When this file is embedded in an iframe,
  the host page must allow the microphone, for example:
    <iframe src="https://pazapaenligne.github.io/..." allow="microphone">
  and must not send a Permissions-Policy that blocks microphone. The HTML
  cannot grant itself this permission. Without it the recorder shows a calm
  message and the learner can still practise aloud and press Done.

COMPLETION
  Local only. Done is available on the last screen once the learner has tried
  the strong-part board and practised at least one phrase (recording, AI check,
  My turn, or "I practised this aloud"). AI success is never required. No
  learner-facing save or LMS message is shown. Try again (beside Done) starts

/* ============================================================================
   SMALL HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function announce(msg){ var l = document.getElementById("pz-live"); if (l) l.textContent = String(msg || ""); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fr(text){ var p = el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function img(key, alt){
  var src = IMAGES[key];
  if (typeof src !== "string" || !/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(src)) return null;
  var i = document.createElement("img");
  i.src = src; i.alt = alt || ""; i.setAttribute("decoding","async");
  return i;
}
function cueNode(pieces){
  var s = el("span");
  for (var i = 0; i < pieces.length; i++){
    if (pieces[i][1]) s.appendChild(el("strong","pz-strong",pieces[i][0]));
    else s.appendChild(document.createTextNode(pieces[i][0]));
  }
  return s;
}
function isSafeEndpoint(v){
  if (typeof v !== "string" || v === "" || v !== v.trim()) return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  if (u.protocol !== "https:") return false;
  if (/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(u.hostname)) return false;
  if (u.search || u.hash || u.username || u.password) return false;
  return true;
}
function isSafeUrl(v){
  if (typeof v !== "string" || v === "") return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  return u.protocol === "https:" && !u.username && !u.password;
}
function isValidAudio(key){
  var v = AUDIO_FILES[key];
  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+/=]+$/.test(v);
}
function anyAudio(){ for (var k in AUDIO_FILES){ if (isValidAudio(k)) return true; } return false; }

/* ============================================================================
   AUDIO — one persistent element, one sound at a time, never autoplayed
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null;
var audioToken = 0;

function stopAudio(){
  audioToken++;
  if (audioEl){
    try { audioEl.pause(); } catch(e){}
    try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  }
  audioBusyKey = null;
  refreshAudioButtons();
}
function playSource(src, busyKey, btn){
  if (!audioEl || !src) return;
  if (audioBusyKey === busyKey){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var token = ++audioToken;
  audioBusyKey = busyKey;
  refreshAudioButtons();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e2){} }
    var p = audioEl.play();
    if (p && typeof p.catch === "function"){
      p.catch(function(){
        if (token !== audioToken) return;
        audioBusyKey = null; refreshAudioButtons();
        if (btn) announce("The audio did not play. Read the phrase and say it aloud.");
      });
    }
  } catch(e){
    if (token !== audioToken) return;
    audioBusyKey = null; refreshAudioButtons();
  }
}
function playAudio(key, btn){ if (isValidAudio(key)) playSource(AUDIO_FILES[key], "model:" + key, btn); }
if (audioEl){
  audioEl.addEventListener("ended", function(){ audioBusyKey = null; refreshAudioButtons(); });
  audioEl.addEventListener("error", function(){
    if (!audioEl.getAttribute("src")) return;
    audioBusyKey = null; refreshAudioButtons();
  });
}
function refreshAudioButtons(){
  var btns = document.querySelectorAll("[data-play-key]");
  for (var i = 0; i < btns.length; i++){
    var b = btns[i], playing = (b.getAttribute("data-play-key") === audioBusyKey);
    b.setAttribute("aria-pressed", playing ? "true" : "false");
    b.textContent = playing ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");
  }
}
/* Listen button for a supplied model; null when no recording exists. */
function modelButton(p, label){
  if (!isValidAudio(p.id)) return null;
  var b = el("button","pz-btn-help",label);
  b.type = "button";
  b.setAttribute("data-play-key","model:" + p.id);
  b.setAttribute("data-label-play",label);
  b.setAttribute("data-label-stop","Stop");
  b.setAttribute("aria-pressed","false");
  b.setAttribute("aria-label",label + ": " + p.text);
  b.addEventListener("click", function(){ playAudio(p.id, b); });
  return b;
}
function noAudioNote(){
  return el("p","pz-note","The audio model is not added yet. Read the phrase and say it aloud.");
}

/* ============================================================================
   PRACTICE STATE — what completion needs (never a score)
   ========================================================================= */
var state;
function freshState(){ return { noticeTried:false, practised:{}, localComplete:false }; }
function practisedCount(){ var n = 0; for (var k in state.practised){ if (state.practised[k]) n++; } return n; }
function markPractised(id){ state.practised[id] = true; }

/* ============================================================================
   SPEECH RECOGNITION + AI CHECK  (text only is sent)
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognisingPanel = null, recognitionTimer = null;
var RECOGNITION_TIMEOUT_MS = 12000;

function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }
function part(panel, role){ return panel.querySelector('[data-role="' + role + '"]'); }

function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
  if (recognisingPanel){ setSpeakBusy(recognisingPanel, false); recognisingPanel = null; }
  if (!recognition) return;
  try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; } catch(e){}
  try { recognition.abort(); } catch(e){}
  recognition = null;
}
function setSpeakBusy(panel, busy){
  var b = part(panel,"speak"); if (!b) return;
  b.disabled = !!busy;
  b.textContent = busy ? "Listening…" : "AI check: say the phrase";
}
function speakStatus(panel, text){
  var out = part(panel,"out"); if (!out) return;
  var s = out.querySelector(".pz-status");
  if (!s){ s = el("p","pz-status"); out.appendChild(s); }
  s.textContent = text;
}
function showHeard(panel, text){
  var out = part(panel,"out"); if (!out) return;
  var box = out.querySelector(".pz-heard");
  if (!box){
    box = el("div","pz-heard");
    box.appendChild(el("p","pz-heard-label","Your words:"));
    box.appendChild(el("p","pz-heard-text"));
    out.insertBefore(box, out.firstChild);
  }
  box.querySelector(".pz-heard-text").textContent = text;
}
function showFeedback(panel, fb, heard){
  var out = part(panel,"out"); if (!out) return;
  panel.pzAttempted = true; markPractised(panel.pzPhrase.id);
  if (heard) showHeard(panel, heard);
  var old = out.querySelector(".pz-fb"); if (old) out.removeChild(old);
  var s = out.querySelector(".pz-status"); if (s) s.textContent = "";
  var word, cls;
  if (fb.status === "match"){ word = "Your words matched"; cls = "pz-fb pz-fb-match"; }
  else if (fb.status === "try_again"){ word = "Try once more"; cls = "pz-fb pz-fb-try"; }
  else { word = "Not compared"; cls = "pz-fb pz-fb-unclear"; }
  var box = el("div", cls);
  box.appendChild(el("p","pz-fb-state",word));
  box.appendChild(el("p","pz-fb-msg",fb.message));
  if (fb.focus){
    var f = el("p","pz-fb-focus");
    f.appendChild(document.createTextNode("Practise this part: "));
    f.appendChild(el("b",null,fb.focus));
    box.appendChild(f);
  }
  out.appendChild(box);
  part(panel,"after").hidden = false;
}
function showFallback(panel, heard){
  var out = part(panel,"out"); if (!out) return;
  panel.pzAttempted = true; markPractised(panel.pzPhrase.id);
  if (heard) showHeard(panel, heard);
  var old = out.querySelector(".pz-fb"); if (old) out.removeChild(old);
  var s = out.querySelector(".pz-status"); if (s) s.textContent = "";
  var box = el("div","pz-fb pz-fb-unclear");
  box.appendChild(el("p","pz-fb-state","AI feedback unavailable"));
  box.appendChild(el("p","pz-fb-msg",FALLBACK_MSG));
  out.appendChild(box);
  part(panel,"after").hidden = false;
}
function abortPendingFeedback(panel){
  var list = panel ? [panel] : document.querySelectorAll(".pz-speak");
  for (var i = 0; i < list.length; i++){
    list[i].pzSeq = (list[i].pzSeq || 0) + 1;
    if (list[i].pzCtrl){ try { list[i].pzCtrl.abort(); } catch(e){} list[i].pzCtrl = null; }
  }
}
function clearAttempt(panel){
  abortPendingFeedback(panel);
  if (recognisingPanel === panel) stopRecognition();
  setSpeakBusy(panel,false);
  var out = part(panel,"out"); if (out){ while (out.firstChild) out.removeChild(out.firstChild); }
  part(panel,"after").hidden = true;
}
function resetAllSpeakPanels(){
  var ps = document.querySelectorAll(".pz-speak");
  for (var i = 0; i < ps.length; i++){
    var out = part(ps[i],"out"); if (out){ while (out.firstChild) out.removeChild(out.firstChild); }
    part(ps[i],"after").hidden = true;
    setSpeakBusy(ps[i], false);
  }
}

function startRecognition(panel){
  if (!speakingEnabled()) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var r;
  try { r = new SR(); } catch(e){ showFallback(panel); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;

  r.onresult = function(ev){
    if (recognition !== r) return;
    if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); }
    catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recognition !== r || settled) return;
    settled = true;
    var code = (ev && ev.error) ? String(ev.error) : "";
    setSpeakBusy(panel,false);
    if (code === "not-allowed" || code === "service-not-allowed"){
      panel.pzAttempted = true; markPractised(panel.pzPhrase.id);
      speakStatus(panel,"The microphone is off. You can carry on.");
      part(panel,"after").hidden = false;
    } else if (code === "no-speech" || code === "aborted"){
      showFeedback(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again, or carry on.",focus:""},"");
    } else { showFallback(panel); }
    stopRecognition();
  };
  r.onend = function(){
    if (recognition !== r || settled) return;
    settled = true;
    setSpeakBusy(panel,false);
    stopRecognition();
    var clean = got.replace(/\s+/g," ").trim();
    if (clean === ""){
      showFeedback(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again, or carry on.",focus:""},"");
      return;
    }
    if (clean.length > 200) clean = clean.slice(0,200);
    requestFeedback(panel, clean);
  };
  recognition = r; recognisingPanel = panel;
  setSpeakBusy(panel,true);
  speakStatus(panel,"Listening. Say the phrase once.");
  recognitionTimer = setTimeout(function(){
    if (recognition !== r || settled) return;
    settled = true;
    stopRecognition();
    panel.pzAttempted = true; markPractised(panel.pzPhrase.id);
    speakStatus(panel,"The AI check did not respond in this browser. You can try again or carry on.");
    part(panel,"after").hidden = false;
  }, RECOGNITION_TIMEOUT_MS);
  try { r.start(); }
  catch(e){ settled = true; setSpeakBusy(panel,false); stopRecognition(); showFallback(panel); }
}

/* Sends ONLY { targetPhrase, recognisedText } — never audio. */
function requestFeedback(panel, recognisedText){
  var p = panel.pzPhrase, seq = panel.pzSeq || 0;
  showHeard(panel, recognisedText);
  speakStatus(panel,"Comparing your words with the model.");
  if (!isSafeEndpoint(CONFIG.feedbackEndpoint)){ showFallback(panel, recognisedText); return; }
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  panel.pzCtrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ targetPhrase:p.text, recognisedText:recognisedText }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad-status"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      var safe = sanitiseFeedback(data, p);
      if (!safe){ showFallback(panel, recognisedText); return; }
      showFeedback(panel, safe, recognisedText);
    })
    .catch(function(){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      showFallback(panel, recognisedText);
    });
}
/* Second gate on whatever comes back: plain sentence text only, no score-like
   or grading language, and "focus" may only echo words from this phrase. */
function sanitiseFeedback(data, p){
  if (!data || typeof data !== "object") return null;
  var status = data.status;
  if (status !== "match" && status !== "try_again" && status !== "unclear") return null;
  var message = (typeof data.message === "string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (message === "" || message.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(message)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(message)) return null;
  var focus = (typeof data.focus === "string") ? data.focus.replace(/\s+/g," ").trim() : "";
  if (focus.length > 60 || !focusIsApproved(focus, p)) focus = "";
  return { status:status, message:message, focus:focus };
}
function focusIsApproved(focus, p){
  var norm = function(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  var f = norm(focus);
  if (f === "") return true;
  if (f === norm(p.chunks.join(" / "))) return true;
  return (" " + norm(p.text) + " ").indexOf(" " + f + " ") !== -1;
}

/* ============================================================================
   RECORD AND COMPARE — local only, up to two takes per phrase
   ========================================================================= */
var RECORD_MAX_MS = 20000;                 /* documented capture limit */
var RECORD_PERMISSION_TIMEOUT_MS = 10000;
var recGen = 0, recorder = null, recStream = null, recPanel = null;
var recPendingPanel = null, recPendingTimer = null, recTick = null;

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function" &&
            typeof window.MediaRecorder !== "undefined");
}
function recMimeType(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){ try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){} }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function stopActiveRecorder(){
  if (!recorder) return;
  try { if (recorder.state !== "inactive") recorder.stop(); } catch(e){}
}
function stopTick(){ if (recTick){ clearInterval(recTick); recTick = null; } }
function recStatus(panel, text){
  var out = part(panel,"rec-out"); if (!out) return;
  var s = out.querySelector(".pz-status");
  if (!s){ s = el("p","pz-status"); out.appendChild(s); }
  s.textContent = text;
}
function setRecBusy(panel, busy){
  var b = part(panel,"rec-start"); if (!b) return;
  b.disabled = false;
  b.textContent = busy ? "Stop recording" : (panel.pzTakes.length ? "Record again" : "Start recording");
  b.setAttribute("aria-pressed", busy ? "true" : "false");
  panel.pzRecording = !!busy;
}
function cancelPendingRecordingRequest(){
  if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer = null; }
  if (recPendingPanel){
    recGen++;
    setRecBusy(recPendingPanel,false);
    recStatus(recPendingPanel,"");
    recPendingPanel = null;
  }
}
function revokeTake(panel, i){
  var u = panel.pzTakes[i];
  if (u){ if (audioBusyKey === "rec:" + panel.id + ":" + i) stopAudio(); try { URL.revokeObjectURL(u); } catch(e){} }
}
function clearRecordings(panel){
  stopAudio();
  for (var i = 0; i < panel.pzTakes.length; i++) revokeTake(panel, i);
  panel.pzTakes = [];
  renderTakes(panel);
  setRecBusy(panel,false);
}
function clearAllRecordings(){
  var ps = document.querySelectorAll(".pz-record");
  for (var i = 0; i < ps.length; i++){
    clearRecordings(ps[i]);
    var o = part(ps[i],"rec-out"); if (o){ while (o.firstChild) o.removeChild(o.firstChild); }
  }
}
function renderTakes(panel){
  var box = part(panel,"takes");
  while (box.firstChild) box.removeChild(box.firstChild);
  for (var i = 0; i < panel.pzTakes.length; i++){
    (function(n){
      var row = el("div","pz-take");
      row.appendChild(el("span","pz-take-name","My recording " + (n + 1)));
      var play = el("button","pz-btn-primary","Hear my recording");
      play.type = "button";
      play.setAttribute("data-play-key","rec:" + panel.id + ":" + n);
      play.setAttribute("data-label-play","Hear my recording");
      play.setAttribute("data-label-stop","Stop");
      play.setAttribute("aria-pressed","false");
      play.setAttribute("aria-label","Hear my recording " + (n + 1) + " of: " + panel.pzPhrase.text);
      play.addEventListener("click", function(){ playSource(panel.pzTakes[n], "rec:" + panel.id + ":" + n, play); });
      row.appendChild(play);
      var del = el("button","pz-btn-quiet","Delete recording");
      del.type = "button";
      del.setAttribute("aria-label","Delete recording " + (n + 1));
      del.addEventListener("click", function(){
        revokeTake(panel, n);
        panel.pzTakes.splice(n,1);
        renderTakes(panel);
        setRecBusy(panel,false);
        recStatus(panel,"Recording deleted.");
      });
      row.appendChild(del);
      box.appendChild(row);
    })(i);
  }
  var mb = part(panel,"rec-model");
  if (mb) mb.hidden = (panel.pzTakes.length === 0);
  refreshAudioButtons();
}

function startRecording(panel){
  if (!recordingSupported()) return;
  cancelPendingRecordingRequest();
  var gen = ++recGen;
  stopAudio(); stopRecognition(); stopActiveRecorder(); stopTick();
  setRecBusy(panel,true);
  recStatus(panel,"Starting the microphone…");
  recPendingPanel = panel;
  recPendingTimer = setTimeout(function(){
    if (gen !== recGen) return;
    cancelPendingRecordingRequest();
    recStatus(panel,"The microphone did not respond. You can try again or carry on.");
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer = null; }
    if (recPendingPanel === panel) recPendingPanel = null;
    if (gen !== recGen){ releaseStream(stream); return; }
    var chunks = [], mr, cap = null;
    try { var mt = recMimeType(); mr = mt ? new window.MediaRecorder(stream,{mimeType:mt}) : new window.MediaRecorder(stream); }
    catch(e){
      releaseStream(stream); setRecBusy(panel,false);
      recStatus(panel,"Recording does not work in this browser. Say the phrase aloud, then carry on.");
      return;
    }
    recorder = mr; recStream = stream; recPanel = panel;
    var started = Date.now();
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
    mr.onerror = function(){
      if (cap) clearTimeout(cap);
      stopTick(); releaseStream(stream);
      if (recorder === mr) recorder = null;
      if (recStream === stream) recStream = null;
      if (gen !== recGen) return;
      setRecBusy(panel,false);
      recStatus(panel,"The recording did not work. You can try again or carry on.");
    };
    mr.onstop = function(){
      if (cap) clearTimeout(cap);
      stopTick(); releaseStream(stream);
      if (recorder === mr) recorder = null;
      if (recStream === stream) recStream = null;
      if (recPanel === panel) recPanel = null;
      if (gen !== recGen) return;
      if (!chunks.length){
        setRecBusy(panel,false);
        recStatus(panel,"I did not catch that. You can try again or carry on.");
        return;
      }
      var blob;
      try { blob = new Blob(chunks,{ type: chunks[0].type || "audio/mp4" }); }
      catch(e){ setRecBusy(panel,false); recStatus(panel,"The recording did not work. You can try again or carry on."); return; }
      /* Keep up to two takes: a third replaces the second, never the first. */
      if (panel.pzTakes.length >= 2){ revokeTake(panel,1); panel.pzTakes.splice(1,1); }
      panel.pzTakes.push(URL.createObjectURL(blob));
      markPractised(panel.pzPhrase.id);
      renderTakes(panel);
      setRecBusy(panel,false);
      recStatus(panel, panel.pzTakes.length > 1
        ? "Recording saved. Hear recording 1 and recording 2, then listen to the model."
        : "Recording saved. Hear your recording, then listen to the model.");
    };
    try { mr.start(); }
    catch(e){
      releaseStream(stream); recorder = null; recStream = null;
      if (gen !== recGen) return;
      setRecBusy(panel,false);
      recStatus(panel,"Recording does not work in this browser. Say the phrase aloud, then carry on.");
      return;
    }
    recStatus(panel,"Recording 0:00. Say the phrase.");
    recTick = setInterval(function(){
      var s = Math.floor((Date.now() - started) / 1000);
      recStatus(panel,"Recording " + Math.floor(s/60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60) + ". Say the phrase.");
    }, 500);
    cap = setTimeout(function(){ try { if (mr.state === "recording") mr.stop(); } catch(e){} }, RECORD_MAX_MS);
  }).catch(function(){
    if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer = null; }
    if (recPendingPanel === panel) recPendingPanel = null;
    if (gen !== recGen) return;
    setRecBusy(panel,false);
    recStatus(panel,"The microphone is off. You can still say the phrase aloud and carry on.");
  });
}
function toggleRecording(panel){
  if (recPendingPanel === panel){
    cancelPendingRecordingRequest();
    recStatus(panel,"Cancelled. You can try again or carry on.");
  } else if (panel.pzRecording){ stopActiveRecorder(); }
  else { startRecording(panel); }
}
function stopAll(){ stopAudio(); stopRecognition(); stopActiveRecorder(); stopTick(); cancelPendingRecordingRequest(); }

/* ============================================================================
   SCREEN BUILDERS
   ========================================================================= */
var screens = [];
var current = 0;
var builders = [];

function newScreen(id, title){
  var sec = el("section","pz-screen");
  sec.id = "pz-" + id; sec.tabIndex = -1; sec.hidden = true;
  sec.setAttribute("aria-labelledby","pz-" + id + "-h");
  sec.appendChild(el("div","pz-accent")).setAttribute("aria-hidden","true");
  var h = el("h1",null,title); h.id = "pz-" + id + "-h";
  sec.appendChild(h);
  return sec;
}
function actionRow(tryFn, nextLabel){
  var row = el("div","pz-actions");
  if (tryFn){
    var t = el("button","pz-btn-quiet","Try again");
    t.type = "button";
    t.addEventListener("click", tryFn);
    row.appendChild(t);
  }
  if (nextLabel){
    var n = el("button","pz-btn-primary",nextLabel);
    n.type = "button";
    n.addEventListener("click", function(){ showScreen(current + 1); });
    row.appendChild(n);
  }
  return row;
}
function rebuildScreen(i){
  var host = document.getElementById("pz-host");
  var fresh = builders[i]();
  host.replaceChild(fresh, screens[i]);
  screens[i] = fresh;
  showScreen(i);
}

/* ---- Part 1 — enter the situation (scene composition) ---- */
function buildScene(){
  var sec = newScreen("scene","Pronunciation Clinic: I don't feel well");
  sec.appendChild(el("p",null,"You tell a friend how you feel. One strong part in each symptom word helps people understand you."));
  sec.appendChild(fr("Vous dites à une amie comment vous vous sentez. Une syllabe forte dans chaque mot aide l'autre personne à vous comprendre."));

  var scene = el("div","pz-scene");
  var im = img("scene","Two women sit together at home. One rests her head on her hand. The other holds a glass of water for her.");
  if (im) scene.appendChild(im);
  var bub = el("div","pz-bubble");
  bub.appendChild(el("p","pz-bubble-who","Sara"));
  var bt = el("p","pz-bubble-text");
  bt.appendChild(cueNode(PHRASES[0].cue));
  bub.appendChild(bt);
  scene.appendChild(bub);
  sec.appendChild(scene);

  sec.appendChild(el("p",null,"Today's focus: " + FOCUS.toLowerCase() + "."));
  var row = el("div","pz-btnrow");
  var hear = modelButton(PHRASES[0],"Hear the phrase");
  if (hear) row.appendChild(hear);
  if (row.firstChild) sec.appendChild(row); else sec.appendChild(noAudioNote());
  sec.appendChild(actionRow(null,"Find the strong parts"));
  return sec;
}

/* ---- Part 2 — notice the strong syllable (symptom board) ---- */
function buildBoard(){
  var sec = newScreen("board","Find the strong part");
  sec.appendChild(el("p",null,"Each symptom word has one strong part. Tap the strong part in each word."));
  sec.appendChild(fr("Chaque mot a une partie forte. Touchez la partie forte de chaque mot."));
  if (!anyAudio()) sec.appendChild(noAudioNote());

  var list = el("ul","pz-board");
  var order = shuffle(PHRASES);                  /* new order on every load and Try again */
  for (var k = 0; k < order.length; k++){
    list.appendChild(boardRow(order[k]));
  }
  sec.appendChild(list);
  sec.appendChild(actionRow(function(){ rebuildScreen(1); announce("Starting the board again."); },
                            "Practise the rhythm"));
  return sec;
}
function boardRow(p){
  var li = el("li","pz-row");
  var im = img(p.img, p.alt);
  if (im) li.appendChild(im); else li.appendChild(el("span"));
  var body = el("div");
  body.appendChild(el("p","pz-word",p.word));
  var chips = el("div","pz-chips");
  chips.setAttribute("role","group");
  chips.setAttribute("aria-label","Which part of " + p.word + " is strong?");
  var status = el("p","pz-status");
  status.setAttribute("role","status"); status.setAttribute("aria-live","polite");
  var idxs = []; for (var i = 0; i < p.parts.length; i++) idxs.push(i);
  /* syllables stay in reading order (al · ler · gic); only the word rows are shuffled */
  var solved = false;
  idxs.forEach(function(i){
    var b = el("button","pz-chip",p.parts[i]);
    b.type = "button";
    b.setAttribute("aria-label",p.word + ", part " + (i + 1) + ": " + p.parts[i]);
    b.addEventListener("click", function(){
      if (solved) return;
      state.noticeTried = true;
      if (i === p.strong){
        solved = true;
        b.className = "pz-chip is-right";
        li.className = "pz-row is-solved";
        var kids = chips.querySelectorAll("button");
        for (var q = 0; q < kids.length; q++) kids[q].disabled = true;
        b.disabled = false;
        var cue = p.parts.map(function(s,n){ return n === p.strong ? s.toUpperCase() : s; }).join("");
        status.textContent = "Yes. The strong part is " + p.parts[p.strong].toUpperCase() + ": " + cue + ".";
      } else {
        b.className = "pz-chip is-try";
        status.textContent = "Try another part.";
      }
    });
    chips.appendChild(b);
  });
  body.appendChild(chips);
  body.appendChild(status);
  li.appendChild(body);
  return li;
}

/* ---- Part 3 — rehearse in meaningful chunks (rhythm strip) ---- */
function buildStrip(){
  var sec = newScreen("strip","Say it with the beat");
  sec.appendChild(el("p",null,"Choose a phrase. Look at the strong beat. Then say the whole phrase."));
  sec.appendChild(fr("Choisissez une phrase. Regardez le temps fort. Puis dites toute la phrase."));

  var sel = 0;
  var tabs = el("div","pz-tabs");
  tabs.setAttribute("role","group"); tabs.setAttribute("aria-label","Choose a phrase");
  var stage = el("div");
  var tabBtns = [];

  function paint(){
    var p = PHRASES[sel];
    while (stage.firstChild) stage.removeChild(stage.firstChild);
    var strip = el("div","pz-strip");
    strip.setAttribute("role","img");
    strip.setAttribute("aria-label", p.text + " The strong beat is " + p.parts[p.strong].toUpperCase() + " in " + p.word + ".");
    p.beats.forEach(function(b){
      var beat = el("div","pz-beat" + (b[1] ? " is-strong" : ""));
      beat.appendChild(el("span","pz-dot"));
      beat.appendChild(el("span","pz-block",b[0]));
      strip.appendChild(beat);
    });
    stage.appendChild(strip);
    var line = el("p");
    line.appendChild(document.createTextNode("Strong beat: "));
    line.appendChild(el("strong","pz-strong",p.parts[p.strong].toUpperCase()));
    line.appendChild(document.createTextNode(" in " + p.word + ". Say it: "));
    line.appendChild(cueNode(p.cue));
    stage.appendChild(line);

    var ul = el("ul","pz-chunks");
    ul.setAttribute("aria-label","Speaking chunks for: " + p.text);
    p.chunks.forEach(function(c,n){
      if (n > 0){ var s = el("li","pz-sep","/"); s.setAttribute("aria-hidden","true"); ul.appendChild(s); }
      ul.appendChild(el("li",null,c));
    });
    stage.appendChild(ul);

    var row = el("div","pz-btnrow");
    var hear = modelButton(p,"Hear it");
    if (hear) row.appendChild(hear);
    var my = el("button","pz-btn-primary","My turn: I said it aloud");
    my.type = "button";
    var st = el("p","pz-status"); st.setAttribute("role","status"); st.setAttribute("aria-live","polite");
    my.addEventListener("click", function(){
      markPractised(p.id);
      st.textContent = "Good. Say it once more with a clear strong beat.";
    });
    row.appendChild(my);
    stage.appendChild(row);
    if (!hear) stage.appendChild(noAudioNote());
    stage.appendChild(st);
    refreshAudioButtons();
  }

  PHRASES.forEach(function(p,i){
    var b = el("button","pz-tab",p.tab);
    b.type = "button";
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", function(){
      stopAudio(); sel = i;
      tabBtns.forEach(function(x,n){ x.setAttribute("aria-pressed", n === i ? "true" : "false"); });
      paint();
    });
    tabBtns.push(b); tabs.appendChild(b);
  });
  sec.appendChild(tabs);
  sec.appendChild(stage);
  paint();
  sec.appendChild(actionRow(null,"Go to the recording studio"));
  return sec;
}

/* ---- Parts 4–6 — recording studio, one per phrase ---- */
var STUDIO_NEXT = ["Next phrase","Last phrase","See my summary"];
function buildStudio(n){
  var p = PHRASES[n];
  var sec = newScreen("studio" + (n + 1), "Recording studio: " + (n + 1) + " of " + PHRASES.length);

  var top = el("div","pz-studio-top");
  var im = img(p.img, p.alt);
  if (im) top.appendChild(im); else top.appendChild(el("span"));
  var tt = el("div");
  tt.appendChild(el("p","pz-label","Say this phrase"));
  var ph = el("p","pz-studio-phrase"); ph.appendChild(cueNode(p.cue));
  tt.appendChild(ph);
  tt.appendChild(el("p","pz-label","Focus: " + FOCUS.toLowerCase() + "."));
  top.appendChild(tt);
  sec.appendChild(top);

  var hear = modelButton(p,"Hear the model");
  if (hear){ var hr = el("div","pz-btnrow"); hr.appendChild(hear); sec.appendChild(hr); }
  else sec.appendChild(noAudioNote());

  var rec = null, spk = null;
  if (recordingSupported()) { rec = buildRecordPanel(p); sec.appendChild(rec); }
  else {
    sec.appendChild(el("p","pz-note","Recording is not available here. Say the phrase aloud and press “I practised this aloud”."));
  }
  if (speakingEnabled()) { spk = buildSpeakPanel(p); sec.appendChild(spk); }

  var self = el("div","pz-self");
  var sb = el("button","pz-btn-quiet","I practised this aloud");
  sb.type = "button";
  var ss = el("p","pz-status"); ss.setAttribute("role","status"); ss.setAttribute("aria-live","polite");
  sb.addEventListener("click", function(){
    markPractised(p.id);
    ss.textContent = "Good. Keep the strong part clear.";
  });
  self.appendChild(sb); self.appendChild(ss);
  sec.appendChild(self);

  sec.appendChild(actionRow(function(){
      if (rec) { clearRecordings(rec); var o = part(rec,"rec-out"); if (o){ while (o.firstChild) o.removeChild(o.firstChild); } }
      if (spk) clearAttempt(spk);
      ss.textContent = "";
      announce("Starting this phrase again.");
    }, STUDIO_NEXT[n]));
  return sec;
}

function buildRecordPanel(p){
  var panel = el("div","pz-record");
  panel.id = "pz-rec-" + p.id;
  panel.pzPhrase = p; panel.pzTakes = []; panel.pzRecording = false;
  panel.appendChild(el("h2",null,"Record and compare"));
  panel.appendChild(el("p",null,"Record the phrase. Hear yourself. Hear the model. Record again if you want."));
  panel.appendChild(fr("Enregistrez la phrase. Écoutez-vous. Écoutez le modèle. Recommencez si vous voulez."));

  var row = el("div","pz-btnrow");
  var start = el("button","pz-btn-primary","Start recording");
  start.type = "button";
  start.setAttribute("data-role","rec-start");
  start.setAttribute("aria-pressed","false");
  start.setAttribute("aria-label","Recording: " + p.text);
  start.addEventListener("click", function(){ toggleRecording(panel); });
  row.appendChild(start);
  var model = modelButton(p,"Hear the model");
  if (model){ model.setAttribute("data-role","rec-model"); model.hidden = true; row.appendChild(model); }
  panel.appendChild(row);

  var out = el("div"); out.setAttribute("data-role","rec-out"); out.setAttribute("aria-live","polite");
  panel.appendChild(out);
  var takes = el("div","pz-takes"); takes.setAttribute("data-role","takes");
  panel.appendChild(takes);
  return panel;
}

function buildSpeakPanel(p){
  var panel = el("div","pz-speak");
  panel.id = "pz-speak-" + p.id;
  panel.pzPhrase = p;
  panel.appendChild(el("h2",null,"AI check"));
  panel.appendChild(el("p",null,"Say the phrase once. The computer shows your words and gives one tip. It reads your words. It does not judge your accent."));
  panel.appendChild(fr("Dites la phrase une fois. L'ordinateur affiche vos mots et donne un conseil. Il lit vos mots, il ne juge pas votre accent."));

  var row = el("div","pz-btnrow");
  var go = el("button","pz-btn-primary","AI check: say the phrase");
  go.type = "button"; go.setAttribute("data-role","speak");
  go.setAttribute("aria-label","AI check: say " + p.text);
  go.addEventListener("click", function(){ startRecognition(panel); });
  row.appendChild(go);
  panel.appendChild(row);

  var out = el("div"); out.setAttribute("data-role","out"); out.setAttribute("aria-live","polite");
  panel.appendChild(out);

  var after = el("div","pz-btnrow"); after.setAttribute("data-role","after"); after.hidden = true;
  var again = el("button","pz-btn-primary","Try once more");
  again.type = "button";
  again.addEventListener("click", function(){ clearAttempt(panel); startRecognition(panel); });
  after.appendChild(again);
  var listen = modelButton(p,"Listen again");
  if (listen) after.appendChild(listen);
  var del = el("button","pz-btn-quiet","Delete my words");
  del.type = "button";
  del.addEventListener("click", function(){ clearAttempt(panel); speakStatus(panel,"Your words are deleted."); });
  after.appendChild(del);
  panel.appendChild(after);
  return panel;
}

/* ---- Part 7 — practical close ---- */
function buildDone(){
  var sec = newScreen("done","Well done");
  var box = el("div","pz-complete");
  box.appendChild(el("p",null,"You practised word stress in symptom words. You can say:"));
  var ul = el("ul","pz-summary");
  PHRASES.forEach(function(p){
    var li = el("li"); li.appendChild(cueNode(p.cue)); ul.appendChild(li);
  });
  box.appendChild(ul);
  sec.appendChild(box);
  sec.appendChild(el("p",null,"Say these phrases again before you speak to a health professional."));
  sec.appendChild(fr("Redites ces phrases avant de parler à un professionnel de santé."));

  var row = el("div","pz-actions");
  var again = el("button","pz-btn-quiet","Try again");
  again.type = "button"; again.id = "pz-try-all";
  again.addEventListener("click", restartAll);
  row.appendChild(again);
  var done = el("button","pz-btn-done","Done");
  done.type = "button"; done.id = "pz-done-btn";
  done.addEventListener("click", finishActivity);
  row.appendChild(done);
  sec.appendChild(row);

  var hint = el("p","pz-status"); hint.id = "pz-done-hint";
  hint.setAttribute("role","status"); hint.setAttribute("aria-live","polite");
  sec.appendChild(hint);
  var st = el("p","pz-status"); st.id = "pz-done-status";
  st.setAttribute("role","status"); st.setAttribute("aria-live","polite");
  sec.appendChild(st);
  var nw = el("div","pz-btnrow"); nw.id = "pz-next-wrap"; nw.hidden = true;
  var nb = el("button","pz-btn-primary","Go to the next activity");
  nb.type = "button";
  nb.addEventListener("click", function(){ if (isSafeUrl(CONFIG.nextActivityUrl)) window.location.href = CONFIG.nextActivityUrl; });
  nw.appendChild(nb);
  sec.appendChild(nw);
  return sec;
}

/* ============================================================================
   NAVIGATION + COMPLETION
   ========================================================================= */
function showScreen(i){
  if (i < 0 || i >= screens.length) return;
  stopAll();
  clearAllRecordings();            /* a recording never outlives its screen */
  abortPendingFeedback(null);
  resetAllSpeakPanels();
  for (var k = 0; k < screens.length; k++){
    if (k === i) screens[k].removeAttribute("hidden"); else screens[k].hidden = true;
  }
  current = i;
  document.getElementById("pz-progress").textContent = "Part " + (i + 1) + " of " + PARTS;
  try { screens[i].focus({ preventScroll:true }); } catch(e){ try { screens[i].focus(); } catch(e2){} }
  try { window.scrollTo(0,0); } catch(e){}
}

function finishActivity(){
  var hint = document.getElementById("pz-done-hint");
  var st = document.getElementById("pz-done-status");
  if (!state.noticeTried || practisedCount() < 1){
    var need = !state.noticeTried
      ? "Almost there. Try the strong-part board first, then practise one phrase aloud."
      : "Almost there. Practise one phrase aloud first: record it, use the AI check, or press “I practised this aloud”.";
    if (hint) hint.textContent = need;
    return;
  }
  if (hint) hint.textContent = "";
  state.localComplete = true;
  if (st) st.textContent = "Step 3 is complete.";
  var d = document.getElementById("pz-done-btn"); if (d) d.disabled = true;
  if (isSafeUrl(CONFIG.nextActivityUrl)){ var w = document.getElementById("pz-next-wrap"); if (w) w.hidden = false; }
}

function buildAll(){
  var host = document.getElementById("pz-host");
  while (host.firstChild) host.removeChild(host.firstChild);
  screens = [];
  builders = [buildScene, buildBoard, buildStrip,
    function(){ return buildStudio(0); },
    function(){ return buildStudio(1); },
    function(){ return buildStudio(2); },
    buildDone];
  for (var i = 0; i < builders.length; i++){
    var s = builders[i]();
    host.appendChild(s); screens.push(s);
  }
}

/* Try again beside Done: starts the whole activity again. */
function restartAll(){
  stopAll(); clearAllRecordings(); abortPendingFeedback(null);
  state = freshState();
  buildAll();
  showScreen(0);
  announce("Starting the pronunciation clinic again.");
}

function init(){
  state = freshState();
  buildAll();
  window.addEventListener("pagehide", function(){ stopAll(); clearAllRecordings(); });
  window.addEventListener("beforeunload", function(){ stopAll(); clearAllRecordings(); });
  showScreen(0);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

/* Exposed for the verification harness only. Holds no learner data. */
window.__PZ__ = { CONFIG:CONFIG, PHRASES:PHRASES, AUDIO_FILES:AUDIO_FILES,
  sanitiseFeedback:sanitiseFeedback, isSafeEndpoint:isSafeEndpoint,
  showScreen:showScreen, restartAll:restartAll, finishActivity:finishActivity,
  state:function(){ return { current:current, noticeTried:state.noticeTried, practised:state.practised, localComplete:state.localComplete }; } };
})();
</script>
