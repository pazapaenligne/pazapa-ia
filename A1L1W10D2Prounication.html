<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronunciation Clinic — Comparing accommodation</title>
<style>
:root{
  --pz-blue:#36BBD6; --pz-blue-dark:#1B7E92; --pz-lime:#C9D646; --pz-yellow:#FCC104;
  --pz-red:#E6352B; --pz-grey:#EBEBEB; --pz-dark:#2E2E2D;
  --pz-blue-80:#5EC9DE; --pz-blue-60:#86D6E6; --pz-blue-40:#AFE4EF; --pz-blue-20:#D7F1F7;
  --pz-lime-80:#D4DE6B; --pz-lime-40:#E9EFB5; --pz-lime-20:#F4F7DA;
  --pz-yellow-80:#FDCD36; --pz-yellow-20:#FEF3CD;
  --pz-head-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --pz-body-font:"Open Sans",Arial,sans-serif;
  --pz-radius:10px; --pz-tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--pz-body-font);font-size:17px;line-height:1.6;color:var(--pz-dark);background:#FFF;-webkit-text-size-adjust:100%;}
.pz-shell{max-width:44rem;margin:0 auto;padding:16px 16px 48px;}
.pz-brand{border-bottom:4px solid var(--pz-blue);padding-bottom:12px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;}
.pz-brand-text{font-family:var(--pz-head-font);font-weight:700;font-size:1.05rem;}
.pz-crumb{font-size:.9rem;margin:2px 0 0;}
h1,h2,h3{font-family:var(--pz-head-font);line-height:1.25;}
h1{font-size:1.5rem;margin:0 0 6px;} h2{font-size:1.18rem;margin:0 0 8px;} h3{font-size:1rem;margin:0 0 6px;}
p{margin:0 0 12px;}
.pz-progress{font-size:.86rem;background:var(--pz-grey);border-radius:var(--pz-radius);padding:5px 12px;display:inline-block;margin-bottom:14px;}
.pz-screen{outline:none;}
[hidden]{display:none !important;}
.pz-gloss{display:none;font-size:.88rem;font-style:italic;margin:0 0 8px;}
body.fr .pz-gloss{display:block;}
.pz-word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px;}
.pz-word-card{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:12px;background:#FFF;display:flex;flex-direction:column;align-items:center;text-align:center;}
.pz-word-card img{width:100%;max-width:150px;height:auto;border-radius:var(--pz-radius);background:var(--pz-grey);margin-bottom:8px;}
.pz-word-text{font-family:var(--pz-head-font);font-size:1.3rem;margin:0 0 2px;}
.pz-strong{font-weight:800;color:var(--pz-blue-dark);font-size:1.12em;}
.pz-weak{font-weight:400;opacity:.8;}
.pz-dot{opacity:.5;padding:0 1px;}
.pz-word-note{font-size:.88rem;margin:0 0 8px;}
.pz-card{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:16px;margin:0 0 16px;background:#FFF;}
.pz-figure{margin:0 0 12px;text-align:center;}
.pz-figure img{max-width:100%;max-height:200px;width:auto;height:auto;border-radius:var(--pz-radius);background:var(--pz-grey);}
.pz-target-text{font-family:var(--pz-head-font);font-size:1.4rem;margin:0 0 6px;text-align:center;}
.pz-phrase-text{font-family:var(--pz-head-font);font-size:1.22rem;margin:0 0 6px;text-align:center;line-height:1.5;}
.pz-center{text-align:center;}
.pz-blocks{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:0 0 10px;}
.pz-block{border-radius:var(--pz-radius);padding:8px 14px;font-family:var(--pz-head-font);font-weight:700;}
.pz-block-strong{background:var(--pz-blue);color:var(--pz-dark);font-size:2rem;}
.pz-block-weak{background:var(--pz-grey);color:var(--pz-dark);font-size:1.1rem;font-weight:400;}
.pz-pending{font-size:.88rem;background:var(--pz-yellow-20);border-left:6px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:8px 12px;margin:0 0 12px;}
.pz-btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0;}
button{font-family:var(--pz-body-font);font-size:1rem;font-weight:600;min-height:var(--pz-tap);min-width:var(--pz-tap);padding:12px 18px;border-radius:var(--pz-radius);border:2px solid var(--pz-dark);background:#FFF;color:var(--pz-dark);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--pz-grey);}
button:focus-visible,input:focus-visible{outline:4px solid var(--pz-dark);outline-offset:3px;}
button[disabled]{opacity:.55;cursor:default;border-style:dashed;}
button[disabled]:hover{background:#FFF;}
.pz-btn-primary{background:var(--pz-blue);border-color:var(--pz-blue);}
.pz-btn-primary:hover{background:var(--pz-blue-80);}
.pz-btn-primary[disabled]:hover{background:var(--pz-blue);}
.pz-btn-help{background:var(--pz-yellow);border-color:var(--pz-yellow);}
.pz-btn-help:hover{background:var(--pz-yellow-80);}
.pz-btn-help[disabled]:hover{background:var(--pz-yellow);}
.pz-btn-done{background:var(--pz-lime);border-color:var(--pz-lime);}
.pz-btn-done:hover{background:var(--pz-lime-80);}
.pz-btn-done[disabled]:hover{background:var(--pz-lime);}
.pz-lang{min-height:var(--pz-tap);}
.pz-record{border:2px dashed var(--pz-lime-80);border-radius:var(--pz-radius);padding:14px;margin:14px 0 0;background:var(--pz-lime-20);}
.pz-rec-status,.pz-ai-status{margin:10px 0 0;font-size:.92rem;min-height:1.4em;}
.pz-fallback{margin-top:10px;}
.pz-ai{border:2px dashed var(--pz-blue-60);border-radius:var(--pz-radius);padding:14px;margin:14px 0 0;background:var(--pz-blue-20);}
.pz-ai-result{background:#FFF;border-radius:var(--pz-radius);padding:8px 12px;margin:10px 0 0;}
.pz-selfcheck{list-style:none;margin:0 0 6px;padding:0;}
.pz-selfcheck li{margin:0 0 8px;}
.pz-selfcheck label{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:var(--pz-tap);}
.pz-selfcheck input{width:24px;height:24px;}
.pz-choice-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;}
.pz-choice-btn{flex:1 1 220px;text-align:left;}
.pz-choice-btn[aria-pressed="true"]{background:var(--pz-blue-40);border-color:var(--pz-blue-dark);border-width:3px;}
.pz-complete-box{border:2px solid var(--pz-lime-80);border-left:8px solid var(--pz-lime);border-radius:var(--pz-radius);padding:18px;background:var(--pz-lime-20);margin:0 0 16px;}
.pz-done-status{margin:10px 0 0;min-height:1.4em;font-weight:600;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important;}}
</style>
</head>

<div class="pz-shell">

  <header class="pz-brand">
    <div>
      <div class="pz-brand-text">Pazapa English Programme for Adults</div>
      <p class="pz-crumb" data-i="crumb"></p>
    </div>
    <button type="button" id="pz-lang" class="pz-lang" aria-pressed="false"></button>
  </header>

  <div id="pz-announcer" class="sr-only" role="status" aria-live="polite"></div>

  <section id="scr-1" class="pz-screen" tabindex="-1">

    <h1 data-i="title"></h1>
    <h2 data-i="s1h"></h2>
    <p data-i="s1p"></p>
    <div id="pz-word-grid" class="pz-word-grid"></div>
    <div class="pz-btnrow"><button type="button" id="s1-continue" class="pz-btn-primary" data-i="cont"></button></div>
  </section>

  <section id="scr-2" class="pz-screen" tabindex="-1" hidden>
    <p class="pz-progress" data-i="progress" data-p="2"></p>
    <h2 data-i="s2h"></h2>
    <p data-i="s2p"></p>
    <div class="pz-blocks" aria-hidden="true">
      <span class="pz-block pz-block-strong" lang="en-GB">BIG</span><span class="pz-block pz-block-weak" lang="en-GB">ger</span>
    </div>
    <p class="pz-word-note pz-center" data-i="s2alt"></p>
    <h3 data-i="s2h3"></h3>

    <div id="pz-example-text" style="margin-top:10px;"></div>
    <div class="pz-btnrow"><button type="button" id="s2-continue" class="pz-btn-primary" data-i="cont"></button></div>
  </section>

  <section id="scr-3" class="pz-screen" tabindex="-1" hidden>
    <p class="pz-progress" data-i="progress" data-p="3"></p>
    <h2 data-i="s3h"></h2>
    <p id="pz-word-step-status" class="pz-progress" style="margin-left:0;"></p>
    <div id="pz-word-practice-host"></div>
    <div class="pz-btnrow"><button type="button" id="s3-next" class="pz-btn-primary"></button></div>
  </section>

  <section id="scr-4" class="pz-screen" tabindex="-1" hidden>
    <p class="pz-progress" data-i="progress" data-p="4"></p>
    <h2 data-i="s4h"></h2>
    <p id="pz-phrase-step-status" class="pz-progress" style="margin-left:0;"></p>
    <div id="pz-phrase-practice-host"></div>
    <div class="pz-btnrow"><button type="button" id="s4-next" class="pz-btn-primary"></button></div>
  </section>

  <section id="scr-5" class="pz-screen" tabindex="-1" hidden>
    <p class="pz-progress" data-i="progress" data-p="5"></p>
    <h2 data-i="s5h"></h2>
    <p data-i="s5p"></p>
    <div id="pz-retry-choice" class="pz-choice-row"></div>
    <div id="pz-retry-host"></div>
    <h3 data-i="howfelt"></h3>
    <p class="pz-word-note" data-i="notscore"></p>
    <ul class="pz-selfcheck">
      <li><label><input type="checkbox" id="sc-clear"> <span data-i="scclear"></span></label></li>
      <li><label><input type="checkbox" id="sc-stress"> <span data-i="scstress"></span></label></li>
      <li><label><input type="checkbox" id="sc-understand"> <span data-i="scund"></span></label></li>
    </ul>
    <div class="pz-btnrow"><button type="button" id="s5-continue" class="pz-btn-primary" data-i="cont"></button></div>
  </section>

  <section id="scr-6" class="pz-screen" tabindex="-1" hidden>
    <p class="pz-progress" data-i="progress" data-p="6"></p>
    <div class="pz-complete-box">
      <h2 data-i="s6h"></h2>
      <p data-i="s6p"></p>
    </div>
    <div class="pz-btnrow">
      <button type="button" id="s6-done" class="pz-btn-done" disabled data-i="done"></button>
      <button type="button" id="s6-tryagain" class="pz-btn-primary" data-i="tryagain"></button>
    </div>
    <p id="pz-done-status" class="pz-done-status" role="status" aria-live="polite"></p>
  </section>

</div>

/* ===== Record and compare ===== */
var panels = {};
var activeRecKey = null, mediaStream = null, mediaRecorder = null, recordedChunks = [];
var RECORD_MAX_MS = 12000;

function recordingSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function pickMimeType(){
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  var c = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  for (var i=0;i<c.length;i++){ if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}
function setStatus(key, msgKey){
  var p = panels[key]; if (!p) return;
  var st = p.root.querySelector(".pz-rec-status");
  if (msgKey) setI(st, msgKey); else { st.removeAttribute("data-i"); st.textContent = ""; }
}
function listenOk(p, on){
  if (p.listenBtn) p.listenBtn.disabled = !(on && p.listenBtn.dataset.avail === "1");
}
function setState(key, state){
  var p = panels[key]; if (!p) return;
  var q = function(r){ return p.root.querySelector('[data-role="'+r+'"]'); };
  var rec=q("record"), stop=q("stop"), hear=q("hear"), again=q("again"), fb=q("fallback");
  if (state === "idle"){
    rec.disabled=false; stop.disabled=true; hear.disabled=true; again.disabled=true; listenOk(p,true);
  } else if (state === "recording"){
    rec.disabled=true; stop.disabled=false; hear.disabled=true; again.disabled=true; listenOk(p,false);
  } else if (state === "ready"){
    rec.disabled=false; stop.disabled=true; hear.disabled=false; again.disabled=false; listenOk(p,true);
  } else if (state === "unavailable"){
    rec.disabled=true; stop.disabled=true; hear.disabled=true; again.disabled=true; listenOk(p,true);
    fb.hidden = false;
  }
  var ai = p.aiBtn; if (ai) refreshAi(key);
}
function releaseMic(){
  if (mediaStream){ mediaStream.getTracks().forEach(function(tr){ tr.stop(); }); mediaStream = null; }
}
function dropBlob(p){
  if (p.blobUrl){ URL.revokeObjectURL(p.blobUrl); p.blobUrl = null; }
  p.blob = null;
}
function startRecording(key){
  if (activeRecKey) return;
  var target = panels[key]; if (!target) return;
  if (!recordingSupported()){ setStatus(key,"stUnsup"); setState(key,"unavailable"); return; }
  stopAudio();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if (panels[key] !== target || activeRecKey){ stream.getTracks().forEach(function(tr){ tr.stop(); }); return; }
    mediaStream = stream;
    var mime = pickMimeType();
    try{ mediaRecorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){ releaseMic(); mediaRecorder = null; setStatus(key,"stFail"); setState(key,"idle"); return; }
    recordedChunks = [];
    activeRecKey = key;
    mediaRecorder.ondataavailable = function(e){ if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = function(){ finalise(key, target); };
    mediaRecorder.onerror = function(){ setStatus(key,"stFail"); };
    try{ mediaRecorder.start(); }
    catch(e){ releaseMic(); mediaRecorder=null; activeRecKey=null; setStatus(key,"stFail"); setState(key,"idle"); return; }
    setState(key,"recording");
    setStatus(key,"stRec");
    target.timeoutId = setTimeout(function(){ if (activeRecKey === key) stopRecording(key); }, RECORD_MAX_MS);
  }).catch(function(err){
    if (panels[key] !== target) return;
    var n = err && err.name;
    if (n === "NotAllowedError" || n === "SecurityError"){ setStatus(key,"stDenied"); setState(key,"unavailable"); }
    else if (n === "NotFoundError" || n === "OverconstrainedError"){ setStatus(key,"stNoMic"); setState(key,"unavailable"); }
    else { setStatus(key,"stFail"); setState(key,"idle"); }
  });
}
function stopRecording(key){
  if (activeRecKey !== key || !mediaRecorder) return;
  var p = panels[key];
  if (p && p.timeoutId){ clearTimeout(p.timeoutId); p.timeoutId = null; }
  var sb = p && p.root.querySelector('[data-role="stop"]'); if (sb) sb.disabled = true;
  try{ mediaRecorder.stop(); }catch(e){}
}
function finalise(key, target){
  releaseMic();
  var chunks = recordedChunks; recordedChunks = [];
  activeRecKey = null;
  var rec = mediaRecorder; mediaRecorder = null;
  var p = panels[key];
  if (!p || p !== target) return;
  var blob = null;
  try{ blob = new Blob(chunks,{type:(rec && rec.mimeType) ? rec.mimeType : "audio/webm"}); }catch(e){ blob = null; }
  if (!blob || blob.size === 0){ setStatus(key,"stEmpty"); setState(key,"idle"); return; }
  dropBlob(p);
  p.blob = blob;
  p.blobUrl = URL.createObjectURL(blob);
  setState(key,"ready");
  setStatus(key,"stSaved");
}
function recordAgain(key){
  var p = panels[key]; if (!p) return;
  dropBlob(p);
  setState(key,"idle");
  setStatus(key,"stReady");
}
function clearAllRecordings(){
  Object.keys(panels).forEach(function(k){
    var p = panels[k];
    if (p.timeoutId){ clearTimeout(p.timeoutId); p.timeoutId = null; }
    dropBlob(p);
  });
}
function stopActiveRecorder(){
  if (mediaRecorder && activeRecKey){
    var k = activeRecKey, p = panels[k];
    if (p && p.timeoutId){ clearTimeout(p.timeoutId); p.timeoutId = null; }
    try{ mediaRecorder.stop(); }catch(e){}
  }
  releaseMic();
  /* a recording interrupted by leaving the item is discarded */
  mediaRecorder = null; activeRecKey = null; recordedChunks = [];
  Object.keys(panels).forEach(function(k){
    var p = panels[k];
    var stop = p.root.querySelector('[data-role="stop"]');
    if (stop && !stop.disabled){
      var hasUnavail = !p.root.querySelector('[data-role="fallback"]').hidden;
      setState(k, hasUnavail ? "unavailable" : (p.blobUrl ? "ready" : "idle"));
      setStatus(k, p.blobUrl ? "stSaved" : "stReady");
    }
  });
}

function buildRecordPanel(key, listenBtn, phraseText){
  var wrap = document.createElement("div");
  wrap.className = "pz-record";
  wrap.innerHTML =
    '<div class="pz-btnrow">' +
      '<button type="button" data-role="record" data-i="record"></button>' +
      '<button type="button" data-role="stop" data-i="stop" disabled></button>' +
      '<button type="button" data-role="hear" data-i="hear" disabled></button>' +
      '<button type="button" data-role="again" data-i="again" disabled></button>' +
    '</div>' +
    '<p class="pz-rec-status" role="status" aria-live="polite"></p>' +
    '<div class="pz-fallback" data-role="fallback" hidden>' +
      '<p class="pz-word-note" data-i="fbHint"></p>' +
      '<button type="button" data-role="practised" data-i="practised"></button>' +
    '</div>';
  var p = {root:wrap, blobUrl:null, blob:null, timeoutId:null, listenBtn:listenBtn || null, aiBtn:null, phrase:phraseText || null};
  panels[key] = p;
  var q = function(r){ return wrap.querySelector('[data-role="'+r+'"]'); };
  q("record").addEventListener("click", function(){ startRecording(key); });
  q("stop").addEventListener("click", function(){ stopRecording(key); });

  q("again").addEventListener("click", function(){ recordAgain(key); });
  q("practised").addEventListener("click", function(){ setStatus(key,"stPract"); announce(t("stPract")); });
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-i]"), function(el){ el.textContent = t(el.getAttribute("data-i")); });
  if (!recordingSupported()){ setStatus(key,"stUnsup"); setState(key,"unavailable"); }
  else { setStatus(key,"stReady"); setState(key,"idle"); }
  return wrap;
}

function buildAiPanel(key){
  var p = panels[key];
  var wrap = document.createElement("div");
  wrap.className = "pz-ai";
  wrap.innerHTML =
    '<div class="pz-btnrow"><button type="button" class="pz-btn-help" data-role="ai" data-i="aiBtn" disabled></button></div>' +
    '<div class="pz-btnrow" data-role="confirm" hidden>' +
      '<button type="button" data-role="send" data-i="aiSend" class="pz-btn-primary"></button>' +
      '<button type="button" data-role="cancel" data-i="aiCancel"></button></div>' +
    '<p class="pz-ai-status" role="status" aria-live="polite"></p>' +
    '<div class="pz-ai-result" hidden></div>';
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-i]"), function(el){ el.textContent = t(el.getAttribute("data-i")); });
  var q = function(r){ return wrap.querySelector('[data-role="'+r+'"]'); };
  var st = wrap.querySelector(".pz-ai-status");
  p.aiBtn = q("ai"); p.aiWrap = wrap; p.aiBusy = false;
  q("ai").addEventListener("click", function(){
    if (p.aiBusy || !p.blob) return;
    q("confirm").hidden = false; setI(st,"aiConfirm");
  });
  q("cancel").addEventListener("click", function(){ q("confirm").hidden = true; refreshAi(key); });
  q("send").addEventListener("click", function(){ submitAi(key); });
  refreshAi(key);
  return wrap;
}
function refreshAi(key){
  var p = panels[key]; if (!p || !p.aiWrap) return;
  var st = p.aiWrap.querySelector(".pz-ai-status");
  var conf = p.aiWrap.querySelector('[data-role="confirm"]');
  if (!conf.hidden) return;
  if (!CONFIG.feedbackEndpoint){ p.aiBtn.disabled = true; setI(st,"aiOff"); return; }
  p.aiBtn.disabled = p.aiBusy || !p.blob;
  if (!p.blob) setI(st,"aiNeed"); else if (!p.aiBusy) { st.removeAttribute("data-i"); st.textContent = ""; }
}
function submitAi(key){
  var p = panels[key];
  if (!p || p.aiBusy || !p.blob || !CONFIG.feedbackEndpoint || !/^https:\/\//.test(CONFIG.feedbackEndpoint)) return;
  var st = p.aiWrap.querySelector(".pz-ai-status");
  var res = p.aiWrap.querySelector(".pz-ai-result");
  p.aiWrap.querySelector('[data-role="confirm"]').hidden = true;
  p.aiBusy = true; p.aiBtn.disabled = true; res.hidden = true; res.textContent = "";
  setI(st,"aiSending");
  var fd = new FormData();
  fd.append("expectedPhrase", p.phrase || "");
  fd.append("locale","en-GB");
  fd.append("activityId", CONFIG.activityId);
  fd.append("audio", p.blob, "recording.webm");
  var ctrl = new AbortController(), timedOut = false;
  var timer = setTimeout(function(){ timedOut = true; ctrl.abort(); }, CONFIG.requestTimeoutMs);
  fetch(CONFIG.feedbackEndpoint,{method:"POST", body:fd, signal:ctrl.signal, credentials:"omit"})
    .then(function(r){ if (!r.ok) throw new Error("http"); return r.text(); })
    .then(function(txt){
      if (txt.length > 4000) throw new Error("size");
      var o = JSON.parse(txt);
      if (!o || typeof o.strength !== "string" || typeof o.nextStep !== "string" ||
          o.strength.length > 400 || o.nextStep.length > 400) throw new Error("schema");
      res.textContent = "";
      var a = document.createElement("p"); a.textContent = t("aiStrength") + " " + o.strength;
      var b = document.createElement("p"); b.textContent = t("aiNext") + " " + o.nextStep;
      res.appendChild(a); res.appendChild(b); res.hidden = false;
      st.removeAttribute("data-i"); st.textContent = "";
    })
    .catch(function(){ setI(st, timedOut ? "aiTimeout" : "aiErr"); })
    .then(function(){ clearTimeout(timer); p.aiBusy = false; if (panels[key] === p) p.aiBtn.disabled = !p.blob; });
}

    updatePhraseStepStatus();
    phraseStepEls[phraseStepIndex].focus();
    announce(document.getElementById("pz-phrase-step-status").textContent);
  } else showScreen(4);
}

var retrySelectedId = null;
function buildScreen5(){
  var row = document.getElementById("pz-retry-choice");
  PHRASES.forEach(function(ph){
    var b = document.createElement("button"); b.type = "button"; b.className = "pz-choice-btn";
    b.textContent = ph.text; b.setAttribute("lang","en-GB"); b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){ selectRetry(ph.id, b); });
    row.appendChild(b);
  });
}
function selectRetry(id, btn){
  stopActiveRecorder(); stopAudio();
  retrySelectedId = id;
  Array.prototype.forEach.call(document.querySelectorAll("#pz-retry-choice .pz-choice-btn"), function(b){
    b.setAttribute("aria-pressed", b === btn ? "true" : "false");
  });
  var host = document.getElementById("pz-retry-host"); host.innerHTML = "";
  var ph = PHRASES.filter(function(x){ return x.id === id; })[0];
  var card = document.createElement("div"); card.className = "pz-card"; card.setAttribute("tabindex","-1");
  var tx = document.createElement("p"); tx.className = "pz-phrase-text"; tx.setAttribute("lang","en-GB");
  tx.innerHTML = phraseHtml(ph.parts); card.appendChild(tx);
  card.appendChild(gloss(ph.fr)).style.textAlign = "center";
  var row = document.createElement("div"); row.className = "pz-btnrow";
  var lb = makeListen(ph.audio, ph.text); row.appendChild(lb); card.appendChild(row);
  if (panels.retry){ if (panels.retry.timeoutId) clearTimeout(panels.retry.timeoutId); dropBlob(panels.retry); delete panels.retry; }
  card.appendChild(buildRecordPanel("retry", lb, ph.text));
  card.appendChild(buildAiPanel("retry"));
  host.appendChild(card);
  card.focus();
  announce(t("practising", ph.text));
}

/* ===== Completion: SCORM 1.2 / 2004 with localStorage fallback ===== */
var lmsPending = false, completionBusy = false;
function findApi(win, name){
  var n = 0;
  try{
    while (win && n < 10){
      try{ if (win[name]) return win[name]; }catch(e){}
      if (win === win.parent) break;
      win = win.parent; n++;
    }
  }catch(e){}
  return null;
}
function detectLms(){
  var wins = [window];
  try{ if (window.opener && !window.opener.closed) wins.push(window.opener); }catch(e){}
  for (var i=0;i<wins.length;i++){
    var a = findApi(wins[i],"API_1484_11"); if (a) return {v:2004, api:a};
    var b = findApi(wins[i],"API"); if (b) return {v:1.2, api:b};
  }
  return null;
}
function pushToLms(){
  var lms = detectLms(); if (!lms) return false;
  var api = lms.api, is04 = lms.v === 2004, ok = false;
  try{
    try{ is04 ? api.Initialize("") : api.LMSInitialize(""); }catch(e){}
    var field = is04 ? "cmi.completion_status" : "cmi.core.lesson_status";
    var cur = is04 ? api.GetValue(field) : api.LMSGetValue(field);
    if (cur === "completed" || cur === "passed"){ ok = true; }
    else {
      var r = is04 ? api.SetValue(field,"completed") : api.LMSSetValue(field,"completed");
      var c = is04 ? api.Commit("") : api.LMSCommit("");
      ok = (String(r) !== "false") && (String(c) !== "false");
    }
  }catch(e){ ok = false; }
  return ok;
}
function activityCompleted(){
  if (completionBusy) return "busy";
  completionBusy = true;
  var result;
  try{
    if (pushToLms()){ lmsPending = false; result = "lms"; }
    else {
      lmsPending = true;
      try{ localStorage.setItem(STORE_KEY+"-done","1"); }catch(e){}
      result = "local";
    }
    completionSent = true;
    try{ console.log("W10D2 Pronunciation Clinic completed"); }catch(e){}
    saveProgress();
  } finally { completionBusy = false; }
  return result;
}
function onDone(){
  var st = document.getElementById("pz-done-status");
  if (current !== 5) return;
  if (completionSent){ setI(st,"doneAgain"); return; }
  var r = activityCompleted();
  setI(st, r === "lms" ? "doneOk" : "doneSaved");
  announce(st.textContent);
}
/* re-detect an LMS after later interaction if completion was only stored locally */
document.addEventListener("click", function(){
  if (lmsPending && completionSent && !completionBusy){ if (pushToLms()) lmsPending = false; }
}, true);

/* ===== Reset ===== */
function clearContent(){
  ["pz-word-grid","pz-example-list","pz-example-text","pz-word-practice-host","pz-phrase-practice-host","pz-retry-choice","pz-retry-host"]
    .forEach(function(id){ document.getElementById(id).innerHTML = ""; });
}
function buildAll(){ buildScreen1(); buildScreen2(); buildScreen3(); buildScreen4(); buildScreen5(); applyLang(); }
function resetActivity(){
  stopActiveRecorder(); stopAudio(); clearAllRecordings(); panels = {};
  clearContent();
  wordStepIndex = 0; wordStepEls = []; phraseStepIndex = 0; phraseStepEls = []; retrySelectedId = null;
  ["sc-clear","sc-stress","sc-understand"].forEach(function(id){ document.getElementById(id).checked = false; });
  var st = document.getElementById("pz-done-status"); st.removeAttribute("data-i"); st.textContent = "";
  buildAll();
  doneBtn.disabled = true;
  showScreen(0);
}

/* ===== Start-up ===== */
function init(){
  buildAll();
  document.getElementById("pz-lang").addEventListener("click", function(){ lang = lang ? 0 : 1; applyLang(); });
  document.getElementById("s1-continue").addEventListener("click", function(){ showScreen(1); });
  document.getElementById("s2-continue").addEventListener("click", function(){ showScreen(2); });
  document.getElementById("s3-next").addEventListener("click", goWordNext);
  document.getElementById("s4-next").addEventListener("click", goPhraseNext);
  document.getElementById("s5-continue").addEventListener("click", function(){ showScreen(5); });
  doneBtn.addEventListener("click", onDone);
  document.getElementById("s6-tryagain").addEventListener("click", resetActivity);
  window.addEventListener("pagehide", function(){ stopActiveRecorder(); clearAllRecordings(); stopAudio(); });
  var saved = loadProgress();
  current = 0;
  if (saved && saved.screen > 0){ screens[0].setAttribute("hidden",""); showScreen(saved.screen, true); }
  else showScreen(0, true);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

window.__PZ__ = {CONFIG:CONFIG, showScreen:showScreen, resetActivity:resetActivity,
  state:function(){ return {current:current, doneDisabled:doneBtn.disabled, completionSent:completionSent, lang:lang}; }};
})();
