<style>
:root{
  --pz-blue:#36BBD6; --pz-lime:#C9D646; --pz-yellow:#FCC104; --pz-red:#E6352B;
  --pz-grey:#EBEBEB; --pz-dark:#2E2E2D;
  --pz-blue-80:#5EC9DE; --pz-blue-60:#86D6E6; --pz-blue-40:#AFE4EF; --pz-blue-20:#D7F1F7;
  --pz-lime-80:#D4DE6B; --pz-lime-60:#DFE690; --pz-lime-40:#E9EFB5; --pz-lime-20:#F4F7DA;
  --pz-yellow-80:#FDCD36; --pz-yellow-60:#FDDA68; --pz-yellow-40:#FEE69B; --pz-yellow-20:#FEF3CD;
  --pz-head-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --pz-body-font:"Open Sans",Arial,sans-serif;
  --pz-radius:12px; --pz-tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--pz-body-font);font-size:17px;line-height:1.6;color:var(--pz-dark);background:#fff;-webkit-text-size-adjust:100%;}
[hidden]{display:none !important;}
.pz-shell{max-width:46rem;margin:0 auto;padding:16px 16px 44px;}

.pz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--pz-blue);padding-bottom:10px;margin-bottom:14px;}
.pz-brand{font-family:var(--pz-head-font);font-weight:700;font-size:1.05rem;margin:0;}
.pz-crumb{font-size:.88rem;margin:0;opacity:.85;}
.pz-progress{display:flex;gap:6px;margin:0 0 16px;padding:0;list-style:none;}
.pz-progress li{flex:1;height:8px;border-radius:4px;background:var(--pz-grey);}
.pz-progress li.on{background:var(--pz-blue);}
.pz-progress li.now{background:var(--pz-dark);}
.pz-steptext{font-size:.88rem;margin:0 0 8px;}

h1,h2,h3{font-family:var(--pz-head-font);color:var(--pz-dark);line-height:1.25;}
h1{font-size:1.6rem;margin:0 0 6px;}
h2{font-size:1.2rem;margin:0 0 8px;}
h3{font-size:1.02rem;margin:0 0 6px;}
p{margin:0 0 12px;}
.pz-fr{font-size:.9rem;font-style:italic;opacity:.9;margin:0 0 12px;}
.pz-label{font-size:.88rem;opacity:.85;margin:0 0 8px;}
.pz-screen{outline:none;}
.pz-accent{width:56px;height:5px;border-radius:3px;background:var(--pz-red);margin:0 0 12px;}

.pz-focus{display:inline-block;background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:999px;padding:4px 14px;font-size:.92rem;font-weight:600;margin:0 0 14px;}

/* ---------- buttons ---------- */
button{font-family:var(--pz-body-font);font-size:1rem;font-weight:600;min-height:var(--pz-tap);min-width:var(--pz-tap);padding:10px 18px;border-radius:var(--pz-radius);border:2px solid var(--pz-dark);background:#fff;color:var(--pz-dark);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:var(--pz-grey);}
button:focus-visible,input:focus-visible{outline:4px solid var(--pz-dark);outline-offset:3px;}
button[disabled]{opacity:.5;cursor:default;}
button[disabled]:hover{background:#fff;}
.pz-btn-primary{background:var(--pz-blue);border-color:var(--pz-blue);}
.pz-btn-primary:hover{background:var(--pz-blue-80);}
.pz-btn-help{background:var(--pz-yellow);border-color:var(--pz-yellow);}
.pz-btn-help:hover{background:var(--pz-yellow-80);}
.pz-btn-done{background:var(--pz-lime);border-color:var(--pz-lime);}
.pz-btn-done:hover{background:var(--pz-lime-80);}
.pz-btn-quiet{font-weight:400;}
.pz-btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0;}

/* ---------- composition 1: ride-app conversation ---------- */
.pz-phone{border:3px solid var(--pz-dark);border-radius:28px;padding:16px 14px;background:var(--pz-blue-20);margin:0 0 18px;}
.pz-phone-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
.pz-phone-head img{width:64px;height:64px;object-fit:contain;border-radius:var(--pz-radius);background:#fff;}
.pz-phone-head p{margin:0;font-weight:600;}
.pz-bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:10px 14px;margin:0 0 10px;max-width:92%;border:1px solid var(--pz-blue-60);display:flex;gap:10px;align-items:center;}
.pz-bubble img{width:52px;height:52px;object-fit:contain;flex:none;border-radius:8px;background:var(--pz-grey);}
.pz-bubble span{font-family:var(--pz-head-font);font-size:1.08rem;}
.pz-bubble.me{margin-left:auto;background:var(--pz-lime-20);border-color:var(--pz-lime-60);border-radius:16px 16px 4px 16px;}

/* ---------- composition 2: route map ---------- */
.pz-map{border:2px solid var(--pz-blue-40);border-radius:var(--pz-radius);padding:10px;margin:0 0 16px;background:#fff;}
.pz-map svg{width:100%;height:auto;display:block;}
.pz-q{border:2px solid var(--pz-grey);border-radius:var(--pz-radius);padding:14px;margin:0 0 14px;background:#fff;}
.pz-q.ok{border-color:var(--pz-lime);background:var(--pz-lime-20);}
.pz-q-prompt{font-family:var(--pz-head-font);font-size:1.12rem;margin:0 0 10px;}
.pz-opts{display:flex;flex-wrap:wrap;gap:10px;}
.pz-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;min-width:92px;position:relative;}
.pz-opt img{width:86px;height:86px;object-fit:contain;border-radius:8px;background:var(--pz-grey);}
.pz-opt.word{min-width:84px;font-size:1.08rem;}
.pz-dot{display:none;width:14px;height:14px;border-radius:50%;position:absolute;top:6px;right:6px;border:2px solid var(--pz-dark);}
.pz-opt.good{border-color:var(--pz-lime);background:var(--pz-lime-20);}
.pz-opt.good .pz-dot{display:block;background:var(--pz-lime);}
.pz-opt.bad{border-color:var(--pz-yellow);background:var(--pz-yellow-20);}
.pz-opt.bad .pz-dot{display:block;background:var(--pz-yellow);}
.pz-q-fb{margin:10px 0 0;font-size:.98rem;}
.pz-note{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:10px 12px;margin:12px 0 0;font-weight:600;}

/* ---------- composition 3: rhythm strip ---------- */
.pz-strip{background:var(--pz-dark);color:#fff;border-radius:var(--pz-radius);padding:16px 14px 14px;margin:0 0 18px;}
.pz-strip h2{color:#fff;}
.pz-strip .pz-label{color:#fff;opacity:.92;}
.pz-beats{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;margin:6px 0 8px;padding:0;list-style:none;}
.pz-beats li{display:flex;flex-direction:column;align-items:center;}
.pz-beats .m{display:block;height:18px;line-height:18px;font-size:1rem;}
.pz-beats .w{font-family:var(--pz-head-font);font-size:1.3rem;padding:2px 8px;border-radius:8px;}
.pz-beats li.beat .w{background:var(--pz-yellow);color:var(--pz-dark);font-weight:700;font-size:1.55rem;border-bottom:4px solid var(--pz-yellow-80);}
.pz-beats li.beat .m{color:var(--pz-yellow);font-size:1.3rem;}
.pz-beats li.weak .m{opacity:.55;}
.pz-beat-text{font-size:.92rem;margin:0 0 8px;}
.pz-strip .pz-rec{background:#fff;color:var(--pz-dark);}
.pz-card{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:14px;margin:0 0 16px;background:#fff;}
.pz-model{font-family:var(--pz-head-font);font-size:1.4rem;line-height:1.35;margin:0 0 6px;}
.pz-thumb{width:72px;height:72px;object-fit:contain;border-radius:var(--pz-radius);background:var(--pz-grey);float:right;margin:0 0 6px 10px;}

/* ---------- recorder widget ---------- */
.pz-rec{border:2px dashed var(--pz-lime-80);border-radius:var(--pz-radius);background:var(--pz-lime-20);padding:12px;margin:12px 0 0;color:var(--pz-dark);}
.pz-rec-title{font-weight:600;margin:0 0 8px;font-size:1rem;}
.pz-rec-timer{font-variant-numeric:tabular-nums;font-weight:600;align-self:center;min-width:3.2em;}
.pz-rec-status{font-size:.95rem;margin:8px 0 0;min-height:1.4em;}
.pz-rec-on{border-color:var(--pz-yellow);}
.pz-rec-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pz-yellow);border:2px solid var(--pz-dark);margin-right:6px;vertical-align:middle;}

.pz-speak{border:2px dashed var(--pz-blue-60);border-radius:var(--pz-radius);background:var(--pz-blue-20);padding:12px;margin:14px 0 0;}
.pz-heard{background:#fff;border:1px solid var(--pz-dark);border-radius:var(--pz-radius);padding:10px 12px;margin:12px 0 0;}
.pz-heard p{margin:0;}
.pz-fb{border-radius:var(--pz-radius);padding:12px 14px;margin:12px 0 0;border:2px solid var(--pz-dark);background:#fff;}
.pz-fb-match{background:var(--pz-lime-20);border-color:var(--pz-lime);}
.pz-fb-try{background:var(--pz-yellow-20);border-color:var(--pz-yellow);}
.pz-fb-state{font-family:var(--pz-head-font);font-weight:700;margin:0 0 4px;}
.pz-status{font-size:.95rem;margin:10px 0 0;}

.pz-take-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:640px){.pz-take-grid{grid-template-columns:1fr 1fr;}}

.pz-nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding-top:16px;border-top:2px solid var(--pz-grey);}
.pz-complete{background:var(--pz-lime-20);border:2px solid var(--pz-lime);border-radius:var(--pz-radius);padding:16px;margin:0 0 16px;}
.pz-check{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;}
.pz-check input{width:26px;height:26px;margin-top:2px;flex:none;}
.pz-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
noscript p{background:var(--pz-yellow-20);border:2px solid var(--pz-yellow);border-radius:var(--pz-radius);padding:14px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
@media (max-width:480px){
  body{font-size:16px;}
  .pz-btnrow button,.pz-nav button{flex:1 1 100%;}
  .pz-opt{min-width:calc(50% - 6px);flex:1 1 calc(50% - 6px);}
  .pz-bubble{max-width:100%;}
}
</style>
</head>

/* ============================================================================
   HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function fr(text){ var p = el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function announce(msg){ var l=document.getElementById("pz-live"); if(l) l.textContent=String(msg||""); }
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function mmss(ms){ var s=Math.floor(ms/1000); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
function isEmbeddedImage(v){ return typeof v==="string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function isSafeEndpoint(v){
  if (typeof v!=="string" || v==="" || v!==v.trim()) return false;
  var u; try{ u=new URL(v);}catch(e){return false;}
  if (u.protocol!=="https:") return false;
  if (/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(u.hostname)) return false;
  if (u.search||u.hash||u.username||u.password) return false;
  return true;
}
function isValidAudio(key){
  if (audioPendingConfirmation.indexOf(key)!==-1) return false;
  var v = AUDIO_FILES[key];
  return typeof v==="string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+\/=]+$/.test(v);
}
function img(key, alt, cls){
  var i = document.createElement("img");
  if (cls) i.className = cls;
  if (isEmbeddedImage(IMAGES[key])) i.src = IMAGES[key];
  i.alt = alt || "";
  i.setAttribute("decoding","async");
  return i;
}

/* ============================================================================
   AUDIO — one element, one sound at a time, started only by a click or tap
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null, audioToken = 0, audioQueue = [];

function stopAudio(){
  audioToken++; audioQueue = [];
  try{ audioEl.pause(); }catch(e){}
  try{ if (audioEl.readyState>0) audioEl.currentTime = 0; }catch(e){}
  audioBusyKey = null; refreshPlayButtons();
}
function playAudio(key){ if (isValidAudio(key)) playSource(AUDIO_FILES[key], key); }
function playSource(src, busyKey, rest){
  if (!src) return;
  if (audioBusyKey === busyKey){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecording();
  var token = ++audioToken;
  audioBusyKey = busyKey; audioQueue = rest ? rest.slice() : [];
  refreshPlayButtons();
  try{
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try{ if (audioEl.readyState>0) audioEl.currentTime = 0; }catch(e2){} }
    var p = audioEl.play();
    if (p && p.catch) p.catch(function(){
      if (token!==audioToken) return;
      audioBusyKey = null; audioQueue = []; refreshPlayButtons();
      announce("The audio did not play. Read the phrase and say it aloud.");
    });
  }catch(e){ if (token===audioToken){ audioBusyKey=null; audioQueue=[]; refreshPlayButtons(); } }
}
audioEl.addEventListener("ended", function(){
  if (audioQueue.length){
    var nxt = audioQueue.shift(), token = audioToken;
    try{ audioEl.src = nxt; var p = audioEl.play(); if (p&&p.catch) p.catch(function(){ if(token===audioToken){audioBusyKey=null;audioQueue=[];refreshPlayButtons();} }); }
    catch(e){ audioBusyKey=null; audioQueue=[]; refreshPlayButtons(); }
    return;
  }
  audioBusyKey = null; refreshPlayButtons();
});
audioEl.addEventListener("error", function(){
  if (!audioEl.getAttribute("src")) return;
  audioBusyKey = null; audioQueue = []; refreshPlayButtons();
});
function refreshPlayButtons(){
  var bs = document.querySelectorAll("[data-play-key]");
  for (var i=0;i<bs.length;i++){
    var b = bs[i], playing = (b.getAttribute("data-play-key")===audioBusyKey);
    b.setAttribute("aria-pressed", playing?"true":"false");
    b.textContent = playing ? b.getAttribute("data-stop") : b.getAttribute("data-play");
  }
}
/* Model listen button, or null when no real recording exists. */
function listenButton(phrase, label){
  if (!isValidAudio(phrase.id)) return null;
  var b = el("button","pz-btn-help",label||"Listen");
  b.type = "button";
  b.setAttribute("data-play-key", phrase.id);
  b.setAttribute("data-play", label||"Listen"); b.setAttribute("data-stop","Stop");
  b.setAttribute("aria-pressed","false");
  b.setAttribute("aria-label",(label||"Listen")+": "+phrase.text);
  b.addEventListener("click", function(){ playAudio(phrase.id); });
  return b;
}
function audioNote(){
  return el("p","pz-label","Model audio is not available yet. Read the phrase and say it aloud.");
}

/* ============================================================================
   RECORDING — many independent recorders, one active at a time
   ========================================================================= */
var REC_MAX_MS = 20000;
var REC_PERMISSION_TIMEOUT_MS = 10000;
var recGen = 0, activeRec = null, recStream = null, recorderObj = null;
var pendingRec = null, pendingTimer = null;
var recs = {};            /* key -> recorder state */

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
    typeof navigator.mediaDevices.getUserMedia==="function" && typeof window.MediaRecorder!=="undefined");
}
function recMime(){
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i=0;i<c.length;i++){ try{ if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
function releaseStream(s){ if(!s) return; try{ s.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); }catch(e){} }
function stopActiveRecorder(){ if(!recorderObj) return; try{ if(recorderObj.state!=="inactive") recorderObj.stop(); }catch(e){} }
function anyRecording(){ for (var k in recs){ if (recs[k].url) return true; } return false; }
function recordedCount(){ var n=0; for (var k in recs){ if (recs[k].url) n++; } return n; }

function cancelPendingRecording(){
  if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
  if (pendingRec){ recGen++; setRecUi(pendingRec,"idle"); pendingRec=null; }
}

/* UI states: idle | waiting | recording | ready */
function setRecUi(r, state){
  var hasUrl = !!r.url;
  r.recording = (state==="recording"||state==="waiting");
  r.btnRec.textContent = r.recording ? "Stop" : (hasUrl ? "Record again" : "Record");
  r.btnRec.setAttribute("aria-pressed", r.recording?"true":"false");
  r.root.classList.toggle("pz-rec-on", r.recording);
  r.btnPlay.hidden = !hasUrl; r.btnDel.hidden = !hasUrl;
  if (!r.recording) r.timer.textContent = hasUrl ? mmss(r.lastMs||0) : "0:00";
}
function setRecStatus(r, text, withDot){
  r.status.textContent = "";
  if (withDot){ var d = el("span","pz-rec-dot"); d.setAttribute("aria-hidden","true"); r.status.appendChild(d); }
  r.status.appendChild(document.createTextNode(text));
}
function clearRecording(r){
  if (audioBusyKey === "rec:"+r.key) stopAudio();
  if (r.url){ try{ URL.revokeObjectURL(r.url); }catch(e){} r.url = null; }
  r.lastMs = 0; setRecUi(r,"idle"); refreshPlayButtons();
  if (r.onChange) r.onChange();
}
function clearAllRecordings(){ for (var k in recs){ clearRecording(recs[k]); setRecStatus(recs[k],""); } }

function startRecording(r){
  if (!recordingSupported()) return;
  cancelPendingRecording();
  var gen = ++recGen;
  stopAudio(); stopRecognition(); stopActiveRecorder();
  if (r.url){ try{ URL.revokeObjectURL(r.url); }catch(e){} r.url=null; if (audioBusyKey==="rec:"+r.key) stopAudio(); }
  setRecUi(r,"waiting"); setRecStatus(r,"Recording. Say the phrase.", true);
  pendingRec = r;
  pendingTimer = setTimeout(function(){
    if (gen!==recGen) return;
    cancelPendingRecording();
    setRecStatus(r,"The microphone did not answer. You can try again or carry on.");
    r.attempted = true; if (r.onChange) r.onChange();
  }, REC_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
    if (pendingRec===r) pendingRec=null;
    if (gen!==recGen){ releaseStream(stream); return; }
    var chunks=[], mr, cap=null, tick=null, t0=Date.now();
    try{ var mt=recMime(); mr = mt ? new MediaRecorder(stream,{mimeType:mt}) : new MediaRecorder(stream); }
    catch(e){ releaseStream(stream); setRecUi(r,"idle"); r.attempted=true;
      setRecStatus(r,"Recording does not work in this browser. Say the phrase aloud."); if(r.onChange) r.onChange(); return; }
    recorderObj = mr; recStream = stream; activeRec = r;
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size>0) chunks.push(ev.data); };
    function endAll(){ if(cap) clearTimeout(cap); if(tick) clearInterval(tick); releaseStream(stream);
      if (recorderObj===mr) recorderObj=null; if (recStream===stream) recStream=null; if (activeRec===r) activeRec=null; }
    mr.onerror = function(){ endAll(); if (gen!==recGen) return; setRecUi(r,"idle"); r.attempted=true;
      setRecStatus(r,"The recording did not work. You can try again or carry on."); if(r.onChange) r.onChange(); };
    mr.onstop = function(){
      endAll();
      if (gen!==recGen) return;
      r.attempted = true; r.lastMs = Date.now()-t0;
      if (!chunks.length){ setRecUi(r,"idle"); setRecStatus(r,"I did not catch that. You can try again."); if(r.onChange) r.onChange(); return; }
      var blob;
      try{ blob = new Blob(chunks,{type:chunks[0].type||"audio/mp4"}); }
      catch(e){ setRecUi(r,"idle"); setRecStatus(r,"The recording did not work. You can try again."); if(r.onChange) r.onChange(); return; }
      if (blob.size < 200){ setRecUi(r,"idle"); setRecStatus(r,"The recording is empty. You can try again."); if(r.onChange) r.onChange(); return; }
      r.url = URL.createObjectURL(blob);
      setRecUi(r,"ready"); setRecStatus(r,"Your recording is ready. Press Play my voice.");
      refreshPlayButtons(); if (r.onChange) r.onChange();
    };
    try{ mr.start(); }catch(e){ endAll(); setRecUi(r,"idle"); r.attempted=true;
      setRecStatus(r,"Recording does not work in this browser. Say the phrase aloud."); if(r.onChange) r.onChange(); return; }
    setRecUi(r,"recording");
    tick = setInterval(function(){ r.timer.textContent = mmss(Date.now()-t0); }, 250);
    cap = setTimeout(function(){ try{ if (mr.state==="recording") mr.stop(); }catch(e){} }, REC_MAX_MS);
  }).catch(function(){
    if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; }
    if (pendingRec===r) pendingRec=null;
    if (gen!==recGen) return;
    setRecUi(r,"idle"); r.attempted = true;
    setRecStatus(r,"The microphone is off. You can say the phrase aloud and carry on.");
    if (r.onChange) r.onChange();
  });
}
function toggleRecording(r){
  if (pendingRec===r){ cancelPendingRecording(); setRecStatus(r,"Stopped. You can try again."); r.attempted=true; if(r.onChange) r.onChange(); }
  else if (r.recording){ stopActiveRecorder(); }
  else startRecording(r);
}

/* ============================================================================
   SPEECH RECOGNITION + AI FEEDBACK (text only — never audio)
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognisingPanel = null, recognitionTimer = null;
function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer=null; }
  if (recognisingPanel){ setSpeakBusy(recognisingPanel,false); recognisingPanel=null; }
  if (!recognition) return;
  try{ recognition.onresult=null; recognition.onerror=null; recognition.onend=null; }catch(e){}
  try{ recognition.abort(); }catch(e){}
  recognition = null;
}
function setSpeakBusy(panel, busy){
  if (!panel.btn) return;
  panel.btn.disabled = !!busy;
  panel.btn.textContent = busy ? "Listening…" : "Get AI feedback";
}
function speakStatus(panel, text){ panel.status.textContent = text; }
function clearFeedback(panel){
  panel.seq++; if (panel.ctrl){ try{panel.ctrl.abort();}catch(e){} panel.ctrl=null; }
  while (panel.out.firstChild) panel.out.removeChild(panel.out.firstChild);
  panel.status.textContent = "";
}
function startRecognition(panel, phrase){
  if (!speakingEnabled()) return;
  stopAudio(); stopActiveRecorder(); cancelPendingRecording(); stopRecognition(); clearFeedback(panel);
  var r; try{ r = new SR(); }catch(e){ showFallback(panel); return; }
  r.lang="en-GB"; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
  var got="", settled=false;
  r.onresult = function(ev){ if (recognition!==r) return;
    try{ if (ev.results&&ev.results[0]&&ev.results[0][0]) got = String(ev.results[0][0].transcript||""); }catch(e){ got=""; } };
  r.onerror = function(ev){
    if (recognition!==r || settled) return; settled=true;
    var code = (ev&&ev.error)?String(ev.error):"";
    stopRecognition();
    if (code==="not-allowed"||code==="service-not-allowed") speakStatus(panel,"The microphone is off. You can carry on.");
    else if (code==="no-speech"||code==="aborted") showResult(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again.",focus:""},"");
    else showFallback(panel);
  };
  r.onend = function(){
    if (recognition!==r || settled) return; settled=true;
    stopRecognition();
    var clean = got.replace(/\s+/g," ").trim();
    if (!clean){ showResult(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again.",focus:""},""); return; }
    if (clean.length>200) clean = clean.slice(0,200);
    requestFeedback(panel, phrase, clean);
  };
  recognition = r; recognisingPanel = panel; setSpeakBusy(panel,true);
  speakStatus(panel,"Listening. Say the phrase once.");
  recognitionTimer = setTimeout(function(){
    if (recognition!==r || settled) return; settled=true; stopRecognition();
    speakStatus(panel,"Feedback did not respond in this browser. You can try again or carry on.");
  }, 12000);
  try{ r.start(); }catch(e){ settled=true; stopRecognition(); showFallback(panel); }
}
function showHeard(panel, text){
  var box = el("div","pz-heard"); box.appendChild(el("p","pz-label","Your words:"));
  box.appendChild(el("p",null,text)); panel.out.insertBefore(box, panel.out.firstChild);
}
function requestFeedback(panel, phrase, heard){
  var seq = panel.seq;
  showHeard(panel, heard); speakStatus(panel,"Comparing your words with the model.");
  var ctrl = (typeof AbortController==="function") ? new AbortController() : null;
  panel.ctrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try{ctrl.abort();}catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ targetPhrase: phrase.text, recognisedText: heard }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if(!res.ok) throw new Error("bad"); return res.json(); })
    .then(function(data){
      clearTimeout(timer); if (panel.seq!==seq) return; panel.ctrl=null;
      var safe = sanitiseFeedback(data, phrase);
      if (!safe){ showFallback(panel); return; }
      showResult(panel, safe, "");
    })
    .catch(function(){ clearTimeout(timer); if (panel.seq!==seq) return; panel.ctrl=null; showFallback(panel); });
}
function sanitiseFeedback(data, phrase){
  if (!data || typeof data!=="object") return null;
  var s = data.status;
  if (s!=="match" && s!=="try_again" && s!=="unclear") return null;
  var m = (typeof data.message==="string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (!m || m.length>160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  var f = (typeof data.focus==="string") ? data.focus.replace(/\s+/g," ").trim() : "";
  if (f.length>60 || !focusApproved(f, phrase)) f = "";
  return { status:s, message:m, focus:f };
}
function focusApproved(f, phrase){
  var norm = function(x){ return String(x).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  f = norm(f); if (!f) return true;
  return (" "+norm(phrase.text)+" ").indexOf(" "+f+" ")!==-1;
}
function showResult(panel, fb, heard){
  panel.attempted = true;
  if (heard) showHeard(panel, heard);
  var old = panel.out.querySelector(".pz-fb"); if (old) panel.out.removeChild(old);
  panel.status.textContent = "";
  var word, cls;
  if (fb.status==="match"){ word="Your words matched"; cls="pz-fb pz-fb-match"; }
  else if (fb.status==="try_again"){ word="Try once more"; cls="pz-fb pz-fb-try"; }
  else { word="Not compared"; cls="pz-fb"; }
  var box = el("div",cls); box.appendChild(el("p","pz-fb-state",word)); box.appendChild(el("p",null,fb.message));
  if (fb.focus){ var p = el("p",null,"Practise this part: "); p.appendChild(el("b",null,fb.focus)); box.appendChild(p); }
  panel.out.appendChild(box);
}
function showFallback(panel){
  panel.attempted = true;
  var old = panel.out.querySelector(".pz-fb"); if (old) panel.out.removeChild(old);
  panel.status.textContent = "";
  var box = el("div","pz-fb"); box.appendChild(el("p","pz-fb-state","Feedback not available"));
  box.appendChild(el("p",null,FALLBACK_MSG)); panel.out.appendChild(box);
}
function makeSpeakPanel(phrase){
  var panel = { seq:0, ctrl:null, attempted:false };

}
function buildS4(){
  var p = PHRASES[TARGET];
  var s = screenShell(4,"Recording studio");
  s.appendChild(el("p",null,"Record your phrase two times. Listen to each take. Compare them."));
  s.appendChild(fr("Enregistrez la phrase deux fois. Écoutez chaque essai. Comparez-les."));
  var card = el("div","pz-card");
  card.appendChild(img(p.img,p.alt,"pz-thumb"));
  card.appendChild(el("p","pz-label","Your phrase"));
  card.appendChild(el("p","pz-model",p.text));
  card.appendChild(beatStrip(p).cloneNode(true));
  var lb = listenButton(p,"Listen to the model");
  if (lb){ var mr = el("div","pz-btnrow"); mr.appendChild(lb); card.appendChild(mr); } else card.appendChild(audioNote());
  s.appendChild(card);

  var grid = el("div","pz-take-grid");
  var t1 = makeRecorder("take1","Take 1",p.text), t2 = makeRecorder("take2","Take 2",p.text);
  grid.appendChild(t1.root); grid.appendChild(t2.root);
  s.appendChild(grid);

  var cmp = el("div","pz-card"); cmp.style.marginTop = "16px";
  cmp.appendChild(el("h2",null,"Compare"));
  var row = el("div","pz-btnrow");
  var nodes = [];
  if (isValidAudio(p.id)){
    nodes.push(compareButton("Model, then take 1","cmp1",function(){ return t1.url ? [AUDIO_FILES[p.id], t1.url] : []; }));
    nodes.push(compareButton("Model, then take 2","cmp2",function(){ return t2.url ? [AUDIO_FILES[p.id], t2.url] : []; }));
  }
  nodes.push(compareButton("Take 1, then take 2","cmp12",function(){ return (t1.url&&t2.url) ? [t1.url,t2.url] : []; }));
  nodes.push(compareButton("First try, then take 2","cmp0",function(){ var f=recs.first; return (f&&f.url&&t2.url) ? [f.url,t2.url] : []; }));
  nodes.forEach(function(n){ row.appendChild(n); });
  cmp.appendChild(row);
  cmp.appendChild(el("p","pz-label","Listen to the beat on the direction word. Is take 2 clearer than take 1? Keep the take you like. Delete the other."));
  s.appendChild(cmp);

  if (speakingEnabled()){
    speakPanel = makeSpeakPanel(p);
    s.appendChild(speakPanel.root);
  }
  resetters[3] = function(){ [t1,t2].forEach(function(r){ clearRecording(r); setRecStatus(r,""); }); if (speakPanel) speakPanel.reset(); };
  var row2 = el("div","pz-btnrow");
  var again = el("button","pz-btn-quiet","Try again"); again.type="button";
  again.setAttribute("aria-label","Try again: delete both takes and start again");
  again.addEventListener("click", function(){ resetters[3](); announce("Both takes deleted. You can record again."); });
  row2.appendChild(again); s.appendChild(row2);
  return s;
}

/* ---------- 5. The whole route ---------- */
function buildS5(){
  var s = screenShell(5,"Say the whole route");
  s.appendChild(el("p",null,"Say the three directions in order. Record them. Play your voice."));
  s.appendChild(fr("Dites les trois directions dans l’ordre. Enregistrez-vous et réécoutez-vous."));
  var card = el("div","pz-card");
  var ol = el("ol"); ol.style.margin="0 0 8px"; ol.style.paddingLeft="1.3rem";
  PHRASES.forEach(function(p){ var li = el("li","pz-model",p.text); li.style.fontSize="1.2rem"; ol.appendChild(li); });
  card.appendChild(ol);
  s.appendChild(card);
  var a = makeRecorder("route1","Route recording 1",PHRASES.map(function(p){return p.text;}).join(" "));
  var b = makeRecorder("route2","Route recording 2 (optional)",PHRASES.map(function(p){return p.text;}).join(" "));
  var grid = el("div","pz-take-grid"); grid.appendChild(a.root); grid.appendChild(b.root); s.appendChild(grid);
  var row = el("div","pz-btnrow");
  row.appendChild(compareButton("Recording 1, then 2","cmpR",function(){ return (a.url&&b.url)?[a.url,b.url]:[]; }));
  s.appendChild(row);
  resetters[4] = function(){ [a,b].forEach(function(r){ clearRecording(r); setRecStatus(r,""); }); };
  var row2 = el("div","pz-btnrow");
  var again = el("button","pz-btn-quiet","Try again"); again.type="button";
  again.setAttribute("aria-label","Try again: delete these recordings and start again");
  again.addEventListener("click", function(){ resetters[4](); announce("Recordings deleted. You can record again."); });
  row2.appendChild(again); s.appendChild(row2);
  return s;
}

/* ---------- 6. Summary ---------- */
function buildS6(){
  var s = screenShell(6,"Your practice today");
  var box = el("div","pz-complete");
  box.appendChild(el("p",null,"You practised: “"+PHRASES[TARGET].text+"”"));
  box.appendChild(el("p",null,"You gave the direction word a clear beat: left, and ROUND in roundabout."));
  var count = el("p",null,""); count.id="pz-count"; count.style.margin="0"; box.appendChild(count);
  s.appendChild(box);
  s.appendChild(el("p",null,"Use these phrases with a taxi or a ride app. Say the direction word clearly."));
  s.appendChild(fr("Utilisez ces phrases avec un taxi ou une application. Dites bien le mot de direction."));
  var chk = el("label","pz-check"); chk.setAttribute("for","pz-selfcheck");
  selfCheck = document.createElement("input"); selfCheck.type="checkbox"; selfCheck.id="pz-selfcheck";
  chk.appendChild(selfCheck);
  chk.appendChild(el("span",null,"I listened and said the phrases aloud."));
  s.appendChild(chk);
  var row = el("div","pz-btnrow");
  var done = el("button","pz-btn-done","Done"); done.type="button"; done.id="pz-done";
  var again = el("button","pz-btn-quiet","Try again"); again.type="button"; again.id="pz-again-all";
  again.setAttribute("aria-label","Try again: start the whole activity again");
  row.appendChild(done); row.appendChild(again); s.appendChild(row);
  var st = el("p","pz-status"); st.id="pz-done-status"; st.setAttribute("role","status"); st.setAttribute("aria-live","polite"); s.appendChild(st);
  var nw = el("div","pz-btnrow"); nw.id="pz-next-wrap"; nw.hidden = true;
  var nb = el("button","pz-btn-primary","Go to the next activity"); nb.type="button"; nb.id="pz-next-activity";
  nw.appendChild(nb); s.appendChild(nw);

  done.addEventListener("click", function(){
    var needNotice = !noticeAttempted();
    var needPractice = !(anyRecording() || selfCheck.checked);
    if (needNotice){ st.textContent = "Please do the Follow the directions screen first. It is quick."; return; }
    if (needPractice){ st.textContent = "Record one phrase, or tick the box when you say the phrases aloud. Then press Done."; return; }
    doneState = true; done.disabled = true;
    st.textContent = "Pronunciation Clinic is complete.";
    if (/^https:\/\//.test(CONFIG.nextActivityUrl)) nw.hidden = false;
    announce("Pronunciation Clinic is complete.");
  });
  again.addEventListener("click", restartAll);
  nb.addEventListener("click", function(){ if (/^https:\/\//.test(CONFIG.nextActivityUrl)) window.location.href = CONFIG.nextActivityUrl; });
  s.refresh = function(){
    var n = recordedCount();
    count.textContent = n ? ("You recorded your voice "+n+(n===1?" time.":" times.")) : "Recording was optional. You can also practise aloud.";
  };
  return s;
}

/* ============================================================================
   NAVIGATION
   ========================================================================= */
var FWD_LABELS = ["See the route","Practise the phrases","Open the studio","Say the route","See my summary"];

function setNavStatus(t){ var n=document.getElementById("pz-nav-status"); if(n) n.textContent=t||""; }

function showScreen(i){
  if (i<0 || i>=screens.length) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecording();
  screens.forEach(function(sc,k){ sc.hidden = (k!==i); });
  current = i;
  var bar = document.querySelectorAll("#pz-progress li");
  for (var k=0;k<bar.length;k++){ bar[k].className = k<i ? "on" : (k===i ? "now" : ""); }
  document.getElementById("pz-steptext").textContent = "Screen "+(i+1)+" of "+screens.length+" · "+STEP_NAMES[i];
  var fwd = document.getElementById("pz-fwd");
  fwd.hidden = (i===screens.length-1);
  fwd.textContent = FWD_LABELS[i] || "Carry on";
  if (screens[i].refresh) screens[i].refresh();
  setNavStatus("");
  try{ screens[i].focus({preventScroll:true}); }catch(e){ try{screens[i].focus();}catch(e2){} }
  try{ window.scrollTo(0,0); }catch(e){}
}
function goForward(){
  if (current===1 && !noticeAttempted()){
    setNavStatus("Try each question first. Then you can carry on."); return;
  }
  setNavStatus("");
  showScreen(current+1);
}

/* Restart the whole activity: every screen, every recording, every shuffle. */
function restartAll(){
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecording();
  clearAllRecordings();
  if (speakPanel) speakPanel.reset();
  noticeItems.forEach(function(q){ q.render(); });
  if (selfCheck) selfCheck.checked = false;
  doneState = false;
  var d = document.getElementById("pz-done"); if (d) d.disabled = false;
  var st = document.getElementById("pz-done-status"); if (st) st.textContent = "";
  var nw = document.getElementById("pz-next-wrap"); if (nw) nw.hidden = true;
  showScreen(0);
  announce("The activity starts again.");
}

function init(){
  var main = document.getElementById("pz-main");
  [buildS1,buildS2,buildS3,buildS4,buildS5,buildS6].forEach(function(f){ var s=f(); main.appendChild(s); screens.push(s); });
  var bar = document.getElementById("pz-progress");
  for (var i=0;i<screens.length;i++) bar.appendChild(document.createElement("li"));
  document.getElementById("pz-fwd").addEventListener("click", goForward);
  window.addEventListener("pagehide", function(){ stopRecognition(); stopActiveRecorder(); cancelPendingRecording(); stopAudio(); clearAllRecordings(); });
  showScreen(0);
}
if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();

window.__PZ__ = { LESSON_ID:LESSON_ID, PHRASES:PHRASES, AUDIO_FILES:AUDIO_FILES, recs:recs, showScreen:showScreen,
  goForward:goForward, sanitiseFeedback:sanitiseFeedback, state:function(){ return {current:current,done:doneState,rec:recordedCount()}; } };

})();
</script>
