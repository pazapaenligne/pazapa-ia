ONE PRONUNCIATION FOCUS: Word stress in clinic terms.
EXACT MODEL LANGUAGE (verbatim from the Step 3 prompt — nothing added):
  1. I have an appointment.     apPOINTment
  2. I have a prescription.     preSCRIPtion
  3. What is the dosage?        DOSage
TARGET RECORDING: "I have an appointment."

SCREENS (7), three different compositions
  1  Route          contextual opening: reception -> pharmacy counter
  2  Noticing board explore the strong part of each clinic term
  3-5 Rhythm strips  one phrase per screen, beat boxes, record + AI check
  6  Studio         two takes side by side, model, AI feedback
  7  Close          summary, Try again, Done

  The three illustrations are taken from the lesson workbook
  Week_9_Lesson_2_A2_Workbook_Clinic_and_Pharmacy.pdf, unmodified

.pz-term img{width:120px;height:auto;border-radius:10px;background:var(--pz-grey);}
.pz-term-main{flex:1 1 220px;}
.pz-term-word{font-family:var(--pz-head-font);font-size:1.4rem;margin:0 0 2px;}

.pz-choice img{display:block;width:120px;max-width:100%;height:auto;border-radius:8px;margin:0 auto 4px;}

.pz-strip{

}
.pz-beats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;}
.pz-beat{

var FALLBACK_MSG = "Feedback is not available right now. Listen to the model and try again, or carry on.";
var RECORD_MAX_MS = 20000;               /* documented capture limit, 20 s */
var RECORD_PERMISSION_TIMEOUT_MS = 10000;
var RECOGNITION_TIMEOUT_MS = 12000;

/* ============================================================================
   HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function announce(msg){
  var live = document.getElementById("pz-live");
  if (live) live.textContent = String(msg || "");
}
function fr(text){
  var p = el("p", "pz-fr", text);
  p.setAttribute("lang", "fr");
  return p;
}
function shuffle(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function isSafeUrl(value){
  if (typeof value !== "string" || value === "" || value !== value.trim()) return false;
  var u; try { u = new URL(value); } catch(e){ return false; }
  return u.protocol === "https:" && u.username === "" && u.password === "";
}
function isSafeEndpoint(value){
  if (!isSafeUrl(value)) return false;
  var u = new URL(value);
  if (u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "::1" || u.hostname === "[::1]") return false;
  return u.search === "" && u.hash === "";
}
function isEmbeddedImage(v){
  return typeof v === "string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(v);
}
function isValidAudio(key){
  if (audioPendingConfirmation.indexOf(key) !== -1) return false;
  var v = AUDIO_FILES[key];
  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav|x-m4a|aac);base64,[A-Za-z0-9+/=]+$/.test(v);
}
function allAudioSupplied(){
  for (var i = 0; i < PHRASES.length; i++) if (!isValidAudio(PHRASES[i].audio)) return false;
  return true;
}
function fmtTime(ms){
  var s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
}

/* Stress cue as text: strong part in capitals, bold and underlined. */
function stressWordNode(p){
  var w = el("span", "pz-word");
  w.setAttribute("aria-label", p.word + ", strong part: " + p.syll[p.strong].toLowerCase());
  for (var i = 0; i < p.syll.length; i++){
    var s = el("span", i === p.strong ? "pz-strong" : null, i === p.strong ? p.syll[i].toUpperCase() : p.syll[i].toLowerCase());
    s.setAttribute("aria-hidden", "true");
    w.appendChild(s);
  }
  return w;
}

/* ============================================================================
   AUDIO — one element, one source at a time, never autoplayed
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null;
var audioToken = 0;

function stopAudio(){
  audioToken++;
  if (!audioEl) return;
  try { audioEl.pause(); } catch(e){}
  try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  audioBusyKey = null;
  refreshAudioButtons();
}
function playSource(src, busyKey, btn){
  if (!audioEl || !src) return;
  if (audioBusyKey === busyKey){ stopAudio(); return; }
  stopAudio();
  stopRecognition();
  stopActiveRecorder();
  cancelPendingRecordingRequest();
  var token = ++audioToken;
  audioBusyKey = busyKey;
  refreshAudioButtons();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e2){} }
    var pr = audioEl.play();
    if (pr && typeof pr.catch === "function"){
      pr.catch(function(){
        if (token !== audioToken) return;
        audioBusyKey = null; refreshAudioButtons();
        if (btn) announce("The audio did not play. Read the phrase and say it aloud.");
      });
    }
  } catch(e){
    if (token !== audioToken) return;
    audioBusyKey = null; refreshAudioButtons();
  }
}
function playAudio(key, btn){ if (isValidAudio(key)) playSource(AUDIO_FILES[key], key, btn); }
if (audioEl){
  audioEl.addEventListener("ended", function(){ audioBusyKey = null; refreshAudioButtons(); });
  audioEl.addEventListener("error", function(){
    if (!audioEl.getAttribute("src")) return;
    audioBusyKey = null; refreshAudioButtons();
  });
}
function refreshAudioButtons(){
  var btns = document.querySelectorAll("[data-audio-key],[data-rec-key]");
  for (var i = 0; i < btns.length; i++){
    var b = btns[i];
    var k = b.getAttribute("data-audio-key") || b.getAttribute("data-rec-key");
    var playing = (k === audioBusyKey);
    b.setAttribute("aria-pressed", playing ? "true" : "false");
    b.textContent = playing ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");
  }
}

/* Model-audio button. With no recording it is shown DISABLED (honest, not
   hidden, not simulated); the note under it says why. */
function buildModelBtn(p, playLabel){
  var avail = isValidAudio(p.audio);
  var b = el("button", "pz-btn-help", playLabel);
  b.type = "button";
  b.setAttribute("aria-label", playLabel + ": " + p.text);
  if (!avail){
    b.disabled = true;
    b.setAttribute("aria-disabled", "true");
    b.setAttribute("data-unavailable", "1");
    return b;
  }
  b.setAttribute("data-audio-key", p.audio);
  b.setAttribute("data-label-play", playLabel);
  b.setAttribute("data-label-stop", "Stop");
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", function(){ playAudio(p.audio, b); });
  return b;
}
function noAudioNote(){ return el("p", "pz-note", NO_AUDIO_NOTE); }

/* ============================================================================
   SPEECH RECOGNITION + AI FEEDBACK (words only)
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognisingPanel = null, recognitionTimer = null;

function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
  if (recognisingPanel){ setSpeakBusy(recognisingPanel, false); recognisingPanel = null; }
  if (!recognition) return;
  try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; } catch(e){}
  try { recognition.abort(); } catch(e){}
  recognition = null;
}

function startRecognition(panel){
  if (!speakingEnabled()) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  panel.pzSeq = (panel.pzSeq || 0) + 1;
  var r;
  try { r = new SR(); } catch(e){ showFallback(panel); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;

  r.onresult = function(ev){
    if (recognition !== r) return;
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); }
    catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recognition !== r || settled) return;
    settled = true;
    var code = (ev && ev.error) ? String(ev.error) : "";
    setSpeakBusy(panel, false);
    stopRecognition();
    if (code === "not-allowed" || code === "service-not-allowed"){
      showStatus(panel, "The microphone is off. You can still say the phrase aloud and carry on.");
      showAfter(panel);
    } else if (code === "no-speech" || code === "aborted"){
      showFeedback(panel, { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on.", focus:"" }, "");
    } else { showFallback(panel); }
  };
  r.onend = function(){
    if (recognition !== r || settled) return;
    settled = true;
    setSpeakBusy(panel, false);
    stopRecognition();
    var clean = got.replace(/\s+/g, " ").trim();
    if (clean === ""){
      showFeedback(panel, { status:"unclear", message:"I could not compare the words this time. Listen and try again, or carry on.", focus:"" }, "");
      return;
    }
    if (clean.length > 200) clean = clean.slice(0, 200);
    requestFeedback(panel, clean);
  };
  recognition = r; recognisingPanel = panel;
  panel.pzBusy = true;
  setSpeakBusy(panel, true);
  showStatus(panel, "Listening. Say the phrase once.");
  recognitionTimer = setTimeout(function(){
    if (recognition !== r || settled) return;
    settled = true;
    stopRecognition();
    showStatus(panel, "The word check did not respond in this browser. You can try again or carry on.");
    showAfter(panel);
  }, RECOGNITION_TIMEOUT_MS);
  try { r.start(); }
  catch(e){ settled = true; setSpeakBusy(panel, false); stopRecognition(); showFallback(panel); }
}

function abortPendingFeedback(panel){
  var list = panel ? [panel] : document.querySelectorAll(".pz-speak");
  for (var i = 0; i < list.length; i++){
    var pn = list[i];
    pn.pzSeq = (pn.pzSeq || 0) + 1;
    if (pn.pzCtrl){ try { pn.pzCtrl.abort(); } catch(e){} pn.pzCtrl = null; }
    if (pn.pzBusy){          /* a half-finished check leaves a clean panel */
      pn.pzBusy = false;
      var out = pn.querySelector('[data-role="out"]');
      if (out) while (out.firstChild) out.removeChild(out.firstChild);
      setSpeakBusy(pn, false);
    }
  }
}

function requestFeedback(panel, recognisedText){
  var p = panel.pzPhrase;
  var seq = panel.pzSeq || 0;
  showHeard(panel, recognisedText);
  showStatus(panel, "Comparing your words with the model.");
  if (!isSafeEndpoint(CONFIG.feedbackEndpoint)){ showFallback(panel, recognisedText); return; }
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  panel.pzCtrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ targetPhrase: p.text, recognisedText: recognisedText }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer"
  };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad-status"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      var safe = sanitiseFeedback(data, p);
      if (!safe){ showFallback(panel, recognisedText); return; }
      showFeedback(panel, safe, recognisedText);
    })
    .catch(function(){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      showFallback(panel, recognisedText);
    });
}

function sanitiseFeedback(data, p){
  if (!data || typeof data !== "object") return null;
  var status = data.status;
  if (status !== "match" && status !== "try_again" && status !== "unclear") return null;
  var message = (typeof data.message === "string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (message === "" || message.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(message)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(message)) return null;
  var focus = (typeof data.focus === "string") ? data.focus.replace(/\s+/g," ").trim() : "";
  if (focus.length > 60 || !focusIsApproved(focus, p)) focus = "";
  return { status:status, message:message, focus:focus };
}
function focusIsApproved(focus, p){
  var norm = function(s){
    return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim();
  };
  var f = norm(focus);
  if (f === "") return true;
  return (" " + norm(p.text) + " ").indexOf(" " + f + " ") !== -1;
}

function pPart(panel, role){ return panel.querySelector('[data-role="' + role + '"]'); }
function setSpeakBusy(panel, busy){
  var b = pPart(panel, "speak");
  if (!b) return;
  b.disabled = !!busy;
  b.textContent = busy ? "Listening…" : (panel.pzHasResult ? "Get AI feedback again" : "Get AI feedback");
}
function showStatus(panel, text){
  var out = pPart(panel, "out");
  if (!out) return;
  var s = out.querySelector(".pz-status");
  if (!s){ s = el("p", "pz-status"); out.appendChild(s); }
  s.textContent = text;
}
function showAfter(panel){ var a = pPart(panel, "after-row"); if (a) a.hidden = false; }
function showHeard(panel, text){
  var out = pPart(panel, "out");
  if (!out) return;
  var box = out.querySelector(".pz-heard");
  if (!box){
    box = el("div", "pz-heard");
    box.appendChild(el("p", "pz-heard-label", "Your words:"));
    box.appendChild(el("p", "pz-heard-text"));
    out.insertBefore(box, out.firstChild);
  }
  box.querySelector(".pz-heard-text").textContent = text;
}
function clearFb(out){
  var old = out.querySelector(".pz-fb"); if (old) out.removeChild(old);
  var s = out.querySelector(".pz-status"); if (s) s.textContent = "";
}
function showFeedback(panel, fb, heard){
  panel.pzBusy = false; panel.pzHasResult = true; panel.pzSpeakAttempted = true;
  var out = pPart(panel, "out"); if (!out) return;
  if (heard) showHeard(panel, heard);
  clearFb(out);
  var word, cls;
  if (fb.status === "match"){ word = "Your words matched"; cls = "pz-fb pz-fb-match"; }
  else if (fb.status === "try_again"){ word = "Try once more"; cls = "pz-fb pz-fb-try"; }
  else { word = "Not compared"; cls = "pz-fb pz-fb-unclear"; }
  var box = el("div", cls);
  box.appendChild(el("p", "pz-fb-state", word));
  box.appendChild(el("p", "pz-fb-msg", fb.message));
  if (fb.focus){
    var f = el("p", "pz-fb-focus");
    f.appendChild(document.createTextNode("Practise this part: "));
    f.appendChild(el("b", null, fb.focus));
    box.appendChild(f);
  }
  out.appendChild(box);
  setSpeakBusy(panel, false);
  showAfter(panel);
  refreshFinishState();
}
function showFallback(panel, heard){
  panel.pzBusy = false; panel.pzHasResult = true; panel.pzSpeakAttempted = true;
  var out = pPart(panel, "out"); if (!out) return;
  if (heard) showHeard(panel, heard);
  clearFb(out);
  var box = el("div", "pz-fb pz-fb-unclear");
  box.appendChild(el("p", "pz-fb-state", "Feedback unavailable"));
  box.appendChild(el("p", "pz-fb-msg", FALLBACK_MSG));
  out.appendChild(box);
  setSpeakBusy(panel, false);
  showAfter(panel);
  refreshFinishState();
}
function clearAttempt(panel){
  abortPendingFeedback(panel);
  stopRecognition();
  panel.pzBusy = false; panel.pzHasResult = false; panel.pzSpeakAttempted = false;
  var out = pPart(panel, "out");
  if (out) while (out.firstChild) out.removeChild(out.firstChild);
  var a = pPart(panel, "after-row"); if (a) a.hidden = true;
  setSpeakBusy(panel, false);
}

/* AI panel. Label "Get AI feedback". It checks WORDS, and says so. */
function buildAIPanel(p, heading){
  if (!speakingEnabled()) return null;
  var panel = el("div", "pz-speak");
  panel.pzPhrase = p;
  panel.appendChild(el("h2", null, heading || "AI check"));
  panel.appendChild(el("p", null, "Say the phrase once. The computer shows your words. It checks your words, not your stress. Use the model to check the strong part."));
  panel.appendChild(fr("Dites la phrase une fois. L’ordinateur affiche vos mots. Il vérifie les mots, pas l’accent tonique."));
  var row = el("div", "pz-btnrow");
  var go = el("button", "pz-btn-primary", "Get AI feedback");
  go.type = "button";
  go.setAttribute("data-role", "speak");
  go.setAttribute("aria-label", "Get AI feedback: " + p.text);
  go.addEventListener("click", function(){ startRecognition(panel); });
  row.appendChild(go);
  panel.appendChild(row);
  var out = el("div"); out.setAttribute("data-role", "out"); out.setAttribute("aria-live", "polite");
  panel.appendChild(out);
  var after = el("div", "pz-btnrow"); after.setAttribute("data-role", "after-row"); after.hidden = true;
  var again = el("button", "pz-btn-quiet", "Try again");
  again.type = "button";
  again.addEventListener("click", function(){ clearAttempt(panel); startRecognition(panel); });
  after.appendChild(again);
  var del = el("button", "pz-btn-quiet", "Clear my words");
  del.type = "button";
  del.addEventListener("click", function(){ clearAttempt(panel); showStatus(panel, "Your words are cleared."); });
  after.appendChild(del);
  panel.appendChild(after);
  aiPanels.push(panel);
  return panel;
}

/* ============================================================================
   RECORDING — local takes
   ========================================================================= */
var recGen = 0, recorder = null, recStream = null;
var pendingTake = null, pendingTimer = null, elapsedTimer = null, activeTake = null;
var takes = [];
var aiPanels = [];

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function" &&
            typeof window.MediaRecorder !== "undefined");
}
function recMimeType(){
  var c = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){
    try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){}
  }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i = 0; i < t.length; i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function stopActiveRecorder(){
  if (!recorder) return;
  try { if (recorder.state !== "inactive") recorder.stop(); } catch(e){}
}
function stopElapsed(){ if (elapsedTimer){ clearInterval(elapsedTimer); elapsedTimer = null; } }

function takeKey(t){ return "rec:" + t.id; }
function takeStatus(t, text){ t.statusEl.textContent = text; }
function takeBusy(t, busy){
  t.recBtn.textContent = busy ? "Stop recording" : (t.url ? "Record again" : "Record");
  t.recBtn.setAttribute("aria-pressed", busy ? "true" : "false");
  t.recording = !!busy;
  if (!busy) stopElapsed();
}
function cancelPendingRecordingRequest(){
  if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; }
  if (pendingTake){
    recGen++;
    var t = pendingTake; pendingTake = null;
    takeBusy(t, false);
    takeStatus(t, "");
  }
}
function takeClear(t, keepStatus){
  if (!t) return;
  if (audioBusyKey === takeKey(t)) stopAudio();
  if (t.url){ try { URL.revokeObjectURL(t.url); } catch(e){} t.url = null; }
  t.afterRow.hidden = true;
  t.recBtn.textContent = "Record";
  t.elapsedEl.textContent = "0:00";
  if (!keepStatus) takeStatus(t, "");
  refreshAudioButtons();
}
function clearAllTakes(){
  for (var i = 0; i < takes.length; i++){ takeClear(takes[i]); takeBusy(takes[i], false); }
}

function startTake(t){
  if (!recordingSupported()) return;
  cancelPendingRecordingRequest();
  var gen = ++recGen;
  stopAudio(); stopRecognition(); stopActiveRecorder();
  takeClear(t, true);
  takeBusy(t, true);
  t.elapsedEl.textContent = "0:00";
  takeStatus(t, "Recording. Say the phrase.");
  pendingTake = t;
  pendingTimer = setTimeout(function(){
    if (gen !== recGen) return;
    cancelPendingRecordingRequest();
    takeStatus(t, "The microphone did not respond. Try again, or say the phrase aloud and tick the box.");
    t.showFallbackTick();
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; }
    if (pendingTake === t) pendingTake = null;
    if (gen !== recGen){ releaseStream(stream); return; }
    var chunks = [], mr, cap = null;
    try {
      var mt = recMimeType();
      mr = mt ? new window.MediaRecorder(stream, { mimeType: mt }) : new window.MediaRecorder(stream);
    } catch(e){
      releaseStream(stream); takeBusy(t, false);
      takeStatus(t, "Recording does not work in this browser. Say the phrase aloud and tick the box.");
      t.showFallbackTick();
      return;
    }
    recorder = mr; recStream = stream; activeTake = t;
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
    mr.onerror = function(){
      if (cap) clearTimeout(cap);
      releaseStream(stream);
      if (recorder === mr) recorder = null;
      if (recStream === stream) recStream = null;
      if (gen !== recGen) return;
      takeBusy(t, false);
      takeStatus(t, "The recording did not work. Try again, or say the phrase aloud and tick the box.");
      t.showFallbackTick();
    };
    mr.onstop = function(){
      if (cap) clearTimeout(cap);
      releaseStream(stream);
      if (recorder === mr) recorder = null;
      if (recStream === stream) recStream = null;
      if (activeTake === t) activeTake = null;
      if (gen !== recGen) return;
      takeBusy(t, false);
      if (!chunks.length){ takeStatus(t, "I did not catch that. Try again."); t.showFallbackTick(); return; }
      var blob;
      try { blob = new Blob(chunks, { type: chunks[0].type || "audio/mp4" }); }
      catch(e){ takeStatus(t, "The recording did not work. Try again."); return; }
      if (!blob.size){ takeStatus(t, "I did not catch that. Try again."); t.showFallbackTick(); return; }
      if (t.url){ try { URL.revokeObjectURL(t.url); } catch(e){} }
      t.url = URL.createObjectURL(blob);
      t.afterRow.hidden = false;
      t.recBtn.textContent = "Record again";
      takeStatus(t, "Recording saved. Listen to it, then listen to the model.");
      refreshAudioButtons();
      refreshFinishState();
    };
    try { mr.start(); }
    catch(e){
      releaseStream(stream); recorder = null; recStream = null;
      if (gen !== recGen) return;
      takeBusy(t, false);
      takeStatus(t, "Recording does not work in this browser. Say the phrase aloud and tick the box.");
      t.showFallbackTick();
      return;
    }
    var started = Date.now();
    stopElapsed();
    elapsedTimer = setInterval(function(){ t.elapsedEl.textContent = fmtTime(Date.now() - started); }, 250);
    cap = setTimeout(function(){ try { if (mr.state === "recording") mr.stop(); } catch(e){} }, RECORD_MAX_MS);
  }).catch(function(err){
    if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; }
    if (pendingTake === t) pendingTake = null;
    if (gen !== recGen) return;
    takeBusy(t, false);
    var name = err && err.name ? String(err.name) : "";
    var msg = (name === "NotFoundError" || name === "OverconstrainedError")
      ? "No microphone was found. Say the phrase aloud and tick the box."
      : "The microphone is off. Say the phrase aloud and tick the box.";
    takeStatus(t, msg);
    t.showFallbackTick();
  });
}
function toggleTake(t){
  if (pendingTake === t){
    cancelPendingRecordingRequest();
    takeStatus(t, "Cancelled. You can try again.");
  } else if (t.recording){
    stopActiveRecorder();
  } else { startTake(t); }
}

var takeSeq = 0;
function buildTake(label, p, cls){
  var t = { id: "t" + (++takeSeq), url:null, recording:false };
  var box = el("div", "pz-take" + (cls ? " " + cls : ""));
  box.appendChild(el("h3", null, label));
  var row = el("div", "pz-btnrow");
  row.style.marginTop = "0";
  t.recBtn = el("button", "pz-btn-primary", "Record");
  t.recBtn.type = "button";
  t.recBtn.setAttribute("aria-pressed", "false");
  t.recBtn.setAttribute("aria-label", label + ": record yourself saying " + p.text);
  t.recBtn.addEventListener("click", function(){ toggleTake(t); });
  row.appendChild(t.recBtn);
  t.elapsedEl = el("span", "pz-elapsed", "0:00");
  t.elapsedEl.setAttribute("aria-hidden", "true");
  row.appendChild(t.elapsedEl);
  box.appendChild(row);
  t.statusEl = el("p", "pz-status");
  t.statusEl.setAttribute("role", "status");
  t.statusEl.setAttribute("aria-live", "polite");
  box.appendChild(t.statusEl);
  t.afterRow = el("div", "pz-btnrow"); t.afterRow.hidden = true;
  var play = el("button", "pz-btn-primary", "Hear my recording");
  play.type = "button";
  play.setAttribute("data-rec-key", takeKey(t));
  play.setAttribute("data-label-play", "Hear my recording");
  play.setAttribute("data-label-stop", "Stop");
  play.setAttribute("aria-pressed", "false");
  play.setAttribute("aria-label", label + ": hear my recording");
  play.addEventListener("click", function(){ if (t.url) playSource(t.url, takeKey(t), play); });
  t.afterRow.appendChild(play);
  var del = el("button", "pz-btn-quiet", "Delete recording");
  del.type = "button";
  del.addEventListener("click", function(){ takeClear(t, true); takeStatus(t, "Recording deleted."); refreshFinishState(); });
  t.afterRow.appendChild(del);
  box.appendChild(t.afterRow);
  t.el = box;
  t.showFallbackTick = function(){ if (t.onFallback) t.onFallback(); };
  takes.push(t);
  return t;
}

/* ============================================================================
   SCREENS
   ========================================================================= */
var screens = [];
var current = 0;
var screenResets = [];     /* per-screen Try again handlers */
var selfChecks = [];       /* microphone-free route */
var notice = { revealed:{}, matchDone:false };

function section(id, title, sub){
  var s = el("section", "pz-screen");
  s.id = id; s.tabIndex = -1; s.hidden = true;
  s.setAttribute("aria-labelledby", id + "-h");
  s.appendChild(el("div", "pz-accent")).setAttribute("aria-hidden", "true");
  var h = el("h1", null, title); h.id = id + "-h";
  s.appendChild(h);
  if (sub){ var f = el("p", "pz-focus", sub); s.appendChild(f); }
  return s;
}
function imgNode(key, alt){
  var i = document.createElement("img");
  if (isEmbeddedImage(IMAGES[key])){ i.src = IMAGES[key]; i.alt = alt; i.setAttribute("decoding", "async"); }
  return i;
}
function addTryAgain(sec, handler, label){
  var row = el("div", "pz-btnrow");
  var b = el("button", "pz-btn-quiet", "Try again");
  b.type = "button";
  b.setAttribute("aria-label", "Try again: " + label);
  b.addEventListener("click", function(){ handler(); announce("This screen is reset."); });
  row.appendChild(b);
  sec.appendChild(row);
}

/* ---------- screen 1 — ROUTE ---------- */
function buildS1(){
  var s = section("pz-s1", "At the clinic and the pharmacy", FOCUS);
  s.appendChild(el("p", null, "You go to the clinic. Then you go to the pharmacy. In each place, you say one useful phrase. One part of the long word is strong."));
  s.appendChild(fr("Vous allez à la clinique, puis à la pharmacie. Dans chaque lieu, vous dites une phrase utile. Une partie du mot long est forte."));
  var ol = el("ol", "pz-route");
  ol.setAttribute("aria-label", "Your route: reception, pharmacy counter, pharmacist");
  var firstBtn = true;
  PHRASES.forEach(function(p, i){
    var li = el("li", "pz-stop");
    li.setAttribute("data-n", String(i + 1));
    li.appendChild(el("p", "pz-stop-place", p.cap));
    var body = el("div", "pz-stop-body");
    body.appendChild(imgNode(p.img, p.alt));
    var tx = el("div", "pz-stop-text");
    var bub = el("p", "pz-bubble");
    bub.appendChild(document.createTextNode(p.before + " "));
    bub.appendChild(stressWordNode(p));
    bub.appendChild(document.createTextNode(p.text.slice(-1)));
    tx.appendChild(bub);
    var row = el("div", "pz-btnrow");
    row.appendChild(buildModelBtn(p, "Hear the phrase"));
    tx.appendChild(row);
    body.appendChild(tx);
    li.appendChild(body);
    ol.appendChild(li);
  });
  s.appendChild(ol);
  if (!allAudioSupplied() || PHRASES.some(function(p){ return !isValidAudio(p.audio); })) s.appendChild(noAudioNote());
  return s;
}

/* ---------- screen 2 — NOTICING BOARD ---------- */
function buildS2(){
  var s = section("pz-s2", "Notice the strong part", FOCUS);
  s.appendChild(el("p", null, "Each clinic word has one strong part. Tap a word to see it. Say the strong part a little longer and louder."));
  s.appendChild(fr("Chaque mot a une partie forte. Touchez un mot pour la voir. Dites-la un peu plus longtemps et plus fort."));
  var host = el("div");
  s.appendChild(host);
  var status = el("p", "pz-status"); status.setAttribute("role", "status"); status.setAttribute("aria-live", "polite");
  s.appendChild(status);

  var matchHost = el("div");
  s.appendChild(matchHost);

  function renderBoard(){
    host.textContent = "";
    var ul = el("ul", "pz-board");
    shuffle(PHRASES).forEach(function(p){
      var li = el("li", "pz-term");
      li.appendChild(imgNode(p.img, p.alt));
      var main = el("div", "pz-term-main");
      main.appendChild(el("p", "pz-label", p.place));
      var wd = el("p", "pz-term-word");
      var shown = !!notice.revealed[p.id];
      if (shown) wd.appendChild(stressWordNode(p)); else wd.textContent = p.word;
      main.appendChild(wd);
      var sy = el("div", "pz-sylls");
      sy.setAttribute("aria-label", "Parts of the word " + p.word);
      p.syll.forEach(function(sl, k){
        var c = el("span", "pz-syll" + (shown && k === p.strong ? " pz-on" : ""));
        c.textContent = shown && k === p.strong ? sl.toUpperCase() : sl.toLowerCase();
        if (shown && k === p.strong) c.appendChild(el("span", "pz-syll-tag", "strong"));
        sy.appendChild(c);
      });
      main.appendChild(sy);
      var line = el("p", "pz-status");
      line.textContent = shown ? ("Say it: " + p.cue + ". The strong part is “" + p.syll[p.strong].toLowerCase() + "”.") : "";
      main.appendChild(line);
      var row = el("div", "pz-btnrow");
      var show = el("button", shown ? "pz-btn-quiet" : "pz-btn-primary", shown ? "Strong part shown" : "Show the strong part");
      show.type = "button";
      show.setAttribute("aria-label", (shown ? "Strong part shown: " : "Show the strong part of ") + p.word);
      show.disabled = shown;
      show.addEventListener("click", function(){
        notice.revealed[p.id] = true;
        var n = Object.keys(notice.revealed).length;
        status.textContent = n + " of " + PHRASES.length + " words explored.";
        renderBoard();
        refreshFinishState();
      });
      row.appendChild(show);
      main.appendChild(row);
      li.appendChild(main);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    var n = Object.keys(notice.revealed).length;
    status.textContent = n ? (n + " of " + PHRASES.length + " words explored.") : "";
  }

  /* Listen-and-match: needs all three real recordings. Otherwise it is shown
     disabled with an honest note, never turned into a reading question. */
  function renderMatch(){
    matchHost.textContent = "";
    var box = el("div", "pz-matchbox");
    box.appendChild(el("h2", null, "Listen and match"));
    if (!allAudioSupplied()){
      box.appendChild(el("p", null, "Hear a phrase. Choose the picture."));
      var dis = el("button", "pz-btn-help", "Hear a phrase");
      dis.type = "button"; dis.disabled = true; dis.setAttribute("aria-disabled", "true");
      var r = el("div", "pz-btnrow"); r.appendChild(dis); box.appendChild(r);
      box.appendChild(el("p", "pz-note", "This listening task needs the model recordings. They are not available yet, so you can carry on."));
      matchHost.appendChild(box);
      return;
    }
    box.appendChild(el("p", null, "Hear a phrase. Choose the picture."));
    var queue = shuffle(PHRASES), qi = 0;
    var result = el("p", "pz-status"); result.setAttribute("role", "status"); result.setAttribute("aria-live", "polite");
    var choicesHost = el("div");
    function round(){
      choicesHost.textContent = "";
      result.textContent = "";
      if (qi >= queue.length){
        notice.matchDone = true;
        result.textContent = "You matched all three phrases.";
        refreshFinishState();
        return;
      }
      var target = queue[qi];
      var row = el("div", "pz-btnrow");
      row.appendChild(buildModelBtn(target, "Hear a phrase"));
      choicesHost.appendChild(row);
      var wrap = el("div", "pz-choices");
      shuffle(PHRASES).forEach(function(c){
        var b = el("button", "pz-choice pz-btn-quiet");
        b.type = "button";
        b.appendChild(imgNode(c.img, c.alt));
        b.appendChild(document.createTextNode(c.word));
        b.addEventListener("click", function(){
          if (c.id === target.id){
            result.textContent = "Yes. “" + target.text + "”";
            qi++; setTimeout(round, 900);
          } else {
            result.textContent = "Listen again and try another picture.";
          }
        });
        wrap.appendChild(b);
      });
      choicesHost.appendChild(wrap);
    }
    box.appendChild(choicesHost); box.appendChild(result);
    matchHost.appendChild(box);
    round();
  }

  function reset(){
    notice.revealed = {}; notice.matchDone = false;
    stopAudio();
    renderBoard(); renderMatch();
    refreshFinishState();
  }
  screenResets[1] = reset;
  renderBoard(); renderMatch();
  addTryAgain(s, reset, "notice the strong part");
  return s;
}

/* ---------- screens 3-5 — RHYTHM STRIPS ---------- */
function buildPhraseScreen(idx, p){
  var n = idx + 1;
  var s = section("pz-p" + n, "Say it: " + p.text, FOCUS);
  s.appendChild(fr(idx === 0
    ? "Dites la phrase en gardant la partie forte du mot long."
    : "Dites la phrase en gardant la partie forte du mot."));

  var ban = el("div", "pz-banner");
  ban.appendChild(imgNode(p.img, p.alt));
  s.appendChild(ban);

  var strip = el("div", "pz-strip");
  var ul = el("ul", "pz-beats");
  var spoken = [];
  var beats = [{ t:p.before, on:false }];
  p.syll.forEach(function(sl, k){ beats.push({ t:sl, on:k === p.strong }); });
  beats.forEach(function(b, k){
    var last = k === beats.length - 1;
    var li = el("li", "pz-beat" + (b.on ? " pz-on" : ""));
    li.textContent = b.on ? b.t.toUpperCase() : (k === 0 ? b.t : b.t.toLowerCase());
    if (last && !b.on) li.textContent += p.text.slice(-1);
    if (last && b.on) li.textContent += p.text.slice(-1);
    if (b.on) li.appendChild(el("small", null, "strong"));
    spoken.push(b.on ? (b.t.toUpperCase() + " (strong)") : b.t);
    ul.appendChild(li);
  });
  ul.setAttribute("aria-label", "Rhythm: " + spoken.join(", "));
  strip.appendChild(ul);
  var line = el("p", "pz-strip-line");
  line.appendChild(document.createTextNode(p.before + " "));
  line.appendChild(stressWordNode(p));
  line.appendChild(document.createTextNode(p.text.slice(-1)));
  strip.appendChild(line);
  s.appendChild(strip);

  var ck = el("div", "pz-chunks");
  ck.setAttribute("aria-label", "Say it in two parts");
  ck.appendChild(el("span", "pz-label", "Two parts: "));
  ck.appendChild(el("span", "pz-chunk", p.before));
  ck.appendChild(el("span", null, "/"));
  ck.appendChild(el("span", "pz-chunk", p.word + p.text.slice(-1)));
  s.appendChild(ck);

  var mrow = el("div", "pz-btnrow");
  mrow.style.marginTop = "0";
  mrow.appendChild(buildModelBtn(p, "Hear the model"));
  s.appendChild(mrow);
  if (!isValidAudio(p.audio)) s.appendChild(noAudioNote());

  /* My turn — local recording */
  var turn = el("div", "pz-turn");
  turn.appendChild(el("h2", null, "My turn"));
  var take = null;
  var tick;
  if (recordingSupported()){
    turn.appendChild(el("p", null, "Record the phrase. Then hear your voice. Then hear the model."));
    take = buildTake("My recording", p);
    take.el.style.border = "0"; take.el.style.padding = "0"; take.el.style.background = "transparent";
    take.onFallback = function(){ tick.wrap.hidden = false; };
    turn.appendChild(take.el);
  } else {
    turn.appendChild(el("p", null, "Recording does not work here. Say the phrase aloud, then tick the box."));
  }
  /* microphone-free route */
  var wrap = el("label", "pz-selfcheck");
  var cb = document.createElement("input"); cb.type = "checkbox";
  cb.addEventListener("change", function(){ refreshFinishState(); });
  wrap.appendChild(cb);
  wrap.appendChild(el("span", null, "I listened and said the phrase aloud."));
  tick = { wrap: wrap, cb: cb };
  selfChecks.push(cb);
  turn.appendChild(wrap);
  s.appendChild(turn);

  var ai = buildAIPanel(p, "AI check");
  if (ai) s.appendChild(ai);
  else if (!SR && isSafeEndpoint(CONFIG.feedbackEndpoint)){
    s.appendChild(el("p", "pz-note", "The AI word check does not work in this browser. You can still record, listen and compare."));
  }

  screenResets[idx + 2] = function(){
    stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
    if (take){ takeClear(take); takeBusy(take, false); }
    if (ai) clearAttempt(ai);
    cb.checked = false;
    refreshFinishState();
  };
  addTryAgain(s, screenResets[idx + 2], p.text);
  return s;
}

/* ---------- screen 6 — STUDIO ---------- */
function buildStudio(){
  var p = TARGET;
  var s = section("pz-s6", "Recording studio", FOCUS);
  s.appendChild(fr("Enregistrez deux prises, écoutez-les et comparez avec le modèle."));
  var head = el("div", "pz-studio-head");
  var bub = el("p", "pz-bubble");
  bub.appendChild(document.createTextNode(p.before + " "));
  bub.appendChild(stressWordNode(p));
  bub.appendChild(document.createTextNode(p.text.slice(-1)));
  head.appendChild(bub);
  s.appendChild(head);

  var studio = el("div", "pz-studio");
  studio.appendChild(el("p", null, "Say the target phrase. Keep the strong part clear. You can make a second take and compare."));
  var mrow = el("div", "pz-btnrow");
  mrow.style.marginTop = "0";
  mrow.appendChild(buildModelBtn(p, "Hear the model"));
  studio.appendChild(mrow);
  if (!isValidAudio(p.audio)) studio.appendChild(noAudioNote());

  var wrap = el("label", "pz-selfcheck");
  var cb = document.createElement("input"); cb.type = "checkbox";
  cb.addEventListener("change", function(){ refreshFinishState(); });
  wrap.appendChild(cb);
  wrap.appendChild(el("span", null, "I listened and said the phrase aloud."));
  selfChecks.push(cb);

  var t1 = null, t2 = null;
  if (recordingSupported()){
    var grid = el("div", "pz-takes");
    grid.style.marginTop = "14px";
    t1 = buildTake("Take 1", p);
    t2 = buildTake("Take 2 (optional)", p, "pz-take2");
    t1.onFallback = t2.onFallback = function(){ wrap.hidden = false; };
    grid.appendChild(t1.el); grid.appendChild(t2.el);
    studio.appendChild(grid);
    studio.appendChild(el("p", "pz-label", "Your first take stays when you record a second one. Delete a take only when you want to."));
  } else {
    studio.appendChild(el("p", "pz-note", "Recording does not work here. Say the phrase aloud, then tick the box."));
  }
  studio.appendChild(wrap);
  s.appendChild(studio);

  var ai = buildAIPanel(p, "Get AI feedback");
  if (ai) s.appendChild(ai);
  else if (!SR && isSafeEndpoint(CONFIG.feedbackEndpoint)){
    s.appendChild(el("p", "pz-note", "The AI word check does not work in this browser. You can still record, listen and compare."));
  }

  screenResets[5] = function(){
    stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
    if (t1){ takeClear(t1); takeBusy(t1, false); }
    if (t2){ takeClear(t2); takeBusy(t2, false); }
    if (ai) clearAttempt(ai);
    cb.checked = false;
    refreshFinishState();
  };
  addTryAgain(s, screenResets[5], "recording studio");
  return s;
}

/* ---------- screen 7 — CLOSE ---------- */
var doneBtn, doneStatus, hintEl, tryAllBtn, localComplete = false;
function buildClose(){
  var s = section("pz-s7", "Well done", null);
  var box = el("div", "pz-complete");
  box.appendChild(el("p", null, "You worked on word stress in clinic terms."));
  var p2 = el("p");
  p2.style.margin = "0";
  p2.appendChild(document.createTextNode("You practised: "));
  PHRASES.forEach(function(p, i){
    if (i) p2.appendChild(document.createTextNode(" · "));
    p2.appendChild(stressWordNode(p));
  });
  box.appendChild(p2);
  s.appendChild(box);
  s.appendChild(el("p", null, "Next time at the clinic or the pharmacy, say the strong part clearly: “I have an appointment.”"));
  s.appendChild(fr("La prochaine fois à la clinique ou à la pharmacie, dites clairement la partie forte."));
  hintEl = el("p", "pz-hint"); hintEl.hidden = true;
  hintEl.setAttribute("role", "status");
  s.appendChild(hintEl);
  var row = el("div", "pz-btnrow");
  tryAllBtn = el("button", "pz-btn-quiet", "Try again");
  tryAllBtn.type = "button";
  tryAllBtn.setAttribute("aria-label", "Try again: start the whole activity again");
  tryAllBtn.addEventListener("click", restartAll);
  doneBtn = el("button", "pz-btn-done", "Done");
  doneBtn.type = "button";
  doneBtn.addEventListener("click", onDone);
  row.appendChild(tryAllBtn);
  row.appendChild(doneBtn);
  s.appendChild(row);
  doneStatus = el("p", "pz-status");
  doneStatus.setAttribute("role", "status");
  doneStatus.setAttribute("aria-live", "polite");
  s.appendChild(doneStatus);
  var nx = el("div", "pz-btnrow"); nx.hidden = true; nx.id = "pz-next-wrap";
  var nb = el("button", "pz-btn-primary", "Go to the next activity");
  nb.type = "button";
  nb.addEventListener("click", function(){ if (isSafeUrl(CONFIG.nextActivityUrl)) window.location.href = CONFIG.nextActivityUrl; });
  nx.appendChild(nb);
  s.appendChild(nx);
  return s;
}

/* ============================================================================
   COMPLETION RULES
   ========================================================================= */
function noticeDone(){
  var n = Object.keys(notice.revealed).length === PHRASES.length;
  return n;
}
function practisedAny(){
  var i;
  for (i = 0; i < takes.length; i++) if (takes[i].url) return true;
  for (i = 0; i < aiPanels.length; i++) if (aiPanels[i].pzSpeakAttempted) return true;
  for (i = 0; i < selfChecks.length; i++) if (selfChecks[i].checked) return true;
  return false;
}
function missingText(){
  var m = [];
  if (!noticeDone()) m.push("tap Show the strong part for each word on the noticing screen");
  if (!practisedAny()) m.push("say one phrase aloud: record it, use the AI check, or tick “I listened and said the phrase aloud”");
  return m.length ? ("Almost there. Please " + m.join(", and ") + ".") : "";
}
function refreshFinishState(){
  if (!hintEl) return;
  var msg = missingText();
  if (!msg){ hintEl.hidden = true; hintEl.textContent = ""; }
}
function onDone(){
  var msg = missingText();
  if (msg){ hintEl.textContent = msg; hintEl.hidden = false; return; }
  hintEl.hidden = true;
  if (!localComplete){
    localComplete = true;
    if (isSafeUrl(CONFIG.nextActivityUrl)){ var w = document.getElementById("pz-next-wrap"); if (w) w.hidden = false; }
  }
  doneBtn.disabled = true;
  doneStatus.textContent = "Step 3 is complete.";
}
function restartAll(){
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  clearAllTakes();
  for (var i = 0; i < aiPanels.length; i++) clearAttempt(aiPanels[i]);
  for (var j = 0; j < selfChecks.length; j++) selfChecks[j].checked = false;
  if (screenResets[1]) screenResets[1]();
  localComplete = false;
  doneBtn.disabled = false;
  doneStatus.textContent = "";
  hintEl.hidden = true; hintEl.textContent = "";
  var nw = document.getElementById("pz-next-wrap"); if (nw) nw.hidden = true;
  showScreen(0);
  announce("The activity starts again.");
}

/* ============================================================================
   NAVIGATION — never automatic
   ========================================================================= */
var NEXT_LABELS = ["Notice the strong part", "Practise the phrases", "Next phrase", "Next phrase", "Open the studio", "Close the clinic", ""];

function showScreen(i){
  if (i < 0 || i >= screens.length) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  abortPendingFeedback(null);
  for (var k = 0; k < screens.length; k++){
    if (k === i) screens[k].removeAttribute("hidden"); else screens[k].hidden = true;
  }
  current = i;
  document.getElementById("pz-progress").textContent = "Screen " + (i + 1) + " of " + screens.length;
  var back = document.getElementById("pz-back"), fwd = document.getElementById("pz-fwd");
  back.disabled = (i === 0);
  fwd.hidden = (i === screens.length - 1);
  fwd.textContent = NEXT_LABELS[i] || "Next";
  try { screens[i].focus({ preventScroll:true }); } catch(e){ try { screens[i].focus(); } catch(e2){} }
  try { window.scrollTo(0, 0); } catch(e){}
  if (i === screens.length - 1) refreshFinishState();
}

function init(){
  var main = document.getElementById("pz-main");
  screens.push(buildS1());
  screens.push(buildS2());
  for (var i = 0; i < PHRASES.length; i++) screens.push(buildPhraseScreen(i, PHRASES[i]));
  screens.push(buildStudio());
  screens.push(buildClose());
  screens.forEach(function(s){ main.appendChild(s); });
  document.getElementById("pz-back").addEventListener("click", function(){ showScreen(current - 1); });
  document.getElementById("pz-fwd").addEventListener("click", function(){ showScreen(current + 1); });
  function bye(){ stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest(); clearAllTakes(); stopAudio(); }
  window.addEventListener("pagehide", bye);
  window.addEventListener("beforeunload", bye);
  showScreen(0);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

/* Exposed for the verification harness only. */
window.__PZ__ = {
  CONFIG: CONFIG, AUDIO_FILES: AUDIO_FILES, PHRASES: PHRASES,
  sanitiseFeedback: sanitiseFeedback, isSafeEndpoint: isSafeEndpoint,
  showScreen: showScreen, state: function(){ return { current: current, localComplete: localComplete, takes: takes.length, liveStream: !!recStream, liveRecorder: !!recorder }; }
};
})();
