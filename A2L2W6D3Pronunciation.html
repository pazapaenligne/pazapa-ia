function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function btn(label, cls, onClick){
  var b = el("button", cls || "", label);
  b.type = "button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }

function isImg(v){ return typeof v==="string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function picture(key, alt, cls){
  var v = IMAGES[key];
  if (!isImg(v)) return null;
  var im = document.createElement("img");
  im.src = v; im.alt = alt || ""; im.setAttribute("decoding","async");
  if (cls) im.className = cls;
  return im;
}
function isSafeEndpoint(v){
  if (typeof v!=="string" || v==="" || v!==v.trim()) return false;
  var u; try { u = new URL(v); } catch(e){ return false; }
  if (u.protocol!=="https:") return false;
  if (u.hostname==="localhost"||u.hostname==="127.0.0.1"||u.hostname==="[::1]") return false;
  if (u.search!==""||u.hash!==""||u.username!==""||u.password!=="") return false;

}
function hasAudio(key){
  var v = AUDIO_FILES[key];
  return typeof v==="string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav|webm|x-m4a|aac);base64,[A-Za-z0-9+\/=]+$/.test(v);

/* ============================================================================
   AUDIO — one element, one sound at a time, only ever started by a click/tap
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusy = null, audioToken = 0;

function refreshPlayButtons(){
  var bs = document.querySelectorAll("[data-play-key]");
  for (var i=0;i<bs.length;i++){
    var b = bs[i], playing = (b.getAttribute("data-play-key")===audioBusy);
    b.setAttribute("aria-pressed", playing ? "true":"false");
    b.textContent = playing ? b.getAttribute("data-stop") : b.getAttribute("data-play");
  }
}
function stopAudio(){
  audioToken++;
  try { audioEl.pause(); } catch(e){}
  try { if (audioEl.readyState>0) audioEl.currentTime = 0; } catch(e){}
  audioBusy = null;
  refreshPlayButtons();
}
function playSource(src, key){
  if (!src) return;
  if (audioBusy===key){ stopAudio(); return; }
  stopAudio(); stopSpeech(); stopRecorderNow();
  var tok = ++audioToken; audioBusy = key; refreshPlayButtons();
  try {
    if (audioEl.getAttribute("src")!==src) audioEl.src = src;
    else { try { audioEl.currentTime = 0; } catch(e2){} }
    var p = audioEl.play();
    if (p && p.catch) p.catch(function(){
      if (tok!==audioToken) return;
      audioBusy = null; refreshPlayButtons();
      announce("The sound did not play.");
    });
  } catch(e){ if (tok===audioToken){ audioBusy=null; refreshPlayButtons(); } }
}
audioEl.addEventListener("ended", function(){ audioBusy=null; refreshPlayButtons(); });
audioEl.addEventListener("error", function(){ if (!audioEl.getAttribute("src")) return; audioBusy=null; refreshPlayButtons(); });

/* A play button that toggles to Stop. */
function playButton(key, playLabel, stopLabel, getSrc, aria){
  var b = btn(playLabel, "pz-btn-help");

}
/* Model Listen control, or an honest unavailable note. Never TTS. */
function modelControl(p){
  if (hasAudio(p.id)){
    return playButton("model:"+p.id, "Hear the phrase", "Stop", function(){ return AUDIO_FILES[p.id]; },
      "Hear the phrase: " + disp(p.text));

/* ============================================================================
   SPEECH RECOGNITION + AI CHECK (words only, never audio)
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var speechCur = null;   /* {r, timer, widget} */

function aiAvailable(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function stopSpeech(){
  if (!speechCur) return;
  var c = speechCur; speechCur = null;
  if (c.timer) clearTimeout(c.timer);
  try { c.r.onresult=null; c.r.onerror=null; c.r.onend=null; } catch(e){}
  try { c.r.abort(); } catch(e){}
  if (c.widget) c.widget.setBusy(false);
}

function sanitiseFeedback(data, phrase){
  if (!data || typeof data!=="object") return null;
  var st = data.status;
  if (st!=="match" && st!=="try_again" && st!=="unclear") return null;
  var msg = (typeof data.message==="string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (msg==="" || msg.length>160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(msg)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(msg)) return null;
  var focus = (typeof data.focus==="string") ? data.focus.replace(/\s+/g," ").trim() : "";
  if (focus.length>60 || !focusApproved(focus, phrase)) focus = "";
  return { status:st, message:msg, focus:focus };
}
function focusApproved(focus, phrase){
  var norm = function(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  var f = norm(focus);
  if (f==="") return true;
  if (f===norm(phrase.open+" / "+phrase.rest)) return true;
  return (" "+norm(phrase.text)+" ").indexOf(" "+f+" ")!==-1;
}

/* One reusable "say it and get an AI check" block. Several screens use it. */
function makeSpeak(phrase, heading, startLabel){
  var w = { root: el("div","pz-speak"), seq:0, ctrl:null, attempted:false, started:false };
  w.root.appendChild(el("h3", null, heading || "Say it — AI check"));
  var out = el("div"); out.setAttribute("aria-live","polite");
  var row = el("div","pz-btnrow");
  var go = null, again = null;

  if (!aiAvailable()){
    var why = !SR ? "The AI check does not work in this browser." : "The AI check is not switched on yet.";
    w.root.appendChild(el("p","pz-label", why + " Say the phrase out loud and use the self-check on the last screen."));
    w.reset = function(){}; w.setBusy = function(){};
    return w;
  }
  w.root.appendChild(el("p","pz-label","Press the button. Say the phrase once. The computer reads your words and gives one tip."));

  go = btn(startLabel || "Say it and check", "pz-btn-primary", function(){ start(); });
  go.setAttribute("aria-label", (startLabel || "Say it and check") + ": " + disp(phrase.text));
  row.appendChild(go);
  again = btn("Try again", "", function(){ w.reset(); start(); });
  again.hidden = true;
  row.appendChild(again);
  w.root.appendChild(row);
  w.root.appendChild(out);

  function status(t){
    var s = out.querySelector(".pz-status");
    if (!s){ s = el("p","pz-status"); out.appendChild(s); }
    s.textContent = t;
  }
  w.setBusy = function(b){ go.disabled = !!b; go.textContent = b ? "Listening…" : (startLabel || "Say it and check"); };
  w.reset = function(){
    w.seq++;
    if (w.ctrl){ try { w.ctrl.abort(); } catch(e){} w.ctrl = null; }
    if (speechCur && speechCur.widget===w) stopSpeech();
    clear(out); again.hidden = true; w.setBusy(false); w.attempted = false;
  };
  function finish(){ w.attempted = true; again.hidden = false; }
  function heard(text){
    var box = el("div","pz-heard");
    box.appendChild(el("p","pz-label","Your words:"));
    box.appendChild(el("p",null,text));
    out.insertBefore(box, out.firstChild);
  }
  function showFb(fb){
    var cls = fb.status==="match" ? "pz-fb pz-fb-match" : fb.status==="try_again" ? "pz-fb pz-fb-try" : "pz-fb pz-fb-unclear";
    var word = fb.status==="match" ? "Your words matched" : fb.status==="try_again" ? "Try once more" : "Not compared";
    var box = el("div", cls);
    box.appendChild(el("p","pz-fb-state",word));
    box.appendChild(el("p","pz-fb-msg",fb.message));
    if (fb.focus){
      var f = el("p","pz-fb-focus","Practise this part: ");
      f.appendChild(el("b",null,fb.focus)); box.appendChild(f);
    }
    var old = out.querySelector(".pz-fb"); if (old) out.removeChild(old);
    var s = out.querySelector(".pz-status"); if (s) s.textContent = "";
    out.appendChild(box); finish();
  }
  function unavailable(text){
    var old = out.querySelector(".pz-fb"); if (old) out.removeChild(old);
    var s = out.querySelector(".pz-status"); if (s) s.textContent = "";
    var box = el("div","pz-fb pz-fb-unclear");
    box.appendChild(el("p","pz-fb-state","Feedback unavailable"));
    box.appendChild(el("p","pz-fb-msg","The AI check is not available right now. Listen again if you can, say the phrase once more, or carry on."));
    out.appendChild(box); finish();
  }
  function request(text){
    var seq = w.seq;
    heard(text);
    status("Checking your words.");
    var ctrl = (typeof AbortController==="function") ? new AbortController() : null;
    w.ctrl = ctrl;
    var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
    var opts = { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ targetPhrase: phrase.text, recognisedText: text }),
      cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer" };
    if (ctrl) opts.signal = ctrl.signal;
    fetch(CONFIG.feedbackEndpoint, opts)
      .then(function(res){ if (!res.ok) throw new Error("status"); return res.json(); })
      .then(function(data){
        clearTimeout(timer);
        if (seq!==w.seq) return;
        w.ctrl = null;
        var safe = sanitiseFeedback(data, phrase);
        if (!safe) unavailable(); else showFb(safe);
      })
      .catch(function(){
        clearTimeout(timer);
        if (seq!==w.seq) return;
        w.ctrl = null; unavailable();
      });
  }
  function start(){
    stopAudio(); stopSpeech(); stopRecorderNow();
    w.seq++;
    var r; try { r = new SR(); } catch(e){ unavailable(); return; }
    r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
    var got = "", settled = false;
    clear(out); again.hidden = true;
    speechCur = { r:r, timer:null, widget:w };
    w.setBusy(true);
    status("Listening. Say the phrase once.");
    r.onresult = function(ev){
      try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript||""); } catch(e){ got = ""; }
    };
    r.onerror = function(ev){
      if (!speechCur || speechCur.r!==r || settled) return;
      settled = true; stopSpeech();
      var code = ev && ev.error ? String(ev.error) : "";
      if (code==="not-allowed" || code==="service-not-allowed"){
        status("The microphone is off. Allow it in your browser, then try again."); finish();
      } else if (code==="no-speech" || code==="aborted"){
        showFb({ status:"unclear", message:"I could not hear your words this time. Try again.", focus:"" });
      } else unavailable();
    };
    r.onend = function(){
      if (!speechCur || speechCur.r!==r || settled) return;
      settled = true; stopSpeech();
      var clean = got.replace(/\s+/g," ").trim();
      if (clean===""){ showFb({ status:"unclear", message:"I could not hear your words this time. Try again.", focus:"" }); return; }
      if (clean.length>200) clean = clean.slice(0,200);
      request(clean);
    };
    speechCur.timer = setTimeout(function(){
      if (!speechCur || speechCur.r!==r || settled) return;
      settled = true; stopSpeech();
      status("The AI check did not respond. You can try again."); finish();
    }, 12000);
    try { r.start(); } catch(e){ settled = true; stopSpeech(); unavailable(); }
  }
  return w;
}

/* ============================================================================
   RECORDER — getUserMedia + MediaRecorder, two takes (slot 0 and slot 1)
   ========================================================================= */
var takes = [null, null];          /* object URLs of Blob recordings */
var recWidgets = [];
var rc = { gen:0, mr:null, stream:null, widget:null, capTimer:null, tickTimer:null, t0:0, pendTimer:null, pending:null };

function recSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia==="function" &&
            typeof window.MediaRecorder!=="undefined");
}
function recUnsupportedMsg(){
  if (!window.isSecureContext) return "Recording needs a secure (https) page. You can still say the phrase and use the self-check.";
  if (!navigator.mediaDevices || typeof window.MediaRecorder==="undefined") return "Recording does not work in this browser. You can still say the phrase and use the self-check.";
  return "Recording is not available. You can still say the phrase and use the self-check.";
}
function recMime(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i=0;i<c.length;i++){ try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){} }
  return "";
}
function releaseStream(s){
  if (!s) return;
  try { var t = s.getTracks(); for (var i=0;i<t.length;i++){ try { t[i].stop(); } catch(e){} } } catch(e){}
}
function fmtTime(ms){ var s = Math.floor(ms/1000); return "0:" + (s<10?"0":"") + s; }
function maxLabel(){ return fmtTime(CONFIG.recordMaxMs); }

function deleteTake(slot){
  if (audioBusy==="take:"+slot) stopAudio();
  if (takes[slot]){ try { URL.revokeObjectURL(takes[slot]); } catch(e){} takes[slot] = null; }
  renderRecorders(); renderCompare();
}
function cancelPending(){
  if (rc.pendTimer){ clearTimeout(rc.pendTimer); rc.pendTimer = null; }
  if (rc.pending){ rc.gen++; var w = rc.pending; rc.pending = null; w.status("Cancelled. You can start again."); }
}
function stopRecorderNow(){
  cancelPending();
  if (rc.mr){ try { if (rc.mr.state!=="inactive") rc.mr.stop(); } catch(e){} }
}
function clearTimers(){
  if (rc.capTimer){ clearTimeout(rc.capTimer); rc.capTimer = null; }
  if (rc.tickTimer){ clearInterval(rc.tickTimer); rc.tickTimer = null; }
}

function startRec(w){
  if (!recSupported()){ w.status(recUnsupportedMsg()); return; }
  stopAudio(); stopSpeech(); stopRecorderNow();
  var gen = ++rc.gen;
  rc.pending = w; w.state = "pending"; renderRecorders();
  w.status("Asking for the microphone. Choose Allow.");
  rc.pendTimer = setTimeout(function(){
    if (gen!==rc.gen) return;
    rc.pendTimer = null; rc.pending = null; rc.gen++;
    w.state = "idle"; renderRecorders();
    w.status("The microphone did not answer. Check your browser settings, then try again.");
  }, 15000);

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (rc.pendTimer){ clearTimeout(rc.pendTimer); rc.pendTimer = null; }
    if (gen!==rc.gen){ releaseStream(stream); return; }
    rc.pending = null;
    var chunks = [], mr, mt = recMime();
    try { mr = mt ? new MediaRecorder(stream,{mimeType:mt}) : new MediaRecorder(stream); }
    catch(e){ releaseStream(stream); w.state="idle"; renderRecorders(); w.status("Recording does not work in this browser. You can use the self-check."); return; }
    rc.mr = mr; rc.stream = stream; rc.widget = w;
    mr.ondataavailable = function(ev){ if (ev.data && ev.data.size>0) chunks.push(ev.data); };
    mr.onerror = function(){
      clearTimers(); releaseStream(stream);
      if (rc.mr===mr){ rc.mr=null; rc.stream=null; rc.widget=null; }
      if (gen!==rc.gen) return;
      w.state="idle"; renderRecorders(); w.status("The recording did not work. Please try again.");
    };
    mr.onstop = function(){
      clearTimers(); releaseStream(stream);          /* microphone released */
      if (rc.mr===mr){ rc.mr=null; rc.stream=null; rc.widget=null; }
      if (gen!==rc.gen && !w.keepOnStop){ /* superseded: still keep sound if any */ }
      var blob = null;
      try { if (chunks.length) blob = new Blob(chunks,{type: chunks[0].type || mt || "audio/mp4"}); } catch(e){ blob = null; }
      w.state = "idle";
      if (!blob || blob.size<200){
        renderRecorders(); w.status("No sound was recorded. Check your microphone and try again.");
        return;
      }
      if (takes[w.slot]){ try { URL.revokeObjectURL(takes[w.slot]); } catch(e){} }
      takes[w.slot] = URL.createObjectURL(blob);
      w.attempted = true;
      renderRecorders(); renderCompare();
      w.status("Your recording is ready. Press Hear my recording.");
    };
    try { mr.start(); } catch(e){
      releaseStream(stream); rc.mr=null; rc.stream=null; rc.widget=null;
      w.state="idle"; renderRecorders(); w.status("Recording does not work in this browser. You can use the self-check."); return;
    }
    w.state = "recording"; w.t0 = Date.now();
    renderRecorders();
    w.status("Recording. Say the phrase, then press Stop.");
    rc.tickTimer = setInterval(function(){ w.setTimer(Date.now()-w.t0); }, 200);
    rc.capTimer = setTimeout(function(){ try { if (mr.state==="recording") mr.stop(); } catch(e){} }, CONFIG.recordMaxMs);
  }).catch(function(err){
    if (rc.pendTimer){ clearTimeout(rc.pendTimer); rc.pendTimer = null; }
    if (gen!==rc.gen) return;
    rc.pending = null; w.state = "idle"; renderRecorders();
    var n = err && err.name ? err.name : "";
    var m;
    if (n==="NotAllowedError" || n==="SecurityError") m = "The microphone is blocked. Allow the microphone in your browser, then try again.";
    else if (n==="NotFoundError" || n==="OverconstrainedError") m = "No microphone was found. Connect one and try again.";
    else if (n==="NotReadableError" || n==="AbortError") m = "The microphone is busy in another app. Close it and try again.";
    else m = "The microphone did not start. Please try again.";
    w.status(m);
  });
}

function makeRecorder(slot, label){
  var w = { slot:slot, state:"idle", attempted:false, t0:0 };
  w.root = el("div");
  var timer = el("p","pz-timer", "0:00 / " + maxLabel());
  timer.setAttribute("aria-hidden","true");
  var tw = el("p","pz-label"); tw.appendChild(timer);
  var status = el("p","pz-status"); status.setAttribute("role","status"); status.setAttribute("aria-live","polite");
  var row = el("div","pz-btnrow");
  var bStart = btn("Start recording","pz-btn-primary", function(){ startRec(w); });
  var bStop  = btn("Stop","pz-btn-help", function(){ stopRecorderNow(); });
  var bHear  = playButton("take:"+slot, "Hear my recording", "Stop", function(){ return takes[slot]; });
  bHear.className = "pz-btn-primary";
  var bAgain = btn("Record again","", function(){ startRec(w); });
  var bDel   = btn("Delete recording","", function(){ deleteTake(slot); w.status("Your recording is deleted."); });
  row.appendChild(bStart); row.appendChild(bStop); row.appendChild(bHear); row.appendChild(bAgain); row.appendChild(bDel);
  w.root.appendChild(tw); w.root.appendChild(row); w.root.appendChild(status);
  w.status = function(t){ status.textContent = t; };
  w.setTimer = function(ms){ timer.textContent = fmtTime(Math.min(ms, CONFIG.recordMaxMs)) + " / " + maxLabel(); };
  w.render = function(){
    var has = !!takes[slot];
    bStart.hidden = has || w.state==="recording";
    bStart.disabled = (w.state==="pending");
    bStop.hidden = (w.state!=="recording");
    bHear.hidden = !has || w.state==="recording";
    bAgain.hidden = !has || w.state==="recording";
    bAgain.disabled = (w.state==="pending");
    bDel.hidden = !has || w.state==="recording";
    bStart.textContent = (w.state==="pending") ? "Waiting for microphone…" : "Start recording";
    if (w.state!=="recording") timer.textContent = "0:00 / " + maxLabel();
    timer.parentNode.hidden = !(w.state==="recording" || has || w.state==="pending");
    if (!recSupported()){ row.hidden = true; w.status(recUnsupportedMsg()); } else row.hidden = false;
  };
  w.reset = function(){
    stopRecorderNow();
    if (takes[slot]) deleteTake(slot);
    w.state = "idle"; w.attempted = false; w.status(""); w.render();
  };
  recWidgets.push(w);
  w.render();
  return w;
}
function renderRecorders(){ for (var i=0;i<recWidgets.length;i++) recWidgets[i].render(); }

  s2.openTokens = el("div","pz-tokens"); panel.appendChild(s2.openTokens);
  panel.appendChild(el("h3",null,"Service action"));
  s2.restTokens = el("div","pz-tokens"); panel.appendChild(s2.restTokens);
  var row = el("div","pz-btnrow");
  s2.check = btn("Check my request","pz-btn-primary", checkBuild);
  row.appendChild(s2.check);
  panel.appendChild(row);
  s2.out = el("div"); s2.out.setAttribute("aria-live","polite");
  panel.appendChild(s2.out);
  s.appendChild(panel);

  s2.echo = el("div","pz-panel"); s2.echo.hidden = true;
  s.appendChild(s2.echo);
  s2.pending = el("p","pz-label");
  renderNotice();
  return s;
}

function renderNotice(){
  var i;
  clear(s2.tiles);
  var order = s2.tileOrder || (s2.tileOrder = shuffle(PHRASES));
  for (i=0;i<order.length;i++){ (function(p){
    var li = el("li");
    var b = btn("", "pz-tile");
    var im = picture(p.img, "");
    if (im){ im.alt = ""; b.appendChild(im); }
    b.appendChild(el("span",null,p.tile));
    if (build.built[p.id]) b.appendChild(el("span","pz-built","Built"));
    b.setAttribute("aria-pressed", build.service===p.id ? "true":"false");
    b.setAttribute("aria-label", p.tile + (build.built[p.id] ? ", built" : "") + ". " + p.alt);
    b.addEventListener("click", function(){ chooseService(p.id); });
    li.appendChild(b); s2.tiles.appendChild(li);
  })(order[i]); }

  clear(s2.openTokens); clear(s2.restTokens);
  var opens = s2.openOrder || (s2.openOrder = shuffle(["I'd like to","Could you"]));
  var rests = s2.restOrder || (s2.restOrder = shuffle(["cancel my plan.","change my package.","explain the fee?"]));
  function tok(text, kind){
    var b = btn(disp(text),"pz-token");
    b.setAttribute("aria-pressed", build[kind]===text ? "true":"false");
    b.disabled = !build.service;
    b.addEventListener("click", function(){
      build[kind] = (build[kind]===text) ? null : text;
      clear(s2.out); renderNotice();
      announce("Chosen: " + disp(text));
    });
    return b;
  }
  for (i=0;i<opens.length;i++) s2.openTokens.appendChild(tok(opens[i],"open"));
  for (i=0;i<rests.length;i++) s2.restTokens.appendChild(tok(rests[i],"rest"));

  function fill(slot, label, val){
    clear(slot);
    slot.appendChild(el("span",null,label));
    slot.appendChild(el("strong",null, val ? disp(val) : "—"));
  }
  fill(s2.slotOpen,"Opening group",build.open);
  fill(s2.slotRest,"Service action",build.rest);
  s2.check.disabled = !(build.service && build.open && build.rest);
}

function chooseService(id){
  build.service = id; build.open = null; build.rest = null;
  clear(s2.out);
  renderNotice();
  announce("Service chosen: " + byId(id).tile + ". Now choose two groups.");
}

function checkBuild(){
  var p = byId(build.service);
  if (!p || !build.open || !build.rest) return;
  build.attempted = true;
  clear(s2.out);
  var okOpen = (build.open===p.open), okRest = (build.rest===p.rest);
  if (okOpen && okRest){
    build.built[p.id] = true;
    var box = el("div","pz-fb pz-fb-match");
    box.appendChild(el("p","pz-fb-state","That works"));
    box.appendChild(el("p","pz-fb-msg","Say it as two groups: " + disp(p.open) + " / " + disp(p.rest)));
    s2.out.appendChild(box);
    showEcho(p);
    renderNotice();
    announce("That works. Now say the request.");
  } else {
    var b2 = el("div","pz-fb pz-fb-try");
    b2.appendChild(el("p","pz-fb-state","Try once more"));
    var msg = okOpen ? "The opening group is right. Check the service action."
            : okRest ? "The service action is right. Check the opening group."
            : "Look at the service you chose, then change the groups.";
    b2.appendChild(el("p","pz-fb-msg",msg));
    s2.out.appendChild(b2);
    s2.echo.hidden = true;
  }
}

function showEcho(p){
  s2.echo.hidden = false;
  clear(s2.echo);
  s2.echo.appendChild(el("h2",null,"Say your request"));
  s2.echo.appendChild(el("p","pz-target",disp(p.text)));
  var row = el("div","pz-btnrow");
  row.appendChild(modelControl(p));
  s2.echo.appendChild(row);
  var w = speakWidgets.echo[p.id] || (speakWidgets.echo[p.id] = makeSpeak(p,"Say it — AI check","Say it and check"));
  s2.echo.appendChild(w.root);
}

function resetNotice(){
  stopAudio(); stopSpeech();
  for (var k in speakWidgets.echo){ if (speakWidgets.echo.hasOwnProperty(k)) speakWidgets.echo[k].reset(); }
  speakWidgets.echo = {};
  build = { service:null, open:null, rest:null, attempted:false, built:{} };
  s2.tileOrder = null; s2.openOrder = null; s2.restOrder = null;
  clear(s2.out); s2.echo.hidden = true; clear(s2.echo);
  renderNotice();
}

/* ============================================================================
   SCREEN 3 — rehearse in chunks: phrase / rhythm strips
   ========================================================================= */
var s3 = {};
function buildRehearse(){
  var s = screenShell("Rehearse in groups","pz-s3");
  s.appendChild(el("p",null,"Hear the phrase. Say the opening quickly, as one group. Then say the service words clearly."));
  s.appendChild(fr("Dites le début rapidement, en un seul groupe. Puis dites clairement le service."));
  s3.root = s;
  screenTryAgain(s, resetRehearse, "Try again: rehearse the groups");
  s3.host = el("div"); s.appendChild(s3.host);
  renderRehearse();
  return s;
}
function renderRehearse(){
  clear(s3.host);
  for (var i=0;i<PHRASES.length;i++){ (function(p){
    var card = el("section","pz-rhythm");
    card.setAttribute("aria-label","Phrase: " + disp(p.text));
    var top = el("div","pz-rhythm-top");
    var im = picture(p.img,"");
    if (im){ im.alt = ""; top.appendChild(im); }
    var h = el("h2",null,disp(p.text)); h.style.margin = "0";
    top.appendChild(h);
    card.appendChild(top);

    var strip = el("div","pz-strip");
    strip.setAttribute("role","group");
    strip.setAttribute("aria-label","Two groups: " + disp(p.open) + ", then " + disp(p.rest));
    var b1 = el("div","pz-beat pz-beat-open"); b1.appendChild(document.createTextNode(disp(p.open)));
    b1.appendChild(el("small",null,"Group 1: say it fast"));
    var pause = el("div","pz-pause","/"); pause.setAttribute("aria-label","small pause");
    var b2 = el("div","pz-beat pz-beat-rest"); b2.appendChild(document.createTextNode(disp(p.rest)));
    b2.appendChild(el("small",null,"Group 2: say it clearly"));
    strip.appendChild(b1); strip.appendChild(pause); strip.appendChild(b2);
    card.appendChild(strip);
    card.appendChild(el("p","pz-cue","Text cue: the opening is one quick group, then a tiny pause, then the service words."));

    var row = el("div","pz-btnrow"); row.appendChild(modelControl(p)); card.appendChild(row);
    var w = speakWidgets.rhythm[p.id] || (speakWidgets.rhythm[p.id] = makeSpeak(p,"Say it — AI check","Say it and check"));
    card.appendChild(w.root);
    s3.host.appendChild(card);
  })(PHRASES[i]); }
}
function resetRehearse(){
  stopAudio(); stopSpeech();
  for (var k in speakWidgets.rhythm){ if (speakWidgets.rhythm.hasOwnProperty(k)) speakWidgets.rhythm[k].reset(); }
}

/* ============================================================================
   SCREEN 4 — recording studio (take 1)
   ========================================================================= */
var s4 = {};
function buildStudio(){
  var s = screenShell("Recording studio","pz-s4");
  s.appendChild(el("p",null,"Record one useful phrase. Keep the words in front of you."));
  s.appendChild(fr("Enregistrez une phrase utile. Gardez les mots sous les yeux."));
  screenTryAgain(s, resetStudio, "Try again: recording studio");
  var studio = el("div","pz-studio");
  studio.appendChild(el("p","pz-label","Your phrase"));
  studio.appendChild(el("p","pz-target",disp(TARGET.text)));
  var strip = el("div","pz-strip");
  var b1 = el("div","pz-beat pz-beat-open"); b1.appendChild(document.createTextNode(disp(TARGET.open)));
  var pause = el("div","pz-pause","/"); pause.setAttribute("aria-label","small pause");
  var b2 = el("div","pz-beat pz-beat-rest"); b2.appendChild(document.createTextNode(disp(TARGET.rest)));
  strip.appendChild(b1); strip.appendChild(pause); strip.appendChild(b2);
  studio.appendChild(strip);
  var row = el("div","pz-btnrow"); row.appendChild(modelControl(TARGET)); studio.appendChild(row);
  recorder0 = makeRecorder(0);
  studio.appendChild(recorder0.root);
  s.appendChild(studio);
  speakWidgets.studio = makeSpeak(TARGET,"Say it — AI check","Say it and check");
  s.appendChild(speakWidgets.studio.root);
  s4.root = s;
  return s;
}
function resetStudio(){
  stopAudio(); stopSpeech();
  recorder0.reset();
  speakWidgets.studio.reset();
}

/* ============================================================================
   SCREEN 5 — compare and get feedback (take 2 and playback)
   ========================================================================= */
var s5 = {};
function buildCompare(){
  var s = screenShell("Compare your takes","pz-s5");
  s.appendChild(el("p",null,"Listen to the model and your takes. Record a second take if you like."));
  s.appendChild(fr("Écoutez le modèle et vos enregistrements. Faites une deuxième prise si vous voulez."));
  screenTryAgain(s, resetCompare, "Try again: compare your takes");
  s.appendChild(el("p","pz-target",disp(TARGET.text)));

  s5.cols = el("div","pz-compare");
  s.appendChild(s5.cols);

  var panel = el("div","pz-studio");
  panel.appendChild(el("h2",null,"Second take"));
  recorder1 = makeRecorder(1);
  panel.appendChild(recorder1.root);
  s.appendChild(panel);

  speakWidgets.compare = makeSpeak(TARGET,"Get AI feedback","Get AI feedback");
  s.appendChild(speakWidgets.compare.root);

  var tip = el("div","pz-panel");
  tip.appendChild(el("h3",null,"One thing to try"));
  tip.appendChild(el("p",null,"Say “I’d like to” quickly, as one group. Then say “cancel my plan” clearly. Try again and listen for the difference."));
  s.appendChild(tip);
  s5.root = s;
  renderCompare();
  return s;
}
function renderCompare(){
  if (!s5.cols) return;
  clear(s5.cols);
  var m = el("div","pz-col"); m.appendChild(el("h3",null,"Model"));
  if (hasAudio(TARGET.id)){
    var r = el("div","pz-btnrow");
    r.appendChild(playButton("model:cmp","Hear the model","Stop",function(){ return AUDIO_FILES[TARGET.id]; }));
    m.appendChild(r);
  } else m.appendChild(el("p","pz-label","The model recording is not available yet. The phrase is shown above."));
  s5.cols.appendChild(m);
  for (var slot=0; slot<2; slot++){ (function(slot){
    var c = el("div","pz-col"); c.appendChild(el("h3",null,"Take " + (slot+1)));
    if (takes[slot]){
      var r2 = el("div","pz-btnrow");
      var hb = playButton("take:"+slot+":cmp","Hear take " + (slot+1),"Stop",function(){ return takes[slot]; });
      hb.className = "pz-btn-primary";
      r2.appendChild(hb);
      r2.appendChild(btn("Delete take " + (slot+1),"",function(){ deleteTake(slot); announce("Take " + (slot+1) + " deleted."); }));
      c.appendChild(r2);
    } else {
      c.appendChild(el("p","pz-label", slot===0 ? "No recording yet. Record in the Recording studio." : "No recording yet. Use Second take below."));
    }
    s5.cols.appendChild(c);
  })(slot); }
}
function resetCompare(){
  stopAudio(); stopSpeech();
  recorder1.reset();
  speakWidgets.compare.reset();
}

/* ============================================================================
   SCREEN 6 — practical close, Done and Try again
   ========================================================================= */
var s6 = {};
function buildClose(){
  var s = screenShell("Well done","pz-s6");
  var box = el("div","pz-complete");
  box.appendChild(el("p",null,"You practised: " + disp(TARGET.text)));
  box.appendChild(el("p",null,"Focus: say the opening as one small group, then keep the service action clear."));
  s.appendChild(box);
  s.appendChild(fr("Vous avez pratiqué une demande polie. Le début forme un seul petit groupe."));

  var sc = el("div","pz-panel");
  sc.appendChild(el("h2",null,"Self-check"));
  sc.appendChild(el("p","pz-label","Use this if you did not record. It is optional if you recorded."));
  var items = [
    ["a","I said the phrase out loud."],
    ["b","I said “I’d like to” as one group."],
    ["c","I said the phrase a second time."]
  ];
  for (var i=0;i<items.length;i++){ (function(it){
    var lab = el("label","pz-check");
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = self[it[0]];
    cb.addEventListener("change", function(){ self[it[0]] = cb.checked; s6.note.textContent = ""; });
    lab.appendChild(cb); lab.appendChild(el("span",null,it[1]));
    sc.appendChild(lab);
  })(items[i]); }
  s6.checks = sc;
  s.appendChild(sc);

  var row = el("div","pz-btnrow");
  s6.done = btn("Done","pz-btn-done", onDone);
  s6.again = btn("Try again","", fullReset);
  s6.again.setAttribute("aria-label","Try again: start the whole activity again");
  row.appendChild(s6.done); row.appendChild(s6.again);
  s.appendChild(row);
  s6.note = el("p","pz-note"); s6.note.setAttribute("role","status"); s6.note.setAttribute("aria-live","polite");
  s.appendChild(s6.note);
  s6.status = el("p","pz-status"); s6.status.setAttribute("role","status"); s6.status.setAttribute("aria-live","polite");
  s.appendChild(s6.status);
  return s;
}
function selfAll(){ return self.a && self.b && self.c; }
function canFinish(){ return build.attempted && (!!takes[0] || !!takes[1] || selfAll()); }

function onDone(){
  if (!canFinish()){
    var need = [];
    if (!build.attempted) need.push("build one request on the Build a polite request screen");
    if (!(takes[0]||takes[1]||selfAll())) need.push("record yourself, or tick all three boxes in the self-check");
    s6.note.textContent = "To finish, " + need.join(" and ") + ".";
    return;
  }
  s6.note.textContent = "";
  if (!finished){
    finished = true;
    if (typeof CONFIG.onComplete==="function"){ try { CONFIG.onComplete(); } catch(e){} }
  }
  s6.status.textContent = "You finished the Pronunciation Clinic.";
  s6.done.disabled = true;
}

function fullReset(){
  stopAudio(); stopSpeech(); stopRecorderNow();
  recorder0.reset(); recorder1.reset();
  resetNotice(); resetRehearse();
  for (var k in speakWidgets.rhythm){ if (speakWidgets.rhythm.hasOwnProperty(k)) speakWidgets.rhythm[k].reset(); }
  speakWidgets.rhythm = {}; renderRehearse();
  speakWidgets.studio.reset(); speakWidgets.compare.reset();
  self = { a:false, b:false, c:false };
  var cbs = s6.checks.querySelectorAll("input[type=checkbox]");
  for (var i=0;i<cbs.length;i++) cbs[i].checked = false;
  finished = false; s6.done.disabled = false; s6.status.textContent = ""; s6.note.textContent = "";
  renderCompare();
  showScreen(0);
  announce("The activity is ready again.");
}

/* ============================================================================
   NAVIGATION
   ========================================================================= */
var FWD_LABELS = ["Build a request","Rehearse the groups","Open the studio","Compare my takes","Finish up",""];

function showScreen(i){
  if (i<0 || i>=screens.length) return;
  stopAudio(); stopSpeech(); stopRecorderNow();
  for (var k=0;k<screens.length;k++){
    if (k===i) screens[k].removeAttribute("hidden"); else screens[k].hidden = true;
  }
  current = i;
  document.getElementById("pz-progress").textContent = "Screen " + (i+1) + " of " + TOTAL;
  var back = document.getElementById("pz-back"), fwd = document.getElementById("pz-fwd");
  back.hidden = (i===0);
  fwd.hidden = (i===screens.length-1);
  fwd.textContent = FWD_LABELS[i] || "Next";
  renderRecorders(); renderCompare();
  try { screens[i].focus({preventScroll:true}); } catch(e){ try { screens[i].focus(); } catch(e2){} }
  try { window.scrollTo(0,0); } catch(e){}
}

function init(){
  if (isImg(IMAGES.logo)){
    var lg = document.getElementById("pz-logo"); lg.src = IMAGES.logo; lg.removeAttribute("hidden");
  }
  var main = document.getElementById("pz-main");
  screens = [ buildScene(), buildNotice(), buildRehearse(), buildStudio(), buildCompare(), buildClose() ];
  for (var i=0;i<screens.length;i++) main.appendChild(screens[i]);
  document.getElementById("pz-back").addEventListener("click", function(){ showScreen(current-1); });
  document.getElementById("pz-fwd").addEventListener("click", function(){ showScreen(current+1); });
  function release(){ stopSpeech(); stopRecorderNow(); stopAudio(); releaseStream(rc.stream); }
  window.addEventListener("pagehide", release);
  window.addEventListener("beforeunload", release);
  showScreen(0);
}
if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();

/* Exposed for the verification harness only. */
window.__PZ__ = { takes:function(){return takes.slice();}, canFinish:canFinish, showScreen:showScreen, PHRASES:PHRASES, CONFIG:CONFIG, sanitiseFeedback:sanitiseFeedback, rc:rc };
})();
</script>
</body>
