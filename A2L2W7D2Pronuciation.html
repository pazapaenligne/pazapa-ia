PAZAPA ENGLISH FOR ADULTS — A2
Week 7 · Lesson 2 · Step 3: Pronunciation Clinic — "Driving here"
Lesson identifier: A2-W07-L2-S3
Language model: British English (en-GB)

ONE PRONUNCIATION FOCUS: word stress in driving terms. The first syllable is
the strongest part of LICence, PARKing and CAMera.

MODEL PHRASES (exact, from the production brief)
  1. I need a driving licence.     <- target recording
  2. Where is the parking?
  3. There is a speed camera.

IMAGES: all taken from Week_7_Lesson_2_A2_Teaching_PPT_FINAL.pptx (licence
centre scene, licence card, parking bay, speed camera, driving, three
faceless adult women). Women only, no faces. Embedded whole (not cropped).

AUDIO — three supplied MP3 recordings are embedded unmodified (original file
bytes, mono 44.1 kHz): driving.mp3 -> licence_phrase, parking.mp3 ->
parking_question, speedcamera.mp3 -> camera_phrase. The filename-to-phrase
mapping is read from the filenames and is not independently verified by ear.
No text-to-speech is used, ever. To replace one, paste a complete Base64 Data URL.
  licence_phrase    -> "I need a driving licence."
  parking_question  -> "Where is the parking?"
  camera_phrase     -> "There is a speed camera."

Hear my recording, Record again and Delete recording. Takes stay in memory only
while the activity is open and are never uploaded or stored.

AI FEEDBACK: voluntary. Only recognised TEXT is sent (never audio). It compares
words, not stress, and never gives a score, grade or accent judgement.

HOST NOTE (for the course administrator only): recording needs an https page,
and an embedding iframe must carry allow="microphone".

.pz-sign img{max-width:100%;max-height:110px;width:auto;height:auto;border-radius:8px;}
.pz-sign p{margin:6px 0 0;font-family:var(--pz-head-font);font-size:1.05rem;line-height:1.35;}

/* 2. NOTICE — tap the strong part */

.pz-nitem{border:2px solid var(--pz-blue-40);border-left:8px solid var(--pz-blue);border-radius:var(--pz-radius);padding:12px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}

.pz-syls button{font-size:1.3rem;min-width:72px;background:#fff;}

.pz-syls button.pz-no{background:var(--pz-yellow-40);border-color:var(--pz-yellow);}

.pz-beat{text-align:center;}

.pz-beat.strong .w{border-color:var(--pz-blue);background:var(--pz-blue-20);font-size:1.5rem;}
.pz-beat .d{display:block;margin:4px auto 0;border-radius:50%;background:var(--pz-dark);width:10px;height:10px;}
.pz-beat.strong .d{width:22px;height:22px;background:var(--pz-blue);border:3px solid var(--pz-dark);}

  .pz-nitem img{width:72px;}
}

function el(tag, cls, text){ var n=document.createElement(tag); if(cls) n.className=cls; if(text!==undefined&&text!==null) n.textContent=text; return n; }
function announce(m){ var l=document.getElementById("pz-live"); if(l) l.textContent=String(m||""); }
function fr(text){ var p=el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function shuffle(a){ var r=a.slice(); for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function isValidAudio(key){ var v=AUDIO_FILES[key]; return typeof v==="string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function isEmbeddedImage(v){ return typeof v==="string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function isSafeEndpoint(v){
  if(typeof v!=="string"||v==="") return false;
  var u; try{ u=new URL(v); }catch(e){ return false; }
  return u.protocol==="https:" && u.hostname!=="localhost" && u.hostname!=="127.0.0.1" && u.search==="" && u.hash==="" && u.username==="" && u.password==="";
}
function img(key, alt, cls){
  var f=document.createElement("img");
  if(isEmbeddedImage(IMAGES[key])) f.src=IMAGES[key];
  f.alt=alt||""; f.setAttribute("decoding","async"); if(cls) f.className=cls; return f;
}
/* A phrase with its strong part marked: bold + underline + capitals. */
function phraseNode(p, tag, cls){
  var n=el(tag||"span", cls||null);
  n.setAttribute("aria-label", p.text+" Strong part: "+p.strong+".");
  for(var i=0;i<p.parts.length;i++){
    var part=p.parts[i];
    if(typeof part==="string") n.appendChild(document.createTextNode(part));
    else { var s=el("span","st",part.st); s.setAttribute("aria-hidden","true"); n.appendChild(s); }
  }
  return n;
}

/* ============================================================================
   AUDIO — one element, one source at a time, never autoplayed
   ========================================================================= */
var audioEl=document.getElementById("pz-audio");
var audioBusyKey=null, audioToken=0;

function stopAudio(){
  audioToken++;
  if(audioEl){ try{ audioEl.pause(); }catch(e){} try{ if(audioEl.readyState>0) audioEl.currentTime=0; }catch(e){} }
  audioBusyKey=null; refreshAudioButtons();
}
function playSource(src, busyKey){
  if(!audioEl||!src) return;
  if(audioBusyKey===busyKey){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopAnyRecording();
  var token=++audioToken; audioBusyKey=busyKey; refreshAudioButtons();
  try{
    if(audioEl.getAttribute("src")!==src) audioEl.src=src;
    else { try{ if(audioEl.readyState>0) audioEl.currentTime=0; }catch(e2){} }
    var p=audioEl.play();
    if(p&&typeof p.catch==="function") p.catch(function(){ if(token!==audioToken) return; audioBusyKey=null; refreshAudioButtons(); announce("The audio did not play."); });
  }catch(e){ if(token!==audioToken) return; audioBusyKey=null; refreshAudioButtons(); }
}
function playModel(key){ if(isValidAudio(key)) playSource(AUDIO_FILES[key], key); }
if(audioEl){
  audioEl.addEventListener("ended", function(){ audioBusyKey=null; refreshAudioButtons(); });
  audioEl.addEventListener("error", function(){ if(!audioEl.getAttribute("src")) return; audioBusyKey=null; refreshAudioButtons(); });
}
function refreshAudioButtons(){
  var btns=document.querySelectorAll("[data-pkey]");
  for(var i=0;i<btns.length;i++){
    var b=btns[i], playing=(b.getAttribute("data-pkey")===audioBusyKey);
    b.setAttribute("aria-pressed", playing?"true":"false");
    b.textContent = playing ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");
  }
}
function modelButton(key, label, phraseText){
  if(!isValidAudio(key)) return null;
  var b=el("button","pz-btn-help",label); b.type="button";
  b.setAttribute("data-pkey",key); b.setAttribute("data-label-play",label); b.setAttribute("data-label-stop","Stop");
  b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label",label+": "+phraseText);
  b.addEventListener("click", function(){ playModel(key); });
  return b;
}
function audioNote(){ return el("p","pz-label","The audio model is not added yet. Read the phrase and say it aloud."); }

/* ============================================================================
   RECORD YOURSELF — many small units, one live recording at a time.
   getUserMedia is called only when the learner presses Start recording.
   ========================================================================= */
var RECORD_MAX_MS = 20000;            /* documented cap; no countdown is shown */
var RECORD_PERMISSION_TIMEOUT_MS = 10000;
var units = {}, unitOrder = [];

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia==="function" && typeof window.MediaRecorder!=="undefined");
}
function unsupportedMessage(){
  if(!window.isSecureContext) return "Recording needs a secure page. Say the phrase aloud, then use the practice box at the end.";
  return "Recording does not work in this browser. Say the phrase aloud, then use the practice box at the end.";
}
function recMimeType(){
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for(var i=0;i<c.length;i++){ try{ if(window.MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
function releaseStream(s){ if(!s) return; try{ var t=s.getTracks(); for(var i=0;i<t.length;i++){ try{ t[i].stop(); }catch(e){} } }catch(e){} }
function fmtTime(ms){ var s=Math.floor(ms/1000); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }

function renderUnit(u){
  if(!u.btnMain) return;
  var st=u.state;
  u.box.className = "pz-rec" + (st==="recording" ? " is-rec" : "");
  u.btnMain.hidden = (st==="ready");
  u.btnMain.textContent = (st==="recording"||st==="pending") ? "Stop" : "Start recording";
  u.btnMain.setAttribute("aria-pressed", (st==="recording"||st==="pending") ? "true":"false");
  u.after.hidden = (st!=="ready");
  u.timeEl.hidden = !(st==="recording");
  derived();
}
function setStatus(u, text){ if(u.statusEl) u.statusEl.textContent=text; }

function clearUnit(u){
  if(audioBusyKey==="rec:"+u.id) stopAudio();
  if(u.url){ try{ URL.revokeObjectURL(u.url); }catch(e){} u.url=null; }
  u.gen++;
  if(u.mr){ try{ if(u.mr.state!=="inactive") u.mr.stop(); }catch(e){} }
  releaseStream(u.stream); u.stream=null; u.mr=null;
  if(u.tick){ clearInterval(u.tick); u.tick=null; }
  if(u.cap){ clearTimeout(u.cap); u.cap=null; }
  if(u.perm){ clearTimeout(u.perm); u.perm=null; }
  u.state="idle"; renderUnit(u); refreshAudioButtons();
}
function stopUnit(u){
  if(u.state==="pending"){ u.gen++; if(u.perm){ clearTimeout(u.perm); u.perm=null; } u.state="idle"; setStatus(u,"Cancelled. Press Start recording when you are ready."); renderUnit(u); return; }
  if(u.state==="recording" && u.mr){ try{ if(u.mr.state!=="inactive") u.mr.stop(); }catch(e){} }
}
function stopAnyRecording(){ for(var i=0;i<unitOrder.length;i++){ var u=units[unitOrder[i]]; if(u.state==="pending"||u.state==="recording") stopUnit(u); } }
function clearAllUnits(){ for(var i=0;i<unitOrder.length;i++) clearUnit(units[unitOrder[i]]); for(var j=0;j<unitOrder.length;j++) setStatus(units[unitOrder[j]],"Ready."); }

function startUnit(u){
  if(!recordingSupported()) return;
  stopAudio(); stopRecognition(); stopAnyRecording();
  clearUnit(u);
  var gen=++u.gen;
  u.state="pending"; setStatus(u,"Waiting for the microphone."); renderUnit(u);
  u.perm=setTimeout(function(){
    if(gen!==u.gen) return; u.gen++; u.perm=null; u.state="idle";
    setStatus(u,"The microphone did not answer. Try again, or use the practice box at the end."); renderUnit(u);
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(u.perm){ clearTimeout(u.perm); u.perm=null; }
    if(gen!==u.gen){ releaseStream(stream); return; }
    var chunks=[], mr;
    try{ var mt=recMimeType(); mr = mt ? new window.MediaRecorder(stream,{mimeType:mt}) : new window.MediaRecorder(stream); }
    catch(e){ releaseStream(stream); u.state="idle"; setStatus(u,"Recording does not work in this browser. Use the practice box at the end."); renderUnit(u); return; }
    u.mr=mr; u.stream=stream;
    mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size>0) chunks.push(ev.data); };
    mr.onerror=function(){
      releaseStream(stream); if(u.stream===stream) u.stream=null; if(u.mr===mr) u.mr=null;
      if(u.tick){ clearInterval(u.tick); u.tick=null; } if(u.cap){ clearTimeout(u.cap); u.cap=null; }
      if(gen!==u.gen) return; u.state="idle"; setStatus(u,"The recording did not work. Please try again."); renderUnit(u);
    };
    mr.onstop=function(){
      releaseStream(stream); if(u.stream===stream) u.stream=null; if(u.mr===mr) u.mr=null;
      if(u.tick){ clearInterval(u.tick); u.tick=null; } if(u.cap){ clearTimeout(u.cap); u.cap=null; }
      if(gen!==u.gen) return;
      var blob=null;
      try{ blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/mp4"}); }catch(e){}
      if(!blob||!blob.size){ u.state="idle"; setStatus(u,"I did not catch that. Please try again."); renderUnit(u); return; }
      u.url=URL.createObjectURL(blob); u.state="ready";
      setStatus(u,"Recording saved for playback."); renderUnit(u); refreshAudioButtons();
      announce("Recording saved for playback.");
    };
    try{ mr.start(); }catch(e){ releaseStream(stream); u.mr=null; u.stream=null; u.state="idle"; setStatus(u,"Recording does not work in this browser. Use the practice box at the end."); renderUnit(u); return; }
    u.state="recording"; u.t0=Date.now(); u.timeEl.textContent="0:00"; setStatus(u,"Recording. Say the phrase."); renderUnit(u);
    u.tick=setInterval(function(){ u.timeEl.textContent=fmtTime(Date.now()-u.t0); }, 250);
    u.cap=setTimeout(function(){ try{ if(mr.state==="recording") mr.stop(); }catch(e){} }, RECORD_MAX_MS);
  }).catch(function(err){
    if(u.perm){ clearTimeout(u.perm); u.perm=null; }
    if(gen!==u.gen) return; u.state="idle";
    var n=err&&err.name;
    if(n==="NotFoundError"||n==="OverconstrainedError") setStatus(u,"No microphone was found. Use the practice box at the end.");
    else setStatus(u,"The microphone is off. Allow it and try again, or use the practice box at the end.");
    renderUnit(u);
  });
}

  play.setAttribute("aria-pressed","false"); play.setAttribute("aria-label","Hear my recording of: "+phraseText);

   AI FEEDBACK (voluntary) — recognised TEXT only. Never a score or grade.
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition=null, recognitionTimer=null, aiBusy=false, aiSeq=0, aiCtrl=null, aiParts=null;
var RECOGNITION_TIMEOUT_MS = 12000;

function aiOut(){ return aiParts && aiParts.out; }
function aiClear(){ var o=aiOut(); if(o){ while(o.firstChild) o.removeChild(o.firstChild); } }

function stopRecognition(){

  if(aiBusy) aiBusySet(false);
}
function aiShowHeard(t){ var o=aiOut(); if(!o) return; var b=o.querySelector(".pz-heard"); if(!b){ b=el("div","pz-heard"); b.appendChild(el("p","pz-label","Your words:")); b.appendChild(el("p")); o.insertBefore(b,o.firstChild); } b.lastChild.textContent=t; }
function aiShowFb(cls, state, msg, focus){
  var o=aiOut(); if(!o) return;
  var old=o.querySelector(".pz-fb"); if(old) o.removeChild(old);
  var s=o.querySelector(".pz-status"); if(s) s.textContent="";
  var box=el("div","pz-fb "+cls); box.appendChild(el("p","pz-fb-state",state)); box.appendChild(el("p",null,msg));
  if(focus){ var f=el("p"); f.appendChild(document.createTextNode("Practise this part: ")); f.appendChild(el("b",null,focus)); box.appendChild(f); }
  o.appendChild(box);
}
function aiFallback(heard){ if(heard) aiShowHeard(heard); aiShowFb("pz-fb-unclear","Feedback not available",FALLBACK_MSG,""); }

function sanitiseFeedback(d){
  if(!d||typeof d!=="object") return null;
  if(d.status!=="match"&&d.status!=="try_again"&&d.status!=="unclear") return null;
  var m=(typeof d.message==="string")?d.message.replace(/\s+/g," ").trim():"";
  if(m===""||m.length>160) return null;
  if(/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(m)) return null;
  if(/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(m)) return null;
  var f=(typeof d.focus==="string")?d.focus.replace(/\s+/g," ").trim():"";
  if(f.length>60||!focusApproved(f)) f="";
  return {status:d.status,message:m,focus:f};
}
function focusApproved(f){
  var norm=function(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim(); };
  f=norm(f); if(f==="") return true;
  return (" "+norm(TARGET.text)+" ").indexOf(" "+f+" ")!==-1;
}
function startFeedback(){
  if(!aiEnabled()||aiBusy) return;                 /* no duplicate requests */
  stopAudio(); stopAnyRecording(); stopRecognition(); aiClear();

  var got="", settled=false;

    var c=(ev&&ev.error)?String(ev.error):""; stopRecognition();

    else if(c==="no-speech"||c==="aborted") aiShowFb("pz-fb-unclear","Not compared","I could not compare the words this time. Listen and try again.","");
    else aiFallback("");
  };
  r.onend=function(){
    if(recognition!==r||settled) return; settled=true; stopRecognition();
    var clean=got.replace(/\s+/g," ").trim();
    if(clean===""){ aiShowFb("pz-fb-unclear","Not compared","I could not compare the words this time. Listen and try again.",""); return; }
    if(clean.length>200) clean=clean.slice(0,200);

  };

  recognitionTimer=setTimeout(function(){ if(recognition!==r||settled) return; settled=true; stopRecognition(); aiStatus("Feedback did not respond in this browser. You can try again or carry on."); }, RECOGNITION_TIMEOUT_MS);

function sendFeedback(text, seq){

  .then(function(d){
    clearTimeout(timer); if(seq!==aiSeq) return; aiCtrl=null;
    var s=sanitiseFeedback(d); if(!s){ aiFallback(text); return; }
    var map={match:["pz-fb-match","Your words matched"],try_again:["pz-fb-try","Try once more"],unclear:["pz-fb-unclear","Not compared"]};
    aiShowHeard(text); aiShowFb(map[s.status][0], map[s.status][1], s.message, s.focus);
  }).catch(function(){ clearTimeout(timer); if(seq!==aiSeq) return; aiCtrl=null; aiFallback(text); });
}
function aiReset(){ aiSeq++; if(aiCtrl){ try{ aiCtrl.abort(); }catch(e){} aiCtrl=null; } stopRecognition(); aiClear(); }

function buildTalk(){
  var s=section("pz-s5","A real conversation");
  s.appendChild(el("p",null,"Play the visitor. Say your lines. Record yourself and listen back."));
  s.appendChild(fr("Vous êtes la visiteuse. Dites vos phrases, enregistrez-vous et écoutez."));
  var talk=el("div","pz-talk");
  for(var i=0;i<TALK.length;i++){
    var t=TALK[i];
    var c=el("div","pz-turn clerk"); c.appendChild(img("clerk","A woman at the licence centre."));
    var cb=el("div"); cb.appendChild(el("p","pz-who","Clerk")); cb.appendChild(el("p","pz-line",t.clerk)); c.appendChild(cb); talk.appendChild(c);
    var m=el("div","pz-turn me"); m.appendChild(img("visitor","The visitor, a woman in a green headscarf."));
    var mbody=el("div"); mbody.appendChild(el("p","pz-who","You")); mbody.appendChild(phraseNode(t.me,"p","pz-line"));
    var r=el("div","pz-btnrow"); var mb=modelButton(t.me.audio,"Hear the phrase",t.me.text); if(mb){ r.appendChild(mb); mbody.appendChild(r); }
    mbody.appendChild(buildRecorder(t.id,"Record your line "+(i+1),t.me.text));
    m.appendChild(mbody); talk.appendChild(m);
  }
  s.appendChild(talk);
  if(!isValidAudio(TARGET.audio)) s.appendChild(audioNote());
  var all=el("div","pz-strip");
  all.appendChild(el("h2",null,"All three lines together"));
  all.appendChild(el("p",null,"Say all three of your lines, one after the other. Keep the strong parts strong."));
  all.appendChild(el("p","pz-label","I need a driving LICence. / Where is the PARKing? / There is a speed CAMera."));
  all.appendChild(buildRecorder("call","Record all three lines","I need a driving licence. Where is the parking? There is a speed camera."));
  s.appendChild(all);
  return s;
}

/* ---- 6. Close ---- */
var localComplete=false;
function buildClose(){
  var s=section("pz-s6","Well done");
  var box=el("div","pz-complete");
  box.appendChild(el("p",null,"You practised word stress in driving terms with the phrase “I need a driving licence.”"));
  box.appendChild(el("p",null,"You can say LICence, PARKing and CAMera with a strong first part."));
  box.style.marginBottom="16px"; s.appendChild(box);
  s.appendChild(el("h2",null,"Your recordings"));
  var mine=el("div","pz-mine"); mine.id="pz-mine"; s.appendChild(mine);
  s.appendChild(buildSelfCheck());
  s.appendChild(el("p",null,"Say your phrases again on the road, at the licence centre or in the car park."));
  s.appendChild(fr("Redites vos phrases dans la vie de tous les jours."));
  var row=el("div","pz-btnrow");
  var done=el("button","pz-btn-done","Done"); done.type="button"; done.id="pz-done";
  var again=el("button","pz-btn-quiet","Try again"); again.type="button"; again.id="pz-tryall";
  row.appendChild(done); row.appendChild(again); s.appendChild(row);
  var st=el("p","pz-status"); st.id="pz-done-status"; st.setAttribute("role","status"); st.setAttribute("aria-live","polite"); s.appendChild(st);
  var nx=el("div","pz-btnrow"); nx.id="pz-next-wrap"; nx.hidden=true;
  var nb=el("button","pz-btn-primary","Go to the next activity"); nb.type="button";
  nb.addEventListener("click", function(){ if(isSafeEndpoint(CONFIG.nextActivityUrl)) window.location.href=CONFIG.nextActivityUrl; });
  nx.appendChild(nb); s.appendChild(nx);

  done.addEventListener("click", function(){
    var msg=document.getElementById("pz-done-status");
    var checked=false; for(var i=0;i<selfChecks.length;i++) if(selfChecks[i].checked) checked=true;
    if(!anyTake() && !checked){
      msg.className="pz-status pz-warn";
      msg.textContent="Nearly there. Say “I need a driving licence.” aloud once. Then record yourself, or tick the practice box.";
      return;
    }
    localComplete=true; msg.className="pz-status"; msg.textContent="Step 3 is complete."; done.disabled=true;
    if(isSafeEndpoint(CONFIG.nextActivityUrl)) document.getElementById("pz-next-wrap").hidden=false;
  });
  again.addEventListener("click", restartAll);
  return s;
}
function renderMine(){
  var m=document.getElementById("pz-mine"); while(m.firstChild) m.removeChild(m.firstChild);
  var any=false;
  for(var i=0;i<unitOrder.length;i++){ (function(u){
    if(!u.url) return; any=true;
    var nm=u.label.replace(/^Record yourself: /,"").replace(/^Record /,""); var b=el("button","pz-btn-primary","Hear: "+nm); b.type="button";
    b.setAttribute("data-pkey","rec:"+u.id); b.setAttribute("data-label-play","Hear: "+nm); b.setAttribute("data-label-stop","Stop");
    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){ playSource(u.url,"rec:"+u.id); });
    m.appendChild(b); })(units[unitOrder[i]]);
  }
  if(!any) m.appendChild(el("p","pz-label","No recordings yet. You can still tick the practice box and finish."));
  refreshAudioButtons();
}
function derived(){
  var c=document.getElementById("pz-compare");
  if(c){ var h1=!!(units.take1&&units.take1.url), h2=!!(units.take2&&units.take2.url);
    var b1=document.getElementById("pz-cmp-take1"), b2=document.getElementById("pz-cmp-take2");
    if(b1) b1.hidden=!h1; if(b2) b2.hidden=!h2; c.hidden=!(h1||h2); }
}

/* Full restart: clears every take, feedback and answer, returns to the start. */
function restartAll(){
  stopAudio(); stopAnyRecording(); aiReset(); clearAllUnits();
  for(var i=0;i<selfChecks.length;i++) selfChecks[i].checked=false;
  solved={}; wordOrder=shuffle(WORDS); renderNotice();
  localComplete=false;
  var d=document.getElementById("pz-done"); if(d) d.disabled=false;
  var st=document.getElementById("pz-done-status"); if(st){ st.textContent=""; st.className="pz-status"; }
  var nw=document.getElementById("pz-next-wrap"); if(nw) nw.hidden=true;
  document.getElementById("pz-nav-status").textContent="";
  showScreen(0); announce("Starting the clinic again.");
}

/* ============================================================================
   NAVIGATION — forward only; takes are kept while moving between screens
   ========================================================================= */
var NAV_LABELS=["Start the clinic","Go to the rhythm strip","Open the recording studio","Join the conversation","Finish up",""];
function showScreen(i){
  if(i<0||i>=screens.length) return;
  stopAudio(); stopRecognition(); stopAnyRecording();
  for(var k=0;k<screens.length;k++){ if(k===i) screens[k].removeAttribute("hidden"); else screens[k].hidden=true; }
  current=i;
  document.getElementById("pz-progress").textContent="Screen "+(i+1)+" of "+screens.length;
  var fwd=document.getElementById("pz-fwd");
  fwd.hidden=(i===screens.length-1); fwd.textContent=NAV_LABELS[i]||"Carry on";
  if(i===screens.length-1) renderMine();
  try{ screens[i].focus({preventScroll:true}); }catch(e){ try{ screens[i].focus(); }catch(e2){} }
  lastScrollTop();
}
function goForward(){
  var ns=document.getElementById("pz-nav-status");
  if(current===1 && !allSolved()){ ns.textContent="Tap the strong part of each word first. You can try as many times as you like."; return; }
  ns.textContent=""; showScreen(current+1);
}

function init(){
  wordOrder=shuffle(WORDS);
  var host=document.getElementById("pz-main");
  screens=[buildScene(),buildNotice(),buildRehearse(),buildStudio(),buildTalk(),buildClose()];
  for(var i=0;i<screens.length;i++) host.appendChild(screens[i]);
  renderNotice();
  document.getElementById("pz-fwd").addEventListener("click", goForward);
  var release=function(){ stopRecognition(); stopAnyRecording(); clearAllUnits(); stopAudio(); };
  window.addEventListener("pagehide", release);
  showScreen(0);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();

window.__PZ__={AUDIO_FILES:AUDIO_FILES,units:units,goForward:goForward,showScreen:showScreen,restartAll:restartAll,
  state:function(){ return {current:current,solved:solved,localComplete:localComplete}; }};
})();
</script>
