ONE PRONUNCIATION FOCUS
  Grouping reported instructions. "told me to" stays connected inside the
  instruction; a natural pause is used only where the meaning allows it.

EXACT MODEL LANGUAGE (from the production prompt)
  1. The doctor told me to rest.      <- target recording
  2. She told me to drink water.
  3. I need a follow-up appointment.

RECORDING + AI CHECK ON ALL THREE PHRASES

  panel. Neither is required to finish: a learner without a microphone can use

/* ============================================================================
   HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function frLine(text){ var p = el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
function announce(msg){ var l = document.getElementById("pz-live"); if (l) l.textContent = String(msg||""); }
function shuffle(a){
  var b = a.slice();
  for (var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function isEmbeddedImage(v){ return typeof v==="string" && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(v); }
function isSafeUrl(v){
  if (typeof v!=="string" || v==="" || v!==v.trim()) return false;
  var u; try{ u=new URL(v); }catch(e){ return false; }
  return u.protocol==="https:" && u.username==="" && u.password==="";
}
function isSafeEndpoint(v){
  if (!isSafeUrl(v)) return false;
  var u=new URL(v);
  if (u.hostname==="localhost"||u.hostname==="127.0.0.1"||u.hostname==="[::1]") return false;
  return u.search==="" && u.hash==="";
}
function isValidAudio(key){
  if (audioPendingConfirmation.indexOf(key)!==-1) return false;
  var v=AUDIO_FILES[key];
  return typeof v==="string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+/=]+$/.test(v);
}
function part(root, role){ return root.querySelector('[data-role="'+role+'"]'); }
function makeFigure(key, alt){
  var src = IMAGES[key];
  if (!isEmbeddedImage(src)) return null;
  var fig = el("figure","pz-figure");
  var img = document.createElement("img");
  img.src = src; img.alt = alt; img.setAttribute("decoding","async");
  fig.appendChild(img);
  return fig;
}
function makeRibbon(beats){
  var wrap = el("div","pz-ribbon");
  for (var i=0;i<beats.length;i++){
    var s = el("span","pz-beat"+(beats[i][1]?" link":""), beats[i][0]);
    wrap.appendChild(s);
  }
  return wrap;
}

/* ============================================================================
   AUDIO — one element, one sound at a time, never autoplayed
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null;
var audioToken = 0;

function stopAudio(){
  audioToken++;
  if (!audioEl) return;
  try{ audioEl.pause(); }catch(e){}
  try{ if (audioEl.readyState>0) audioEl.currentTime=0; }catch(e){}
  audioBusyKey = null;
  refreshAudioButtons();
}
function playSource(src, busyKey, btn){
  if (!audioEl || !src) return;
  if (audioBusyKey===busyKey){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var token = ++audioToken;
  audioBusyKey = busyKey;
  refreshAudioButtons();
  try{
    if (audioEl.getAttribute("src")!==src) audioEl.src = src;
    else { try{ if (audioEl.readyState>0) audioEl.currentTime=0; }catch(e2){} }
    var p = audioEl.play();
    if (p && typeof p.catch==="function"){
      p.catch(function(){
        if (token!==audioToken) return;
        audioBusyKey=null; refreshAudioButtons();
        if (btn) announce("The audio did not play. Read the phrase and say it aloud.");
      });
    }
  }catch(e){
    if (token!==audioToken) return;
    audioBusyKey=null; refreshAudioButtons();
  }
}
function playAudio(key, btn){ if (isValidAudio(key)) playSource(AUDIO_FILES[key], key, btn); }
if (audioEl){
  audioEl.addEventListener("ended", function(){ audioBusyKey=null; refreshAudioButtons(); });
  audioEl.addEventListener("error", function(){
    if (!audioEl.getAttribute("src")) return;
    audioBusyKey=null; refreshAudioButtons();
  });
}
function refreshAudioButtons(){
  var btns = document.querySelectorAll("[data-audio-key],[data-rec-key]");
  for (var i=0;i<btns.length;i++){
    var b=btns[i];
    var k=b.getAttribute("data-audio-key")||b.getAttribute("data-rec-key");
    var on=(k===audioBusyKey);
    b.setAttribute("aria-pressed", on?"true":"false");
    b.textContent = on ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");
  }
}
function buildAudioButton(key, playLabel, phraseText){
  if (!isValidAudio(key)) return null;
  var b = el("button","pz-btn-help",playLabel);
  b.type="button";
  b.setAttribute("data-audio-key",key);
  b.setAttribute("data-label-play",playLabel);
  b.setAttribute("data-label-stop","Stop");
  b.setAttribute("aria-pressed","false");
  b.setAttribute("aria-label",playLabel+": "+phraseText);
  b.addEventListener("click", function(){ playAudio(key,b); });
  return b;
}
function noModelNote(){
  return el("p","pz-label","The audio model is not available yet. Read the phrase and say it aloud.");
}

/* ============================================================================
   SPEECH RECOGNITION + AI CHECK
   Only the recognised words are sent, never audio. Never a score.
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition=null, recognisingPanel=null, recognitionTimer=null;
var RECOGNITION_TIMEOUT_MS = 12000;

function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }

function setSpeakBusy(panel, busy){
  var b = part(panel,"speak");
  if (!b) return;
  b.disabled = !!busy;
  b.textContent = busy ? "Listening…" : "Check with AI";
}
function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer=null; }
  if (recognisingPanel){ setSpeakBusy(recognisingPanel,false); recognisingPanel=null; }
  if (!recognition) return;
  try{ recognition.onresult=null; recognition.onerror=null; recognition.onend=null; }catch(e){}
  try{ recognition.abort(); }catch(e){}
  recognition=null;
}
function startRecognition(index, panel){
  if (!speakingEnabled()) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var r;
  try{ r=new SR(); }catch(e){ showFallback(panel); return; }
  r.lang="en-GB"; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
  var got="", settled=false;
  r.onresult=function(ev){
    if (recognition!==r) return;
    if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer=null; }
    try{ if (ev.results && ev.results[0] && ev.results[0][0]) got=String(ev.results[0][0].transcript||""); }catch(e){ got=""; }
  };
  r.onerror=function(ev){
    if (recognition!==r || settled) return;
    settled=true;
    var code=(ev&&ev.error)?String(ev.error):"";
    setSpeakBusy(panel,false);
    if (code==="not-allowed"||code==="service-not-allowed"){
      showStatus(panel,"The microphone is off. You can still record, listen and compare.");
    } else if (code==="no-speech"||code==="aborted"){
      showFeedback(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again.",focus:""},"");
    } else { showFallback(panel); }
    stopRecognition();
  };
  r.onend=function(){
    if (recognition!==r || settled) return;
    settled=true;
    setSpeakBusy(panel,false);
    stopRecognition();
    var clean=got.replace(/\s+/g," ").trim();
    if (clean===""){
      showFeedback(panel,{status:"unclear",message:"I could not compare the words this time. Listen and try again.",focus:""},"");
      return;
    }
    if (clean.length>200) clean=clean.slice(0,200);
    requestFeedback(index,panel,clean);
  };
  recognition=r; recognisingPanel=panel;
  setSpeakBusy(panel,true);
  showStatus(panel,"Listening. Say the phrase once.");
  recognitionTimer=setTimeout(function(){
    if (recognition!==r || settled) return;
    settled=true;
    stopRecognition();
    showStatus(panel,"The AI check did not respond in this browser. You can try again.");
  }, RECOGNITION_TIMEOUT_MS);
  try{ r.start(); }
  catch(e){ settled=true; setSpeakBusy(panel,false); stopRecognition(); showFallback(panel); }
}

function abortPendingFeedback(panel){
  var list = panel ? [panel] : document.querySelectorAll(".pz-speak");
  for (var i=0;i<list.length;i++){
    var pn=list[i];
    pn.pzSeq=(pn.pzSeq||0)+1;
    if (pn.pzCtrl){ try{ pn.pzCtrl.abort(); }catch(e){} pn.pzCtrl=null; }
  }
}
function requestFeedback(index, panel, recognisedText){
  var seq=(panel.pzSeq||0);
  showHeard(panel,recognisedText);
  showStatus(panel,"Comparing your words with the model.");
  if (!isSafeEndpoint(CONFIG.feedbackEndpoint)){ showFallback(panel,recognisedText); return; }
  var ctrl=(typeof AbortController==="function")?new AbortController():null;
  panel.pzCtrl=ctrl;
  var timer=setTimeout(function(){ if (ctrl){ try{ ctrl.abort(); }catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts={
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({targetPhrase:PHRASES[index].text, recognisedText:recognisedText}),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer"
  };
  if (ctrl) opts.signal=ctrl.signal;
  fetch(CONFIG.feedbackEndpoint,opts)
    .then(function(res){ if (!res.ok) throw new Error("bad-status"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if ((panel.pzSeq||0)!==seq) return;
      panel.pzCtrl=null;
      var safe=sanitiseFeedback(data,index);
      if (!safe){ showFallback(panel,recognisedText); return; }
      showFeedback(panel,safe,recognisedText);
    })
    .catch(function(){
      clearTimeout(timer);
      if ((panel.pzSeq||0)!==seq) return;
      panel.pzCtrl=null;
      showFallback(panel,recognisedText);
    });
}
function sanitiseFeedback(data,index){
  if (!data || typeof data!=="object") return null;
  var status=data.status;
  if (status!=="match" && status!=="try_again" && status!=="unclear") return null;
  var message=(typeof data.message==="string")?data.message.replace(/\s+/g," ").trim():"";
  if (message==="" || message.length>160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(message)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(message)) return null;
  var focus=(typeof data.focus==="string")?data.focus.replace(/\s+/g," ").trim():"";
  if (focus.length>60) focus="";
  if (!focusIsApproved(focus,index)) focus="";
  return {status:status,message:message,focus:focus};
}
function focusIsApproved(focus,index){
  var p=PHRASES[index];
  var norm=function(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[.,!?;:\/]/g," ").replace(/\s+/g," ").trim(); };
  var f=norm(focus);
  if (f==="") return true;
  return (" "+norm(p.text)+" ").indexOf(" "+f+" ")!==-1;
}
function showStatus(panel,text){
  var out=part(panel,"out"); if (!out) return;
  var s=out.querySelector(".pz-status");
  if (!s){ s=el("p","pz-status"); out.appendChild(s); }
  s.textContent=text;
}
function showHeard(panel,text){
  var out=part(panel,"out"); if (!out) return;
  var box=out.querySelector(".pz-heard");
  if (!box){
    box=el("div","pz-heard");
    box.appendChild(el("p","pz-heard-label","Your words:"));
    box.appendChild(el("p","pz-heard-text"));
    out.insertBefore(box,out.firstChild);
  }
  box.querySelector(".pz-heard-text").textContent=text;
}
function markSpoken(panel){
  panel.pzSpeakAttempted=true;
  if (panel.pzIndex!==undefined) practised[panel.pzIndex]=true;
  var after=part(panel,"after-row"); if (after) after.hidden=false;
}
function showFeedback(panel,fb,heardText){
  markSpoken(panel);
  var out=part(panel,"out"); if (!out) return;
  if (heardText) showHeard(panel,heardText);
  var old=out.querySelector(".pz-fb"); if (old) out.removeChild(old);
  var s=out.querySelector(".pz-status"); if (s) s.textContent="";
  var word,cls;
  if (fb.status==="match"){ word="Your words matched"; cls="pz-fb pz-fb-match"; }
  else if (fb.status==="try_again"){ word="Try once more"; cls="pz-fb pz-fb-try"; }
  else { word="Not compared"; cls="pz-fb pz-fb-unclear"; }
  var box=el("div",cls);
  box.appendChild(el("p","pz-fb-state",word));
  box.appendChild(el("p","pz-fb-msg",fb.message));
  if (fb.focus){
    var f=el("p","pz-fb-focus");
    f.appendChild(document.createTextNode("Practise this part: "));
    f.appendChild(el("b",null,fb.focus));
    box.appendChild(f);
  }
  out.appendChild(box);
}
function showFallback(panel,heardText){
  markSpoken(panel);
  var out=part(panel,"out"); if (!out) return;
  if (heardText) showHeard(panel,heardText);
  var old=out.querySelector(".pz-fb"); if (old) out.removeChild(old);
  var s=out.querySelector(".pz-status"); if (s) s.textContent="";
  var box=el("div","pz-fb pz-fb-unclear");
  box.appendChild(el("p","pz-fb-state","Feedback unavailable"));
  box.appendChild(el("p","pz-fb-msg",FALLBACK_MSG));
  out.appendChild(box);
}
function clearAttempt(panel){
  abortPendingFeedback(panel);
  if (recognisingPanel===panel) stopRecognition();
  setSpeakBusy(panel,false);
  var out=part(panel,"out");
  if (out){ while (out.firstChild) out.removeChild(out.firstChild); }
  var after=part(panel,"after-row"); if (after) after.hidden=true;
}

/* ============================================================================
   RECORDING — local Blob only, 20 s cap, microphone released on stop
   ========================================================================= */
var RECORD_MAX_MS = 20000;
var RECORD_PERMISSION_TIMEOUT_MS = 10000;
var recGen=0, recorder=null, recPanel=null, recStream=null;
var recPendingPanel=null, recPendingTimer=null, recTick=null;

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia==="function" &&
            typeof window.MediaRecorder!=="undefined");
}
function recMimeType(){
  var c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i=0;i<c.length;i++){ try{ if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
function releaseStream(stream){
  if (!stream) return;
  try{ var t=stream.getTracks(); for (var i=0;i<t.length;i++){ try{ t[i].stop(); }catch(e){} } }catch(e){}
}
function stopTick(){ if (recTick){ clearInterval(recTick); recTick=null; } }
function stopActiveRecorder(){
  if (!recorder) return;
  try{ if (recorder.state!=="inactive") recorder.stop(); }catch(e){}
}
function cancelPendingRecordingRequest(){
  if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer=null; }
  if (recPendingPanel){
    recGen++;
    setRecBusy(recPendingPanel,false);
    showRecStatus(recPendingPanel,"");
    recPendingPanel=null;
  }
}
function recKeyFor(panel){ return "rec:"+panel.id; }
function clearRecording(panel){
  if (!panel) return;
  if (audioBusyKey===recKeyFor(panel)) stopAudio();
  if (panel.pzRecUrl){ try{ URL.revokeObjectURL(panel.pzRecUrl); }catch(e){} panel.pzRecUrl=null; }
  var after=part(panel,"rec-after"); if (after) after.hidden=true;
  refreshAudioButtons();
}
function setRecBusy(panel,busy){
  var b=part(panel,"rec-start"); if (!b) return;
  b.disabled=false;
  b.textContent = busy ? "Stop" : "Start recording";
  b.setAttribute("aria-pressed", busy?"true":"false");
  panel.pzRecording=!!busy;
}
function showRecStatus(panel,text){
  var out=part(panel,"rec-out"); if (!out) return;
  var s=out.querySelector(".pz-rec-status");
  if (!s){ s=el("p","pz-rec-status pz-status"); out.appendChild(s); }
  s.textContent=text;
}
function fmt(sec){ return "0:"+(sec<10?"0":"")+sec; }

function startRecording(panel){
  if (!recordingSupported()) return;
  cancelPendingRecordingRequest();
  var gen=++recGen;
  stopAudio(); stopRecognition(); stopActiveRecorder(); stopTick();
  clearRecording(panel);
  setRecBusy(panel,true);
  showRecStatus(panel,"Waiting for the microphone.");
  recPendingPanel=panel;
  recPendingTimer=setTimeout(function(){
    if (gen!==recGen) return;
    cancelPendingRecordingRequest();
    showRecStatus(panel,"The microphone did not respond. You can try again.");
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer=null; }
    if (recPendingPanel===panel) recPendingPanel=null;
    if (gen!==recGen){ releaseStream(stream); return; }
    var chunks=[], mr, capTimer=null;
    try{
      var mt=recMimeType();
      mr = mt ? new window.MediaRecorder(stream,{mimeType:mt}) : new window.MediaRecorder(stream);
    }catch(e){
      releaseStream(stream); setRecBusy(panel,false);
      showRecStatus(panel,"Recording does not work in this browser. You can say the phrase aloud and use the self-check.");
      return;
    }
    recorder=mr; recStream=stream; recPanel=panel;
    mr.ondataavailable=function(ev){ if (ev.data && ev.data.size>0) chunks.push(ev.data); };
    mr.onerror=function(){
      if (capTimer) clearTimeout(capTimer);
      stopTick(); releaseStream(stream);
      if (recorder===mr) recorder=null;
      if (recStream===stream) recStream=null;
      if (gen!==recGen) return;
      setRecBusy(panel,false);
      showRecStatus(panel,"The recording did not work. You can try again.");
    };
    mr.onstop=function(){
      if (capTimer) clearTimeout(capTimer);
      stopTick(); releaseStream(stream);
      if (recorder===mr) recorder=null;
      if (recStream===stream) recStream=null;
      if (recPanel===panel) recPanel=null;
      if (gen!==recGen) return;
      setRecBusy(panel,false);
      if (!chunks.length){ showRecStatus(panel,"I did not catch that. You can try again."); return; }
      var blob;
      try{ blob=new Blob(chunks,{type:chunks[0].type||"audio/mp4"}); }
      catch(e){ showRecStatus(panel,"The recording did not work. You can try again."); return; }
      if (!blob.size){ showRecStatus(panel,"I did not catch that. You can try again."); return; }
      if (panel.pzRecUrl){ try{ URL.revokeObjectURL(panel.pzRecUrl); }catch(e){} }
      panel.pzRecUrl=URL.createObjectURL(blob);
      panel.pzRecAttempted=true;
      if (panel.pzIndex!==undefined) practised[panel.pzIndex]=true;
      var after=part(panel,"rec-after"); if (after) after.hidden=false;
      showRecStatus(panel,"Recording saved. Listen to your voice, then to the model.");
      refreshAudioButtons();
    };
    try{ mr.start(); }
    catch(e){
      releaseStream(stream); recorder=null; recStream=null;
      if (gen!==recGen) return;
      setRecBusy(panel,false);
      showRecStatus(panel,"Recording does not work in this browser. You can say the phrase aloud and use the self-check.");
      return;
    }
    var secs=0;
    showRecStatus(panel,"Recording "+fmt(0)+". Say the phrase.");
    recTick=setInterval(function(){
      secs++;
      if (panel.pzRecording) showRecStatus(panel,"Recording "+fmt(secs)+". Say the phrase.");
    },1000);
    capTimer=setTimeout(function(){ try{ if (mr.state==="recording") mr.stop(); }catch(e){} }, RECORD_MAX_MS);
  }).catch(function(){
    if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer=null; }
    if (recPendingPanel===panel) recPendingPanel=null;
    if (gen!==recGen) return;
    setRecBusy(panel,false);
    showRecStatus(panel,"The microphone is off. You can say the phrase aloud and use the self-check.");
  });
}
function toggleRecording(panel){
  if (recPendingPanel===panel){
    cancelPendingRecordingRequest();
    showRecStatus(panel,"Cancelled. You can try again.");
  } else if (panel.pzRecording){ stopActiveRecorder(); }
  else { startRecording(panel); }
}
function clearAllRecordings(){
  var panels=document.querySelectorAll(".pz-record");
  for (var i=0;i<panels.length;i++){
    clearRecording(panels[i]);
    setRecBusy(panels[i],false);
    var s=panels[i].querySelector(".pz-rec-status"); if (s) s.textContent="";
  }
}

/* ============================================================================
   SCREEN BUILDERS
   ========================================================================= */
function makeSection(id, heading){
  var sec=el("section","pz-screen");
  sec.id=id; sec.tabIndex=-1; sec.hidden=true;
  var h=el("h1",null,heading); h.id=id+"-h";
  sec.setAttribute("aria-labelledby",h.id);
  sec.appendChild(el("div","pz-accent"));
  sec.appendChild(h);
  return sec;
}

/* ---- screen 1: conversation scene ---- */
function buildScene(){
  var sec=makeSection("pz-s1","What the doctor told me");
  sec.appendChild(el("p",null,"You are at a clinic. You tell a friend what the doctor said. Listen for how the words go together."));
  sec.appendChild(frLine("Vous racontez à une amie ce que le médecin a dit. Écoutez comment les mots vont ensemble."));
  var f=makeFigure("sc","A doctor speaks to a patient who is writing notes."); if (f){ f.className="pz-scene"; sec.appendChild(f); }
  var bub=el("div","pz-bubbles");
  var b1=el("div","pz-bubble"); b1.appendChild(el("b",null,"The doctor says")); b1.appendChild(el("span",null,"“Rest. Drink water.”")); bub.appendChild(b1);
  var b2=el("div","pz-bubble me"); b2.appendChild(el("b",null,"You tell your friend")); b2.appendChild(el("span",null,"“The doctor told me to rest.”")); bub.appendChild(b2);
  sec.appendChild(bub);
  var row=el("div","pz-btnrow");
  var hear=buildAudioButton("ph1_normal","Hear the phrase",PHRASES[0].text);
  if (hear) row.appendChild(hear);
  if (row.firstChild) sec.appendChild(row); else sec.appendChild(noModelNote());
  return sec;
}

/* ---- screen 2: notice the groups ---- */
function buildNotice(){
  var sec=makeSection("pz-s2","Notice the groups");
  sec.appendChild(el("p",null,"Some words belong together. Say them as one smooth group."));
  var host=el("div"); host.id="pz-notice-host"; sec.appendChild(host);
  var row=el("div","pz-btnrow");
  var again=el("button","pz-btn-quiet","Try again");
  again.type="button";
  again.setAttribute("aria-label","Try again: start the grouping choices again");
  again.addEventListener("click", function(){
    for (var i=0;i<noticeDone.length;i++) noticeDone[i]=false;
    renderNotice(); announce("The choices are ready again.");
  });
  row.appendChild(again);
  sec.appendChild(row);
  return sec;
}
function renderNotice(){
  var host=document.getElementById("pz-notice-host");
  while (host.firstChild) host.removeChild(host.firstChild);
  NOTICE.forEach(function(item,qi){
    var box=el("div","pz-q");
    box.appendChild(el("p","pz-label","Phrase "+(qi+1)+" of 3"));
    box.appendChild(el("p","pz-qtext",PHRASES[item.phrase].text));
    box.appendChild(el("p","pz-label",item.q));
    var opts=el("div","pz-opts");
    opts.setAttribute("role","group");
    opts.setAttribute("aria-label",item.q+" "+PHRASES[item.phrase].text);
    var res=el("div"); res.setAttribute("aria-live","polite");
    shuffle(item.options).forEach(function(o){
      var b=el("button","pz-opt",o); b.type="button";
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        noticeDone[qi]=true;
        var all=opts.querySelectorAll("button");
        for (var k=0;k<all.length;k++){ all[k].setAttribute("aria-pressed","false"); all[k].className="pz-opt"; }
        b.setAttribute("aria-pressed","true");
        while (res.firstChild) res.removeChild(res.firstChild);
        var ok=(o===item.correct);
        b.className="pz-opt "+(ok?"ok":"again");
        var r=el("div","pz-result "+(ok?"ok":"again"));
        r.appendChild(el("b",null,ok?"Yes. ":"Not this one — try another. "));
        r.appendChild(document.createTextNode(ok?item.why:"Look at the connected words in the phrase and choose again."));
        res.appendChild(r);
      });
      opts.appendChild(b);
    });
    box.appendChild(opts); box.appendChild(res);
    host.appendChild(box);
  });
}

/* ---- screen 3: rhythm strip ---- */
function buildRhythm(){
  var sec=makeSection("pz-s3","Rehearse the rhythm");
  sec.appendChild(el("p",null,"Say each phrase out loud. Keep the yellow group smooth."));
  sec.appendChild(frLine("Dites chaque phrase à voix haute. Gardez le groupe jaune fluide."));
  PHRASES.forEach(function(p,i){
    var strip=el("div","pz-strip");
    strip.appendChild(makeRibbon(p.beats));
    if (i<2) strip.appendChild(el("p","pz-ribbon-note","Keep together: told me to"));
    var row=el("div","pz-btnrow");
    var listen=buildAudioButton(p.normal,"Listen",p.text);
    if (listen) row.appendChild(listen);
    var turn=el("button","pz-turn","My turn");
    turn.type="button";
    turn.setAttribute("aria-pressed","false");
    turn.setAttribute("aria-label","My turn: say “"+p.text+"” aloud");
    turn.addEventListener("click", function(){
      var on=turn.getAttribute("aria-pressed")!=="true";
      turn.setAttribute("aria-pressed",on?"true":"false");
      turn.textContent=on?"I said it":"My turn";
    });
    row.appendChild(turn);
    strip.appendChild(row);
    if (!listen) strip.appendChild(noModelNote());
    sec.appendChild(strip);
  });
  return sec;
}

/* ---- screens 4–6: recording studio, one per phrase ---- */
function resetPhrase(index){
  var rec=document.getElementById("pz-record-"+(index+1));
  var spk=document.getElementById("pz-speak-"+(index+1));
  var chk=document.getElementById("pz-self-"+(index+1));
  if (rec){
    if (recorder && recPanel===rec) stopActiveRecorder();
    cancelPendingRecordingRequest();
    clearRecording(rec); setRecBusy(rec,false); rec.pzRecAttempted=false;
    var s=rec.querySelector(".pz-rec-status"); if (s) s.textContent="";
  }
  if (spk){ clearAttempt(spk); spk.pzSpeakAttempted=false; }
  if (chk) chk.checked=false;
  practised[index]=false;
}
function buildStudio(index){
  var p=PHRASES[index], n=index+1;
  var sec=makeSection("pz-p"+n,"Phrase "+n+" of "+PHRASES.length);
  var top=el("div","pz-btnrow");
  var again=el("button","pz-btn-quiet","Try again");
  again.type="button";
  again.setAttribute("aria-label","Try again: start phrase "+n+" again");
  again.addEventListener("click", function(){ resetPhrase(index); announce("Phrase "+n+" is ready again."); });
  top.appendChild(again);

  var grid=el("div","pz-studio");

  /* left: the model */
  var card=el("div","pz-card");
  var fig=makeFigure(p.img,p.alt); if (fig) card.appendChild(fig);
  card.appendChild(el("p","pz-label","Say this phrase"));
  card.appendChild(el("p","pz-model",p.text));
  card.appendChild(makeRibbon(p.beats));
  card.appendChild(frLine(p.fr));
  var arow=el("div","pz-btnrow");
  var lb=buildAudioButton(p.normal,"Listen to the model",p.text);
  if (lb){ arow.appendChild(lb); card.appendChild(arow); } else card.appendChild(noModelNote());
  grid.appendChild(card);

  /* right: record, AI check, self-check */
  var right=el("div");

  /* record */
  var rec=el("div","pz-record"); rec.id="pz-record-"+n; rec.pzIndex=index;
  rec.appendChild(el("h2",null,"Record your voice"));
  if (recordingSupported()){
    var main=el("div","pz-btnrow");
    var start=el("button","pz-btn-primary","Start recording");
    start.type="button"; start.setAttribute("data-role","rec-start"); start.setAttribute("aria-pressed","false");
    start.setAttribute("aria-label","Start recording: "+p.text);
    start.addEventListener("click", function(){ toggleRecording(rec); });
    main.appendChild(start); rec.appendChild(main);
    var out=el("div"); out.setAttribute("data-role","rec-out"); out.setAttribute("aria-live","polite"); rec.appendChild(out);
    var after=el("div","pz-btnrow"); after.setAttribute("data-role","rec-after"); after.hidden=true;
    var mine=el("button","pz-btn-primary","Hear my recording");
    mine.type="button";
    mine.setAttribute("data-rec-key",recKeyFor(rec));
    mine.setAttribute("data-label-play","Hear my recording");
    mine.setAttribute("data-label-stop","Stop");
    mine.setAttribute("aria-pressed","false");
    mine.addEventListener("click", function(){ if (rec.pzRecUrl) playSource(rec.pzRecUrl,recKeyFor(rec),mine); });
    after.appendChild(mine);
    var ml=buildAudioButton(p.normal,"Hear the model",p.text); if (ml) after.appendChild(ml);
    var ra=el("button","pz-btn-quiet","Record again"); ra.type="button";
    ra.addEventListener("click", function(){ startRecording(rec); });
    after.appendChild(ra);
    var del=el("button","pz-btn-quiet","Delete recording"); del.type="button";
    del.addEventListener("click", function(){ clearRecording(rec); rec.pzRecAttempted=false; showRecStatus(rec,"Your recording is deleted."); });
    after.appendChild(del);
    rec.appendChild(after);
  } else {
    rec.appendChild(el("p",null,window.isSecureContext
      ? "Recording does not work in this browser. Say the phrase aloud and use the self-check below."
      : "Recording does not work here. Say the phrase aloud and use the self-check below."));
  }
  right.appendChild(rec);

  /* AI check */
  var spk=el("div","pz-speak"); spk.id="pz-speak-"+n; spk.pzIndex=index;
  spk.appendChild(el("h2",null,"Check with AI"));
  if (speakingEnabled()){
    spk.appendChild(el("p",null,"Say the phrase once. The computer reads your words and compares them with the model."));
    var row=el("div","pz-btnrow"); row.setAttribute("data-role","main-row");
    var sb=el("button","pz-btn-primary","Check with AI"); sb.type="button"; sb.setAttribute("data-role","speak");
    sb.setAttribute("aria-label","Check with AI: "+p.text);
    sb.addEventListener("click", function(){ startRecognition(index,spk); });
    row.appendChild(sb); spk.appendChild(row);
    var o2=el("div"); o2.setAttribute("data-role","out"); o2.setAttribute("aria-live","polite"); spk.appendChild(o2);
    var af=el("div","pz-btnrow"); af.setAttribute("data-role","after-row"); af.hidden=true;
    var ta=el("button","pz-btn-primary","Try again"); ta.type="button";
    ta.addEventListener("click", function(){ clearAttempt(spk); startRecognition(index,spk); });
    af.appendChild(ta);
    var la=buildAudioButton(p.normal,"Listen again",p.text); if (la) af.appendChild(la);
    var d2=el("button","pz-btn-quiet","Delete"); d2.type="button";
    d2.addEventListener("click", function(){ clearAttempt(spk); showStatus(spk,"Your words are deleted."); });
    af.appendChild(d2);
    spk.appendChild(af);
  } else if (!SR){
    spk.appendChild(el("p",null,"The AI check does not work in this browser. You can still record, listen and compare."));
  } else {
    spk.appendChild(el("p",null,"The AI check is not switched on. You can still record, listen and compare."));
  }
  right.appendChild(spk);

  /* self-check */
  var self=el("div","pz-self");
  var lab=el("label");
  var cb=document.createElement("input"); cb.type="checkbox"; cb.id="pz-self-"+n;
  cb.addEventListener("change", function(){ practised[index]=cb.checked || !!rec.pzRecAttempted || !!spk.pzSpeakAttempted; });
  lab.appendChild(cb);
  lab.appendChild(el("span",null,"I said this phrase aloud without recording."));
  self.appendChild(lab);
  right.appendChild(self);

  grid.appendChild(right);
  sec.appendChild(top);
  sec.appendChild(grid);
  return sec;
}

/* ---- screen 7: close ---- */
function buildClose(){
  var sec=makeSection("pz-s7","Pronunciation clinic finished");
  var box=el("div","pz-complete");
  box.appendChild(el("p",null,"You practised grouping reported instructions. You can tell someone what the doctor said."));
  var ul=el("ul","pz-practised");
  PHRASES.forEach(function(p){ ul.appendChild(el("li",null,p.text)); });
  box.appendChild(ul);
  box.appendChild(el("p",null,"Keep told me to smooth and connected."));
  box.appendChild(frLine("Gardez « told me to » fluide et lié."));
  sec.appendChild(box);
  var row=el("div","pz-btnrow");
  var done=el("button","pz-btn-done","Done"); done.type="button"; done.id="pz-done";
  var again=el("button","pz-btn-primary","Try again"); again.type="button"; again.id="pz-try-all";
  row.appendChild(done); row.appendChild(again);
  sec.appendChild(row);
  var st=el("p","pz-status"); st.id="pz-done-status"; st.setAttribute("role","status"); st.setAttribute("aria-live","polite");
  sec.appendChild(st);
  var nw=el("div","pz-btnrow"); nw.id="pz-next-wrap"; nw.hidden=true;
  var nb=el("button","pz-btn-primary","Go to the next activity"); nb.type="button"; nb.id="pz-next-activity";
  nw.appendChild(nb); sec.appendChild(nw);
  return sec;
}

/* ============================================================================
   NAVIGATION — never automatic
   ========================================================================= */
function setNavStatus(t){ var n=document.getElementById("pz-nav-status"); if (n) n.textContent=t||""; }

function showScreen(i){
  if (i<0 || i>=screens.length) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  /* an AI request still in flight on the screen being left is cancelled */
  var sp=document.querySelectorAll(".pz-speak");
  for (var s=0;s<sp.length;s++){ if (sp[s].pzCtrl){ clearAttempt(sp[s]); } }
  for (var k=0;k<screens.length;k++){
    if (k===i) screens[k].removeAttribute("hidden"); else screens[k].hidden=true;
  }
  current=i;
  document.getElementById("pz-progress").textContent="Screen "+(i+1)+" of "+TOTAL;
  var back=document.getElementById("pz-back"), fwd=document.getElementById("pz-fwd");
  back.disabled=(i===0);
  fwd.hidden=(i===screens.length-1);
  fwd.textContent=NAV_FWD[i]||"Next";
  if (i===screens.length-1) refreshDone();
  try{ screens[i].focus({preventScroll:true}); }catch(e){ try{ screens[i].focus(); }catch(e2){} }
  try{ window.scrollTo(0,0); }catch(e){}
}
function goForward(){ setNavStatus(""); showScreen(current+1); }
function goBack(){ setNavStatus(""); showScreen(current-1); }

/* ============================================================================
   COMPLETION — local only
   Done opens once the learner has tried the grouping choices and practised at
   least one phrase (recording, AI check or the aloud self-check).
   ========================================================================= */
function canFinish(){
  var n=true, p=false, i;
  for (i=0;i<noticeDone.length;i++) if (!noticeDone[i]) n=false;
  for (i=0;i<practised.length;i++) if (practised[i]) p=true;
  return {notice:n, practice:p, ok:n&&p};
}
function refreshDone(){
  var done=document.getElementById("pz-done"), st=document.getElementById("pz-done-status");
  if (!done) return;
  if (localComplete){ done.disabled=true; return; }
  var c=canFinish();
  done.disabled=!c.ok;
  if (st){
    if (c.ok) st.textContent="";
    else if (!c.notice && !c.practice) st.textContent="To finish: try the three grouping choices, then practise one phrase.";
    else if (!c.notice) st.textContent="To finish: try the three grouping choices on screen 2.";
    else st.textContent="To finish: practise one phrase. Record it, use the AI check, or say it aloud and tick the box.";
  }
}
function fullReset(){
  for (var i=0;i<PHRASES.length;i++) resetPhrase(i);
  for (var j=0;j<noticeDone.length;j++) noticeDone[j]=false;
  renderNotice();
  var turns=document.querySelectorAll(".pz-turn");
  for (var t=0;t<turns.length;t++){ turns[t].setAttribute("aria-pressed","false"); turns[t].textContent="My turn"; }
  localComplete=false;
  var st=document.getElementById("pz-done-status"); if (st) st.textContent="";
  var nw=document.getElementById("pz-next-wrap"); if (nw) nw.hidden=true;
  setNavStatus("");
  showScreen(0);
  announce("The clinic is ready to start again.");
}

/* ============================================================================
   START-UP
   ========================================================================= */
function init(){
  if (isEmbeddedImage(IMAGES.logo)){
    var logo=document.getElementById("pz-logo");
    logo.src=IMAGES.logo; logo.removeAttribute("hidden");
    document.getElementById("pz-brand-text").textContent="English for Adults";
  }
  var main=document.getElementById("pz-main");
  screens=[buildScene(),buildNotice(),buildRhythm(),buildStudio(0),buildStudio(1),buildStudio(2),buildClose()];
  screens.forEach(function(s){ main.appendChild(s); });
  renderNotice();

  document.getElementById("pz-back").addEventListener("click",goBack);
  document.getElementById("pz-fwd").addEventListener("click",goForward);

  document.getElementById("pz-done").addEventListener("click", function(){
    if (!canFinish().ok){ refreshDone(); return; }
    localComplete=true;
    document.getElementById("pz-done").disabled=true;
    document.getElementById("pz-done-status").textContent="Step 3 is complete.";
    if (isSafeUrl(CONFIG.nextActivityUrl)) document.getElementById("pz-next-wrap").hidden=false;
  });
  document.getElementById("pz-try-all").addEventListener("click", fullReset);
  document.getElementById("pz-next-activity").addEventListener("click", function(){
    if (isSafeUrl(CONFIG.nextActivityUrl)) window.location.href=CONFIG.nextActivityUrl;
  });
  /* keep Done in step with progress while the close screen is open */
  document.addEventListener("change", refreshDone);

  function release(){ stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest(); clearAllRecordings(); stopAudio(); }
  window.addEventListener("pagehide",release);
  window.addEventListener("beforeunload",release);
  showScreen(0);
}
if (document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();

/* Exposed for the verification harness only. */
window.__PZ__={
  PHRASES:PHRASES, NOTICE:NOTICE, AUDIO_FILES:AUDIO_FILES, CONFIG:CONFIG,
  sanitiseFeedback:sanitiseFeedback, showScreen:showScreen, canFinish:canFinish,
  state:function(){ return {current:current,noticeDone:noticeDone,practised:practised,localComplete:localComplete,
    liveStream:!!recStream,liveRecorder:!!recorder}; }
};
})();
</script>
