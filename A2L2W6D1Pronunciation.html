/* ============================================================================
   SMALL HELPERS
   ========================================================================= */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function announce(msg){ var l = document.getElementById("pz-live"); if (l) l.textContent = String(msg || ""); }
function shuffle(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function fr(text){ var p = el("p","pz-fr",text); p.setAttribute("lang","fr"); return p; }
/* The sentence with its strong beat marked: bold, underlined AND highlighted,
   so colour is never the only cue. */
function stressedSentence(p, cls){
  var wrap = el("p", cls || "pz-phrase-big");
  wrap.appendChild(document.createTextNode(p.pre));
  wrap.appendChild(el("span","pz-stress",p.beat));
  wrap.appendChild(document.createTextNode(p.post));
  wrap.setAttribute("aria-label", p.text + " Strong beat: " + p.beat.toLowerCase() + ".");
  return wrap;
}
function isSafeUrl(v){
  if (typeof v !== "string" || v === "" || v !== v.trim()) return false;
  try { var u = new URL(v); return u.protocol === "https:" && !u.username && !u.password; } catch(e){ return false; }
}
function isSafeEndpoint(v){
  if (!isSafeUrl(v)) return false;
  var u = new URL(v);
  if (u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "[::1]") return false;
  return u.search === "" && u.hash === "";
}
function isValidAudio(key){
  if (audioPendingConfirmation.indexOf(key) !== -1) return false;
  var v = AUDIO_FILES[key];
  return typeof v === "string" && /^data:audio\/(mpeg|mp3|mp4|ogg|wav);base64,[A-Za-z0-9+/=]+$/.test(v);
}

/* ============================================================================
   AUDIO — one element, one sound at a time, only started by a click or tap
   ========================================================================= */
var audioEl = document.getElementById("pz-audio");
var audioBusyKey = null, audioToken = 0;

function stopAudio(){
  audioToken++;
  if (audioEl){
    try { audioEl.pause(); } catch(e){}
    try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e){}
  }
  audioBusyKey = null;
  refreshAudioButtons();
}
function playSource(src, key){
  if (!audioEl || !src) return;
  if (audioBusyKey === key){ stopAudio(); return; }
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var token = ++audioToken;
  audioBusyKey = key;
  refreshAudioButtons();
  try {
    if (audioEl.getAttribute("src") !== src) audioEl.src = src;
    else { try { if (audioEl.readyState > 0) audioEl.currentTime = 0; } catch(e2){} }
    var pr = audioEl.play();
    if (pr && typeof pr.catch === "function"){
      pr.catch(function(){
        if (token !== audioToken) return;
        audioBusyKey = null; refreshAudioButtons();
        announce("The audio did not play. Read the phrase and say it aloud.");
      });
    }
  } catch(e){
    if (token !== audioToken) return;
    audioBusyKey = null; refreshAudioButtons();
  }
}
function playAudio(key){ if (isValidAudio(key)) playSource(AUDIO_FILES[key], key); }
if (audioEl){
  audioEl.addEventListener("ended", function(){ audioBusyKey = null; refreshAudioButtons(); });
  audioEl.addEventListener("error", function(){
    if (!audioEl.getAttribute("src")) return;
    audioBusyKey = null; refreshAudioButtons();
    announce("The audio did not load. Read the phrase and say it aloud.");
  });
}
function refreshAudioButtons(){
  var btns = document.querySelectorAll("[data-audio-key],[data-rec-key]");
  for (var i = 0; i < btns.length; i++){
    var b = btns[i];
    var k = b.getAttribute("data-audio-key") || b.getAttribute("data-rec-key");
    var on = (k === audioBusyKey);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = on ? b.getAttribute("data-label-stop") : b.getAttribute("data-label-play");
  }
}
/* Listen button, or an honest "not added yet" note when there is no recording. */
function audioControl(p, label){
  var wrap = el("div");
  if (isValidAudio(p.normal)){
    var b = el("button","pz-btn-help",label || "Listen");
    b.type = "button";
    b.setAttribute("data-audio-key", p.normal);
    b.setAttribute("data-label-play", label || "Listen");
    b.setAttribute("data-label-stop", "Stop");
    b.setAttribute("aria-pressed","false");
    b.setAttribute("aria-label", (label || "Listen") + ": " + p.text);
    b.addEventListener("click", function(){ playAudio(p.normal); });
    wrap.appendChild(b);
  } else {
    var m = el("p","pz-unavail","The model recording is not added yet. Read the phrase above and say it aloud.");
    m.setAttribute("role","note");
    wrap.appendChild(m);
  }
  return wrap;
}

/* ============================================================================
   SPEECH RECOGNITION — the AI check. Only the recognised TEXT leaves the page.
   ========================================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var recognition = null, recognisingPanel = null, recognitionTimer = null;

function speakingEnabled(){ return !!SR && isSafeEndpoint(CONFIG.feedbackEndpoint); }
function aiPart(panel, role){ return panel.querySelector('[data-role="' + role + '"]'); }
function setAiBusy(panel, busy){
  var b = aiPart(panel,"speak"); if (!b) return;
  b.disabled = !!busy;
  b.textContent = busy ? "Listening…" : "AI check";
}
function aiStatus(panel, text){
  var out = aiPart(panel,"out"); if (!out) return;
  var s = out.querySelector(".pz-status");
  if (!s){ s = el("p","pz-status"); out.appendChild(s); }
  s.textContent = text;
}
function stopRecognition(){
  if (recognitionTimer){ clearTimeout(recognitionTimer); recognitionTimer = null; }
  if (recognisingPanel){ setAiBusy(recognisingPanel,false); recognisingPanel = null; }
  if (!recognition) return;
  try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; } catch(e){}
  try { recognition.abort(); } catch(e){}
  recognition = null;
}
function abortPendingFeedback(panel){
  var list = panel ? [panel] : document.querySelectorAll(".pz-ai");
  for (var i = 0; i < list.length; i++){
    var pn = list[i];
    pn.pzSeq = (pn.pzSeq || 0) + 1;
    if (pn.pzCtrl){ try { pn.pzCtrl.abort(); } catch(e){} pn.pzCtrl = null; }
  }
}
function startRecognition(panel){
  if (!speakingEnabled()) return;
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest();
  var r;
  try { r = new SR(); } catch(e){ showFallback(panel); return; }
  r.lang = "en-GB"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
  var got = "", settled = false;
  r.onresult = function(ev){
    if (recognition !== r) return;
    try { if (ev.results && ev.results[0] && ev.results[0][0]) got = String(ev.results[0][0].transcript || ""); } catch(e){ got = ""; }
  };
  r.onerror = function(ev){
    if (recognition !== r || settled) return;
    settled = true;
    var code = (ev && ev.error) ? String(ev.error) : "";
    setAiBusy(panel,false);
    if (code === "not-allowed" || code === "service-not-allowed"){
      panel.pzAiAttempted = true;
      aiStatus(panel,"The microphone is off. You can use Start recording or carry on.");
    } else if (code === "no-speech" || code === "aborted"){
      showFeedback(panel, {status:"unclear", message:"I could not hear the words this time. Say the phrase once more.", focus:""}, "");
    } else { showFallback(panel); }
    stopRecognition();
  };
  r.onend = function(){
    if (recognition !== r || settled) return;
    settled = true;
    setAiBusy(panel,false);
    stopRecognition();
    var clean = got.replace(/\s+/g," ").trim();
    if (clean === ""){
      showFeedback(panel, {status:"unclear", message:"I could not hear the words this time. Say the phrase once more.", focus:""}, "");
      return;
    }
    if (clean.length > 200) clean = clean.slice(0,200);
    requestFeedback(panel, clean);
  };
  recognition = r; recognisingPanel = panel;
  setAiBusy(panel,true);
  aiStatus(panel,"Listening. Say the phrase once.");
  recognitionTimer = setTimeout(function(){
    if (recognition !== r || settled) return;
    settled = true;
    stopRecognition();
    panel.pzAiAttempted = true;
    aiStatus(panel,"The AI check did not respond. You can try again or carry on.");
    var a = aiPart(panel,"after-row"); if (a) a.hidden = false;
  }, RECOGNITION_TIMEOUT_MS);
  try { r.start(); } catch(e){ settled = true; setAiBusy(panel,false); stopRecognition(); showFallback(panel); }
}
function requestFeedback(panel, recognisedText){
  var seq = panel.pzSeq || 0;
  showHeard(panel, recognisedText);
  aiStatus(panel,"Checking your words.");
  if (!isSafeEndpoint(CONFIG.feedbackEndpoint)){ showFallback(panel, recognisedText); return; }
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  panel.pzCtrl = ctrl;
  var timer = setTimeout(function(){ if (ctrl){ try { ctrl.abort(); } catch(e){} } }, CONFIG.feedbackTimeoutMs);
  var opts = {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ targetPhrase: panel.pzPhrase.text, recognisedText: recognisedText }),
    cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer"
  };
  if (ctrl) opts.signal = ctrl.signal;
  fetch(CONFIG.feedbackEndpoint, opts)
    .then(function(res){ if (!res.ok) throw new Error("bad"); return res.json(); })
    .then(function(data){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      var safe = sanitiseFeedback(data, panel.pzPhrase);
      if (!safe){ showFallback(panel, recognisedText); return; }
      showFeedback(panel, safe, recognisedText);
    })
    .catch(function(){
      clearTimeout(timer);
      if ((panel.pzSeq || 0) !== seq) return;
      panel.pzCtrl = null;
      showFallback(panel, recognisedText);
    });
}
function sanitiseFeedback(data, p){
  if (!data || typeof data !== "object") return null;
  var status = data.status;
  if (status !== "match" && status !== "try_again" && status !== "unclear") return null;
  var message = (typeof data.message === "string") ? data.message.replace(/\s+/g," ").trim() : "";
  if (message === "" || message.length > 160) return null;
  if (/[<>{}\[\]\\|`~^]|https?:|data:|javascript:/i.test(message)) return null;
  if (/%|\bscores?\b|\bstars?\b|\bgrades?\b|\bcefr\b|\blevels?\b|\bpoints?\b|\bmarks?\b|\bbadges?\b|\b\d+(?:[.,]\d+)?\s*\/\s*\d+\b/i.test(message)) return null;
  var focus = (typeof data.focus === "string") ? data.focus.replace(/\s+/g," ").trim() : "";

/* ============================================================================
   LEARNER RECORDING — getUserMedia + MediaRecorder, only on button press
   ========================================================================= */
var recGen = 0, recorder = null, recStream = null, recPanel = null;
var recPendingPanel = null, recPendingTimer = null, recTick = null, recStartedAt = 0, recCap = null;
var anyRecorded = false;

function recordingSupported(){
  return !!(window.isSecureContext && navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function" &&
            typeof window.MediaRecorder !== "undefined");

function recMimeType(){
  var c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++){ try { if (window.MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch(e){} }

}
function stopActiveRecorder(){

}
function recPart(panel, role){ return panel.querySelector('[data-role="' + role + '"]'); }
function fmtTime(ms){ var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
function stopTick(){ if (recTick){ clearInterval(recTick); recTick = null; } if (recCap){ clearTimeout(recCap); recCap = null; } }
function recStatus(panel, text){

}
function setTimerText(panel, text){ var t = recPart(panel,"timer"); if (t) t.textContent = text; }
function setLight(panel, on){ var l = recPart(panel,"light"); if (l) l.classList.toggle("on", !!on); }
function nextSlot(panel){
  for (var i = 0; i < panel.pzMax; i++){ if (!panel.pzTakes[i]) return i; }

}
function updateRecButton(panel){

function renderTakes(panel){

}
function clearTake(panel, i){

  if (audioBusyKey === "rec:" + panel.id + ":" + i) stopAudio();
  try { URL.revokeObjectURL(t); } catch(e){}
  panel.pzTakes[i] = null;
  renderTakes(panel);
}
function clearPanelRecordings(panel){
  for (var i = 0; i < panel.pzMax; i++) clearTake(panel, i);

}
function clearAllRecordings(){
  var ps = document.querySelectorAll(".pz-rec");
  for (var i = 0; i < ps.length; i++){ clearPanelRecordings(ps[i]); ps[i].pzRecording = false; updateRecButton(ps[i]); }
}
function cancelPendingRecordingRequest(){
  if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer = null; }
  if (recPendingPanel){
    recGen++;
    var p = recPendingPanel; recPendingPanel = null;
    recStatus(p,""); updateRecButton(p);

function startRecording(panel){
  if (!recordingSupported()) return;

  recPendingPanel = panel;
  updateRecButton(panel);
  recStatus(panel,"Allow the microphone if your browser asks.");
  recPendingTimer = setTimeout(function(){
    if (gen !== recGen) return;
    cancelPendingRecordingRequest();
    panel.pzRecAttempted = true;
    recStatus(panel,"The microphone did not answer. You can try again or carry on.");
  }, RECORD_PERMISSION_TIMEOUT_MS);

  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if (recPendingTimer){ clearTimeout(recPendingTimer); recPendingTimer = null; }

      if (recStream === stream) recStream = null;

      panel.pzRecAttempted = true;
      recStatus(panel,"The recording did not work. You can try again or carry on.");
    };
    mr.onstop = function(){
      stopTick(); releaseStream(stream);
      if (recorder === mr) recorder = null;
      if (recStream === stream) recStream = null;
      if (recPanel === panel) recPanel = null;
      if (gen !== recGen) return;

      panel.pzRecAttempted = true;

      if (panel.pzTakes[slot]){ try { URL.revokeObjectURL(panel.pzTakes[slot]); } catch(e){} }

      renderTakes(panel);
      recStatus(panel, "Your recording is ready. Press Hear my recording, then compare with the model.");
      announce("Your recording is ready.");

    try { mr.start(); } catch(e){
      releaseStream(stream); recorder = null; recStream = null;
      if (gen !== recGen) return;
      updateRecButton(panel); panel.pzRecAttempted = true;
      recStatus(panel,"Recording does not work in this browser. You can carry on.");
      return;
    }
    panel.pzRecording = true;
    recStartedAt = Date.now();
    setLight(panel,true);
    updateRecButton(panel);
    recStatus(panel,"Recording. Say the phrase, then press Stop.");
    setTimerText(panel,"0:00 / " + fmtTime(RECORD_MAX_MS));
    recTick = setInterval(function(){ setTimerText(panel, fmtTime(Date.now() - recStartedAt) + " / " + fmtTime(RECORD_MAX_MS)); }, 250);

    if (gen !== recGen) return;
    updateRecButton(panel); panel.pzRecAttempted = true;

  });
}

  studio.appendChild(el("p",null,"Say it clearly. Make " + TARGET.beat.toLowerCase() + " a little stronger. Keep the other parts short. Keep the words in view."));
  studio.appendChild(audioControl(TARGET,"Hear the model"));
  var rec = buildRecPanel(TARGET, 2, "studio"); studio.appendChild(rec); sec.pzRec = rec;
  var ai = buildAiPanel(TARGET, "studio"); studio.appendChild(ai); sec.pzAi = ai;
  sec.appendChild(studio);
  sec.appendChild(el("p","pz-label","Record a second take if you like. Then play take 1 and take 2 and compare them with the model."));
  practisedBox(sec);
  addNav(sec, 5, true);
  return sec;
}

/* ---- 6. Closing summary ---- */
function buildClose(){
  var sec = newScreen("pz-s6","Your phrase is ready");
  var calm = el("div","pz-calm");
  var img = document.createElement("img"); img.src = IMAGES.wifi; img.alt = "A laptop and a phone connected to wifi.";
  calm.appendChild(img);
  calm.appendChild(el("p",null,"You practised this phrase:"));
  calm.appendChild(stressedSentence(TARGET));
  calm.appendChild(el("p",null,"Focus: " + FOCUS + ". You can use it when you call to book an installation."));
  sec.appendChild(calm);
  sec.appendChild(fr("Vous pouvez utiliser cette phrase pour réserver une installation."));
  var recNote = el("p","pz-label");
  sec.appendChild(recNote); sec.pzRecNote = recNote;
  var checks = el("div"); sec.appendChild(checks); sec.pzChecks = checks;
  sec.pzTicks = [false,false];
  ["I noticed the strong beat in each phrase.","I said the phrase aloud."].forEach(function(t, i){
    var lab = el("label","pz-check");
    var cb = document.createElement("input"); cb.type = "checkbox";
    cb.addEventListener("change", function(){ sec.pzTicks[i] = cb.checked; updateDone(); });
    lab.appendChild(cb); lab.appendChild(el("span",null,t));
    checks.appendChild(lab);
  });
  var row = el("div","pz-btnrow");
  var done = el("button","pz-btn-done","Done"); done.type = "button"; done.id = "pz-done";
  done.addEventListener("click", function(){
    if (!doneAllowed()) return;
    localComplete = true;
    var st = document.getElementById("pz-done-status");
    if (st) st.textContent = "Pronunciation Clinic is complete.";
    done.disabled = true;
    if (isSafeUrl(CONFIG.nextActivityUrl)){ var nw = document.getElementById("pz-next-wrap"); if (nw) nw.hidden = false; }
  });
  row.appendChild(done);
  var again = el("button","pz-btn-quiet","Try again"); again.type = "button"; again.id = "pz-again";
  again.addEventListener("click", restartActivity);
  row.appendChild(again);
  sec.appendChild(row);
  var st = el("p","pz-status"); st.id = "pz-done-status"; st.setAttribute("role","status"); st.setAttribute("aria-live","polite");
  sec.appendChild(st);
  var nw = el("div","pz-btnrow"); nw.id = "pz-next-wrap"; nw.hidden = true;
  var nx = el("button","pz-btn-primary","Go to the next activity"); nx.type = "button";
  nx.addEventListener("click", function(){ if (isSafeUrl(CONFIG.nextActivityUrl)) window.location.href = CONFIG.nextActivityUrl; });
  nw.appendChild(nx); sec.appendChild(nw);
  return sec;
}
/* Complete after noticing was tried AND either a recording was made or the
   two self-check boxes are ticked. AI success is never required. */
function doneAllowed(){
  var cl = screens[6];
  var ticks = cl && cl.pzTicks && cl.pzTicks[0] && cl.pzTicks[1];
  return noticeAttempted && (anyRecorded || !!ticks);
}
function updateDone(){
  var d = document.getElementById("pz-done"); if (!d || localComplete) return;
  var ok = doneAllowed();
  d.disabled = !ok;
  var st = document.getElementById("pz-done-status");
  if (st) st.textContent = ok ? "" : (noticeAttempted
    ? "Tick both boxes, or go back to the studio and record, then press Done."
    : "Try the strong-beat stops first, then tick both boxes.");
}

/* ============================================================================
   NAVIGATION — forward only, never automatic, never blocking
   ========================================================================= */
var BUILDERS = [buildOpening, buildNotice,
  function(){ return buildRehearse(0); }, function(){ return buildRehearse(1); }, function(){ return buildRehearse(2); },
  buildStudio, buildClose];

function nudgeFor(i){
  var sec = screens[i];
  if (i === 1){
    var n = 0; for (var k in sec.pzStops) if (sec.pzStops[k]) n++;
    if (n < PHRASES.length) return "Give each stop a try first. Tap the word shape you think is strongest. You can do it.";
    return "";
  }
  if (i >= 2 && i <= 5){
    var rec = sec.pzRec, ai = sec.pzAi;
    var tried = (rec && rec.pzRecAttempted) || (ai && ai.pzAiAttempted) || sec.pzPractised;
    if (!tried) return "Try the phrase first: record yourself or use the AI check. Every try helps you.";
  }
  return "";
}
function goForward(){
  var sec = screens[current];
  var msg = nudgeFor(current);
  if (msg && !sec.pzNudged){
    sec.pzNudged = true;
    var n = sec.querySelector('[data-role="nudge"]'); if (n) n.textContent = msg;
    return;
  }
  showScreen(current + 1);
}
function teardown(){
  stopAudio(); stopRecognition(); stopActiveRecorder(); cancelPendingRecordingRequest(); stopTick();
  clearAllRecordings(); abortPendingFeedback(null);
}
function showScreen(i){
  if (i < 0 || i >= screens.length) return;
  teardown();
  for (var k = 0; k < screens.length; k++) screens[k].hidden = (k !== i);
  current = i;
  var prog = document.getElementById("pz-progress");
  if (prog) prog.textContent = "Screen " + (i + 1) + " of " + screens.length;
  if (i === screens.length - 1){
    var s = screens[i];
    if (s.pzRecNote) s.pzRecNote.textContent = anyRecorded
      ? "You recorded your voice. Press Done when you are ready."
      : "Recording is optional. Tick both boxes to finish.";
    updateDone();
  }
  try { screens[i].focus({ preventScroll:true }); } catch(e){ try { screens[i].focus(); } catch(e2){} }
  try { window.scrollTo(0,0); } catch(e){}
}
function rebuildScreen(i){
  teardown();
  var old = screens[i];
  var fresh = BUILDERS[i]();
  host.replaceChild(fresh, old);
  screens[i] = fresh;
  if (i === 1) noticeAttempted = false;
  showScreen(i);
}
function buildAll(){
  teardown();
  while (host.firstChild) host.removeChild(host.firstChild);
  screens = []; noticeAttempted = false; anyRecorded = false; localComplete = false;
  for (var i = 0; i < BUILDERS.length; i++){
    var s = BUILDERS[i](); host.appendChild(s); screens.push(s);
  }
}
function restartActivity(){ buildAll(); showScreen(0); announce("The activity is ready again."); }

function init(){
  buildAll();
  showScreen(0);
  window.addEventListener("pagehide", teardown);
  window.addEventListener("beforeunload", teardown);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

/* Exposed for the verification harness only. No learner data is held here. */
window.__PZ__ = {
  CONFIG:CONFIG, AUDIO_FILES:AUDIO_FILES, PHRASES:PHRASES, isSafeEndpoint:isSafeEndpoint,
  sanitiseFeedback:sanitiseFeedback, recordingSupported:recordingSupported, speakingEnabled:speakingEnabled,
  goForward:goForward, showScreen:showScreen, doneAllowed:doneAllowed,
  state:function(){ return { current:current, noticeAttempted:noticeAttempted, anyRecorded:anyRecorded, localComplete:localComplete, total:screens.length }; }
};
})();
</script>
